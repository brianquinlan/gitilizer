<title>Gitilizer Eval Ranker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: ranked list on the left (the order), selected issue on the right (the evidence); move controls sit on top of the issue. */
:root {
  --bg: #f4f6f8; --surface: #ffffff; --ink: #16202c; --muted: #5a6575; --line: #d9dfe7; --hover: #eef2f6;
  --accent: #0e6b67; --accent-ink: #ffffff; --accent-soft: #dcefed;
  --pr: #5b3aa6; --pr-soft: #ece6f8; --issue: #23692f; --issue-soft: #e3f1e5;
  --warn: #8a5300; --warn-soft: #fbedd6; --down: #a3332b; --down-soft: #f9e3e1;
  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141a; --surface: #171e26; --ink: #e5eaf0; --muted: #98a3b2; --line: #2a3441; --hover: #1d2630;
  --accent: #46b8b0; --accent-ink: #062523; --accent-soft: #15302f;
  --pr: #b9a0f0; --pr-soft: #2a2140; --issue: #86d193; --issue-soft: #183020;
  --warn: #f0b75c; --warn-soft: #33270f; --down: #f09a92; --down-soft: #3a1d1b; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f141a; --surface: #171e26; --ink: #e5eaf0; --muted: #98a3b2; --line: #2a3441; --hover: #1d2630;
  --accent: #46b8b0; --accent-ink: #062523; --accent-soft: #15302f;
  --pr: #b9a0f0; --pr-soft: #2a2140; --issue: #86d193; --issue-soft: #183020;
  --warn: #f0b75c; --warn-soft: #33270f; --down: #f09a92; --down-soft: #3a1d1b; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14.5px/1.5 var(--font-body); display: flex; flex-direction: column; }
a { color: var(--accent); }
button { font: 600 13px/1 var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 9px 12px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--muted); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); }
h1 { font: 800 18px/1.1 var(--font-display); margin: 0; }
.status { font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; margin-right: auto; min-width: 0; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.status[data-s="saved"] .dot { background: var(--issue); }
.status[data-s="saving"] .dot { background: var(--warn); }
.status[data-s="error"] .dot, .status[data-s="offline"] .dot { background: var(--down); }
.count { font-size: 12.5px; color: var(--muted); }

.panes { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); }
.listpane { border-right: 1px solid var(--line); overflow-y: auto; background: var(--surface); }
ol.rank { list-style: none; margin: 0; padding: 6px 0; }
ol.rank li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px; align-items: baseline; padding: 7px 12px 7px 10px; cursor: pointer; border-left: 3px solid transparent; }
ol.rank li:hover { background: var(--hover); }
ol.rank li[aria-selected="true"] { background: var(--accent-soft); border-left-color: var(--accent); }
.n { font: 800 15px/1 var(--font-display); font-variant-numeric: tabular-nums; text-align: right; color: var(--muted); }
li[aria-selected="true"] .n { color: var(--accent); }
.row-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
.row-id { font: 11.5px/1.3 var(--font-mono); color: var(--muted); display: flex; gap: 6px; align-items: center; }
.k { flex: none; font: 700 10px/1 var(--font-body); padding: 2px 4px; border-radius: 3px; }
.k.pr { background: var(--pr-soft); color: var(--pr); } .k.issue { background: var(--issue-soft); color: var(--issue); }
.rid { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.newdot { flex: none; white-space: nowrap; font: 600 10px/1 var(--font-body); color: var(--warn); background: var(--warn-soft); padding: 2px 4px; border-radius: 3px; }

.viewpane { overflow-y: auto; min-width: 0; }
.mover { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-block: 10px; padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); background: var(--bg); border-bottom: 1px solid var(--line); }
.pos { font: 800 22px/1 var(--font-display); font-variant-numeric: tabular-nums; margin-right: 6px; }
.pos small { font: 500 13px var(--font-body); color: var(--muted); }
.mover .big { padding: 10px 16px; font-size: 14px; }
.mover .sep { flex: 1; }
.hint { font-size: 12px; color: var(--muted); }
kbd { font: 11px var(--font-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 1px 4px; background: var(--surface); }

article { padding: 18px 20px 40px; padding-right: max(20px, env(safe-area-inset-right, 0px)); max-width: 860px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 600 11px/1 var(--font-body); padding: 4px 7px; border-radius: 5px; background: var(--surface); color: var(--muted); border: 1px solid var(--line); }
.chip.pr { background: var(--pr-soft); color: var(--pr); border-color: transparent; }
.chip.issue { background: var(--issue-soft); color: var(--issue); border-color: transparent; }
h2 { font: 600 20px/1.3 var(--font-body); margin: 10px 0 4px; text-wrap: balance; }
h2 a { color: var(--ink); text-decoration: none; } h2 a:hover { text-decoration: underline; }
.idline { font: 12.5px/1.4 var(--font-mono); color: var(--muted); overflow-wrap: anywhere; }
.banner { margin: 12px 0 0; padding: 9px 12px; border-radius: 8px; font-size: 13.5px; }
.banner.asof { background: var(--warn-soft); color: var(--warn); }
.banner.down { background: var(--down-soft); color: var(--down); }
.banner.note { background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
.banner.note b { color: var(--muted); font-weight: 600; }
dl.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 14px; margin: 14px 0; font-size: 13.5px; }
dl.facts dt { color: var(--muted); } dl.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
h3 { font: 600 11px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px; }
.body { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; font-size: 14px; }
.tlbar { display: flex; align-items: center; gap: 10px; margin: 22px 0 8px; }
.tlbar h3 { margin: 0; }
.tlbar label { font-size: 12.5px; color: var(--muted); display: inline-flex; gap: 5px; align-items: center; }
ol.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
ol.tl li { border-left: 2px solid var(--line); padding: 2px 0 2px 12px; }
ol.tl li.me { border-left-color: var(--accent); }
ol.tl li.bot { opacity: .7; }
ol.tl .meta { font-size: 12.5px; color: var(--muted); }
ol.tl .meta b { color: var(--ink); font-weight: 600; }
ol.tl .txt { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 3px; font-size: 13.5px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; max-height: 340px; overflow-y: auto; }
.why label { display: block; font-size: 12.5px; color: var(--muted); margin: 22px 0 4px; }
textarea { width: 100%; min-height: 56px; resize: vertical; font: 14px/1.45 var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; }
.yaml { margin: 16px; }
.yaml textarea { min-height: 200px; font: 12px/1.4 var(--font-mono); }

@media (max-width: 760px) {
  body { height: auto; display: block; }
  .panes { display: flex; flex-direction: column-reverse; }
  .listpane { border-right: 0; border-top: 1px solid var(--line); max-height: none; overflow: visible; }
  .viewpane { overflow: visible; }
  .mover { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .mover .hint { display: none; }
  article { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
</style>

<header class="top">
  <h1>Eval ranker</h1>
  <span class="count" id="count"></span>
  <div class="status" id="status" data-s="loading" role="status" aria-live="polite"><span class="dot"></span><span id="statusText">Connecting…</span></div>
  <button id="copyBtn" type="button">Copy as YAML</button>
  <button id="doneBtn" class="primary" type="button" aria-pressed="false">Mark done</button>
</header>

<div class="panes">
  <nav class="listpane" aria-label="Ranking">
    <ol class="rank" id="rank" role="listbox" aria-label="Ranked issues"></ol>
  </nav>
  <main class="viewpane" id="viewpane">
    <div class="mover" role="toolbar" aria-label="Move this issue">
      <div class="pos" id="pos"></div>
      <button class="big" id="upBtn" type="button">▲ Move up</button>
      <button class="big" id="downBtn" type="button">▼ Move down</button>
      <button id="up5Btn" type="button" title="Move up 5">▲ 5</button>
      <button id="down5Btn" type="button" title="Move down 5">▼ 5</button>
      <button id="keepBtn" type="button" hidden>Keep here</button>
      <span class="sep"></span>
      <span class="hint"><kbd>↑</kbd><kbd>↓</kbd> move · <kbd>Shift</kbd> ×5 · <kbd>J</kbd><kbd>K</kbd> next/prev issue</span>
    </div>
    <article id="view"></article>
    <div class="yaml" id="yamlBox" hidden>
      <p>Saving isn't available in this view. Copy this and paste it to Claude:</p>
      <textarea id="yamlText" readonly></textarea>
    </div>
  </main>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const ME = DATA.user.toLowerCase();
  const byId = Object.fromEntries(DATA.items.map(x => [x.id, x]));
  const DOC = "rankings/all";
  let order = DATA.items.map(x => x.id);
  let why = {};
  // Items added after the PRD start unplaced until they're moved or kept.
  let placed = new Set(DATA.items.filter(x => x.set !== "B").map(x => x.id));
  let done = false;
  let sel = order[0];
  let hideBots = true;
  let db = null, writing = false, pending = false, timer = null, first = true;

  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const when = iso => new Date(iso).toLocaleString(undefined, { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit", timeZoneName: "short" });
  const role = r => r.replace("requested_reviewer_via_team", "review requested via team").replace(/_/g, " ");

  // ---- list
  const rankEl = $("#rank");
  const rows = {};
  for (const x of DATA.items) {
    const li = document.createElement("li");
    li.setAttribute("role", "option");
    li.dataset.id = x.id;
    li.innerHTML = `<span class="n"></span><span style="min-width:0"><span class="row-title">${esc(x.title)}</span><span class="row-id"><span class="k ${x.kind === "PR" ? "pr" : "issue"}">${x.kind}</span><span class="rid">${esc(x.id)}</span><span class="newdot" hidden>not placed</span></span></span>`;
    li.addEventListener("click", () => select(x.id, true));
    rows[x.id] = li;
  }

  function renderList() {
    order.forEach((id, i) => {
      const li = rows[id];
      if (rankEl.children[i] !== li) rankEl.insertBefore(li, rankEl.children[i] || null);
      li.querySelector(".n").textContent = i + 1;
      li.setAttribute("aria-selected", String(id === sel));
      li.querySelector(".newdot").hidden = placed.has(id);
    });
    const unplaced = order.filter(id => !placed.has(id)).length;
    $("#count").textContent = `${order.length} issues` + (unplaced ? ` · ${unplaced} not placed yet` : "");
    $("#doneBtn").setAttribute("aria-pressed", String(done));
    $("#doneBtn").textContent = done ? "Done ✓" : "Mark done";
    $("#yamlText").value = yaml();
  }

  function renderMover() {
    const i = order.indexOf(sel);
    $("#pos").innerHTML = `#${i + 1} <small>of ${order.length}</small>`;
    $("#upBtn").disabled = $("#up5Btn").disabled = i === 0;
    $("#downBtn").disabled = $("#down5Btn").disabled = i === order.length - 1;
    $("#keepBtn").hidden = placed.has(sel);
    $("#keepBtn").textContent = `Keep at #${i + 1}`;
  }

  // ---- issue view
  function renderView() {
    const x = byId[sel];
    const chips = [`<span class="chip ${x.kind === "PR" ? "pr" : "issue"}">${x.kind}</span>`, `<span class="chip">${esc(x.state)}</span>`,
      ...x.labels.map(l => `<span class="chip">${esc(l)}</span>`)].join("");
    const facts = [
      ["Author", x.author], ["Opened", x.created], ["Last update", x.updated],
      x.assignees.length && ["Assigned", x.assignees.join(", ")],
      x.requested.length && ["Review requested", x.requested.join(", ")],
      x.roles.length && ["Your role", x.roles.map(role).join(", ")],
      ["Last human activity", x.last || "none (bots only)"],
      x.stacked_on && ["Stacked on", Array.isArray(x.stacked_on) ? x.stacked_on.map(s => `${s.pr} “${s.title}” (${s.state}; reviews: ${Array.isArray(s.reviews) ? s.reviews.join(", ") : s.reviews})`).join(" · ") : x.stacked_on],
      x.related.length && ["Related", x.related.join(" · ")],
    ].filter(Boolean).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("");
    const banners = [
      x.as_of ? `<div class="banner asof"><b>Shown as it was on ${esc(when(x.as_of))}.</b> Rank it as if that were now.</div>` : `<div class="banner note"><b>Snapshot:</b> ${esc(when(x.snapshot))}. GitHub may have changed since; rank what you see here.</div>`,
      x.thumbs_down_at ? `<div class="banner down"><b>Pretend you thumbs-downed this on ${esc(when(x.thumbs_down_at))}.</b></div>` : "",
      x.prd_note ? `<div class="banner note"><b>Your note in the PRD:</b> ${esc(x.prd_note)}</div>` : "",
    ].join("");
    const events = x.timeline.filter(e => !(hideBots && e.bot));
    const tl = events.map(e => `<li class="${e.who.toLowerCase() === ME ? "me" : ""} ${e.bot ? "bot" : ""}"><div class="meta"><b>${esc(e.who)}</b> ${esc(e.what)} · ${esc(e.at)} (${esc(e.ago)})</div>${e.text ? `<div class="txt">${esc(e.text)}</div>` : ""}</li>`).join("");
    const botCount = x.timeline.filter(e => e.bot).length;
    $("#view").innerHTML = `
      <div class="chips">${chips}</div>
      <h2><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></h2>
      <div class="idline">${esc(x.id)}${x.repo_desc ? " · " + esc(x.repo_desc) : ""}</div>
      ${banners}
      <dl class="facts">${facts}</dl>
      <h3>Description</h3>
      <div class="body">${x.body ? esc(x.body) : "<i>No description.</i>"}</div>
      <div class="tlbar"><h3>Conversation (${events.length})</h3>${botCount ? `<label><input type="checkbox" id="botToggle" ${hideBots ? "checked" : ""}> Hide ${botCount} bot events</label>` : ""}</div>
      <ol class="tl">${tl || "<li><i>Nothing yet.</i></li>"}</ol>
      <div class="why"><label for="whyBox">Why is it ranked here? (optional)</label><textarea id="whyBox" placeholder="e.g. security; a contributor is waiting on me; nothing for me to do"></textarea></div>`;
    $("#whyBox").value = why[sel] || "";
    $("#whyBox").addEventListener("input", e => { why[sel] = e.target.value; save(); });
    const bt = $("#botToggle"); if (bt) bt.addEventListener("change", e => { hideBots = e.target.checked; renderView(); });
  }

  function select(id, fromClick) {
    sel = id;
    renderList(); renderMover(); renderView();
    $("#viewpane").scrollTop = 0;
    if (!fromClick) rows[id].scrollIntoView({ block: "nearest" });
  }

  function move(delta) {
    const i = order.indexOf(sel);
    const j = Math.max(0, Math.min(order.length - 1, i + delta));
    if (i === j) return;
    order.splice(i, 1); order.splice(j, 0, sel);
    placed.add(sel);
    renderList(); renderMover();
    rows[sel].scrollIntoView({ block: "nearest" });
    save();
  }

  $("#upBtn").addEventListener("click", () => move(-1));
  $("#downBtn").addEventListener("click", () => move(1));
  $("#up5Btn").addEventListener("click", () => move(-5));
  $("#down5Btn").addEventListener("click", () => move(5));
  $("#keepBtn").addEventListener("click", () => { placed.add(sel); renderList(); renderMover(); save(); });
  $("#doneBtn").addEventListener("click", () => { done = !done; renderList(); save(); });
  document.addEventListener("keydown", e => {
    if (e.target.closest("textarea, input, select") || e.metaKey || e.ctrlKey || e.altKey) return;
    const step = e.shiftKey ? 5 : 1;
    if (e.key === "ArrowUp") { e.preventDefault(); move(-step); }
    else if (e.key === "ArrowDown") { e.preventDefault(); move(step); }
    else if (e.key === "j" || e.key === "J") { const i = order.indexOf(sel); if (i < order.length - 1) select(order[i + 1]); }
    else if (e.key === "k" || e.key === "K") { const i = order.indexOf(sel); if (i > 0) select(order[i - 1]); }
  });

  function yaml() {
    const lines = ["# Combined ranking: first item = rank 1", "ranked: true", "items:"];
    for (const id of order) {
      const x = byId[id];
      lines.push(`  - url: ${x.url}`);
      if (x.as_of) lines.push(`    as_of: ${x.as_of}`);
      if (x.thumbs_down_at) lines.push(`    thumbs_down_at: ${x.thumbs_down_at}`);
      lines.push(`    why: ${JSON.stringify((why[id] || "").trim())}`);
    }
    return lines.join("\n") + "\n";
  }
  $("#copyBtn").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(yaml()); $("#copyBtn").textContent = "Copied"; setTimeout(() => $("#copyBtn").textContent = "Copy as YAML", 1500); }
    catch { $("#yamlBox").hidden = false; $("#yamlText").value = yaml(); $("#yamlText").focus(); $("#yamlText").select(); }
  });

  // ---- saving (db capability): one document, written after a short pause, one write at a time
  function setStatus(s, t) { $("#status").dataset.s = s; $("#statusText").textContent = t; }
  function save() {
    if (!db) { $("#yamlText").value = yaml(); return; }
    setStatus("saving", "Saving…");
    clearTimeout(timer); timer = setTimeout(flush, 600);
  }
  async function flush() {
    timer = null;
    if (writing) { pending = true; return; }
    writing = true;
    try {
      await db.doc(DOC).set({ order: [...order], why: { ...why }, placed: [...placed], done, updated_at: new Date().toISOString() });
      setStatus("saved", done ? "Saved · marked done" : "Saved");
    } catch (e) {
      if (e && e.code === "unavailable") { pending = true; setStatus("saving", "Retrying…"); await new Promise(r => setTimeout(r, 1200 + Math.random() * 800)); }
      else setStatus("error", `Couldn't save (${e && e.code || "error"}). Use Copy as YAML.`);
    } finally {
      writing = false;
      if (pending) { pending = false; flush(); }
    }
  }
  function apply(d) {
    const known = new Set(DATA.items.map(x => x.id));
    const o = (d.order || []).filter(id => known.has(id));
    order = o.concat(DATA.items.map(x => x.id).filter(id => !o.includes(id)));
    why = { ...(d.why || {}) };
    if (Array.isArray(d.placed)) placed = new Set(d.placed.filter(id => known.has(id)).concat([...placed].filter(id => byId[id].set !== "B")));
    done = !!d.done;
  }

  select(sel);

  (async () => {
    try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch { db = null; }
    if (!db) { setStatus("offline", "Saving unavailable here: use Copy as YAML"); $("#yamlBox").hidden = false; return; }
    db.doc(DOC).onSnapshot(snap => {
      if (first) {
        first = false;
        if (snap.exists) { apply(snap.data()); select(sel); setStatus("saved", done ? "Saved · marked done" : "Saved"); }
        else setStatus("saved", "Nothing saved yet");
      } else if (snap.exists && !snap.metadata.hasPendingWrites && !writing && !timer) {
        apply(snap.data()); renderList(); renderMover();
      }
    }, e => setStatus("error", `Saving stopped (${e.code}). Reload the page.`));
  })();
})();
</script>
