": ["natebosch"], "requested": ["natebosch"], "repo_desc": "[Experimental] Google Cloud Dart Client Libraries", "created": "11d ago", "updated": "4d ago", "snapshot": "2026-10-25T19:31:27Z", "as_of": null, "thumbs_down_at": null, "roles": ["author", "commenter", "watches_repo"], "last": "brianquinlan commented 4d ago", "stacked_on": null, "related": ["issue googleapis/google-cloud-dart#359 '[google_cloud_rpc] Wire RetryRunner and per-call RequestOptions into ServiceClient for generated REST clients': open, by kevmoo, updated 10d ago, assignees ['brianquinlan']", "PR brianquinlan/google-cloud-dart#2 'chore(pubsub): merge main and update Subscription retry calls': merged, by sigurdm, updated 5d ago", "PR googleapis/google-cloud-dart#292 'feat(google_cloud_pubsub): add Subscription ack and modifyAckDeadline batching': merged, by sigurdm, updated 5d ago", "PR googleapis/google-cloud-dart#339 'feat(pubsub): add resilient parallel streaming pull': merged, by sigurdm, updated 5d ago", "PR googleapis/google-cloud-dart#2 'Configure Renovate': closed, by renovate-bot, updated 13mo ago"], "body": "Part of https://github.com/googleapis/google-cloud-dart/issues/359\r\n\r\nHistory: My original implementation of RPC retry logic was located in `package:google_cloud_storage` and meant for use in that package. @sigurdm needed equivalent functionality for `package:google_cloud_pubsub` so he moved it to a common location (`package:google_cloud_rpc`).\r\n\r\nThe intent of this PR is to make this RPC retry logic useable by all clients, hand-written and generated.\r\n\r\nThe broad strokes (does saying something like \"broad strokes\" make this seem more or less AI-written?):\r\n1. Remove the Google Cloud Storage-specific retry logic from `package:google_cloud_rpc` and replace it with the ability to retry errors based on either a predicate function or specific error codes.\r\n2. Changed the retry defaults to match Python (there is variation across implementations so I picked one)\r\n3. Changed the jittering logic to match the other languages' clients (the were all the same) \r\n4. Changed `ServiceClient` to accept a `retry` argument for every RPC method\r\n\r\nThe rest of the PR is clean-up in `package:google_cloud_storage` and `package:google_cloud_pubsub` to use the change functionality.\r\n\r\nThere are a few semi-related changes in `package:google_cloud_storage` (I noticed these because it does affect the retry strategy):\r\n- Changed `deleteObjectAcl`/`patchObjectAcl` to never be idempotent.\r\n- Changed `deleteBucket` to always be idempotent.\r\n- Changed `uploadObjectFromSink` to only consider the generation match when starting the transfer, not when retrying failed data chunk uploads.\r\n\r\nOne small semi-related change to `package:google_cloud_pubsub`:\r\n- Changed `defaultRetry` to match the service definition. @sigurdm could you check that I used the correct reference?\r\n\r\n**Question**: Should every package `export 'package:google_cloud_rpc/retry.dart';` so that developers don't have to explicitly depend on `package:google_cloud_rpc` if they want to modify their client's retry logic?\r\n\r\nI talked to @natebosch and we will not be doing that.", "timeline": [{"who": "Brian Quinlan", "bot": false, "at": "2026-10-13 20:15", "ago": "12d ago", "what": "pushed commit 6328f71 'first go'", "text": ""}, {"who": "Brian Quinlan", "bot": false, "at": "2026-10-13 21:16", "ago": "12d ago", "what": "pushed commit 4dc8510 'Fix'", "text": ""}, {"who": "Brian Quinlan", "bot": false, "at": "2026-10-13 22:38", "ago": "12d ago", "what": "pushed commit a7807d9 'Retry'", "text": ""}, {"who": "Brian Quinlan", "bot": false, "at": "2026-10-13 22:46", "ago": "12d ago", "what": "pushed commit 0591457 'Update AGENTS.md'", "text": ""}, {"who": "Brian Quinlan", "bot": false, "at": "2026-10-13 23:19", "ago": "12d ago", "what": "pushed commit 5e4974c 'fixes'", "text": ""}, {"who": "Brian Quinlan", "bot": false, "at": "2026-10-13 23:28", "ago": "12d ago", "what": "pushed commit c83bb62 'Docs.'", "text": ""}, {"who": "Brian Quinlan", "bot": false, "at": "2026-10-13 23:37", "ago": "12d ago", "what": "pushed commit 8629ad5 'Remove equality.'", "text": ""}, {"who": "Brian Quinlan", "bot": false, "at": "2026-10-13 23:49", "ago": "12d ago", "what": "pushed commit 0c91543 'retry private'", "text": ""}, {"who": "Brian Quinlan", "bot": false, "at": "2026-10-14 00:08", "ago": "12d ago", "what": "pushed commit b416590 'docfixes'", "text": ""}, {"who": "Brian Quinlan", "bot": false, "at": "2026-10-14 00:56", "ago": "12d ago", "what": "pushed commit 4205674 'Doc fix'", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2026-10-14 16:37", "ago": "11d ago", "what": "opened this PR", "text": ""}, {"who": "gemini-code-assist[bot]", "bot": true, "at": "2026-10-14 16:42", "ago": "11d ago", "what": "reviewed [COMMENTED]", "text": "## Code Review\n\nThis pull request refactors the retry mechanism across the Google Cloud Dart packages, introducing breaking changes to `ExponentialRetry` by removing built-in retryable errors in favor of explicit predicates or status codes, implementing full jitter, and dynamically determining idempotency within client methods rather than the retry runner. Additionally, it updates documentation, examples, and tests to align with these changes. A critical bug was identified in the newly added `isTransientError` helper in `pkgs/google_cloud_storage/lib/src/retry.dart`, where parsed REST-based `ServiceException` errors containing HTTP status codes in `status.code` would fail to be recognized as transient and thus would not be retried."}, {"who": "gemini-code-assist[bot]", "bot": true, "at": "2026-10-14 16:42", "ago": "11d ago", "what": "left inline review comment on pkgs/google_cloud_storage/lib/src/retry.dart", "text": "![high](https://www.gstatic.com/codereviewagent/high-priority.svg)\n\nIn REST-based APIs like Google Cloud Storage, the JSON error response is parsed into a `ServiceException` where `status.code` contains the HTTP status code (e.g., `503`), rather than a gRPC status code. Because `status?.code` is `503` (which is not in the gRPC status codes list `2 || 4 || 8 || 10 || 13 || 14` and is not `null`), the switch falls through to `_ => false`. This prevents transient REST errors with parsed JSON bodies from being retried. Adding the transient HTTP status codes to the first switch case resolves this issue.\n\n```suggestion\n    ServiceException(:final status, :final statusCode) =>\n      switch (status?.code) {\n        // gRPC status codes: UNKNOWN(2), DEADLINE_EXCEEDED(4),\n        // RESOURCE_EXHAUSTED(8), ABORTED(10), INTERNAL(13), UNAVAILABLE(14).\n        // HTTP status codes: 408, 429, 500, 502, 503, 504.\n        2 || 4 || 8 || 10 || 13 || 14 ||\n        408 || 429 || 500 || 502 || 503 || 504 => true,\n        null =>\n          statusCode == 408 ||\n              statusCode == 429 ||\n              statusCode == 500 ||\n              statusCode == 502 ||\n              statusCode == 503 ||\n              statusCode == 504,\n        _ => false,\n      },\n```"}, {"who": "Brian Quinlan", "bot": false, "at": "2026-10-14 16:49", "ago": "11d ago", "what": "pushed commit 76bf2fd 'Retry docs'", "text": ""}, {"who": "Brian Quinlan", "bot": false, "at": "2026-10-14 17:07", "ago": "11d ago", "what": "pushed commit f6b92db 'test cleanup'", "text": ""}, {"who": "Brian Quinlan", "bot": false, "at": "2026-10-14 17:09", "ago": "11d ago", "what": "pushed commit ff338a3 'simplify'", "text": ""}, {"who": "Brian Quinlan", "bot": false, "at": "2026-10-14 17:26", "ago": "11d ago", "what": "pushed commit 66488eb 'Remove language stuff'", "text": ""}, {"who": "Brian Quinlan", "bot": false, "at": "2026-10-14 17:31", "ago": "11d ago", "what": "pushed commit 85b2651 'Matching'", "text": ""}, {"who": "Brian Quinlan", "bot": false, "at": "2026-10-14 17:32", "ago": "11d ago", "what": "pushed commit b755444 'Update AGENTS.md'", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2026-10-14 17:42", "ago": "11d ago", "what": "renamed 'Retry harmony' -> 'feat(rpc): make retry logic useable across clients'", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2026-10-14 18:05", "ago": "11d ago", "what": "commented", "text": "/gcbrun"}, {"who": "Brian Quinlan", "bot": false, "at": "2026-10-14 18:21", "ago": "11d ago", "what": "pushed commit cf08f15 'Fix'", "text": ""}, {"who": "Brian Quinlan", "bot": false, "at": "2026-10-14 18:29", "ago": "11d ago", "what": "pushed commit db747a3 'Update retry.dart'", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2026-10-14 18:31", "ago": "11d ago", "what": "left inline review comment (reply) on pkgs/google_cloud_storage/lib/src/retry.dart", "text": "google_cloud_storage doesn't use gRPC so I removed all of these cases."}, {"who": "Brian Quinlan", "bot": false, "at": "2026-10-14 19:32", "ago": "11d ago", "what": "pushed commit 8ded78b 'Update client_test.dart'", "text": ""}, {"who": "Brian Quinlan", "bot": false, "at": "2026-10-14 19:35", "ago": "11d ago", "what": "pushed commit 69b4cf6 'fix'", "text": ""}, {"who": "Brian Quinlan", "bot": false, "at": "2026-10-14 19:55", "ago": "11d ago", "what": "pushed commit c94e910 'Update retry_test.dart'", "text": ""}, {"who": "Brian Quinlan", "bot": false, "at": "2026-10-14 20:19", "ago": "11d ago", "what": "pushed commit 3ccbba4 'Fixes some tests'", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2026-10-14 20:20", "ago": "11d ago", "what": "commented", "text": "/gcbrun"}, {"who": "Brian Quinlan", "bot": false, "at": "2026-10-14 20:36", "ago": "11d ago", "what": "pushed commit a2d98a4 'Update retry.dart'", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2026-10-14 20:41", "ago": "11d ago", "what": "commented", "text": "/gcbrun"}, {"who": "brianquinlan", "bot": false, "at": "2026-10-14 20:50", "ago": "11d ago", "what": "commented", "text": "/gemini review"}, {"who": "gemini-code-assist[bot]", "bot": true, "at": "2026-10-14 20:53", "ago": "11d ago", "what": "reviewed [COMMENTED]", "text": "## Code Review\n\nThis pull request introduces significant updates to the retry mechanism across the google_cloud_rpc, google_cloud_pubsub, and google_cloud_storage packages, including breaking changes that remove the isIdempotent parameter from RetryRunner.run and allow explicit retry runners to always be used. It also adds the isTransientError helper and noRetry option for Cloud Storage. Feedback on these changes suggests documenting that the custom http.Client is closed when Storage is closed, and correcting the Pub/Sub delayMultiplier from 4 to 2 (along with its corresponding test) to align with the standard service configuration."}, {"who": "gemini-code-assist[bot]", "bot": true, "at": "2026-10-14 20:53", "ago": "11d ago", "what": "left inline review comment on pkgs/google_cloud_storage/lib/src/client.dart", "text": "![medium](https://www.gstatic.com/codereviewagent/medium-priority.svg)\n\nSince the `Storage` class closes the user-provided `http.Client` in its `close()` method, this behavior must be explicitly documented in the constructor to warn users against passing shared or persistent clients, in accordance with the repository's general rules.\n\n```suggestion\n  /// Methods retry failed requests using [defaultRetry] if the operation is\n  /// [idempotent][], and don't retry them otherwise. Pass a `retry` argument\n  /// to a method to change how that call is retried. The documentation for\n  /// each method says when the operation is idempotent.\n  ///\n  /// Note that if a custom [client] is provided, it will be closed when\n  /// [close] is called on this [Storage] instance. Avoid passing a shared or\n  /// persistent client that is used elsewhere.\n```\n\n<details>\n<summary>References<\/summary>\n\n1. If a class or function accepts a user-provided http.Client (or a factory creating one) and closes it, this behavior must be explicitly documented to warn users against passing shared or persistent clients.\n<\/details>"}, {"who": "gemini-code-assist[bot]", "bot": true, "at": "2026-10-14 20:53", "ago": "11d ago", "what": "left inline review comment on pkgs/google_cloud_pubsub/lib/src/retry.dart", "text": "![medium](https://www.gstatic.com/codereviewagent/medium-priority.svg)\n\nThe `google.pubsub.v1` gRPC service configuration specifies a `backoffMultiplier` of `2` (or `1.3` in some versions), not `4`. A multiplier of `4` causes the retry delay to grow extremely fast, which deviates from the standard Pub/Sub retry policy. Please update this to `2` to match the service definition.\n\n```suggestion\n  delayMultiplier: 2,\n```"}, {"who": "gemini-code-assist[bot]", "bot": true, "at": "2026-10-14 20:53", "ago": "11d ago", "what": "left inline review comment on pkgs/google_cloud_pubsub/test/retry_test.dart", "text": "![medium](https://www.gstatic.com/codereviewagent/medium-priority.svg)\n\nUpdate the test assertion to expect a `delayMultiplier` of `2` to align with the corrected default retry configuration.\n\n```dart\n      expect(defaultRetry.delayMultiplier, equals(2));\n```"}, {"who": "brianquinlan", "bot": false, "at": "2026-10-14 21:04", "ago": "11d ago", "what": "commented", "text": "/gcbrun(a2d98a479f1227e5e51f65592d64dba7e320fafb)"}, {"who": "Brian Quinlan", "bot": false, "at": "2026-10-14 22:32", "ago": "11d ago", "what": "pushed commit 07791cd \"Merge branch 'main' into retry_harmony\"", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2026-10-14 22:33", "ago": "11d ago", "what": "left inline review comment (reply) on pkgs/google_cloud_pubsub/lib/src/retry.dart", "text": "The value is `4` here:\r\nhttps://github.com/googleapis/googleapis/blob/8c6e40489b4ab4f1886154a32ece2f0b5db52b27/google/pubsub/v1/pubsub_grpc_service_config.json#L41-L64"}, {"who": "brianquinlan", "bot": false, "at": "2026-10-14 22:34", "ago": "11d ago", "what": "left inline review comment (reply) on pkgs/google_cloud_storage/lib/src/client.dart", "text": "This seems unrelated to this PR."}, {"who": "brianquinlan", "bot": false, "at": "2026-10-14 22:34", "ago": "11d ago", "what": "review_requested natebosch", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2026-10-14 22:34", "ago": "11d ago", "what": "review_requested sigurdm", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2026-10-14 22:34", "ago": "11d ago", "what": "assigned natebosch", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2026-10-14 22:35", "ago": "11d ago", "what": "commented", "text": "@sigurdm for the pubsub bits"}, {"who": "Brian Quinlan", "bot": false, "at": "2026-10-15 07:22", "ago": "11d ago", "what": "pushed commit d6ef4f3 \"Merge branch 'main' into retry_harmony\"", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2026-10-15 07:22", "ago": "11d ago", "what": "commented", "text": "/gcbrun"}, {"who": "Brian Quinlan", "bot": false, "at": "2026-10-15 22:05", "ago": "10d ago", "what": "pushed commit 5b0d75e 'no export retry'", "text": ""}, {"who": "Brian Quinlan", "bot": false, "at": "2026-10-15 22:15", "ago": "10d ago", "what": "pushed commit 4cffd84 'fix'", "text": ""}, {"who": "Brian Quinlan", "bot": false, "at": "2026-10-15 22:54", "ago": "10d ago", "what": "pushed commit 23e6915 'Fix CHANGELOG'", "text": ""}, {"who": "sigurdm", "bot": false, "at": "2026-10-19 15:17", "ago": "6d ago", "what": "reviewed [APPROVED]", "text": "LGTM!\n\nChecked the `defaultRetry` reference in `pkgs/google_cloud_pubsub/lib/src/retry.dart` — [`pubsub_grpc_service_config.json#L41-L64`](https://github.com/googleapis/googleapis/blob/8c6e40489b4ab4f1886154a32ece2f0b5db52b27/google/pubsub/v1/pubsub_grpc_service_config.json#L41-L64) is the right reference for `Publish` (100ms initial delay, 4x multiplier, 60s max delay, 60s timeout, and those 7 status codes). (`pubsub_grpc_service_config.json` has separate entries for `StreamingPull` at `#L101-L122` and `Acknowledge`/`ModifyAckDeadline` at `#L189-L241`, which we can either share `defaultRetry` for or specialize in #292/#339.)"}, {"who": "Sigurd Meldgaard", "bot": false, "at": "2026-10-20 09:59", "ago": "5d ago", "what": "pushed commit ec8f213 'Merge main into retry_harmony and update Subscription retry calls'", "text": ""}, {"who": "sigurdm", "bot": false, "at": "2026-10-20 10:03", "ago": "5d ago", "what": "commented", "text": "I opened https://github.com/brianquinlan/google-cloud-dart/pull/2 against `retry_harmony` to resolve the merge conflicts with #292 and #339 and update `Subscription` for the new `RetryRunner`/`ExponentialRetry` API."}, {"who": "Brian Quinlan", "bot": false, "at": "2026-10-20 16:03", "ago": "5d ago", "what": "pushed commit 283d072 'Merge pull request #2 from sigurdm/retry-harmony-merged'", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2026-10-20 16:04", "ago": "5d ago", "what": "commented", "text": "/gbcrun"}, {"who": "brianquinlan", "bot": false, "at": "2026-10-21 16:34", "ago": "4d ago", "what": "commented", "text": "Hey @sigurdm \r\n\r\nDo you think that this is good to merge (I mean did you look at the non-PubSub parts)? @natebosch has a lot of reviews on his plate right now so, if he doesn't have to review this code, it would be helpful."}], "note": "", "prd_note": "", "set": "B"}, {"id": "googleapis/google-cloud-dart#359", "url": "https://github.com/googleapis/google-cloud-dart/issues/359", "title": "[google_cloud_rpc] Wire RetryRunner and per-call RequestOptions into ServiceClient for generated REST clients", "kind": "Issue", "state": "open", "author": "kevmoo", "labels": [], "assignees": ["brianquinlan"], "requested": [], "repo_desc": "[Experimental] Google Cloud Dart Client Libraries", "created": "37d ago", "updated": "10d ago", "snapshot": "2026-10-25T19:31:36Z", "as_of": null, "thumbs_down_at": null, "roles": ["assignee", "commenter", "watches_repo"], "last": "brianquinlan commented 10d ago", "stacked_on": null, "related": ["PR googleapis/google-cloud-dart#352 'feat(google_cloud_rpc): extract shared RetryRunner and ExponentialRetry': merged, by sigurdm, updated 27d ago", "PR googleapis/google-cloud-dart#353 'feat(google_cloud_pubsub): add Pub/Sub retry configuration and gRPC error mapping': merged, by sigurdm, updated 17d ago", "issue googleapis/google-cloud-dart#346 'Share retry logic between google_cloud_pubsub and google_cloud_storage (before pubsub 1.0)': closed (completed), by sigurdm, updated 27d ago", "issue googleapis/google-cloud-dart#80 '`AutoPopulated` fields not supported': open, by brianquinlan, updated 10d ago"], "body": "### Context & Problem\n\nPR #352 extracts `RetryRunner`, `ExponentialRetry`, `NoDelayRetry`, and `defaultIsRetryable` into `package:google_cloud_rpc/retry.dart` (`keep:` list) so `google_cloud_storage` and `google_cloud_pubsub` (#353) can share a common retry implementation (#346).\n\nHowever, three transport and codegen gaps remain before `RetryRunner` can reliably protect all 20+ generated REST client packages in `generated/*`:\n\n1. **`ServiceClient._makeRequest()` Does Not Invoke `RetryRunner` or Accept `RequestOptions`**:\n   - `ServiceClient._makeRequest()` in `generated/google_cloud_rpc/lib/service_client.dart` still executes raw `http.Client.send` calls without invoking `RetryRunner`, and provides no mechanism for callers to configure client-level retry policies, per-call timeouts, or custom headers (`RequestOptions`).\n   - By contrast, sibling `sidekick`-generated SDKs (`google-cloud-rust` and `google-cloud-swift`) wrap every generated client transport in a `RetryLoop` consulting a client-level `RetryPolicy` and per-call `RequestOptions`.\n\n2. **Bug: `ServiceException.fromHttpResponse` Throws `FormatException` on HTML `502`/`503`/`504` Responses (Bypassing `RetryRunner`)**:\n   - In `generated/google_cloud_rpc/lib/src/exceptions.dart:60`, `ServiceException.fromHttpResponse(http.Response response, String body)` calls `JsonDecode(body)` whenever `body.isNotEmpty` without catching `FormatException`.\n   - When a Google Front End (GFE) or load balancer returns a transient `502 Bad Gateway`, `503 Service Unavailable`, or `504 Gateway Timeout` with an HTML error page (`<html>...`), `JsonDecode(body)` throws an uncaught `FormatException` **before `ServiceException` is constructed**.\n   - Because `defaultIsRetryable` in `retry.dart` (#352) checks `if (error is ServiceException)` (`500`, `502`, `503`, `504`, `408`, `429`), an uncaught `FormatException` completely bypasses `RetryRunner` on gateway errors.\n\n<del>\n3. **AIP-4222 `x-goog-request-params` Routing Headers & AIP-155 Auto-Populated `request_id` UUIDv4 (`sidekick/dart`)**:\n   - `sidekick/api` (`routing_info.go`) already parses `google.api.routing` annotations into `api.Method.Routing` and `auto_populated_fields` (`request_id` UUIDv4) into `api.Method.AutoPopulated`, and `sidekick/rust` emits both, whereas `sidekick/dart` currently drops them.\n   - Emitting `x-goog-request-params` is required by [AIP-4222](https://google.aip.dev/client-libraries/4222) for regional/tenant routing, and auto-populating empty `request_id` fields with a UUIDv4 ([AIP-155](https://google.aip.dev/155) / [AIP-4235](https://google.aip.dev/client-libraries/4235)) makes mutating `POST` RPCs idempotent so `RetryRunner` can safely retry them on transient failures.\n<\/del>\n\n### Proposed Solution\n\n1. **Harden `ServiceException.fromHttpResponse` and Extend `ServiceClient` in `package:google_cloud_rpc`**:\n   - Wrap `JsonDecode(body)` in `ServiceException.fromHttpResponse` (`exceptions.dart:60`) in a `try / on FormatException` block that falls back to constructing the status-code-mapped `ServiceException` with `response.reasonPhrase ?? body` when the error payload is non-JSON/HTML.\n   - Add an optional `RetryRunner retry` parameter to `ServiceClient({...})` (defaulting to `const NoDelayRetry()` or per-service defaults passed by generated clients).\n   - Add a `RequestOptions` class in `package:google_cloud_rpc` supporting per-call `Duration? timeout`, `RetryRunner? retry`, and `Map<String, String>? headers`.\n   - Update `ServiceClient._makeRequest()` to execute requests through `(options?.retry ?? this.retry).run(...)` with optional timeout enforcement.\n2. **Update `sidekick/dart` Generator Templates (`googleapis/librarian`)**:\n   - Pass service-specific retry defaults (from service config / `librarian.yaml`) when constructing `ServiceClient`.\n   - Add an optional `RequestOptions? options` parameter to generated RPC methods in `method.mustache`.\n   - Emit `x-goog-request-params` headers from `api.Method.Routing` ([AIP-4222](https://google.aip.dev/client-libraries/4222)) and auto-populate unset `request_id` fields (`api.Method.AutoPopulated`) with a UUIDv4 before entering `RetryRunner`.\n\n### Acceptance Criteria\n\n- [ ] `ServiceException.fromHttpResponse` gracefully handles non-JSON/HTML `502`/`503`/`504` error bodies without throwing `FormatException`, allowing `RetryRunner` to retry gateway errors.\n- [ ] `ServiceClient` in `package:google_cloud_rpc` supports `RetryRunner` and per-request `RequestOptions`.\n- [ ] Generated REST clients in `generated/*` support configurable retry policies, per-call `RequestOptions`, `x-goog-request-params` routing headers, and auto-populated `request_id` UUIDs.", "timeline": [{"who": "kevmoo", "bot": false, "at": "2026-09-18 22:35", "ago": "37d ago", "what": "opened this issue", "text": ""}, {"who": "github-project-automation[bot]", "bot": true, "at": "2026-09-18 22:35", "ago": "37d ago", "what": "added to project v2", "text": ""}, {"who": "github-project-automation[bot]", "bot": true, "at": "2026-09-18 22:35", "ago": "37d ago", "what": "project v2 item status changed", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2026-10-09 00:14", "ago": "17d ago", "what": "assigned brianquinlan", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2026-10-09 00:21", "ago": "17d ago", "what": "commented", "text": "Retry examples:\n\nGo:\n```golang\npackage main\n\nimport (\n\t\"context\"\n\t\"time\"\n\n\tsecretmanager \"cloud.google.com/go/secretmanager/apiv1\"\n\t\"cloud.google.com/go/secretmanager/apiv1/secretmanagerpb\"\n\t\"github.com/googleapis/gax-go/v2\"\n\t\"google.golang.org/grpc/codes\"\n)\n\nfunc example(ctx context.Context) error {\n\tclient, err := secretmanager.NewClient(ctx)\n\tif err != nil {\n\t\treturn err\n\t}\n\tdefer client.Close()\n\n\t// 1. Client-level (per-method) override on CallOptions:\n\tclient.CallOptions.GetSecret = []gax.CallOption{\n\t\tgax.WithRetry(func() gax.Retryer {\n\t\t\treturn gax.OnCodes([]codes.Code{\n\t\t\t\tcodes.Unavailable,\n\t\t\t\tcodes.DeadlineExceeded,\n\t\t\t}, gax.Backoff{\n\t\t\t\tInitial:    100 * time.Millisecond,\n\t\t\t\tMax:        10 * time.Second,\n\t\t\t\tMultiplier: 1.3,\n\t\t\t})\n\t\t}),\n\t}\n\n\t// 2. Per-call override via variadic gax.CallOption:\n\treq := &secretmanagerpb.GetSecretRequest{Name: \"projects/my-project/secrets/my-secret\"}\n\tsecret, err := client.GetSecret(\n\t\tctx,\n\t\treq,\n\t\tgax.WithTimeout(30*time.Second),\n\t\tgax.WithRetry(func() gax.Retryer {\n\t\t\t// Return a fresh Retryer per call (Retryer is stateful)\n\t\t\treturn gax.OnHTTPCodes(gax.Backoff{\n\t\t\t\tInitial:    500 * time.Millisecond,\n\t\t\t\tMax:        30 * time.Second,\n\t\t\t\tMultiplier: 2.0,\n\t\t\t}, 429, 502, 503, 504)\n\t\t}),\n\t)\n\t_ = secret\n\treturn err\n}\n```\n\nJava:\n```java\nimport com.google.api.gax.httpjson.HttpJsonCallContext;\nimport com.google.api.gax.retrying.RetrySettings;\nimport com.google.api.gax.rpc.StatusCode;\nimport com.google.cloud.secretmanager.v1.GetSecretRequest;\nimport com.google.cloud.secretmanager.v1.Secret;\nimport com.google.cloud.secretmanager.v1.SecretManagerServiceClient;\nimport com.google.cloud.secretmanager.v1.SecretManagerServiceSettings;\nimport java.time.Duration;\nimport java.util.Set;\n\npublic class RetryExample {\n  public static void main(String[] args) throws Exception {\n    // 1. Client-level (per-method) configuration via Settings Builder:\n    SecretManagerServiceSettings.Builder settingsBuilder =\n        SecretManagerServiceSettings.newHttpJsonBuilder();\n\n    settingsBuilder\n        .getSecretSettings()\n        .setRetryableCodes(\n            StatusCode.Code.UNAVAILABLE,\n            StatusCode.Code.DEADLINE_EXCEEDED)\n        .setRetrySettings(\n            RetrySettings.newBuilder()\n                .setInitialRetryDelayDuration(Duration.ofMillis(100))\n                .setRetryDelayMultiplier(1.3)\n                .setMaxRetryDelayDuration(Duration.ofSeconds(60))\n                .setInitialRpcTimeoutDuration(Duration.ofSeconds(20))\n                .setMaxRpcTimeoutDuration(Duration.ofSeconds(20))\n                .setTotalTimeoutDuration(Duration.ofMinutes(5))\n                .setMaxAttempts(5)\n                .build());\n\n    try (SecretManagerServiceClient client =\n        SecretManagerServiceClient.create(settingsBuilder.build())) {\n\n      GetSecretRequest request =\n          GetSecretRequest.newBuilder()\n              .setName(\"projects/my-project/secrets/my-secret\")\n              .build();\n\n      // 2. Per-call override using the generated Callable + ApiCallContext:\n      HttpJsonCallContext callContext =\n          HttpJsonCallContext.createDefault()\n              .withRetrySettings(\n                  RetrySettings.newBuilder()\n                      .setMaxAttempts(3)\n                      .setInitialRetryDelayDuration(Duration.ofSeconds(1))\n                      .build())\n              .withRetryableCodes(Set.of(StatusCode.Code.UNAVAILABLE))\n              .withTimeoutDuration(Duration.ofSeconds(15));\n\n      Secret secret = client.getSecretCallable().call(request, callContext);\n    }\n  }\n}\n```\n\nPython:\n```python\nfrom google.api_core import exceptions\nfrom google.api_core import retry\nfrom google.cloud import secretmanager_v1\n\n# Initialize the client (using REST transport if desired)\nclient = secretmanager_v1.SecretManagerServiceClient(transport=\"rest\")\n\n# Define a custom retry policy\ncustom_retry = retry.Retry(\n    predicate=retry.if_exception_type(\n        exceptions.ServiceUnavailable,\n        exceptions.DeadlineExceeded,\n        exceptions.InternalServerError,\n    ),\n    initial=1.0,       # 1s initial delay\n    maximum=60.0,      # 60s max delay\n    multiplier=2.0,    # exponential multiplier\n    timeout=120.0,     # total retry deadline (2 minutes)\n)\n\nrequest = secretmanager_v1.GetSecretRequest(\n    name=\"projects/my-project/secrets/my-secret\"\n)\n\n# Pass retry, timeout, and metadata per-call\nresponse = client.get_secret(\n    request=request,\n    retry=custom_retry,\n    timeout=30.0,\n    metadata=[(\"x-custom-header\", \"value\")],\n)\n```"}, {"who": "brianquinlan", "bot": false, "at": "2026-10-15 15:52", "ago": "10d ago", "what": "commented", "text": "I think that the client side changes required for AIP-4222 & AIP-155 are covered by https://github.com/googleapis/google-cloud-dart/issues/80 so I'm going to remove that part of this bug."}], "note": "", "prd_note": "", "set": "B"}, {"id": "googleapis/google-cloud-dart#366", "url": "https://github.com/googleapis/google-cloud-dart/issues/366", "title": "Require the `google_cloud_rpc` release that adds `retry.dart` in `google_cloud_storage` and `google_cloud_pubsub`", "kind": "Issue", "state": "open", "author": "sigurdm", "labels": [], "assignees": [], "requested": [], "repo_desc": "[Experimental] Google Cloud Dart Client Libraries", "created": "27d ago", "updated": "17d ago", "snapshot": "2026-10-25T19:31:39Z", "as_of": null, "thumbs_down_at": null, "roles": ["commenter", "watches_repo"], "last": "brianquinlan commented 17d ago", "stacked_on": null, "related": ["PR googleapis/google-cloud-dart#352 'feat(google_cloud_rpc): extract shared RetryRunner and ExponentialRetry': merged, by sigurdm, updated 27d ago", "PR googleapis/google-cloud-dart#333 'fix(rpc): update version to 0.6.0': merged, by brianquinlan, updated 58d ago, assignees ['natebosch']", "PR googleapis/google-cloud-dart#353 'feat(google_cloud_pubsub): add Pub/Sub retry configuration and gRPC error mapping': merged, by sigurdm, updated 17d ago"], "body": "#352 moves `RetryRunner`, `ExponentialRetry`, and `ChecksumValidationException` into `package:google_cloud_rpc`, but the latest published `google_cloud_rpc` (0.6.0) doesn't include them. The workspace resolves the local copy, so CI won't catch that `google_cloud_storage` still allows `google_cloud_rpc: ^0.6.0`.\n\nOnce the generated `google_cloud_rpc` version has been bumped:\n\n- [ ] Require the new version in `pkgs/google_cloud_storage/pubspec.yaml` (as #333 did for 0.6.0) and mention it in the CHANGELOG, before releasing `google_cloud_storage` 0.6.5.\n- [ ] Do the same in `pkgs/google_cloud_pubsub/pubspec.yaml` before publishing `google_cloud_pubsub`, since it imports `package:google_cloud_rpc/retry.dart` from #353 on.", "timeline": [{"who": "sigurdm", "bot": false, "at": "2026-09-28 08:57", "ago": "27d ago", "what": "opened this issue", "text": ""}, {"who": "github-project-automation[bot]", "bot": true, "at": "2026-09-28 08:57", "ago": "27d ago", "what": "added to project v2", "text": ""}, {"who": "github-project-automation[bot]", "bot": true, "at": "2026-09-28 08:57", "ago": "27d ago", "what": "project v2 item status changed", "text": ""}, {"who": "sigurdm", "bot": false, "at": "2026-09-28 10:11", "ago": "27d ago", "what": "referenced this in commit b3069e7", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2026-10-08 21:31", "ago": "17d ago", "what": "commented", "text": "I'm trying to decide whether how we should fix this in general, e.g., through librarian automation."}], "note": "", "prd_note": "", "set": "B"}, {"id": "dart-lang/http#2027", "url": "https://github.com/dart-lang/http/issues/2027", "title": "Tighten `Client.close` semantics", "kind": "Issue", "state": "open", "author": "brianquinlan", "labels": [], "assignees": [], "requested": [], "repo_desc": "A composable API for making HTTP requests in Dart.", "created": "9d ago", "updated": "9d ago", "snapshot": "2026-10-25T19:31:42Z", "as_of": null, "thumbs_down_at": null, "roles": ["author", "watches_repo"], "last": "brianquinlan opened this issue 9d ago", "stacked_on": null, "related": [], "body": "The current documentation for `Client.close` says:\n\n```dart\n/// Closes the client and cleans up any resources associated with it.\n///\n/// Once [close] is called, no other [Client] methods should be called. If\n/// [close] is called while there are active requests, the behavior is\n/// undefined.\n///\n/// > [!WARNING]\n/// > The behavior is undefined if [close] is not called before the isolate\n/// > that created this [Client], including the main isolate, exits.\nvoid close();\n```\n\nThe problem with the undefined behavior when `close` is called with active requests is that it makes this pattern impossible:\n\n```dart\ntry:\n  client.get(...).timeout(const Duration(seconds: 0));\nfinally:\n  client.close();  // orphaned request may still be running\n```\n\n1. The reason that I made the `close` behavior undefined when there are active requests is because some libraries (e.g. `cronet`) do not support closing when there are active requests. I think that I can fix that by tracking the outstanding requests and only closing the client when they have all finished.\n\nwhich brings up...\n\n2. The reason that I made calling `close` before isolate exit a requirement is because `ffigen`ed Objective-C asynchronous callbacks would cause the VM to exit if they were called on an isolate that had already exited. \n \nSo the fix was to:\n  - Make `close` synchronous (which means that you there can't be active requests for some clients because you can't wait for them to complete)\n  - Make calling `close` before isolate exit a requirement\n\nBut I think that the issue with callbacks on exited isolates causing a VM exit has been fixed in the latest `ffigen`/`jnigen` versions (though I think that memory might leak because native references aren't cleaned up).\n\nUh, maybe we should just bite the bullet and make `close` return a `Future` that must be `await`ed. That would be a breaking change but there are a lot of pending breaking changes for `package:http` so maybe it is time for a 2.0 release. Making `close` async would make it possible for `Client` implementations to wait until requests are actual killed/finished before returning.", "timeline": [{"who": "brianquinlan", "bot": false, "at": "2026-10-16 15:49", "ago": "9d ago", "what": "opened this issue", "text": ""}], "note": "", "prd_note": "", "set": "B"}, {"id": "dart-lang/sdk#59846", "url": "https://github.com/dart-lang/sdk/issues/59846", "title": "[io]: HTTP header parser accepts many invalid characters within header names", "kind": "Issue", "state": "open", "author": "kenballus", "labels": ["area-vm", "library-io", "type-bug", "triaged"], "assignees": ["brianquinlan"], "requested": [], "repo_desc": "The Dart SDK, including the VM, JS and Wasm compilers, analysis, core libraries, and more.", "created": "22mo ago", "updated": "22mo ago", "snapshot": "2026-10-25T19:31:43Z", "as_of": null, "thumbs_down_at": null, "roles": ["assignee"], "last": "a-siva labeled 22mo ago", "stacked_on": null, "related": ["issue dart-lang/sdk#1 'Process tests sometimes cause timeout on Linux': closed (completed), by sgjesse, updated 11.4y ago, assignees ['sgjesse']"], "body": "In RFC 9110, the allowable characters within a header name are\r\n> tchar = \"!\" / \"#\" / \"$\" / \"%\" / \"&\" / \"'\" / \"*\" / \"+\" / \"-\" / \".\" /\r\n \"^\" / \"_\" / \"`\" / \"|\" / \"~\" / DIGIT / ALPHA\r\n\r\ndart:io does not enforce this rule. The following characters are incorrectly accepted:\r\n```\r\n\\x00 \\x01 \\x02 \\x03 \\x04 \\x05 \\x06 \\x07 \\x08 \\x0b \\x0c \\x0e \\x0f \\x10 \\x11 \\x12 \\x13 \\x14 \\x15 \\x16 \\x17 \\x18 \\x19 \\x1a \\x1b \\x1c \\x1d \\x1e \\x1f \\x22 \\x28 \\x29 \\x2c \\x2f \\x3a \\x3b \\x3c \\x3d \\x3e \\x3f \\x40 \\x5b \\x5c \\x5d \\x7b \\x7d \\x7f \\x80 \\x81 \\x82 \\x83 \\x84 \\x85 \\x86 \\x87 \\x88 \\x89 \\x8a \\x8b \\x8c \\x8d \\x8e \\x8f \\x90 \\x91 \\x92 \\x93 \\x94 \\x95 \\x96 \\x97 \\x98 \\x99 \\x9a \\x9b \\x9c \\x9d \\x9e \\x9f \\xa0 \\xa1 \\xa2 \\xa3 \\xa4 \\xa5 \\xa6 \\xa7 \\xa8 \\xa9 \\xaa \\xab \\xac \\xad \\xae \\xaf \\xb0 \\xb1 \\xb2 \\xb3 \\xb4 \\xb5 \\xb6 \\xb7 \\xb8 \\xb9 \\xba \\xbb \\xbc \\xbd \\xbe \\xbf \\xc0 \\xdb \\xdc \\xdd \\xde \\xdf \\xe0 \\xe1 \\xe2 \\xe3 \\xe4 \\xe5 \\xe6 \\xe7 \\xe8 \\xe9 \\xea \\xeb \\xec \\xed \\xee \\xef \\xf0 \\xf1 \\xf2 \\xf3 \\xf4 \\xf5 \\xf6 \\xf7 \\xf8 \\xf9 \\xfa \\xfb \\xfc \\xfd \\xfe \\xff\r\n```\r\n\r\nOf particular note is that NUL and some whitespace characters (`\\x0b`) are in this list. This can cause issues with upstream proxies.\r\n\r\n```\r\n$ dart info\r\n...\r\n- Dart 3.6.0-edge.3cc6105316be32e2d48b1b9b253247ad4fc89698 (main) (Fri Aug 30 22:53:32 2024 +0000) on \"linux_x64\"\r\n- on linux / Linux 6.10.2-arch1-2 #1 SMP PREEMPT_DYNAMIC Sat, 03 Aug 2024 17:56:17 +0000\r\n- locale is en_US\r\n```", "timeline": [{"who": "kenballus", "bot": false, "at": "2025-01-06 19:02", "ago": "22mo ago", "what": "opened this issue", "text": ""}, {"who": "dart-github-bot", "bot": true, "at": "2025-01-06 19:05", "ago": "22mo ago", "what": "commented", "text": "**Summary:** Dart's `dart:io` HTTP header parser accepts invalid characters in header names, violating RFC 9110.  This may cause interoperability issues."}, {"who": "dart-github-bot", "bot": true, "at": "2025-01-06 19:05", "ago": "22mo ago", "what": "labeled 'area-core-library'", "text": ""}, {"who": "dart-github-bot", "bot": true, "at": "2025-01-06 19:05", "ago": "22mo ago", "what": "labeled 'triage-automation'", "text": ""}, {"who": "dart-github-bot", "bot": true, "at": "2025-01-06 19:05", "ago": "22mo ago", "what": "labeled 'type-bug'", "text": ""}, {"who": "lrhn", "bot": false, "at": "2025-01-07 23:11", "ago": "22mo ago", "what": "unlabeled 'area-core-libra triaged-tool']"], "body": "Observed on the following Dart version:\r\n\r\n```sh\r\n$ dart --version\r\nDart VM version: 2.5.0-dev.3.0.flutter-35382f9b14 (Wed Aug 28 18:50:51 2019 +0000) on \"macos_x64\"\r\n```\r\n\r\n```\r\n  FileSystemException: Deletion failed, path = '/private/var/folders/dy/cv4xnlnn7sb_4bz47wvmdwjw003g3j/T/file_test_JGEQQ7' (OS Error: Directory not empty, errno = 66)\r\n  dart:io                      FileSystemEntity.deleteSync\r\n  test/chroot_test.dart 45:13  main.<fn>.<fn>.<fn>\r\n```\r\n\r\nThe test in question has the following `setUp()` and `tearDown()` methods - the exception was thrown in `tearDown()`;\r\n\r\n```dart\r\nio.Directory tmp;\r\n\r\nsetUp(() {\r\n  tmp = io.Directory.systemTemp.createTempSync('file_test_');\r\n  tmp = io.Directory(tmp.resolveSymbolicLinksSync());\r\n});\r\n\r\ntearDown(() {\r\n  tmp.deleteSync(recursive: true);\r\n});\r\n```\r\n\r\nThis failure is intermittent - not 100% reproducible.", "timeline": [{"who": "tvolkert", "bot": false, "at": "2019-08-30 20:19", "ago": "7.2y ago", "what": "opened this issue", "text": ""}, {"who": "tvolkert", "bot": false, "at": "2019-08-30 20:21", "ago": "7.2y ago", "what": "labeled 'area-library'", "text": ""}, {"who": "tvolkert", "bot": false, "at": "2019-08-30 20:21", "ago": "7.2y ago", "what": "labeled 'library-io'", "text": ""}, {"who": "tvolkert", "bot": false, "at": "2019-08-30 20:22", "ago": "7.2y ago", "what": "commented", "text": "Prior art:\r\n* https://github.com/dart-lang/sdk/issues/16264\r\n* https://github.com/dart-lang/sdk/issues/1757\r\n\r\nExcept both those are closed, and I just saw this happen today against BE Dart."}, {"who": "alexmercerind", "bot": false, "at": "2022-07-13 10:26", "ago": "4.3y ago", "what": "commented", "text": "I can confirm. And I'm surprised how noone came across this yet.\r\n\r\nI think this affects this aswell: https://github.com/flutter/flutter/issues/64410\r\n\r\nThankyou!"}, {"who": "brianquinlan", "bot": false, "at": "2022-08-02 21:27", "ago": "4.2y ago", "what": "assigned brianquinlan", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2022-12-28 00:03", "ago": "3.8y ago", "what": "labeled 'triaged'", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2022-12-28 00:03", "ago": "3.8y ago", "what": "labeled 'P2'", "text": ""}, {"who": "TMcClain5", "bot": false, "at": "2023-01-13 14:11", "ago": "3.8y ago", "what": "commented", "text": "This is an issue I am seeing as well, it is intermittent."}, {"who": "lrhn", "bot": false, "at": "2025-02-13 13:59", "ago": "20mo ago", "what": "labeled 'area-vm'", "text": ""}, {"who": "lrhn", "bot": false, "at": "2025-02-13 14:17", "ago": "20mo ago", "what": "unlabeled 'area-core-library'", "text": ""}, {"who": "filiph", "bot": false, "at": "2026-10-01 14:23", "ago": "24d ago", "what": "commented", "text": "I'm seeing this with `Dart SDK version: 3.13.5 (stable) (Tue Sep 29 01:00:52 2026 -0700) on \"macos_arm64\"` and I can reproduce locally (I can create the directory that cannot be deleted with `recursive: true` because it \"is not empty\").\n\nIs there a way I can help with hunting down the bug?"}, {"who": "copybara-service[bot]", "bot": true, "at": "2026-10-21 12:12", "ago": "4d ago", "what": "referenced this in commit 2752d56", "text": ""}], "note": "", "prd_note": "", "set": "B"}, {"id": "dart-lang/http#1841", "url": "https://github.com/dart-lang/http/issues/1841", "title": "Respect Retry-After header on 503 responses for RetryClient", "kind": "Issue", "state": "open", "author": "RobertBrunhage", "labels": ["type-enhancement", "next-breaking-release", "package:http"], "assignees": [], "requested": [], "repo_desc": "A composable API for making HTTP requests in Dart.", "created": "12mo ago", "updated": "25d ago", "snapshot": "2026-10-25T19:31:47Z", "as_of": null, "thumbs_down_at": "2026-10-05T00:00:00Z", "roles": ["commenter", "mentioned", "watches_repo"], "last": "agam1092005 referenced this in commit 23d ago", "stacked_on": null, "related": ["PR dart-lang/http#2002 [linked: closes/closed-by] 'Add retryDelay callback to RetryClient to support Retry-After header': open, by agam1092005, updated 12d ago, labels ['package:http']"], "body": "it is generally recommended that on 503, if the server responds with the `Retry-After` header we should respect that and if it's not present we should default back exponential backoff.\n\nIs this something that coud be considered to be added directly into the `RetryClient`, so we have that as default behaviour?\n\nI am asking this because we already retrying [503 by default](https://github.com/dart-lang/http/blob/2cb6c12966e18abc11a0217a8b613742849a29ea/pkgs/http/lib/retry.dart#L182C1-L182C4).", "timeline": [{"who": "RobertBrunhage", "bot": false, "at": "2025-10-30 14:43", "ago": "12mo ago", "what": "opened this issue", "text": ""}, {"who": "RobertBrunhage", "bot": false, "at": "2025-10-30 14:43", "ago": "12mo ago", "what": "labeled 'type-enhancement'", "text": ""}, {"who": "RobertBrunhage", "bot": false, "at": "2025-10-30 14:43", "ago": "12mo ago", "what": "labeled 'package:http'", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2025-12-02 01:06", "ago": "11mo ago", "what": "commented", "text": "The most obvious way of doing this is to make `BaseResponse` available in the `delay` function. But that would be a breaking change.\n\nCan you think of another way of doing this?"}, {"who": "brianquinlan", "bot": false, "at": "2025-12-02 01:06", "ago": "11mo ago", "what": "labeled 'next-breaking-release'", "text": ""}, {"who": "agam1092005", "bot": false, "at": "2026-09-30 17:51", "ago": "25d ago", "what": "commented", "text": "Another way to do this without breaking the existing API is to keep delay(int retryCount) as the default backoff policy and add a separate opt-in callback for response-aware delays. For example:\n\n`Duration? Function(BaseResponse response, int retryCount)? retryDelay`\n\nThe default implementation would continue using the current exponential backoff, while callers that need server-controlled retry timing can provide a function that reads Retry-After and returns the appropriate delay. This preserves compatibility for existing users while allowing Retry-After support without changing the meaning of delay.\nThat keeps the change focused and avoids forcing all retry users to depend on BaseResponse in the existing callback.\n\n@brianquinlan @RobertBrunhage \n I’d like to work on this issue."}, {"who": "agam1092005", "bot": false, "at": "2026-10-02 18:36", "ago": "23d ago", "what": "referenced this in commit 4d1b31e", "text": ""}, {"who": "agam1092005", "bot": false, "at": "2026-10-02 18:41", "ago": "23d ago", "what": "referenced this in commit d69fb8d", "text": ""}], "note": "", "prd_note": "", "set": "B"}, {"id": "dart-lang/http#579", "url": "https://github.com/dart-lang/http/pull/579", "title": "Add onSendProgress callback", "kind": "PR", "state": "open", "author": "tlueder", "labels": ["cla: yes", "next-breaking-release", "package:http"], "assignees": [], "requested": ["brianquinlan"], "repo_desc": "A composable API for making HTTP requests in Dart.", "created": "5.4y ago", "updated": "14mo ago", "snapshot": "2026-10-25T19:31:50Z", "as_of": null, "thumbs_down_at": null, "roles": ["requested_reviewer", "commenter", "mentioned", "watches_repo"], "last": "retendo commented 14mo ago", "stacked_on": null, "related": ["issue dart-lang/http#465 'Add support for getting the progress of a file upload / download': open, by liranzairi, updated 21mo ago"], "body": "This fixes the upload part of https://github.com/dart-lang/http/issues/465 \r\n\r\nI had also tried to include the download progress, but that did not work as expected.\r\nAnd it is why easier to do this while consuming the response stream.", "timeline": [{"who": "tlueder", "bot": false, "at": "2021-05-27 15:37", "ago": "5.4y ago", "what": "opened this PR", "text": ""}, {"who": "google-cla[bot]", "bot": true, "at": "2021-05-27 15:38", "ago": "5.4y ago", "wh t": "2021-05-27 15:42", "ago": "5.4y ago", "what": "commented", "text": "@googlebot I signed it!"}, {"who": "google-cla[bot]", "bot": true, "at": "2021-05-27 15:43", "ago": "5.4y ago", "what": "unlabeled 'cla: no'", "text": ""}, {"who": "google-cla[bot]", "bot": true, "at": "2021-05-27 15:43", "ago": "5.4y ago", "what": "labeled 'cla: yes'", "text": ""}, {"who": "piotrsed", "bot": false, "at": "2022-02-18 09:40", "ago": "4.7y ago", "what": "reviewed [APPROVED]", "text": ""}, {"who": "jasonroland", "bot": false, "at": "2022-02-28 19:46", "ago": "4.7y ago", "what": "reviewed [APPROVED]", "text": ""}, {"who": "NazarenoCavazzon", "bot": false, "at": "2022-05-16 22:08", "ago": "4.4y ago", "what": "commented", "text": "Hope this gets merged, it would really help"}, {"who": "tomassasovsky", "bot": false, "at": "2022-05-16 23:23", "ago": "4.4y ago", "what": "commented", "text": "@tlueder @jasonroland @piotrsed any updates on this?"}, {"who": "tlueder", "bot": false, "at": "2022-05-17 08:30", "ago": "4.4y ago", "what": "commented", "text": "Hi, I can rebase this. But without a clear path forward I don't see the point.\r\n\r\nCurrently I just use this plugin from my repro via dependency override, works great."}, {"who": "yinxulai", "bot": false, "at": "2023-03-21 06:49", "ago": "3.6y ago", "what": "reviewed [COMMENTED]", "text": ""}, {"who": "yinxulai", "bot": false, "at": "2023-03-21 06:49", "ago": "3.6y ago", "what": "left inline review comment on pkgs/http/lib/src/io_client.dart", "text": "Why to needs close this ioRequest"}, {"who": "tlueder", "bot": false, "at": "2023-05-29 19:23", "ago": "3.4y ago", "what": "left inline review comment (reply) on pkgs/http/lib/src/io_client.dart", "text": "It's been a while since I've last had a look at this.\r\n\r\nBut I need the response from the ioRequest for the code that follows and I guess that was the easiest way I could think of.\r\n\r\nBut if that is not a good idea or best practice I'm all in for improvements."}, {"who": "kevmoo", "bot": false, "at": "2023-05-30 00:39", "ago": "3.4y ago", "what": "commented", "text": "@brianquinlan @devoncarew @natebosch"}, {"who": "kevmoo", "bot": false, "at": "2023-05-30 00:40", "ago": "3.4y ago", "what": "commented", "text": "Please fix merge conflicts!"}, {"who": "github-actions[bot]", "bot": true, "at": "2023-05-30 09:12", "ago": "3.4y ago", "what": "labeled 'package:http'", "text": ""}, {"who": "tlueder", "bot": false, "at": "2023-05-30 09:15", "ago": "3.4y ago", "what": "commented", "text": "@kevmoo done"}, {"who": "natebosch", "bot": false, "at": "2023-05-30 22:41", "ago": "3.4y ago", "what": "labeled 'next-breaking-release'", "text": ""}, {"who": "natebosch", "bot": false, "at": "2023-05-30 22:54", "ago": "3.4y ago", "what": "commented", "text": "This looks like a breaking change, and we have been avoiding breaking API changes. This is only breaking for a subset of users, but I don't know what proportion.\r\n\r\nWe are currently getting through a major version bump without too much difficulty, but that was a version bump without breaking API changes. cc @brianquinlan for thoughts on the practicality of a breaking API change and another version bump."}, {"who": "tlueder", "bot": false, "at": "2023-05-31 06:21", "ago": "3.4y ago", "what": "commented", "text": "This is a API change for sure but I would argue against a breaking one. This adds a new optional feature. And should not break anything for anyone not using it.\r\n\r\nCan you elaborate what you mean by \"This is only breaking for a subset of users\"?\r\nMaybe I can change the code to make sure it won't affect them."}, {"who": "natebosch", "bot": false, "at": "2023-05-31 14:30", "ago": "3.4y ago", "what": "commented", "text": "This is breaking for classes with overrides of the changed methods."}, {"who": "tlueder", "bot": false, "at": "2023-05-31 14:46", "ago": "3.4y ago", "what": "commented", "text": "Of course, I haven't even thought about that.\r\nThanks for the information."}, {"who": "brianquinlan", "bot": false, "at": "2023-05-31 17:07", "ago": "3.4y ago", "what": "commented", "text": "> We are currently getting through a major version bump without too much difficulty, but that was a version bump without breaking API changes. cc @brianquinlan for thoughts on the practicality of a breaking API change and another version bump.\r\n\r\n1. As you said, this is definitely a breaking change (in particular it will definitely break at least `package:cronet_http` and `package:cupertino_http`).\r\n2. I wonder if there is a way to implement this without breaking the API? For example, we could define a new class like:\r\n\r\n```dart\r\ninterface class ProgressTracker {\r\n  void onSendProgress(int loaded, int total);\r\n}\r\n\r\nclass ProgressTrackingRequest extends StreamedRequest implements ProgressTracker {\r\n   ...\r\n}\r\n```\r\n\r\nAnd `send` implementations could check if the `Request` implements that class and, if so, could update the progress e.g.\r\n\r\n```dart\r\nif (request is ProgressTracker) {\r\n  request.onSendProcess(...);\r\n}\r\n```\r\n\r\nThat's a bit ugly.\r\n\r\n3. I'm not sure why tracking upload progress is more important than tracking download progress. If we are going to make a breaking change then we should do both so we don't have to update the major version just to add the obvious complementary feature.\r\n4. I'd be fine with another version bump but maybe we should wait a few months and accumulate all the breaking changes into one release? Is there an easy way to do this? Like have a 2.0 branch or something?"}, {"who": "tlueder", "bot": false, "at": "2023-05-31 21:26", "ago": "3.4y ago", "what": "commented", "text": "1. Understood, and thanks for your input I was not aware of that.\r\n2. I'd rather wait for a version bump instead of a \"quick fix\". But in the end, I don't really care so much about the how this is implemented, because I don't know enough about dart best practice and what side effects this can have. I just need the progress data and if this is done a different way? I'm happy to update my apps if that means I can get rid of the dependency override and rebasing my fork.\r\n3. It is not that tracking the download is not important, but in contrast to the upload it can be done easily on the consuming side as all the needed data is already available. Just not as callback function. And when I wrote this, 2 years ago, I was not able to do this and my attempts felt just wrong. So I left it at that, but any hints in the right direction are welcome."}, {"who": "Thomas Lüder", "bot": false, "at": "2024-08-27 11:32", "ago": "2.2y ago", "what": "pushed commit b16c0fa 'Setup callback for send data progress'", "text": ""}, {"who": "Thomas Lüder", "bot": false, "at": "2024-08-27 11:32", "ago": "2.2y ago", "what": "pushed commit c16bf02 'Added send progress to BrowserClient'", "text": ""}, {"who": "Thomas Lüder", "bot": false, "at": "2024-08-27 11:32", "ago": "2.2y ago", "what": "pushed commit b2d832b 'Added send progress to IOClient'", "text": ""}, {"who": "Thomas Lüder", "bot": false, "at": "2024-08-27 11:32", "ago": "2.2y ago", "what": "pushed commit 7574756 'Update changelog'", "text": ""}, {"who": "Thomas Lüder", "bot": false, "at": "2024-08-27 11:32", "ago": "2.2y ago", "what": "pushed commit e2f0ea6 'Update changelog'", "text": ""}, {"who": "Thomas Lüder", "bot": false, "at": "2024-08-27 11:32", "ago": "2.2y ago", "what": "pushed commit 2a03ddd 'Fixed test override'", "text": ""}, {"who": "Thomas Lüder", "bot": false, "at": "2024-08-27 11:33", "ago": "2.2y ago", "what": "pushed commit 2272c00 'Update changelog'", "text": ""}, {"who": "Thomas Lüder", "bot": false, "at": "2024-08-27 11:33", "ago": "2.2y ago", "what": "pushed commit 30b47e6 'Fixed overrides after rebase'", "text": ""}, {"who": "kevmoo", "bot": false, "at": "2024-08-27 20:26", "ago": "2.2y ago", "what": "review_requested brianquinlan", "text": ""}, {"who": "github-actions[bot]", "bot": true, "at": "2024-08-27 20:27", "ago"  "at": "2024-08-21 21:08", "ago": "2.2y ago", "what": "commented", "text": "> @bkonyi could you comment on what it would take to access data from web socket network traffic?\r\n\r\nThis would be quite a bit of work as we'd have to add network profiling support in `dart:io` at the very least. If we wanted to add generic support we'd have to update our HTTP profiling solution to also handle websocket traffic. cc @brianquinlan @derekxu16"}, {"who": "srawlins", "bot": false, "at": "2025-03-21 00:10", "ago": "19mo ago", "what": "labeled 'cost: high'", "text": ""}, {"who": "kenzieschmoll", "bot": false, "at": "2025-07-07 18:46", "ago": "16mo ago", "what": "labeled 'new feature'", "text": ""}, {"who": "srawlins", "bot": false, "at": "2025-11-05 23:47", "ago": "12mo ago", "what": "parent issue added", "text": ""}, {"who": "github-project-automation[bot]", "bot": true, "at": "2026-01-23 22:54", "ago": "9mo ago", "what": "added to project v2", "text": ""}, {"who": "Victowolf", "bot": false, "at": "2026-02-26 10:15", "ago": "8mo ago", "what": "commented", "text": "Hi @bkonyi,\n\nMy name is [**Yash (VictoWolf)**](https://github.com/Victowolf) ,\nI am currently exploring this project  under GSOC 2026.\n\nRight now, HTTP profiling is request-based, whereas WebSocket is connection-based and long-lived.\n\nIf we move toward a generic profiling model that supports both request-based (HTTP) and connection-based (WebSocket) protocols, what safe design measures should I keep in mind to avoid breaking the current system?\n\nThanks"}, {"who": "srawlins", "bot": false, "at": "2026-10-21 17:08", "ago": "4d ago", "what": "unlabeled 'cost: high'", "text": ""}], "note": "", "prd_note": "", "set": "B"}, {"id": "dart-lang/http#1972", "url": "https://github.com/dart-lang/http/issues/1972", "title": "HEAD call results in ClientException: Content-Length is larger than actual response length.", "kind": "Issue", "state": "open", "author": "Keetz", "labels": ["type-bug", "package:http", "needs-info"]     const li = document.createElement("li");
    li.setAttribute("role", "option");
    li.dataset.id = x.id;
    li.innerHTML = `<span class="n"></span><span style="min-width:0"><span class="row-title">${esc(x.title)}</span><span class="row-id"><span class="k ${x.kind === "PR" ? "pr" : "issue"}">${x.kind}</span><span class="rid">${esc(x.id)}</span><span class="newdot" hidden>not placed</span></span></span>`;
    li.addEventListener("click", () => select(x.id, true));
    rows[x.id] = li;
  }

  function renderList() {
    order.forEach((id, i) => {
      const li = rows[id];
      if (rankEl.children[i] !== li) rankEl.insertBefore(li, rankEl.children[i] || null);
      li.querySelector(".n").textContent = i + 1;
      li.setAttribute("aria-selected", String(id === sel));
      li.querySelector(".newdot").hidden = placed.has(id);
    });
    const unplaced = order.filter(id => !placed.has(id)).length;
    $("#count").textContent = `${order.length} issues` + (unplaced ? ` · ${unplaced} not placed yet` : "");
    $("#doneBtn").setAttribute("aria-pressed", String(done));
    $("#doneBtn").textContent = done ? "Done ✓" : "Mark done";
    $("#yamlText").value = yaml();
  }

  function renderMover() {
    const i = order.indexOf(sel);
    $("#pos").innerHTML = `#${i + 1} <small>of ${order.length}</small>`;
    $("#upBtn").disabled = $("#up5Btn").disabled = i === 0;
    $("#downBtn").disabled = $("#down5Btn").disabled = i === order.length - 1;
    $("#keepBtn").hidden = placed.has(sel);
    $("#keepBtn").textContent = `Keep at #${i + 1}`;
  }

  // ---- issue view
  function renderView() {
    const x = byId[sel];
    const chips = [`<span class="chip ${x.kind === "PR" ? "pr" : "issue"}">${x.kind}</span>`, `<span class="chip">${esc(x.state)}</span>`,
      ...x.labels.map(l => `<span class="chip">${esc(l)}</span>`)].join("");
    const facts = [
      ["Author", x.author], ["Opened", x.created], ["Last update", x.updated],
      x.assignees.length && ["Assigned", x.assignees.join(", ")],
      x.requested.length && ["Review requested", x.requested.join(", ")],
      x.roles.length && ["Your role", x.roles.map(role).join(", ")],
      ["Last human activity", x.last || "none (bots only)"],
      x.stacked_on && ["Stacked on", Array.isArray(x.stacked_on) ? x.stacked_on.map(s => `${s.pr} “${s.title}” (${s.state}; reviews: ${Array.isArray(s.reviews) ? s.reviews.join(", ") : s.reviews})`).join(" · ") : x.stacked_on],
      x.related.length && ["Related", x.related.join(" · ")],
    ].filter(Boolean).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("");
    const banners = [
      x.as_of ? `<div class="banner asof"><b>Shown as it was on ${esc(when(x.as_of))}.</b> Rank it as if that were now.</div>` : `<div class="banner note"><b>Snapshot:</b> ${esc(when(x.snapshot))}. GitHub may have changed since; rank what you see here.</div>`,
      x.thumbs_down_at ? `<div class="banner down"><b>Pretend you thumbs-downed this on ${esc(when(x.thumbs_down_at))}.</b></div>` : "",
      x.prd_note ? `<div class="banner note"><b>Your note in the PRD:</b> ${esc(x.prd_note)}</div>` : "",
    ].join("");
    const events = x.timeline.filter(e => !(hideBots && e.bot));
    const tl = events.map(e => `<li class="${e.who.toLowerCase() === ME ? "me" : ""} ${e.bot ? "bot" : ""}"><div class="meta"><b>${esc(e.who)}</b> ${esc(e.what)} · ${esc(e.at)} (${esc(e.ago)})</div>${e.text ? `<div class="txt">${esc(e.text)}</div>` : ""}</li>`).join("");
    const botCount = x.timeline.filter(e => e.bot).length;
    $("#view").innerHTML = `
      <div class="chips">${chips}</div>
      <h2><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></h2>
      <div class="idline">${esc(x.id)}${x.repo_desc ? " · " + esc(x.repo_desc) : ""}</div>
      ${banners}
      <dl class="facts">${facts}</dl>
      <h3>Description</h3>
      <div class="body">${x.body ? esc(x.body) : "<i>No description.</i>"}</div>
      <div class="tlbar"><h3>Conversation (${events.length})</h3>${botCount ? `<label><input type="checkbox" id="botToggle" ${hideBots ? "checked" : ""}> Hide ${botCount} bot events</label>` : ""}</div>
      <ol class="tl">${tl || "<li><i>Nothing yet.</i></li>"}</ol>
      <div class="why"><label for="whyBox">Why is it ranked here? (optional)</label><textarea id="whyBox" placeholder="e.g. security; a contributor is waiting on me; nothing for me to do"></textarea></div>`;
    $("#whyBox").value = why[sel] || "";
    $("#whyBox").addEventListener("input", e => { why[sel] = e.target.value; save(); });
    const bt = $("#botToggle"); if (bt) bt.addEventListener("change", e => { hideBots = e.target.checked; renderView(); });
  }

  function select(id, fromClick) {
    sel = id;
    renderList(); renderMover(); renderView();
    $("#viewpane").scrollTop = 0;
    if (!fromClick) rows[id].scrollIntoView({ block: "nearest" });
  }

  function move(delta) {
    const i = order.indexOf(sel);
    const j = Math.max(0, Math.min(order.length - 1, i + delta));
    if (i === j) return;
    order.splice(i, 1); order.splice(j, 0, sel);
    placed.add(sel);
    renderList(); renderMover();
    rows[sel].scrollIntoView({ block: "nearest" });
    save();
  }

  $("#upBtn").addEventListener("click", () => move(-1));
  $("#downBtn").addEventListener("click", () => move(1));
  $("#up5Btn").addEventListener("click", () => move(-5));
  $("#down5Btn").addEventListener("click", () => move(5));
  $("#keepBtn").addEventListener("click", () => { placed.add(sel); renderList(); renderMover(); save(); });
  $("#doneBtn").addEventListener("click", () => { done = !done; renderList(); save(); });
  document.addEventListener("keydown", e => {
    if (e.target.closest("textarea, input, select") || e.metaKey || e.ctrlKey || e.altKey) return;
    const step = e.shiftKey ? 5 : 1;
    if (e.key === "ArrowUp") { e.preventDefault(); move(-step); }
    else if (e.key === "ArrowDown") { e.preventDefault(); move(step); }
    else if (e.key === "j" || e.key === "J") { const i = order.indexOf(sel); if (i < order.length - 1) select(order[i + 1]); }
    else if (e.key === "k" || e.key === "K") { const i = order.indexOf(sel); if (i > 0) select(order[i - 1]); }
  });

  function yaml() {
    const lines = ["# Combined ranking: first item = rank 1", "ranked: true", "items:"];
    for (const id of order) {
      const x = byId[id];
      lines.push(`  - url: ${x.url}`);
      if (x.as_of) lines.push(`    as_of: ${x.as_of}`);
      if (x.thumbs_down_at) lines.push(`    thumbs_down_at: ${x.thumbs_down_at}`);
      lines.push(`    why: ${JSON.stringify((why[id] || "").trim())}`);
    }
    return lines.join("\n") + "\n";
  }
  $("#copyBtn").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(yaml()); $("#copyBtn").textContent = "Copied"; setTimeout(() => $("#copyBtn").textContent = "Copy as YAML", 1500); }
    catch { $("#yamlBox").hidden = false; $("#yamlText").value = yaml(); $("#yamlText").focus(); $("#yamlText").select(); }
  });

  // ---- saving (db capability): one document, written after a short pause, one write at a time
  function setStatus(s, t) { $("#status").dataset.s = s; $("#statusText").textContent = t; }
  function save() {
    if (!db) { $("#yamlText").value = yaml(); return; }
    setStatus("saving", "Saving…");
    clearTimeout(timer); timer = setTimeout(flush, 600);
  }
  async function flush() {
    timer = null;
    if (writing) { pending = true; return; }
    writing = true;
    try {
      await db.doc(DOC).set({ order: [...order], why: { ...why }, placed: [...placed], done, updated_at: new Date().toISOString() });
      setStatus("saved", done ? "Saved · marked done" : "Saved");
    } catch (e) {
      if (e && e.code === "unavailable") { pending = true; setStatus("saving", "Retrying…"); await new Promise(r => setTimeout(r, 1200 + Math.random() * 800)); }
      else setStatus("error", `Couldn't save (${e && e.code || "error"}). Use Copy as YAML.`);
    } finally {
      writing = false;
      if (pending) { pending = false; flush(); }
    }
  }
  function apply(d) {
    const known = new Set(DATA.items.map(x => x.id));
    const o = (d.order || []).filter(id => known.has(id));
    order = o.concat(DATA.items.map(x => x.id).filter(id => !o.includes(id)));
    why = { ...(d.why || {}) };
    if (Array.isArray(d.placed)) placed = new Set(d.placed.filter(id => known.has(id)).concat([...placed].filter(id => byId[id].set !== "B")));
    done = !!d.done;
  }

  select(sel);

  (async () => {
    try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch { db = null; }
    if (!db) { setStatus("offline", "Saving unavailable here: use Copy as YAML"); $("#yamlBox").hidden = false; return; }
    db.doc(DOC).onSnapshot(snap => {
      if (first) {
        first = false;
        if (snap.exists) { apply(snap.data()); select(sel); setStatus("saved", done ? "Saved · marked done" : "Saved"); }
        else setStatus("saved", "Nothing saved yet");
      } else if (snap.exists && !snap.metadata.hasPendingWrites && !writing && !timer) {
        apply(snap.data()); renderList(); renderMover();
      }
    }, e => setStatus("error", `Saving stopped (${e.code}). Reload the page.`));
  })();
})();
</script>
