<style>

  --warn: #f0b75c; --warn-soft: #33270f; --down: #f09a92; --down-soft: #3a1d1b; color-scheme: dark; } }
:root[data-theme="dark"] {

  --pr: #b9a0f0; --pr-soft: #2a2140; --issue: #86d193; --issue-soft: #183020;

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14.5px/1.5 var(--font-body); display: flex; flex-direction: column; }

button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); }
h1 { font: 800 18px/1.1 var(--font-display); margin: 0; }
.status { font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; margin-right: auto; min-width: 0; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.status[data-s="saved"] .dot { background: var(--issue); }
.status[data-s="saving"] .dot { background: var(--warn); }
.status[data-s="error"] .dot, .status[data-s="offline"] .dot { background: var(--down); }
.count { font-size: 12.5px; color: var(--muted); }

.panes { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); }

h3 { font: 600 11px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px; }
.body { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; font-size: 14px; }
.tlbar { display: flex; align-items: center; gap: 10px; margin: 22px 0 8px; }
.tlbar h3 { margin: 0; }
.tlbar label { font-size: 12.5px; color: var(--muted); display: inline-flex; gap: 5px; align-items: center; }
ol.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
ol.tl li { border-left: 2px solid var(--line); padding: 2px 0 2px 12px; }
ol.tl li.me { border-left-color: var(--accent); }

ol.tl .meta { font-size: 12.5px; color: var(--muted); }
ol.tl .meta b { color: var(--ink); font-weight: 600; }
ol.tl .txt { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 3px; font-size: 13.5px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; max-height: 340px; overflow-y: auto; }
.why label { display: block; font-size: 12.5px; color: var(--muted); margin: 22px 0 4px; }
textarea { width: 100%; min-height: 56px; resize: vertical; font: 14px/1.45 var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; }
.yaml { margin: 16px; }
.yaml textarea { min-height: 200px; font: 12px/1.4 var(--font-mono); }

@media (max-width: 760px) {
  body { height: auto; display: block; }
  .panes { display: flex; flex-direction: column-reverse; }
  .listpane { border-right: 0; border-top: 1px solid var(--line); max-height: none; overflow: visible; }

  article { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}

<script id="data" type="application/json">{"user": "brianquinlan", "items": [{"id": "dart-lang/sdk#48056", "url": "https://github.com/dart-lang/sdk/issues/48056", "title": "Disabled CA certificates on android are trusted by Dart", "kind": "Issue", "state": "open", "author": "brianquinlan", "labels": ["area-vm", "P3", "library-io", "os-android", "triaged"], "assignees": ["brianquinlan"], "requested": [], "repo_desc": "The Dart SDK, including the VM, JS and Wasm compilers, analysis, core libraries, and more.", "created": "4.8y ago", "updated": "3d ago", "snapshot": "2026-10-25T17:52:11Z", "as_of": null, "thumbs_down_at": null, "roles": ["author", "assignee", "commenter", "mentioned"], "last": "julemand101 commented 3d ago", "stacked_on": null, "related": ["issue flutter/flutter#26359 'App ignores proxy settings': open, by christian-muertz, updated 9mo ago, labels ['c: new feature', 'framework', 'engine', 'dependency: dart', 'P2', 'team-engine', 'triaged-engine']", "issue dart-lang/sdk#50434 'HttpClient should honor the system configured proxy': open, by brianquinlan, updated 2.5y ago, assignees ['brianquinlan'], labels ['area-vm', 'P3', 'library-io', 'triaged']", "issue dart-lang/sdk#50435 'HttpClient should honor user-installed certificates on Android': open, by brianquinlan, updated 16mo ago, assignees ['brianquinlan'], labels ['area-vm', 'P3', 'library-io', 'os-android', 'triaged']", "issue dart-lang/sdk#64644 '[dart:io] Distrust eight compromised intermediate CA keys': closed (completed), by DubaiChewyCookie, updated 2d ago, assignees ['mraleph'], labels ['area-vm', 'triaged']"], "body": "On Android OS, the list of Root Certificates loaded by the DartSDK SecurityContext is loaded from the directory /system/etc/security/cacerts.\r\n\r\nThe Root Certificate files placed in this path will match the System Certificates in the Trusted credentials on the Android OS. \r\n\r\nHowever, even if Certificate is set to Disable on the Android OS, the Root Certificate file will not be removed from /system/etc/security/cacerts. So even if a user sets any Root Certificate to be untrusted, the DartSDK will ignore that setting and trust it.\r\n\r\nSteps to reproduce:\r\n\r\n1. On AndroidOS, disable the System Root Certificate DigiCert High Assurance EV Root CA in Trusted credentials.\r\n2. Using the `http` package of DartSDK, connect to the server where DigiCert High Assurance EV Root CA will be the RootCA. An example of the code is shown below.\r\n```\r\ndart\r\n// RootCA for www.intellilink.co.jp FQDN is DigiCert High Assurance EV Root CA\r\nhttp.get(Uri.parse('https://www.intellilink.co.jp'));\r\n```\r\n3. For the reasons explained above, DartSDK trusts the Root Certificate with the disabled setting and establishes communication with it. Note that NET::ERR_CERT_AUTHORITY_INVALID is generated when you connect to https://www.intellilink.co.jp with Google Chrome, which confirms that the above disabled setting is working.", "timeline": [{"who": "brianquinlan", "bot": false, "at": "2022-01-04 20:55", "ago": "4.8y ago", "what": "opened this issue", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2022-01-04 20:55", "ago": "4.8y ago", "what": "labeled 'library-io'", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2022-01-04 20:55", "ago": "4.8y ago", "what": "labeled 'os-android'", "text": ""}, {"who": "a-siva", "bot": false, "at": "2022-01-04 21:31", "ago": "4.8y ago", "what": "labeled 'area-library'", "text": ""}, {"who": "acoutts", "bot": false, "at": "2022-03-23 13:10", "ago": "4.6y ago", "what": "commented", "text": "Could this also mean if a user has explicitly added a new certificate to their system, dart wouldn't trust it?\r\nOne issue I'm seeing in the wild is users on corporate public wifi networks are getting certificate errors in my flutter app but they are clearly able to use the internet otherwise to contact our support team, which means their device must trust the root CA being used but the flutter app is not."}, {"who": "komaxx", "bot": false, "at": "2022-10-30 10:22", "ago": "4.0y ago", "what": "commented", "text": "@acoutts\r\nYes, many corporate Wifi network setups will not work with Dart/Flutter (at least with Android devices).\r\nIn one app, we've built a workaround where a required certificate would be installed into the app per MDM additionally to installing it in the OS itself.\r\nThat is brittle workaround, though. \r\n\r\nWe've also tried to pipe all traffic not through `dart.http` but wrote native plugin code for that instead. This will fail for everything that you don't control directly, though, like image loading or video streaming.\r\n\r\nIn the end, we scrapped the Flutter project for all business apps, and started re-implementing natively.\r\n\r\nI wish Flutter/Dart would put a clear warning on their pages, like: _Corporate networks are not supported_."}, {"who": "brianquinlan", "bot": false, "at": "2022-10-31 19:56", "ago": "4.0y ago", "what": "assigned brianquinlan", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2022-10-31 19:57", "ago": "4.0y ago", "what": "labeled 'P2'", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2022-10-31 19:57", "ago": "4.0y ago", "what": "unlabeled 'P2'", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2022-10-31 19:57", "ago": "4.0y ago", "what": "labeled 'P1'", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2022-11-02 00:09", "ago": "4.0y ago", "what": "commented", "text": "Hey @komaxx,\r\n\r\nI'd like to understand your use case (and I'm not familiar with how typical corporate networks do security).\r\n\r\nSo the corporate network that you are trying to access requires a client certificate. When you were explicitly setting the certificate in your app, were you using [`SecurityContext.useCertificateChainBytes`](https://api.dart.dev/stable/2.18.4/dart-io/SecurityContext/useCertificateChainBytes.html)?\r\n\r\nWould [`getCertificateChain`](https://developer.android.com/reference/android/security/KeyChain#getCertificateChain(android.content.Context,%20java.lang.String) have provided the certificate that you needed?\r\n\r\nWhat did your native plugin do? Provide the needed certificate, do the entire HTTP transport or something else?\r\n\r\nThanks for your help!"}, {"who": "aam", "bot": false, "at": "2022-11-02 15:57", "ago": "4.0y ago", "what": "commented", "text": "> Could this also mean if a user has explicitly added a new certificate to their system, dart wouldn't trust it?\r\n\r\nIt depends on how and kind of a certificate was added to the system.\r\nGenerally speaking, by default dart app will pick up _trusted_root_certs_ from the system, so if a user adds new new trusted root cert to the system, dart app will use it. Dart developer can also allows force use of trusted roots certs that are built-in into the dart vm(via [`SecurityContext(withTrustedRoots:true)`](https://api.flutter.dev/flutter/dart-io/SecurityContext/SecurityContext.html)). Dart developer can also explicitly specify certificates that should be used(via [`SecurityContext.setTrustedCertificates`](https://api.flutter.dev/flutter/dart-io/SecurityContext/setTrustedCertificates.html)\r\n\r\n> One issue I'm seeing in the wild is users on corporate public wifi networks are getting certificate errors in my flutter app but they are clearly able to use the internet otherwise to contact our support team, which means their device must trust the root CA being used but the flutter app is not.\r\n\r\nI recommend opening new issue for the issue you see, since this one is specifically about handling of disabled certs on Android, and providing more details along the lines @brianquinlan suggested."}, {"who": "brianquinlan", "bot": false, "at": "2022-11-02 16:29", "ago": "4.0y ago", "what": "commented", "text": "Hey @aam,\r\n\r\nMaybe I'm misunderstanding but Dart is loading certs from [`/system/etc/security/cacerts`](https://github.com/dart-lang/sdk/blob/main/runtime/bin/security_context_android.cc#L50).\r\n\r\nI think that user-add certificates go in `/data/misc/keystore/user_0/` (or in a database in new Android versions), which we don't consider.\r\n\r\nGood point about the new issue - if this is looking like a client certificate issue then I'll file a new issue just about that."}, {"who": "aam", "bot": false, "at": "2022-11-02 16:47", "ago": "4.0y ago", "what": "commented", "text": "> I think that user-add certificates go in `/data/misc/keystore/user_0/` (or in a database in new Android versions), \r\n\r\nAh, I see. If that's the case, then you are right, we are not going to pick those certificates up automatically at the moment"}, {"who": "komaxx", "bot": false, "at": "2022-11-07 09:07", "ago": "4.0y ago", "what": "commented", "text": "Hi @brianquinlan \r\n\r\nHappy to help! \r\nHere's what I've encountered as a common corporate network setup: (Android) devices are controlled via some sort of MDM (Knox, MobileIron, ..). Via these MDMs, self-signed certificates are installed on the phones. In the settings app on the phone, these will then show up as user-added certificates.\r\nAlso Wifi connections are often set-up to use a man-in-the-middle proxy (for \"security\") which uses again a self-signed certificate for TLS.\r\n\r\nFor the **browser**, everything works then out-of-the-box: Browser apps by default trust user-added certificates.\r\n\r\nFor **native Android** apps, there is only a small change necessary: One just has to add a security config XML file that enables user-installed certificates as trust-anchors (see: https://developer.android.com/training/articles/security-config). Proxy settings are honored automatically.\r\n\r\nFor **Flutter apps**, we're now in hot water: \r\n- First, Flutter will not respect the phones proxy settings (see: https://github.com/flutter/flutter/issues/26359) \r\n- Then, when a workaround for that was made, the user-installed certificates will not be accepted. For this, we could not find a simple solution, as there seems to be no easy way to read user-certificates from the system. \r\n\r\nWith one customer we could build a scheme where the PEM of the used self-signed certificate would be transported to the app via MDM. Then, we simply registered an `HttpOverride` and created a `HttpClient` that would check in its `badCertificateCallback` against this pem. It works - but it puts our app at a disadvantage against competitor's apps that don't need fiddling around with certificates in MDM interfaces.\r\n\r\nThe second workaround was to simply dump all http requesting into a plugin and run the requests natively. That gets old quickly (multipart requets, custom headers, error handling, ..) as we had to re-implement parts of the `http` interface, but it works - for http requests that we do ourself; implicit requests (e.g. `Image.network`) fail. One can write workarounds for all those things as well. However, we decided at that point to go for a different platform for apps targeted at corporate customers.\r\n\r\n> Would [getCertificateChain](https://developer.android.com/reference/android/security/KeyChain#getCertificateChain(android.content.Context,%20java.lang.String) have provided the certificate that you needed?\r\n\r\nI don't know :/ This did not turn up in my research at the time, and right now I don't know how I would use it, sorry!\r\n\r\nI hope that makes things a bit clearer?"}, {"who": "brianquinlan", "bot": false, "at": "2022-11-10 18:32", "ago": "4.0y ago", "what": "commented", "text": "Based on the discussion, I've filed two new bugs:\r\n- [HttpClient should honor the system configured proxy](https://github.com/dart-lang/sdk/issues/50434)\r\n- [HttpClient should honor user-installed certificates on Android](https://github.com/dart-lang/sdk/issues/50435)"}, {"who": "brianquinlan", "bot": false, "at": "2022-11-10 18:32", "ago": "4.0y ago", "what": "unlabeled 'P1'", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2022-12-17 02:23", "ago": "3.9y ago", "what": "labeled 'library-io-triaged'", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2022-12-17 02:23", "ago": "3.9y ago", "what": "labeled 'P3'", "text": ""}, {"who": "a-siva", "bot": false, "at": "2022-12-20 19:33", "ago": "3.8y ago", "what": "labeled 'triaged'", "text": ""}, {"who": "a-siva", "bot": false, "at": "2022-12-20 19:33", "ago": "3.8y ago", "what": "unlabeled 'library-io-triaged'", "text": ""}, {"who": "tomekit", "bot": false, "at": "2023-06-02 09:56", "ago": "3.4y ago", "what": "commented", "text": "We're facing similar issue where Dart/Flutter doesn't respect configured user managed trusted CA. \r\n\r\nIn more detail, we're getting:\r\n```HandshakeException: Handshake error in client (OS Error: \\n\\tCERTIFICATE_VERIFY_FAILED: unable to get local issuer certificate(handshake.cc:393```\r\n\r\nOn Android we've installed CA and tested on Android 11, Android 13 and Android 14 without success:\r\n\r\n![Screenshot from 2023-06-02 11-50-25](https://github.com/dart-lang/sdk/assets/7759113/75e9894d-4d36-4def-8b49-ee16ac17e559)\r\n\r\n![Screenshot from 2023-06-02 11-50-49](https://github.com/dart-lang/sdk/assets/7759113/d7c624d9-4cd9-406a-9152-066e5c2ef522)\r\n\r\nAre there any plans to address the issue, so Flutter correctly recognizes the user managed CA installed on the system?\r\n\r\nThis is a deal breaker for many corporate apps / use cases, where CA is managed by the IT department and installed on the user's end device.\r\n\r\nRelated: https://stackoverflow.com/questions/78384421/flutter-user-trusted-credentials-arent-trusted-on-android"}, {"who": "lrhn", "bot": false, "at": "2024-04-21 23:10", "ago": "2.5y ago", "what": "labeled 'area-vm'", "text": ""}, {"who": "lrhn", "bot": false, "at": "2024-04-21 23:10", "ago": "2.5y ago", "what": "unlabeled 'area-core-library'", "text": ""}, {"who": "acn-masatadakurihara", "bot": false, "at": "2026-10-22 08:13", "ago": "3d ago", "what": "commented", "text": "### Security impact: eMudhra intermediate CA compromise (October 2026)\n\nHi Dart team,\n\nI'd like to raise a security-related concern in connection with this issue, following the recent **eMudhra intermediate CA private key compromise**, disclosed on October 20, 2026.\n\nIncident details:\nhttps://emudhra.we-have-a-problem.com/\n\nEight intermediate CA private keys were compromised, potentially allowing attackers to impersonate HTTPS services.\n\nMajor browsers and operating systems have deployed mitigations through certificate revocation or blocklists. However, some non-browser TLS clients may remain vulnerable because they do not enforce these mechanisms.\n\n### Potential impact on Dart/Flutter for Android\n\nAs described in this issue, Dart's `SecurityContext` on Android loads trusted CA certificates from `/system/etc/security/cacerts`, rather than fully relying on Android's platform trust evaluation.\n\nThis raises a related concern:\n\n**Does Dart's `HttpClient` honor Android's certificate revocation and blocklist mechanisms, including the mitigations deployed for the compromised eMudhra intermediates?**\n\nEven if Android has blocked these certificates, Dart applications using `dart:io` might still accept certificate chains involving the compromised intermediates if the relevant revocation or blocklist checks are not enforced.\n\n### Questions\n\n1. Does `dart:io` / `HttpClient` on Android honor certificate revocation and blocklists distributed through Android platform security updates or Google Play services?\n\n2. Are the compromised eMudhra intermediate CA certificates currently rejected by Dart's TLS implementation on Android?\n\n3. Does the behavior differ between Android, iOS, and macOS, particularly where platform-native trust evaluation is used?\n\n4. If Dart is affected, is a Dart SDK security update planned, or is there a recommended mitigation for Flutter applications?\n\n### Reproduction / verification\n\nThe incident disclosure provides public TLS test endpoints:\n\n- https://dv-g3b-emudhra.we-have-a-problem.com/\n- https://dv-g3b-aaa-emudhra.we-have-a-problem.com/\n\nThese can be tested using Dart's standard `HttpClient`, without disabling certificate verification.\n\nSuccessful TLS negotiation with a compromised certificate chain would indicate a potential security issue requiring further investigation.\n\nI have not yet independently confirmed whether current Dart/Flutter versions accept these chains on Android.\n\nGiven the potential impact on Flutter applications handling authentication tokens, API credentials, and sensitive user data, an official assessment of Dart's TLS behavior would be greatly appreciated.\n\nThank you!"}, {"who": "julemand101", "bot": false, "at": "2026-10-22 08:18", "ago": "3d ago", "what": "commented", "text": "@acn-masatadakurihara see also: https://github.com/dart-lang/sdk/issues/64644"}], "note": "", "prd_note": "Issue created by me, recent security concerns that have probably been addressed by #64644 but need to verify that they have been addressed and possibly close the issue.", "set": "A"}, {"id": "googleapis/librarian#7808", "url": "https://github.com/googleapis/librarian/pull/7808", "title": "fix(internal/librarian/dart): set initial `librarian.yaml` version on `bump`", "kind": "PR", "state": "open", "author": "brianquinlan", "labels": [], "assignees": [], "requested": ["cloud-sdk-librarian-team (team)"], "repo_desc": "CLI for managing SDK client library configuration, generation and releases", "created": "3d ago", "updated": "19h ago", "snapshot": "2026-10-25T17:52:14Z", "as_of": null, "thumbs_down_at": null, "roles": ["author"], "last": "kevmoo left inline review comment 19h ago", "stacked_on": null, "related": ["issue googleapis/google-cloud-dart#358 [linked: closes/closed-by] 'Publishing leaves new packages untagged': open, by brianquinlan, updated 4d ago, labels ['type: process', 'priority: p2']"], "body": "Change the way that `librarian bump` works for dart:\r\n1. expect that unpublished packages do *not* have a version in `librarian.yaml` (`librarian generate` will set the `pubspec.yaml` version to `default.dart.version`  or `0.1.0)\r\n2. if `librarian bump` is run on an unpublished package then the `librarian.yaml` and `pubspec.yaml` versions are set to to `default.dart.version`  or `0.1.0\r\n\r\nThis is necessary because `librarian tag` finds the packages released by a commit by comparing the versions in `librarian.yaml` before and after `librarian bump`. New Dart packages were onboarded with a version already in librarian.yaml, so bump never changed it and `librarian tag` skipped their first release.\r\n\r\nFixes https://github.com/googleapis/google-cloud-dart/issues/358", "timeline": [{"who": "Brian Quinlan", "bot": false, "at": "2026-10-22 23:00", "ago": "3d ago", "what": "pushed commit ac88b5b 'fix'", "text": ""}, {"who": "Brian Quinlan", "bot": false, "at": "2026-10-22 23:18", "ago": "3d ago", "what": "pushed commit 27728dd 'Update bump_test.go'", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2026-10-22 23:38", "ago": "3d ago", "what": "opened this PR", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2026-10-22 23:38", "ago": "3d ago", "what": "review_requested cloud-sdk-librarian-team", "text": ""}, {"who": "gemini-code-assist[bot]", "bot": true, "at": "2026-10-22 23:40", "ago": "3d ago", "what": "reviewed [COMMENTED]", "text": "## Code Review\n\nThis pull request updates the Dart package bumping logic to handle unpublished packages, ensuring they do not have a version in `librarian.yaml` and are instead released using a default version (either from `default.dart.version` or defaulting to `0.1.0`). It also refactors `updatePubspecVersion` to use `slices.IndexFunc`. The review feedback suggests optimizing `updatePubspecVersion` by using the `bytes` package directly on the byte slice to avoid unnecessary memory allocations from string conversions."}, {"who": "gemini-code-assist[bot]", "bot": true, "at": "2026-10-22 23:40", "ago": "3d ago", "what": "left inline review comment on internal/librarian/dart/pubspec.go", "text": "![medium](https://www.gstatic.com/codereviewagent/medium-priority.svg)\n\nAccording to the repository's general rules, when working with file contents in Go, we should avoid converting `[]byte` to `string` for search and replace operations to prevent unnecessary memory allocations. We can use the `bytes` package directly on the byte slice instead.\n\n```suggestion\nlines := bytes.Split(content, []byte(\"\\n\"))\ni := slices.IndexFunc(lines, func(line []byte) bool { return bytes.HasPrefix(line, []byte(\"version:\")) })\nif i < 0 {\n\treturn fmt.Errorf(\"no version found in %s\", path)\n}\nlines[i] = []byte(\"version: \" + newVersion)\nreturn os.WriteFile(path, bytes.Join(lines, []byte(\"\\n\")), 0644)\n```\n\n<details>\n<summary>References<\/summary>\n\n1. When working with file contents in Go, avoid converting []byte to string for search and replace operations to prevent unnecessary memory allocations. Use the bytes package (e.g., bytes.Contains, bytes.ReplaceAll) to perform operations directly on the byte slice.\n<\/details>"}, {"who": "Brian Quinlan", "bot": false, "at": "2026-10-23 00:04", "ago": "3d ago", "what": "pushed commit 0534d29 'Update pubspec.go'", "text": ""}, {"who": "kevmoo", "bot": false, "at": "2026-10-24 22:50", "ago": "19h ago", "what": "reviewed [COMMENTED]", "text": ""}, {"who": "kevmoo", "bot": false, "at": "2026-10-24 22:50", "ago": "19h ago", "what": "left inline review comment on internal/librarian/dart/bump.go", "text": "The next `librarian generate` deletes this newly created `CHANGELOG.md` via [`checkAndClean`](https://github.com/googleapis/librarian/blob/00ae0ab2bf5e506433ccfcbb7030b1748e87abc8/internal/librarian/generate.go#L154-L155) because newly onboarded libraries cannot list `\"CHANGELOG.md\"` in [`keep` before `bump` creates the file](https://github.com/googleapis/librarian/blob/00ae0ab2bf5e506433ccfcbb7030b1748e87abc8/internal/librarian/clean.go#L65-L67). Should `Bump` append `\"CHANGELOG.md\"` to `lib.Keep` here, or should `LanguageDart` clean auto-preserve an existing `CHANGELOG.md`?"}], "note": "", "prd_note": "My PR, review feedback needs addressed.", "set": "A"}, {"id": "googleapis/google-cloud-dart#376", "url": "https://github.com/googleapis/google-cloud-dart/pull/376", "title": "feat(pubsub): add client attribution header and pre-release polish", "kind": "PR", "state": "open", "author": "sigurdm", "labels": [], "assignees": [], "requested": [], "repo_desc": "[Experimental] Google Cloud Dart Client Libraries", "created": "5d ago", "updated": "5d ago", "snapshot": "2026-10-25T17:52:19Z", "as_of": null, "thumbs_down_at": null, "roles": ["watches_repo"], "last": "sigurdm opened this PR 5d ago", "stacked_on": null, "related": ["PR googleapis/google-cloud-dart#292 'feat(google_cloud_pubsub): add Subscription ack and modifyAckDeadline batching': merged, by sigurdm, updated 5d ago", "issue googleapis/google-cloud-dart#346 'Share retry logic between google_cloud_pubsub and google_cloud_storage (before pubsub 1.0)': closed (completed), by sigurdm, updated 27d ago", "PR googleapis/google-cloud-dart#348 'test(pubsub): run the Pub/Sub end-to-end tests against Google Cloud': merged, by sigurdm, updated 38d ago", "PR googleapis/google-cloud-dart#354 'feat(google_cloud_pubsub): add Batcher and Topic publish batching': merged, by sigurdm, updated 17d ago", "PR googleapis/google-cloud-dart#339 'feat(pubsub): add resilient parallel streaming pull': merged, by sigurdm, updated 5d ago"], "body": "- Send `gl-dart/<dartVersion> gccl/<packageVersion>` in the `x-goog-api-client` gRPC metadata header on all `PubSub` requests and verify `packageVersion` matches `pubspec.yaml`.\n- Condense `CHANGELOG.md` into a summary of the initial `0.1.0` feature set.\n- Add the license header and `issue_tracker` URL to `pubspec.yaml`.\n- Add `.pubignore` to exclude `protos/` and `tool/` from the published package archive.", "timeline": [{"who": "Sigurd Meldga ud_tasks_v2/example/main.dart|\n|generated/google_cloud_tasks_v2/test/tasks_test.dart|\n|pkgs/google_cloud/example/example.dart|\n|pkgs/google_cloud/example/project_discovery.dart|\n|pkgs/google_cloud/lib/constants.dart|\n|pkgs/google_cloud/lib/general.dart|\n|pkgs/google_cloud/lib/google_cloud.dart|\n|pkgs/google_cloud/lib/src/constants.dart|\n|pkgs/google_cloud/lib/src/gcp_project.dart|\n|pkgs/google_cloud/lib/src/metadata.dart|\n|pkgs/google_cloud/test/gcp_test.dart|\n|pkgs/google_cloud/test/metadata_test.dart|\n|pkgs/google_cloud/test/src/metadata_host_print.dart|\n|pkgs/google_cloud/test/src/project_id_local_no_cache_print.dart|\n|pkgs/google_cloud/test/src/project_id_metadata_cache_print.dart|\n|pkgs/google_cloud/test/src/project_id_print.dart|\n|pkgs/google_cloud_auth/example/main.dart|\n|pkgs/google_cloud_auth/lib/google_cloud_auth.dart|\n|pkgs/google_cloud_auth/lib/src/application_default_credentials.dart|\n|pkgs/google_cloud_auth/lib/src/application_default_credentials_web.dart|\n|pkgs/google_cloud_auth/lib/src/compute_engine_credentials.dart|\n|pkgs/google_cloud_auth/lib/src/credential_exception.dart|\n|pkgs/google_cloud_auth/lib/src/google_credentials.dart|\n|pkgs/google_cloud_auth/lib/src/jwks/jwks_cache.dart|\n|pkgs/google_cloud_auth/lib/src/jwks/x509.dart|\n|pkgs/google_cloud_auth/lib/src/platform_io.dart|\n|pkgs/google_cloud_auth/lib/src/platform_web.dart|\n|pkgs/google_cloud_auth/lib/src/service_account_credentials.dart|\n|pkgs/google_cloud_auth/lib/src/service_account_signer.dart|\n|pkgs/google_cloud_auth/lib/src/verifier/jws_parser.dart|\n|pkgs/google_cloud_auth/lib/src/verifier/token_verification_exception.dart|\n|pkgs/google_cloud_auth/lib/src/verifier/token_verifier.dart|\n|pkgs/google_cloud_auth/test/application_default_credentials_test.dart|\n|pkgs/google_cloud_auth/test/application_default_credentials_web_test.dart|\n|pkgs/google_cloud_auth/test/compute_engine_credentials_test.dart|\n…[68346 more characters]"}, {"who": "gemini-code-assist[bot]", "bot": true, "at": "2026-10-20 09:39", "ago": "5d ago", "what": "reviewed [COMMENTED]", "text": "## Code Review\n\nThis pull request enhances the `google_cloud_pubsub` package by implementing resilient bidirectional streaming pull capabilities, including support for parallel streams, automatic reconnection with exponential backoff, and background batching/routing of acknowledgments and deadline modifications. Feedback on these changes highlights critical issues where asynchronous stream cancellations could throw unhandled `StateError`s during ACK or deadline modification writes, potentially causing callers to hang indefinitely. Additionally, a potential duplicate error emission issue was identified in the stream controller's error-handling logic.\n\n<details>\n<summary>I am having trouble creating individual review comments. Click here to see my feedback.<\/summary>\n\n### pkgs/google_cloud_pubsub/lib/src/subscription.dart (192-197)\n\n![high](https://www.gstatic.com/codereviewagent/high-priority.svg)\n\nCalling `activeStream.add(...)` can throw a `StateError` if the stream has been cancelled asynchronously (e.g., due to a network drop). Since there is no `try-catch` block around this call, the exception will propagate and prevent `resolveBatch()` from being called. This will cause any completers associated with the batch to never complete, leading to callers awaiting `acknowledge()` hanging indefinitely. Wrapping the call in a `try-catch` block allows it to safely fall back to the unary RPC path.\n\n```dart\n    final activeStream = _getActiveStream();\n    if (activeStream != null) {\n      try {\n        activeStream.add(grpc.StreamingPullRequest()..ackIds.addAll(ackIds));\n        resolveBatch();\n        return;\n      } catch (e) {\n        // Fall back to unary RPC if stream write fails.\n      }\n    }\n```\n\n### pkgs/google_cloud_pubsub/lib/src/subscription.dart (258-269)\n\n![high](https://www.gstatic.com/codereviewagent/high-priority.svg)\n\nCalling `activeStream.add(...)` can throw a `StateError` if the stream has been cancelled asynchronously. Without a `try-catch` block, this exception will propagate and prevent `resolveGroup()` from being called, causing callers awaiting `modifyAckDeadline()` to hang indefinitely. Wrapping the call in a `try-catch` block allows it to safely fall back to the unary RPC path.\n\n```dart\n        final activeStream = _getActiveStream();\n        if (activeStream != null) {\n          try {\n            activeStream.add(\n              grpc.StreamingPullRequest()\n                ..modifyDeadlineAckIds.addAll(ackIds)\n                ..modifyDeadlineSeconds.addAll(\n                  List.filled(ackIds.length, deadline),\n                ),\n            );\n            resolveGroup();\n            return;\n          } catch (e) {\n            // Fall back to unary RPC if stream write fails.\n          }\n        }\n```\n\n### pkgs/google_cloud_pubsub/lib/src/client.dart (540-551)\n\n![medium](https://www.gstatic.com/codereviewagent/medium-priority.svg)\n\nWhen `cancelOnError` is true, `controller.addStream` forwards any stream error to the controller and then completes its returned future with that error (throwing it). Because this call is inside the main `try-catch` block, the caught exception will trigger `controller.addError` a second time. If the user listens to the stream without `cancelOnError: true` (the default in Dart), they will receive every stream error twice. Wrapping `addStream` in its own `try-catch` block to catch and ignore the thrown error prevents this duplicate emission.\n\n```suggestion\n          try {\n            await controller.addStream(\n              responseStream.expand(\n                (response) => response.receivedMessages.map(\n                  (receivedMessage) => _mapReceivedMessage(\n                    receivedMessage,\n                    ackHandler: ackHandler,\n                    modifyDeadlineHandler: modifyDeadlineHandler,\n                  ),\n                ),\n              ),\n              cancelOnError: true,\n            );\n          } catch (_) {\n            // The error has already been forwarded to the controller by addStream.\n          }\n```\n\n<\/details>"}], "note": "", "prd_note": "The PR of a close collaborator in a repo that I am responsible for.", "set": "A"}, {"id": "googleapis/google-cloud-dart#382", "url": "https://github.com/googleapis/google-cloud-dart/pull/382", "title": "fix(google_cloud_rpc): use the google.rpc.Code of JSON errors in Status.code", "kind": "PR", "state": "open", "author": "quaaantumdev", "labels": [], "assignees": [], "requested": [], "repo_desc": "[Experimental] Google Cloud Dart Client Libraries", "created": "3d ago", "updated": "3d ago", "snapshot": "2026-10-25T17:52:26Z", "as_of": null, "thumbs_down_at": null, "roles": ["watches_repo"], "last": "quaaantumdev opened this PR 3d ago", "stacked_on": null, "related": ["issue googleapis/google-cloud-dart#381 [linked: closes/closed-by] '[google_cloud_rpc] fromHttpResponse puts the HTTP status into Status.code and drops the google.rpc.Code, so ABORTED is never retried over REST': open, by quaaantumdev, updated 3d ago"], "body": "Fixes #381.\n\nFor an error received as JSON, `ServiceException.fromHttpResponse` put the HTTP status code into `status.code` and dropped the `google.rpc.Code` that the error names in `status`. gRPC errors carry the `google.rpc.Code` there (see `_mapGrpcError` in `google_cloud_pubsub`), and `ExponentialRetry.isRetryable` relies on it. Over REST, an `ABORTED` error (409) was therefore never retried, and callers couldn't tell `ABORTED` from `ALREADY_EXISTS`, or `FAILED_PRECONDITION` from `INVALID_ARGUMENT`.\n\n## Changes\n\n- `fromHttpResponse` reads the error's `status` into `Status.code`, for example `\"ABORTED\"` becomes 10. When `status` is missing or isn't a `google.rpc.Code`, the HTTP status code stays, as before. `ServiceException.statusCode` still has the HTTP status code.\n- The doc comment of `ServiceException.status` says what `code` holds.\n\nThis changes `status.code` for JSON errors that name their code (400 becomes 3, and so on). The only other place in this repository that reads `status.code` for a REST error is `google_cloud_storage`'s `create_bucket_test.dart`. Cloud Storage's JSON API errors don't carry a `status`, so that test still gets 409.\n\n## Tests\n\n- The existing `valid error 400`, `409` and `other` tests now expect the `google.rpc.Code` (3, 6 and 13).\n- New tests: `ABORTED` gives 10 and is retryable, and `ALREADY_EXISTS` is not. An error without a `status`, or with an unknown one, keeps the HTTP status code.\n- Without the fix, the four tests that expect a `google.rpc.Code` fail.\n- `dart test` in `generated/google_cloud_rpc`: 86 passed. `dart analyze --fatal-infos` and `dart format` are clean.", "timeline": [{"who": "Kjartan Ferstl", "bot": false, "at": "2026-10-22 14:37", "ago": "3d ago", "what": "pushed commit dc2f85b 'fix(google_cloud_rpc): use the google.rpc.Code of JSON errors in Status.code'", "text": ""}, {"who": "quaaantumdev", "bot": false, "at": "2026-10-22 14:38", "ago": "3d ago", "what": "opened this PR", "text": ""}, {"who": "gemini-code-assist[bot]", "bot": true, "at": "2026-10-22 14:49", "ago": "3d ago", "what": "reviewed [COMMENTED]", "text": "## Code Review\n\nThis pull request updates the test suite for service exceptions by refining status code assertions to match specific Google Cloud RPC error codes and adding new test cases to verify retryable behavior for specific error scenarios. I have no further feedback to provide as there were no review comments submitted."}], "note": "", "prd_note": "Recent PR from an unknown 3rd party in a repo that I am responsible for.", "set": "A"}, {"id": "googleapis/google-cloud-dart#360", "url": "https://github.com/googleapis/google-cloud-dart/issues/360", "title": "[google_cloud_rpc] Fix _makeStreamingRequest non-SSE EOF buffering and mid-stream error handling", "kind": "Issue", "state": "open", "author": "kevmoo", "labels": [], "assignees": [], "requested": [], "repo_desc": "[Experimental] Google Cloud Dart Client Libraries", "created": "37d ago", "updated": "17d ago", "snapshot": "2026-10-25T17:59:15Z", "as_of": null, "thumbs_down_at": null, "roles": ["commenter", "watches_repo"], "last": "kevmoo commented 17d ago", "stacked_on": null, "related": ["issue googleapis/librarian#2490 'sidekick(dart generator): Only generate streaming method implementations for white-listed methods': open, by brianquinlan, updated 3mo ago, labels ['sidekick']", "PR googleapis/librarian#5533 'feat(dart): support a SSE allowlist': merged, by brianquinlan, updated 10d ago, assignees ['natebosch']", "PR googleapis/google-cloud-dart#339 'feat(pubsub): add resilient parallel streaming pull': merged, by sigurdm, updated 5d ago"], "body": "### Context & Problem\n\nWhile PR #339 adds resilient gRPC bidirectional streaming pull specifically for handwritten `pkgs/google_cloud_pubsub`, all generated server-streaming REST RPCs (such as Vertex AI `streamGenerateContent`, Gemini `streamGenerateContent`, and Firestore `Listen`) rely on `ServiceClient._makeStreamingRequest()` in `generated/google_cloud_rpc/lib/service_client.dart` (lines 177–241).\n\nCurrently, `_makeStreamingRequest()` has two runtime issues:\n\n1. **Non-SSE `application/json` Responses Buffer Until EOF (`service_client.dart:210-217`)**:\n   - When `enableSse: false` (or when a Google API returns a chunked JSON array `[obj1, obj2, ...]` with `Content-Type: application/json` instead of `text/event-stream`), lines 213–216 execute:\n     ```dart\n     final responseBody = await response.stream.bytesToString();\n     final json = (jsonDecode(responseBody) as List)\n         .cast<Map<String, dynamic>>();\n     yield* Stream.fromIterable(json);\n     ```\n   - Awaiting `response.stream.bytesToString()` blocks until the entire HTTP stream reaches EOF before decoding or yielding the first item, defeating incremental streaming for non-SSE streaming endpoints (see also `googleapis/librarian#2490` and `googleapis/librarian#5533`).\n\n2. **Mid-Stream SSE Error Frames Are Silently Decoded as Empty Messages (`service_client.dart:230-240`)**:\n   - When `Content-Type: text/event-stream` is active, an HTTP `200 OK` response header is sent before streaming begins. If an error occurs mid-stream (e.g., quota exhaustion, deadline exceeded, or upstream disconnect), Google APIs emit an SSE `data: {\"error\": {\"code\": ..., \"message\": ..., \"status\": ...}}` JSON frame.\n   - Currently, lines 236–238 decode the `data: ` payload and `yield json` directly to the generated method's `.map(ResponseType.fromJson)`. Because `ResponseType` does not have an `error` field, `ResponseType.fromJson` silently ignores the `\"error\"` key and yields a default/empty `ResponseType` message instead of throwing a `ServiceException`.\n\n### Proposed Solution\n\n1. **Detect and Throw `ServiceException` on Mid-Stream Error Payloads**:\n   - In `_makeStreamingRequest()`, inspect each decoded `Map<String, dynamic>` item (both in the SSE `data:` loop and JSON array stream) for a top-level `'error'` object matching `google.rpc.Status` / Google REST error format (matching the check in `ServiceException.fromHttpResponse` in `lib/src/exceptions.dart:105-110`), and throw the corresponding `ServiceException`.\n2. **Incremental Framing for `application/json` Streaming Responses**:\n   - Replace the full-stream `await response.stream.bytesToString()` buffer in the `case 'application/json':` branch with an incremental JSON array element splitter/decoder so elements in `[obj1, obj2, ...]` are yielded as chunks arrive over `response.stream`.\n\n### Acceptance Criteria\n\n- [ ] Mid-stream SSE `data: {\"error\": ...}` frames (and chunked JSON array error elements) throw a `ServiceException` on the returned `Stream` rather than yielding an empty/default response message.\n- [ ] `application/json` streaming responses (`enableSse: false`) yield array elements incrementally as HTTP chunks arrive instead of buffering until EOF.", "timeline": [{"who": "kevmoo", "bot": false, "at": "2026-09-19 05:56", "ago": "37d ago", "what": "opened this issue", "text": ""}, {"who": "github-project-automation[bot]", "bot": true, "at": "2026-09-19 05:56", "ago": "37d ago", "what": "added to project v2", "text": ""}, {"who": "github-project-automation[bot]", "bot": true, "at": "2026-09-19 05:56", "ago": "37d ago", "what": "project v2 item status changed", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2026-10-08 21:37", "ago": "17d ago", "what": "commented", "text": "For (1), do you know if servers actually incrementally send JSON? Are you worried about the memory footprint of waiting until the entire result is received?"}, {"who": "kevmoo", "bot": false, "at": "2026-10-08 22:24", "ago": "17d ago", "what": "commented", "text": "I don't know if servers send incremental JSON. I'm not *worried*. Just...I don't know. Being able to stream results means we can process on the fly and avoid the memory bits.\n\nI won't say this is urgent, just a hole we have!"}], "note": "", "prd_note": "An issue in a repo that I'm responsible for. The filer is a collaborator. The filer indicated the issue isn't urgent.", "set": "A"}, {"id": "googleapis/google-cloud-dart#361", "url": "https://github.com/googleapis/google-cloud-dart/issues/361", "title": "[google_cloud_compute_v1] Switch to specification_format: discovery and wire CommonDiscovery LRO pollers", "kind": "Issue", "state": "open", "author": "kevmoo", "labels": [], "assignees": [], "requested": [], "repo_desc": "[Experimental] Google Cloud Dart Client Libraries", "created": "36d ago", "updated": "16d ago", "snapshot": "2026-10-25T17:52:30Z", "as_of": null, "thumbs_down_at": null, "roles": ["commenter", "mentioned", "watches_repo"], "last": "brianquinlan commented 16d ago", "stacked_on": null, "related": ["PR googleapis/google-cloud-dart#323 'feat(google_cloud_compute_v1): initial commit': merged, by brianquinlan, updated 2mo ago, assignees ['natebosch']", "PR googleapis/google-cloud-dart#345 'feat(dns): initial support': draft open, by brianquinlan, updated 45d ago", "issue googleapis/google-cloud-dart#28 'provide facilities to make it easier for users to poll for the results of LROs': open, by devoncarew, updated 37d ago, labels ['type: feature request']"], "body": "### Context & Problem\n\n`google_cloud_compute_v1` (landed in #323) is currently configured in `librarian.yaml` (lines 281–293) without `specification_format: discovery`. As a result, `librarian` derives `google/cloud/compute/v1` and generates `google_cloud_compute_v1` from `google/cloud/compute/v1/compute.proto` (`SpecificationFormat: protobuf`).\n\nHowever, Compute Engine does not use `google.longrunning.Operations`. In `compute.proto`, long-running operations return `google.cloud.compute.v1.Operation` and are annotated with `google.cloud.operation_service` extensions (`ZoneOperations`, `RegionOperations`, `GlobalOperations`, `GlobalOrganizationOperations`), which `internal/sidekick/parser/protobuf.go` does not parse into `api.Method.OperationInfo` or `DiscoveryLro`.\n\nBy contrast, in `googleapis/librarian`:\n- `internal/serviceconfig/sdk.yaml:436-438` maps `google/cloud/compute/v1` to `discovery: discoveries/compute.v1.json`.\n- `internal/sidekick/parser/discovery/lro.go` (`lroAnnotations`) populates `api.Method.DiscoveryLro` (`PollingPathParameters`) and injects service-scoped `getOperation` poller methods (`IsLroPoller: true`) when `modelConfig.Discovery` (`*api.Discovery`) is configured via `CommonDiscovery` (`internal/config/discovery.go`, as used by `internal/librarian/rust/codec.go:96-108` and `internal/librarian/swift/generate.go:149-161`).\n- PR #345 (`google_cloud_dns_v1`) already introduces `sources.discovery` and `specification_format: discovery` in `librarian.yaml` for Dart.\n\n### Proposed Solution\n\n1. **Support `SpecDiscovery` and `CommonDiscovery` in `googleapis/librarian` (`internal/librarian/dart/codec.go` & `internal/config/`)**:\n   - Update `toModelConfig` in `internal/librarian/dart/codec.go` (lines 31–66) to accept `config.SpecDiscovery` and resolve `SpecificationSource = svcConfig.Discovery` (`\"discoveries/compute.v1.json\"`, matching `internal/librarian/rust/codec.go:46-53`).\n   - Add `Discovery *CommonDiscovery` (`yaml:\"discovery,omitempty\"`) to `config.DartPackage` and map `library.Dart.Discovery` (`OperationID` and `Pollers`) to `modelConfig.Discovery` in `internal/librarian/dart/codec.go` (matching `internal/librarian/rust/codec.go:96-108`).\n2. **Update `google_cloud_compute_v1` in `librarian.yaml`**:\n   - Switch `google_cloud_compute_v1` to `specification_format: discovery` with `roots: [discovery, googleapis]` and configure `dart.discovery` poller mappings:\n     ```yaml\n     dart:\n       discovery:\n         operation_id: .google.cloud.compute.v1.Operation\n         pollers:\n           - prefix: compute/v1/projects/{project}/zones/{zone}\n             method_id: .google.cloud.compute.v1.zoneOperations.get\n           - prefix: compute/v1/projects/{project}/regions/{region}\n             method_id: .google.cloud.compute.v1.regionOperations.get\n           - prefix: compute/v1/projects/{project}/global\n             method_id: .google.cloud.compute.v1.globalOperations.get\n           - prefix: compute/v1/locations/global\n             method_id: .google.cloud.compute.v1.globalOrganizationOperations.get\n     ```\n3. **Wire `DiscoveryLro` Poller Generation in `sidekick/dart` (for #28)**:\n   - Use the injected `IsLroPoller` (`getOperation`) mixin and `api.Method.DiscoveryLro.PollingPathParameters` (`project`, `zone`, `region`, `operation`) in `internal/sidekick/dart/annotate.go` so Compute Engine mutations (`Instances.insert`, `Disks.insert`, etc.) expose typed LRO polling helpers alongside standard `google.longrunning.Operation` methods (#28).\n\n### Acceptance Criteria\n\n- [ ] `internal/librarian/dart/codec.go` in `googleapis/librarian` supports `specification_format: discovery` (`SpecificationSource = svcConfig.Discovery`) and `dart.discovery` (`CommonDiscovery` pollers).\n- [ ] `google_cloud_compute_v1` in `librarian.yaml` uses `specification_format: discovery` (`discoveries/compute.v1.json`) with `zoneOperations`, `regionOperations`, `globalOperations`, and `globalOrganizationOperations` pollers configured.\n- [ ] Compute Engine LRO methods expose `DiscoveryLro` polling helpers for #28.", "timeline": [{"who": "kevmoo", "bot": false, "at": "2026-09-19 05:57", "ago": "36d ago", "what": "opened this issue", "text": ""}, {"who": "github-project-automation[bot]", "bot": true, "at": "2026-09-19 05:57", "ago": "36d ago", "what": "added to project v2", "text": ""}, {"who": "github-project-automation[bot]", "bot": true, "at": "2026-09-19 05:57", "ago": "36d ago", "what": "project v2 item status changed", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2026-10-08 21:34", "ago": "17d ago", "what": "commented", "text": "Is the problem that the generated `Operation` classes aren't idiomatic?\n\nBecause they are useable, e.g., https://github.com/googleapis/google-cloud-dart/blob/11a532d4a10a20bf23b5961a6a8558dacbe5edff/generated/google_cloud_compute_v1/test/address_test.dart#L63"}, {"who": "kevmoo", "bot": false, "at": "2026-10-08 21:59", "ago": "17d ago", "what": "commented", "text": "@brianquinlan Yes, exactly! Manual polling via `operationsService.get` works and is perfectly usable, but it isn't idiomatic compared to the `op.wait()` polling helpers generated for services returning standard `google.longrunning.Operation`.\n\nBecause `internal/sidekick/parser/protobuf.go` doesn't currently parse the `google.cloud.operation_service` annotations (`ZoneOperations`, `RegionOperations`, etc.) used in `compute.proto`, `sidekick` treats Compute operations as standard RPC responses. This forces clients to write manual `while(true)` polling loops with explicit `Future.delayed` and `status == Operation_Status.done` checks, as seen in `address_test.dart`.\n\nIf we switch Compute Engine to `specification_format: discovery` in `librarian.yaml` and configure the `CommonDiscovery` LRO pollers, `internal/sidekick/parser/discovery/lro.go` will correctly map these to `api.Method.DiscoveryLro`. This gives us the necessary AST data to wire up idiomatic polling helpers for Compute Engine in `sidekick/dart` (resolving #28), bringing it to parity with how Rust and Swift handle Compute LROs."}, {"who": "brianquinlan", "bot": false, "at": "2026-10-09 17:56", "ago": "16d ago", "what": "commented", "text": "I remember generating the discovery version of `compute_v1` and it had a **much** bigger API surface than the proto version because of the synthetic classes. I wish that I had kept the numbers but I remember it being something like 60% larger and, IMO, harder to navigate.\n\nDo you think that we'd be better switching to discovery or adding some convenience extensions to the service operations? \n\nIn my mind, the most compelling reason to go with the discovery version of compute is that other generated code is using that version. But the actual API is less pleasant."}], "note": "", "prd_note": "Issue created by a close collaborator in a repo that I am responsible for. In the last comment I asked a question that hasn't been answered yet.", "set": "A"}, {"id": "dart-lang/sdk#31275", "url": "https://github.com/dart-lang/sdk/issues/31275", "title": "dart:io HttpClient.post throws uncatch-able exception", "kind": "Issue", "state": "open", "author": "Pacane", "labels": ["area-vm", "library-io", "P2", "type-bug"], "assignees": [], "requested": [], "repo_desc": "The Dart SDK, including the VM, JS and Wasm compilers, analysis, core libraries, and more.", "created": "9.0y ago", "updated": "20mo ago", "snapshot": "2026-10-25T17:52:33Z", "as_of": null, "thumbs_down_at": null, "roles": ["mentioned"], "last": "lrhn labeled 20mo ago", "stacked_on": null, "related": [], "body": "I have this issue where I use `dart:io`'s `HttpClient` to post data `client.post` and that the post throws the following exception:\r\n\r\n```dart\r\n      if (_nextResponseCompleter == null) {\r\n        throw new HttpException(\r\n            \"Unexpected response (unsolicited response without request).\",\r\n            uri: _currentUri);\r\n      }\r\n```\r\n(from http_impl.dart)\r\n\r\nwhen I try to put the `client.post` in a try-catch block, the exception doesn't bubble up in my catch. Instead, it goes up until it's uncaught and make my program crash.\r\n\r\nwith the help of @floitschG I could successfully catch the error by issuing my `client.post` in a `runZoned`, but this shouldn't be necessary.\r\n\r\nThis bug affected our system in production and made our server crash.", "timeline": [{"who": "Pacane", "bot": false, "at": "2017-11-03 17:18", "ago": "9.0y ago", "what": "opened this issue", "text": ""}, {"who": "floitschG", "bot": false, "at": "2017-11-03 17:18", "ago": "9.0y ago", "what": "labeled 'area-library'", "text": ""}, {"who": "floitschG", "bot": false, "at": "2017-11-03 17:18", "ago": "9.0y ago", "what": "labeled 'library-io'", "text": ""}, {"who": "floitschG", "bot": false, "at": "2017-11-03 17:39", "ago": "9.0y ago", "what": "commented", "text": "@zanderso : I looked a little bit into this.\r\nThe problem is that this exception is thrown from within the `listen` to a `_httpParser`. This means that the user can't ever catch this error:\r\n\r\n``` dart\r\n    _subscription = _httpParser.listen((incoming) {\r\n      // Only handle one incoming response at the time. Keep the\r\n      // stream paused until the response have been processed.\r\n      _subscription.pause();\r\n      // We assume the response is not here, until we have send the request.\r\n      if (_nextResponseCompleter == null) {\r\n        throw new HttpException(\r\n            \"Unexpected response (unsolicited response without request).\",\r\n            uri: _currentUri);\r\n      }\r\n```\r\n\r\nThe big question is: how should this error be reported?. Just throwing isn't good enough, since it would never reach the user. The surrounding code doesn't give me enough information.\r\n\r\nWhen can `_nextResponseCompleter == null` be true?\r\nIf it is `null` did we already report an error (or success), and should we then just ignore the error? (still better than crashing the VM).\r\n\r\n@Pacane could you provide some feedback on how this was happening?\r\nWhat client/server interaction seems to trigger this?"}, {"who": "Pacane", "bot": false, "at": "2017-11-03 18:19", "ago": "9.0y ago", "what": "commented", "text": "So this happens when I do a post request to a remote server, and the server gives a 408 response (Request Timeout).\r\n\r\nWhen the server returns the 408, `_nextResponseCompleter == null` is true, and the exception is thrown.\r\n\r\nThe production had this pattern\r\n\r\n```dart\r\nconnect() async {\r\n     var client = getSomeClient();\r\n     try {\r\n          HttpClientRequest request = await client.postUrl(connUri);\r\n          // more code\r\n     catch(e) {\r\n          retryConnectWithSomeDelay();\r\n     }\r\n}\r\n```\r\n\r\nFor some reason, when I do this\r\n\r\n```dart\r\nconnect() async {\r\n     var client = getSomeClient();\r\n     try {\r\n          HttpClientRequest request = await client.postUrl(connUri);\r\n          // more code\r\n     catch(e) {\r\n          retryConnectWithSomeDelay();\r\n     }\r\n}\r\n```\r\nthe error happens. But if I close the client before retrying:\r\n\r\n```dart\r\nconnect() async {\r\n     var client = getSomeClient();\r\n     try {\r\n          HttpClientRequest request = await client.postUrl(connUri);\r\n          // more code\r\n     catch(e) {\r\n          __client.close();__\r\n          retryConnectWithSomeDelay();\r\n     }\r\n}\r\n```\r\n\r\nI have no error.\r\n\r\nNote that I can freely remove the `retryConnectWithSomeDelay()` and get essentially the same behaviour. In other words, the minimal code needed to reproduce this (omitting some details like certificates and [I think] other irrelevant stuff) is:\r\n\r\n```dart\r\nconnect() async {\r\n     var client = getSomeClient();\r\n     HttpClientRequest request = await client.postUrl(connUri);\r\n}\r\n```\r\n\r\nwith a server returning a 408. When I debugged the _HttpClientConnection, when the exception was gonna be thrown, the `incoming` value from the `_httpParser.listen()` was:\r\n\r\n![image](https://user-images.githubusercontent.com/2762440/32389745-0b8f891c-c0a2-11e7-9a29-4641f23ac349.png)\r\n\r\nNote that this server returning the 408 is a 3rd party server that I don't have access to unfortunately."}, {"who": "Schwusch", "bot": false, "at": "2020-04-19 09:31", "ago": "6.5y ago", "what": "commented", "text": "I get this when using the [Dart AWS Lambda Runtime](https://github.com/awslabs/aws-lambda-dart-runtime) in the [lambci/lambda:provided](https://github.com/lambci/docker-lambda) Docker image in the [AWS SAM CLI tool](https://github.com/awslabs/aws-sam-cli):\r\n```\r\nUnhandled exception:\r\nHttpException: Unexpected response (unsolicited response without request).\r\n```\r\nThe server interacting with the Dart HTTP client is a [Go server](https://github.com/lambci/docker-lambda/blob/master/provided/run/init.go). \r\nSpecifically the [postInvocationError](https://github.com/awslabs/aws-lambda-dart-runtime/blob/master/lib/client/client.dart#L149..L158) request that is handled by the [handleErrorRequest](https://github.com/lambci/docker-lambda/blob/20bcae1af655c22796ccf7dd11772a4b5defff66/provided/run/init.go#L538) function gives the \"Unexpected response\" exception."}, {"who": "zanderso", "bot": false, "at": "2020-04-20 16:20", "ago": "6.5y ago", "what": "commented", "text": "@ZichangG @sortie"}, {"who": "zichangg", "bot": false, "at": "2020-04-21 00:53", "ago": "6.5y ago", "what": "commented", "text": "```dart\r\n      if (incoming.statusCode == 100) {\r\n        // some codes\r\n      } else {\r\n        _nextResponseCompleter.complete(incoming);\r\n        _nextResponseCompleter = null;\r\n      }\r\n```\r\n\r\n```dart\r\n          if (!closing &&\r\n              !_dispose &&\r\n              incoming.headers.persistentConnection &&\r\n              request.persistentConnection) {\r\n            // Return connection, now we are done.\r\n            _httpClient._returnConnection(this);\r\n            _subscription.resume();\r\n          } else {\r\n            destroy();\r\n          }\r\n```\r\n\r\nI'm not confident whether this is a bug. In our implementation, if `statusCode != 100`, we complete with `incoming` and set `_nextResponseCompleter` to `null`. Because of persistent connection, it resumes the subscription so the next `incoming` arrived and `_nextResponseCompleter` is `null`. \r\nIs this behavior correct?"}, {"who": "Schwusch", "bot": false, "at": "2020-04-21 18:15", "ago": "6.5y ago", "what": "commented", "text": "I'm wondering whether it's a bug in the failing request or the request that came before.\r\nIs there a possibility that the previous request is causing the unexpected response?\r\nHow is this handled in other languages?"}, {"who": "zichangg", "bot": false, "at": "2020-04-21 22:25", "ago": "6.5y ago", "what": "commented", "text": "According to [RFC](https://tools.ietf.org/html/rfc7231#section-6.5.7),\r\n\r\n>  A server SHOULD send the \"close\" connection option\r\n   (Section 6.1 of [RFC7230]) in the response, since 408 implies that\r\n   the server has decided to close the connection rather than continue\r\n   waiting.\r\n\r\nThis looks like the case where server didn't explicitly close.\r\n\r\n@Schwusch or @Pacane Could you please try my patch(https://dart-review.googlesource.com/c/sdk/+/144346) to see whether it worked?"}, {"who": "Schwusch", "bot": false, "at": "2020-04-22 07:11", "ago": "6.5y ago", "what": "commented", "text": "@zichangg I'll make an attempt to download the patchset and build the SDK today, or is there a build artifact or alike from the CI/CD?"}, {"who": "Schwusch", "bot": false, "at": "2020-04-22 10:01", "ago": "6.5y ago", "what": "commented", "text": "@zichangg It worked when I tested it! You're awesome :1st_place_medal:"}, {"who": "zichangg", "bot": false, "at": "2020-04-23 21:44", "ago": "6.5y ago", "what": "commented", "text": "@Schwusch Thanks! I'll try to get it landed asap."}, {"who": "zichangg", "bot": false, "at": "2020-04-23 21:44", "ago": "6.5y ago", "what": "assigned zichangg", "text": ""}, {"who": "sortie", "bot": false, "at": "2020-05-05 13:34", "ago": "6.5y ago", "what": "labeled 'P2'", "text": ""}, {"who": "sortie", "bot": false, "at": "2020-05-05 13:34", "ago": "6.5y ago", "what": "labeled 'type-bug'", "text": ""}, {"who": "rmacnak-google", "bot": false, "at": "2020-10-30 23:15", "ago": "6.0y ago", "what": "unassigned zichangg", "text": ""}, {"who": "gencto", "bot": false, "at": "2024-01-09 17:11", "ago": "2.8y ago", "what": "commented", "text": "@zichangg Hi, will this fix be implemented into the current SDK?"}, {"who": "parlough", "bot": false, "at": "2024-01-09 17:23", "ago": "2.8y ago", "what": "commented", "text": "zichangg is no longer on the Dart team.\r\n\r\nSomeone else could take over their original (now abandoned) CL, or use it as inspiration: https://dart-review.googlesource.com/c/sdk/+/144346\r\n\r\n\\cc @brianquinlan Who is the new owner of this library."}, {"who": "kevmoo", "bot": false, "at": "2024-04-11 00:01", "ago": "2.5y ago", "what": "commented", "text": "I would LOVE this to be taken up. I'm hitting this myself! CC @brianquinlan"}, {"who": "lrhn", "bot": false, "at": "2025-02-13 14:17", "ago": "20mo ago", "what": "unlabeled 'area-core-library'", "text": ""}, {"who": "lrhn", "bot": false, "at": "2025-02-13 14:17", "ago": "20mo ago", "what": "labeled 'area-vm'", "text": ""}], "note": "", "prd_note": "Seemingly important issue where I was explicitly CCed as the last comment. But the last comment is very old and I am not assigned.", "set": "A"}, {"id": "googleapis/google-cloud-dart#381", "url": "https://github.com/googleapis/google-cloud-dart/issues/381", "title": "[google_cloud_rpc] fromHttpResponse puts the HTTP status into Status.code and drops the google.rpc.Code, so ABORTED is never retried over REST", "kind": "Issue", "state": "open", "author": "quaaantumdev", "labels": [], "assignees": [], "requested": [], "repo_desc": "[Experimental] Google Cloud Dart Client Libraries", "created": "3d ago", "updated": "3d ago", "snapshot": "2026-10-25T17:52:34Z", "as_of": null, "thumbs_down_at": null, "roles": ["watches_repo"], "last": "quaaantumdev opened this issue 3d ago", "stacked_on": null, "related": ["PR googleapis/google-cloud-dart#382 [linked: closes/closed-by] 'fix(google_cloud_rpc): use the google.rpc.Code of JSON errors in Status.code': open, by quaaantumdev, updated 3d ago"], "body": "## Summary\n\nFor an error received as JSON, `ServiceException.fromHttpResponse` puts the HTTP status code into `ServiceException.status.code`. The `google.rpc.Code` the service reported, which the JSON error carries by name in `status`, is dropped.\n\n`Status.code` is documented as \"an enum value of `google.rpc.Code`\", and the rest of the package already treats it that way:\n\n- The gRPC error mapping in `google_cloud_pubsub` (`_mapGrpcError`) puts the gRPC code there. Its comment says this matches how `fromHttpResponse` fills it for REST errors, but it doesn't.\n- `ExponentialRetry.isRetryable` reads `status.code`, for example `ConflictException(:final status) => status?.code == 10`. Over REST that value is 409, so an `ABORTED` error is never retried.\n\n## Why it matters\n\nSeveral `google.rpc.Code`s share an HTTP status, and only the name tells them apart:\n\n| HTTP | `status` | for example (Firestore `commit`) |\n|---|---|---|\n| 400 | `FAILED_PRECONDITION` | \"the stored version (…) does not match the required base version (…)\" |\n| 400 | `INVALID_ARGUMENT` | \"Invalid transaction.\" |\n| 409 | `ABORTED` | \"Aborted due to cross-transaction contention. …\" |\n| 409 | `ALREADY_EXISTS` | \"Document already exists: …\" |\n\nThese are real responses from `google_cloud_firestore_v1` 0.5.5 `commit` calls. As things stand, a client can't tell a transaction it should retry (`ABORTED`) from a write that can never succeed (`ALREADY_EXISTS`), or a stale precondition from a malformed request, except by parsing the message.\n\n## Reproduction\n\n```dart\nimport 'package:google_cloud_rpc/exceptions.dart';\nimport 'package:google_cloud_rpc/retry.dart';\nimport 'package:http/http.dart' as http;\n\nvoid main() {\n  const body = '{\"error\": {\"code\": 409, \"message\": \"Aborted due to cross-transaction contention.\", \"status\": \"ABORTED\"}}';\n  final e = ServiceException.fromHttpResponse(http.Response(body, 409), body);\n  print(e.status!.code); // 409, expected 10\n  print(const ExponentialRetry().isRetryable(e)); // false, expected true\n}\n```\n\n## Proposed fix\n\nIn `fromHttpResponse`, set `Status.code` to the `google.rpc.Code` named by the error's `status`, and keep the HTTP status code when `status` is missing or unknown. `ServiceException.statusCode` still has the HTTP status code.\n\nThis changes `status.code` for JSON errors that name their code (400 becomes 3, and so on), so code that compared it with an HTTP status would need `statusCode` instead. Errors without a `status`, such as Cloud Storage's JSON API errors, are unaffected. PR: #382.\n\nVersions: google_cloud_rpc 0.6.0 (`main` has the same code), google_cloud_firestore_v1 0.5.5.", "timeline": [{"who": "quaaantumdev", "bot": false, "at": "2026-10-22 14:37", "ago": "3d ago", "what": "opened this issue", "text": ""}, {"who": "github-project-automation[bot]", "bot": true, "at": "2026-10-22 14:37", "ago": "3d ago", "what": "added to project v2", "text": ""}, {"who": "github-project-automation[bot]", "bot": true, "at": "2026-10-22 14:37", "ago": "3d ago", "what": "project v2 item status changed", "text": ""}, {"who": "github-project-automation[bot]", "bot": true, "at": "2026-10-22 14:39", "ago": "3d ago", "what": "project v2 item status changed", "text": ""}], "note": "", "prd_note": "Issue associated with googleapis/google-cloud-dart#382 - PRs are more important than issues and surfacing an issue associated with a PR is redundant.", "set": "A"}, {"id": "dart-lang/http#1837", "url": "https://github.com/dart-lang/http/issues/1837", "title": "Support WinHTTP-based HTTP client for Windows (similar to cupertino_http and cronet_http)", "kind": "Issue", "state": "open", "author": "UnluckyY1", "labels": ["type-enhancement", "contributions-welcome", "P3", "package:http"], "assignees": [], "requested": [], "repo_desc": "A composable API for making HTTP requests in Dart.", "created": "12mo ago", "updated": "12mo ago", "snapshot": "2026-10-25T17:52:37Z", "as_of": null, "thumbs_down_at": null, "roles": ["commenter", "watches_repo"], "last": "brianquinlan labeled 12mo ago", "stacked_on": null, "related": ["issue flutter/flutter#26359 'App ignores proxy settings': open, by christian-muertz, updated 9mo ago, labels ['c: new feature', 'framework', 'engine', 'dependency: dart', 'P2', 'team-engine', 'triaged-engine']"], "body": "Hi Dart team 👋\n\nI’d like to ask if there are any plans to provide a WinHTTP-based implementation for the http package on Windows, similar to how:\n\t•\tcronet_http is used on Android\n\t•\tcupertino_http is used on iOS/macOS\n\nCurrently, there’s no native Windows equivalent. As a result, apps using Dart/Flutter on Windows rely solely on the default Dart HTTP stack, which may not take advantage of Windows’ native networking capabilities (e.g. WinHTTP, proxy integration, certificate management, etc.).\n\nThis would also help resolve long-standing issues such as:\nflutter/flutter#26359", "timeline": [{"who": "UnluckyY1", "bot": false, "at": "2025-10-20 23:15", "ago": "12mo ago", "what": "opened this issue", "text": ""}, {"who": "UnluckyY1", "bot": false, "at": "2025-10-20 23:15", "ago": "12mo ago", "what": "labeled 'type-enhancement'", "text": ""}, {"who": "UnluckyY1", "bot": false, "at": "2025-10-20 23:15", "ago": "12mo ago", "what": "labeled 'package:http'", "text": ""}, {"who": "HosseinYousefi", "bot": false, "at": "2025-10-21 08:47", "ago": "12mo ago", "what": "labeled 'contributions-welcome'", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2025-10-28 00:05", "ago": "12mo ago", "what": "commented", "text": "Hi @UnluckyY1 ,\n\nThis is not something that the Dart team is likely to take on. It should be possible to a member of the community to tackle this by adding the needed APIs to `package:win32` and then implementing the HTTP API using them."}, {"who": "brianquinlan", "bot": false, "at": "2025-10-28 00:05", "ago": "12mo ago", "what": "labeled 'P3'", "text": ""}], "note": "", "prd_note": "Old low priority issue where I explicitly asked for 3rd party contributions.", "set": "A"}, {"id": "dart-lang/http#2031", "url": "https://github.com/dart-lang/http/pull/2031", "title": "chore(http2): prepare to release 3.2.0", "kind": "PR", "state": "open", "author": "mosuem", "labels": ["package:http2"], "assignees": [], "requested": ["brianquinlan"], "repo_desc": "A composable API for making HTTP requests in Dart.", "created": "3d ago", "updated": "3d ago", "snapshot": "2026-10-25T17:52:38Z", "as_of": null, "thumbs_down_at": null, "roles": ["requested_reviewer", "watches_repo"], "last": "mosuem base ref force pushed 3d ago", "stacked_on": [{"pr": "#2010", "title": "fix(http2): Http2Client evicts dead connections from its pool and keeps healthy ones on a stream reset", "author": "mosuem", "state": "open", "reviews": ["brianquinlan:APPROVED"], "requested_reviewers": []}, {"pr": "#2014", "title": "fix(http2): finish() and terminate() must not hang after a failed socket write", "author": "mosuem", "state": "open", "reviews": "none", "requested_reviewer 29%3B+previously+they+waited%0A++for+a+%60Socket.done%60+that+never+completes+after+a+failed+write.%0A-+%60Http2Client%60+now+drops+a+connection+from+its+pool+as+soon+as+it+is+dead%2C%0A++instead+of+keeping+it+as+an+idle+connection+no+request+may+use%2C+and+keeps+a%0A++healthy+connection+pooled+when+the+server+resets+just+one+of+its+streams.%0A-+Bound+peer-initiated+concurrent+streams+and+reject+peers+that+ignore+the%0A++advertised+%60SETTINGS_MAX_CONCURRENT_STREAMS%60+value.+Reserved+peer+streams%0A++are+also+bounded+locally.+The+default+limit+is+100.%0A-+Bound+inbound+compressed+field+blocks%2C+decoded+field+sections%2C+CONTINUATION%0A++frame+counts%2C+and+incomplete+field-block+duration.+HPACK+decoding+continues%0A++in+discard+mode+after+the+decoded+limit+is+exceeded+so+the+connection-wide%0A++compression+context+remains+synchronized.) |\n\n* 2 already published.\n* 7 WIP (no publish necessary).\n\nDocumentation at https://github.com/dart-lang/ecosystem/wiki/Publishing-automation."}, {"who": "mosuem", "bot": false, "at": "2026-10-22 08:30", "ago": "3d ago", "what": "unlabeled 'package:http2'", "text": ""}, {"who": "mosuem", "bot": false, "at": "2026-10-22 08:30", "ago": "3d ago", "what": "labeled 'package:http2'", "text": ""}, {"who": "github-actions[bot]", "bot": true, "at": "2026-10-22 08:33", "ago": "3d ago", "what": "commented", "text": "## PR Health\n\n\n<details>\n<summary>\n<strong>Coverage<\/strong> :heavy_check_mark:\n<\/summary>\n\n| File | Coverage |\n| :--- | :--- |\n\n\nThis check for [test coverage](https://github.com/dart-lang/ecosystem/wiki/Test-Coverage) is informational (issues shown here will not fail the PR).\n\n\nThis check can be disabled by tagging the PR with `skip-coverage-check`.\n<\/details>\n\n<details>\n<summary>\n<strong>License Headers<\/strong> :heavy_check_mark:\n<\/summary>\n\n```\n// Copyright (c) 2026, the Dart project authors. Please see the AUTHORS file\n// for details. All rights reserved. Use of this source code is governed
