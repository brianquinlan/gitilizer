n be disabled by tagging the PR with `skip-changelog-check` (for example, for non-user-visible changes when the package version is already at `-wip`).\n<\/details>"}, {"who": "Moritz", "bot": false, "at": "2026-10-23 05:32", "ago": "3d ago", "what": "pushed commit d2f008c 'chore(http2): prepare to release 3.2.0'", "text": ""}, {"who": "mosuem", "bot": false, "at": "2026-10-23 05:32", "ago": "3d ago", "what": "base ref force pushed", "text": ""}], "note": "", "prd_note": "The PR of a close collaborator in a repo that I am responsible for. Not actionable because it is part of a PR stack that has lower stacked items that have not been reviewed.", "set": "A"}, {"id": "dart-lang/http#1365", "url": "https://github.com/dart-lang/http/issues/1365", "title": "http2 seems to be slow", "kind": "Issue", "state": "open", "author": "KMantas", "labels": ["type-enhancement", "package:http2"], "assignees": [], "requested": [], "repo_desc": "A composable API for making HTTP requests in Dart.", "created": "6.2y ago", "updated": "8mo ago", "snapshot": "2026-10-25T17:52:45Z", "as_of": null, "thumbs_down_at": null, "roles": ["watches_repo"], "last": "lubritto commented 8mo ago", "stacked_on": null, "related": ["issue dart-lang/sdk#48210 'improve socket read throughput': open, by mraleph, updated 13mo ago, labels ['area-vm', 'type-performance']"], "body": "Hi\r\n\r\nI have tested speed of http2 library and it is much slower comparing to http. I tested with client and server being on my local. Server is written in Go and client in Dart. To downloaded 100mb  file with HttpClient it takes 4s and  http2 takes 15s. \r\nI faced this issue with GRPC. We are downloading files with GRPC streams and speed depending on how far the server is, can be 8 times slower comparing to http download. I was trying to isolate the issue and it seems http2 package seems to be the main problem. \r\nI have Dart VM version: 2.8.4\r\nand tested with\r\nhttp2: ^1.0.0\r\nhttp: ^0.12.2\r\n\r\nI used the code from \"minimal example\" to download file with http2. Is there a way to improve speed?", "timeline": [{"who": "KMantas", "bot": false, "at": "2020-07-28 17:06", "ago": "6.2y ago", "what": "opened this issue", "text": ""}, {"who": "FrantisekGazo", "bot": false, "at": "2020-11-10 11:57", "ago": "6.0y ago", "what": "commented", "text": "Any update on this?"}, {"who": "thamarakshan-pilla", "bot": false, "at": "2022-04-05 13:48", "ago": "4.6y ago", "what": "commented", "text": "Any update on this yet??"}, {"who": "Neronse", "bot": false, "at": "2022-08-04 09:43", "ago": "4.2y ago", "what": "commented", "text": "Seems like problem is not in http2 package. \r\nI noticed that sending photo is slow too.\r\nSending bytes to outgoing stream is fast enough, but when we start listen incoming stream, first header frame received only after 10s+. Looks like problem may be in raw socket.\r\nI have found this issue for dart socket https://github.com/dart-lang/sdk/issues/48210, may be where the same problem.\r\n\r\nI also want to note that the problem is serious for http 2 in dart. All native solutions are faster.\r\n\r\nUPD:\r\nMy problem wasnt in http2 package, or socket. \r\nI am using Dio and write http2 adapter. And all open source adapters implemented like this https://github.com/flutterchina/dio/blob/master/plugins/http2_adapter/lib/src/http2_adapter.dart#L75\r\nThey are sending data messages with 1 byte inside.\r\nWhen i refactored this code, speed of sending becomes `normal.\r\n\r\n\r\n```\r\n final bytes = BytesBuilder(copy: false);\r\n      final completer = Completer<Uint8List>.sync();\r\n      requestStream.listen(\r\n        bytes.add,\r\n        onError: completer.completeError,\r\n        onDone: () => completer.complete(bytes.takeBytes()),\r\n        cancelOnError: true,\r\n      );\r\n      final collectedBytes = await completer.future;\r\n      stream.sendData(collectedBytes);\r\n```"}, {"who": "mosuem", "bot": false, "at": "2024-06-12 14:47", "ago": "2.4y ago", "what": "labeled 'type-enhancement'", "text": ""}, {"who": "mosuem", "bot": false, "at": "2024-10-18 09:08", "ago": "2.0y ago", "what": "labeled 'package:http2'", "text": ""}, {"who": "lubritto", "bot": false, "at": "2026-02-10 08:15", "ago": "8mo ago", "what": "commented", "text": "Hey, is it confirmed that the root cause is not in the http2 library? if so, should this issue be closed?"}], "note": "", "prd_note": "Issue in a repo that I'm interested in. The issue is stale. I indicated that I am not responsible for package:http2.", "set": "A"}, {"id": "googleapis/google-cloud-dart#345", "url": "https://github.com/googleapis/google-cloud-dart/pull/345", "title": "feat(dns): initial support", "kind": "PR", "state": "draft open", "author": "brianquinlan", "labels": [], "assignees": [], "requested": [], "repo_desc": "[Experimental] Google Cloud Dart Client Libraries", "created": "45d ago", "updated": "45d ago", "snapshot": "2026-10-25T17:59:18Z", "as_of": null, "thumbs_down_at": null, "roles": ["author", "watches_repo"], "last": "brianquinlan convert to draft 45d ago", "stacked_on": null, "related": [], "body": "", "timeline": [{"who": "Brian Quinlan", "bot": false, "at": "2026-09-10 18:27", "ago": "45d ago", "what": "pushed commit 7835462 'feat(dns): initial support'", "text": ""}, {"who": "Brian Quinlan", "bot": false, "at": "2026-09-10 18:29", "ago": "45d ago", "what": "pushed commit 5ee2d63 'Fixes'", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2026-09-10 18:31", "ago": "45d ago", "what": "opened this PR", "text": ""}, {"who": "gemini-code-assist[bot]", "bot": true, "at": "2026-09-10 18:33", "ago": "45d ago", "what": "reviewed [COMMENTED]", "text": "## Code Review\n\nThis pull request introduces the new `google_cloud_dns_v1` package, updating the workspace configuration, developer guides, and adding initial implementation files, examples, and tests. The review feedback highlights several critical issues: a compile-time error in the example code due to unsafe handling of the nullable `response.managedZones` list, a potential test failure in `dns_test.dart` for the same nullable field, and multiple runtime failures in the documentation examples where `Policies_UpdateRequest` is instantiated without its required `project` and `policy` parameters."}, {"who": "gemini-code-assist[bot]", "bot": true, "at": "2026-09-10 18:33", "ago": "45d ago", "what": "left inline review comment on generated/google_cloud_dns_v1/example/main.dart", "text": "![high](https://www.gstatic.com/codereviewagent/high-priority.svg)\n\nThe `response.managedZones` field is nullable (`List<ManagedZone>?`). Accessing `.isEmpty` directly or iterating over it without a null check will cause a compile-time error under sound null safety. Use a local variable with a null check to safely handle the nullable list.\n\n```suggestion\n    final zones = response.managedZones;\n    if (zones == null || zones.isEmpty) {\n      print('  (none)');\n    } else {\n      for (final zone in zones) {\n        print('  - ${zone.name} (${zone.dnsName})');\n      }\n    }\n```"}, {"who": "gemini-code-assist[bot]", "bot": true, "at": "2026-09-10 18:33", "ago": "45d ago", "what": "left inline review comment on generated/google_cloud_dns_v1/test/dns_test.dart", "text": "![medium](https://www.gstatic.com/codereviewagent/medium-priority.svg)\n\nSince `response.managedZones` is nullable, it can be `null` if the project has no managed zones (which is often the case for a newly created test project). Expecting it to be strictly a `List<ManagedZone>` will cause the test to fail. Update the assertion to allow `null` or a `List<ManagedZone>`.\n\n```dart\n      expect(response.managedZones, anyOf(isNull, isA<List<ManagedZone>>()));\n```"}, {"who": "gemini-code-assist[bot]", "bot": true, "at": "2026-09-10 18:33", "ago": "45d ago", "what": "left inline review comment on generated/google_cloud_dns_v1/skills/google_cloud_dns_v1-setup/SKILL.md", "text": "![medium](https://www.gstatic.com/codereviewagent/medium-priority.svg)\n\nThe `Policies_UpdateRequest` requires path parameters such as `project` and `policy` to be specified. Calling `Policies_UpdateRequest()` without these parameters will fail at runtime. Please update the example to include these fields or add a comment indicating they are required.\n\n```suggestion\n    final response = await client.update(\n      Policies_UpdateRequest(\n        project: 'my-project',\n        policy: 'my-policy',\n      ),\n    );\n```"}, {"who": "gemini-code-assist[bot]", "bot": true, "at": "2026-09-10 18:33", "ago": "45d ago", "what": "left inline review comment on generated/google_cloud_dns_v1/skills/google_cloud_dns_v1-setup/SKILL.md", "text": "![medium](https://www.gstatic.com/codereviewagent/medium-priority.svg)\n\nThe `Policies_UpdateRequest` requires path parameters such as `project` and `policy` to be specified. Calling `Policies_UpdateRequest()` without these parameters will fail at runtime. Please update the example to include these fields or add a comment indicating they are required.\n\n```suggestion\n    final response = await client.update(\n      Policies_UpdateRequest(\n        project: 'my-project',\n        policy: 'my-policy',\n      ),\n    );\n```"}, {"who": "gemini-code-assist[bot]", "bot": true, "at": "2026-09-10 18:33", "ago": "45d ago", "what": "left inline review comment on generated/google_cloud_dns_v1/skills/google_cloud_dns_v1-tests/SKILL.md", "text": "![medium](https://www.gstatic.com/codereviewagent/medium-priority.svg)\n\nThe `Policies_UpdateRequest` requires path parameters such as `project` and `policy` to be specified. Calling `Policies_UpdateRequest()` without these parameters will fail at runtime. Please update the example to include these fields or add a comment indicating they are required.\n\n```suggestion\n  await service.update(\n    Policies_UpdateRequest(\n      project: 'my-project',\n      policy: 'my-policy',\n    ),\n  );\n```"}, {"who": "brianquinlan", "bot": false, "at": "2026-09-10 22:12", "ago": "45d ago", "what": "convert to draft", "text": ""}], "note": "", "prd_note": "I created the PR but it is still a draft. At some point I should complete the work or abandon it.", "set": "A"}, {"id": "dart-lang/http#2026", "url": "https://github.com/dart-lang/http/pull/2026", "title": "[http2] Keep remotely closed streams until their queues are done", "kind": "PR", "state": "open", "author": "shoaib-akhtar", "labels": ["package:http2"], "assignees": [], "requested": [], "repo_desc": "A composable API for making HTTP requests in Dart.", "created": "11d ago", "updated": "1d ago", "snapshot": "2026-10-25T17:52:47Z", "as_of": null, "thumbs_down_at": null, "roles": ["watches_repo"], "last": "shoaib-akhtar commented 1d ago", "stacked_on": null, "related": ["issue dart-lang/http#2021 [linked: closes/closed-by] 'http2: Connection._terminate asserts _stream2messageQueue.isEmpty on a stream _handleEndOfStreamRemote orphaned': open, by hbarney, updated 16d ago", "PR dart-lang/http#2013 'fix(http2): do not head-of-line block HEADERS, RST_STREAM and GOAWAY behind window-exhausted DATA': merged, by mosuem, updated 3d ago, labels ['package:http2']"], "body": "Fixes #2021.\n\n`StreamHandler._handleEndOfStreamRemote` removed a stream from `_openStreams` as soon as the peer's END_STREAM moved it from `HalfClosedLocal` to `Closed`, even if the application had not read the stream's incoming messages yet. The stream's entry in the connection-level `ConnectionMessageQueueIn` was left behind, so a later `Connection._terminate` skipped the stream (`StreamHandler.onTerminated` only walks `_openStreams`) and then failed:\n\n```\nFailed assertion: '_stream2messageQueue.isEmpty': is not true.\n  ConnectionMessageQueueIn.onTerminated\n  Connection._terminate\n```\n\nWhen END_STREAMs arrive in the other order (ours after the peer's), `_endStream` moves the stream to `Closed` without removing it. It stays in `_openStreams` until both of its queues are done and `_cleanupClosedStream` runs, so termination closes it normally. This change makes the peer-END_STREAM path behave the same way, which is what the TODO at that line was asking for.\n\n### Tests\n\n`terminate-with-undrained-closed-stream--{server,client}-ends-first` in `transport_test.dart` runs the scenario from the issue over the in-memory transport, in both END_STREAM orders, with the server never reading the stream's messages:\n\n| Order | Before | After |\n|---|---|---|\n| server END_STREAM first | ❌ assertion above | ✅ |\n| client END_STREAM first | ✅ | ✅ |\n\nThe first commit adds only the test, so it can be checked out to see the failure. `dart test` in `pkgs/http2` passes (256 tests), and `dart analyze --fatal-infos` reports no issues.", "timeline": [{"who": "Shoaib Akhtar", "bot": false, "at": "2026-10-14 10:38", "ago": "11d ago", "what": "pushed commit 8fa9159 '[http2] Add failing test for terminating with an undrained closed stream'", "text": ""}, {"who": "Shoaib Akhtar", "bot": false, "at": "2026-10-14 10:38", "ago": "11d ago", "what": "pushed commit 4c04318 '[http2] Keep remotely closed streams until their queues are done'", "text": ""}, {"who": "shoaib-akhtar", "bot": false, "at": "2026-10-14 10:38", "ago": "11d ago", "what": "opened this PR", "text": ""}, {"who": "github-actions[bot]", "bot": true, "at": "2026-10-14 10:39", "ago": "11d ago", "what": "labeled 'package:http2'", "text": ""}, {"who": "google-cla[bot]", "bot": true, "at": "2026-10-14 10:39", "ago": "11d ago", "what": "commented", "text": "Thanks for your pull request! It looks like this may be your first contribution to a Google open source project. Before we can look at your pull request, you'll need to sign a Contributor License Agreement (CLA).\n\nView this [failed invocation](https://github.com/dart-lang/http/pull/2026/checks?check_run_id=115808763698) of the CLA check for more information.\n\nFor the most up to date status, view the checks section at the bottom of the pull request."}, {"who": "Shoaib Akhtar", "bot": false, "at": "2026-10-24 10:37", "ago": "1d ago", "what": "pushed commit e90bd89 'Re-run CLA check'", "text": ""}, {"who": "Shoaib Akhtar", "bot": false, "at": "2026-10-24 10:39", "ago": "1d ago", "what": "pushed commit 60061aa \"Merge remote-tracking branch 'origin/master' into http2-terminate-undrained-closed-stream\"", "text": ""}, {"who": "shoaib-akhtar", "bot": false, "at": "2026-10-24 10:40", "ago": "1d ago", "what": "commented", "text": "Hey @mosuem, saw you've been doing a lot in stream_handler lately, so I merged master in. #2013 touched the same spot. Your version keeps the stream around while outgoing DATA is still waiting on window, and this one also keeps it until the incoming side has been read, so I kept the broader check and merged the two comments. All http2 tests pass on my end. CLA is signed now too. Would you mind taking a look when you have a moment?"}], "note": "", "prd_note": "PR in a repo that I am interested in. Assigned to another collaborator. Indicated that I am not responsible for package:http2.", "set": "A"}, {"id": "dart-lang/native#3653", "url": "https://github.com/dart-lang/native/issues/3653", "title": "[ffigen] Use `objc_retainAutoreleasedReturnValue`", "kind": "Issue", "state": "open", "author": "liamappelbe", "labels": ["package:ffigen"], "assignees": ["liamappelbe"], "requested": [], "repo_desc": "Dart packages related to native interop and the foreign function interface. Contains code generators for generating bindings for other programming languages and packages related to the hooks system for bundling native code,", "created": "39d ago", "updated": "34d ago", "snapshot": "2026-10-25T17:52:52Z", "as_of": null, "thumbs_down_at": null, "roles": ["commenter", "mentioned"], "last": "liamappelbe commented 34d ago", "stacked_on": null, "related": ["issue dart-lang/sdk#61129 '[vm] Use autorelease pools in message loop on iOS/macOS': closed (completed), by liamappelbe, updated 34d ago, assignees ['liamappelbe'], labels ['area-vm', 'P2', 'triaged']", "issue dart-lang/native#3652 'Objective-C autorelease pools are never drained': closed (completed), by brianquinlan, updated 27d ago, assignees ['liamappelbe'], labels ['package:ffigen', 'lang-objective_c']", "PR dart-lang/native#3664 [linked: closes/closed-by] '[objective_c] Use `objc_retainAutoreleasedReturnValue`': merged, by liamappelbe, updated 35d ago, labels ['package:ffigen', 'package:objective_c']"], "body": "From the [documentation](https://clang.llvm.org/docs/AutomaticReferenceCounting.html#arc-runtime-objc-retainautoreleasedreturnvalue), I *think* we can just replace all our calls to `objc_retain` with this function. If the reference was not recently autoreleased, this is the same as an `objc_retain` call. But if it was autoreleased, then this essentially promotes the autoreleased reference to a strong reference.\n\nThis would reduce the number of autoreleased references we hold, helping to mitigate https://github.com/dart-lang/sdk/issues/61129 / https://github.com/dart-lang/native/issues/3652 (though it's still not a complete solution, because the ObjC APIs the user is calling could autorelease their own internal references).\n\nThanks for the tip @brianquinlan", "timeline": [{"who": "liamappelbe", "bot": false, "at": "2026-09-16 22:21", "ago": "39d ago", "what": "opened this issue", "text": ""}, {"who": "liamappelbe", "bot": false, "at": "2026-09-16 22:21", "ago": "39d ago", "what": "assigned liamappelbe", "text": ""}, {"who": "liamappelbe", "bot": false, "at": "2026-09-16 22:21", "ago": "39d ago", "what": "labeled 'package:ffigen'", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2026-09-16 22:56", "ago": "39d ago", "what": "commented", "text": "I actually did an experiment with this and I don't think that it always works (https://github.com/dart-lang/native/issues/3652).\n\nThe problem is that some APIs calls (e.g. `NSURLSession.dataTaskWithRequest`) seem to add things to the autorelease pool other than their return values. After you call `NSURLSession.dataTaskWithRequest`, you'll see that the 7 objects in the autorelease pool (instead of the expected one). Those objects include `__NSCFLocalDataTask` and `__CFN_TaskMetrics` (whatever those are)."}, {"who": "liamappelbe", "bot": false, "at": "2026-09-16 23:01", "ago": "39d ago", "what": "commented", "text": "Right, we'd still need the VM message loop autorelease pool for references the APIs creates internally. But I think this still worth doing, as long as `objc_retainAutoreleasedReturnValue` is actually a drop-in replacement for `objc_retain`."}, {"who": "mkustermann", "bot": false, "at": "2026-09-18 08:26", "ago": "37d ago", "what": "commented", "text": "> From the [documentation](https://clang.llvm.org/docs/AutomaticReferenceCounting.html#arc-runtime-objc-retainautoreleasedreturnvalue), I think we can just replace all our calls to objc_retain with this function.\n> ...\n> But I think this still worth doing, as long as objc_retainAutoreleasedReturnValue is actually a drop-in replacement for objc_retain.\n\nIt's not so simple as just calling `objc_retainAutoreleasedReturnValue`: There is a special protocol between caller and callee.\n\nThe called ObjC function that returns the object will get the return address from the stack and look at the following machine instructions to see if it fits a certain pattern (see [here](https://github.com/opensource-apple/objc4/blob/cd5e62a5597ea7a31dccef089317abb3a661c154/runtime/objc-object.h#L1060)). This is also described e.g. [here](https://theapplewiki.com/wiki/Automatic_Reference_Counting#arm64)\n\nSo we cannot just use a FFI calls to `objc_msgSend` and then another FFI call to `objc_retainAutoreleasedReturnValue` with the returned value -- it will not take it out of autorelease pool."}, {"who": "brianquinlan", "bot": false, "at": "2026-09-18 16:38", "ago": "37d ago", "what": "commented", "text": "> The called ObjC function that returns the object will get the return address from the stack and look at the following machine instructions to see if it fits a certain pattern (see [here](https://github.com/opensource-apple/objc4/blob/cd5e62a5597ea7a31dccef089317abb3a661c154/runtime/objc-object.h#L1060)). This is also described e.g. [here](https://theapplewiki.com/wiki/Automatic_Reference_Counting#arm64)\n\nFWIW, when I was experimenting with this, I created one Objective-C trampoline per bound method so clang would be responsible for generating the correct code. But I thought that this wasn't worth it because:\n1. it's a lot of extra native code generation\n2. it doesn't actually fix the problem (because some methods add to the autorelease pool as an implementation detail)\n\nThe trampoline looks like:\n\n```objc\n__attribute__((ns_returns_retained))\nNSURLSessionDataTask* URLSession_dataTaskWithRequest(NSURLSession* session,\n                                                    NSURLRequest* request) {\n  return [session dataTaskWithRequest:request];\n}\n```\n\nThe generated code ends with:\n\n```\nblr  x8                    ; calls objc_msgSend\nmov  x29, x29              ; <-- the magic marker instruction for arm64\nbl   0x78                  ; calls objc_retainAutoreleasedReturnValue\n```\n\nYou can then change the generated binding like:\n\n```diff\n      final $ret = <call trampoline>\n-    return NSURLSessionDataTask.fromPointer($ret, retain: true, release: true);\n+    // Don't retain because the trampoline has already incremented the reference count.\n+    return NSURLSessionDataTask.fromPointer($ret, retain: false, release: true);\n```"}, {"who": "liamappelbe", "bot": false, "at": "2026-09-21 00:27", "ago": "35d ago", "what": "closed", "text": ""}, {"who": "mraleph", "bot": false, "at": "2026-09-21 08:11", "ago": "34d ago", "what": "reopened", "text": ""}, {"who": "mraleph", "bot": false, "at": "2026-09-21 08:23", "ago": "34d ago", "what": "commented", "text": "The landed PR does not actually do anything because there is a protocol between `objc_autoreleaseReturnValue` and `objc_retainAutoreleasedReturnValue` which you need to follow for hand-off to succeed. \n\nSee [the code](https://github.com/apple-oss-distributions/objc4/blob/fb265098298302243cd7eeaa1f63f0ba7786dd9a/runtime/NSObject.mm#L2335-L2342), more specifically [`prepareOptimizedReturn`](https://github.com/apple-oss-distributions/objc4/blob/fb265098298302243cd7eeaa1f63f0ba7786dd9a/runtime/objc-object.h#L1612-L1673) and [`acceptOptimizedReturn`](https://github.com/apple-oss-distributions/objc4/blob/fb265098298302243cd7eeaa1f63f0ba7786dd9a/runtime/objc-object.h#L1676-L1724).\n\nTLDR is that on ARM64  `objc_autoreleaseReturnValue` will put a tuple of `(obj, return-address)` into the TLS and `objc_retainAutoreleasedReturnValue` will check whether `return-address` corresponds to its call-site. There are also some corner-cases (e.g. classes which intercept `retain` / `release` messages are handled specially) where these methods will look at instructions at the call-site to detect a special marking instructions (e.g. `mov fp, fp` on ARM64). \n\nI don't think we can fully satisfy the protocol without some low-level surgery in the FFI implementation in the VM.  \n\nPS. Additional data point. If you take the PR and revert all the changes except changes in the tests - those tests will still pass. Which seems to indicate that the PR does not do anything."}, {"who": "liamappelbe", "bot": false, "at": "2026-09-22 01:51", "ago": "34d ago", "what": "commented", "text": "Ok, that's a much bigger change then. We'd need to add a new flag similar to `isLeaf` to `@Native` etc, and then change the trampoline based on that flag. We would only really need to enable that flag for `objc_msgSend` and co (and only if they return an object pointer with a +0 reference).\n\nAs for *how* we change the trampoline:\n- The straightforward option would be to call `objc_retainAutoreleasedReturnValue` inside the trampoline, which is fine as long as the caller knows that this means the reference is now +1 instead of +0, and must be caught in a Dart wrapper object. As long as we're careful about version skew between VM/FFIgen/package:objective_c, this should be ok. A bit risky tho.\n- A fancier approach would be to try to make the `objc_retainAutoreleasedReturnValue` work by making the trampoline transparent, so that from Dart code it looks like we are directly calling `objc_msgSend`. This seems like it would be extremely difficult.\n\nOverall I'm not sure it's worth it. Better to just wrap every `objc_msgSend` call in an autorelease pool. Seems like a lot of effort to go to to save a few ns."}], "note": "", "prd_note": "Issue that I created comments in. Assigned to someone else and not actionable by me.", "set": "A"}, {"id": "dart-lang/native#3763", "url": "https://github.com/dart-lang/native/pull/3763", "title": "[objective_c] support `scheduleInRunLoop:forMode:`", "kind": "PR", "state": "open", "author": "brianquinlan", "labels": ["package:objective_c"], "assignees": [], "requested": ["liamappelbe"], "repo_desc": "Dart packages related to native interop and the foreign function interface. Contains code generators for generating bindings for other programming languages and packages related to the hooks system for bundling native code,", "created": "2d ago", "updated": "2d ago", "snapshot": "2026-10-25T17:59:22Z", "as_of": null, "thumbs_down_at": null, "roles": ["author"], "last": "brianquinlan review_requested 2d ago", "stacked_on": null, "related": ["issue dart-lang/native#3750 [linked: closes/closed-by] '[objective_c] `NSInputStream` can deadlock': open, by brianquinlan, updated 6d ago, labels ['package:objective_c', 'needs-triage']", "issue dart-lang/native#3752 [linked: closes/closed-by] \"[objective_c] `NSInputStream` doesn't support run loop scheduling\": open, by brianquinlan, updated 6d ago, assignees ['brianquinlan'], labels ['lang-objective_c', 'package:objective_c', 'needs-triage']"], "body": "## Description\r\n\r\nThe `NSInputStream` returned by `toNSInputStream` currently ignores [`scheduleInRunLoop:forMode:`](https://github.com/dart-lang/native/blob/3cbe319e3c1ec0f9253c126ba3e465e55229c3a4/pkgs/objective_c/src/input_stream_adapter.m#L66-L67).\r\n\r\nThis causes `NSURLSession` to make [read:maxLength](https://github.com/dart-lang/native/blob/3cbe319e3c1ec0f9253c126ba3e465e55229c3a4/pkgs/objective_c/src/input_stream_adapter.m#L131) calls on its single, process-wide `com.apple.NSURLConnectionLoader thread`, which [waits](https://github.com/dart-lang/native/blob/3cbe319e3c1ec0f9253c126ba3e465e55229c3a4/pkgs/objective_c/src/input_stream_adapter.m#L163) until the Dart stream provides data. This really hurts `package:cupertino_http`'s performance when performing concurrent uploads.\r\n\r\n## Related Issues\r\n\r\nFixes #3750\r\nFixes #3752 \r\n\r\n## PR Checklist\r\n\r\n- [X] I’ve reviewed the [contributor guide](https://github.com/dart-lang/native/blob/main/CONTRIBUTING.md) and applied the relevant portions to this PR.\r\n- [X] I've run `dart tool/ci.dart --all` locally and resolved all issues identified. This ensures the PR is formatted, has no lint errors, and ran all code generators. This applies to the packages part of the toplevel `pubspec.yaml` workspace.\r\n- [X] All existing and new tests are passing. I added new tests to check the change I am making.\r\n- [X] The PR is actually solving the issue. PRs that don't solve the issue will be closed. Please be respectful of the maintainers' time. If it's not clear what the issue is, feel free to ask questions on the GitHub issue before submitting a PR.\r\n- [X] I have updated `CHANGELOG.md` for the relevant packages. (Not needed for small changes such as doc typos).\r\n- [X] I have [updated the pubspec package version](https://github.com/dart-lang/sdk/blob/main/docs/External-Package-Maintenance.md#making-a-change) if necessary.", "timeline": [{"who": "Brian Quinlan", "bot": false, "at": "2026-10-19 22:06", "ago": "6d ago", "what": "pushe fox failed with exit code 1.\nStandard output:\nError: cannot open display: :99.\n```\n\n### Changes\n- Add `pkgs/http/dart_test.yaml` passing `-headless` to the `firefox` platform so Firefox uses its native headless mode (both in CI and locally) without requiring an X server.\n- Replace the `xvfb-run` `command:` in `pkgs/http/mono_pkg.yaml` with a standard `test:` entry and regenerate `.github/workflows/dart.yml` and `tool/ci.sh` with `mono_repo`.", "timeline": [{"who": "Moritz", "bot": false, "at": "2026-10-23 05:48", "ago": "3d ago", "what": "pushed commit 39b8d0d 'chore(http): run Firefox tests with -headless instead of xvfb-run'", "text": ""}, {"who": "mosuem", "bot": false, "at": "2026-10-23 05:48", "ago": "3d ago", "what": "opened this PR", "text": ""}, {"who": "mosuem", "bot": false, "at": "2026-10-23 05:48", "ago": "3d ago", "what": "review_requested brianquinlan", "text": ""}, {"who": "github-actions[bot]", "bot": true, "at": "2026-10-23 05:48", "ago": "3d ago", "what": "labeled 'package:http'", "text": ""}, {"who": "github-actions[bot]", "bot": true, "at": "2026-10-23 05:48", "ago": "3d ago", "what": "labeled 'type-infra'", "text": ""}, {"who": "github-actions[bot]", "bot": true, "at": "2026-10-23 05:50", "ago": "3d ago", "what": "commented", "text": "## PR Health\n\n\n<details>\n<summary>\n<strong>Coverage<\/strong> :heavy_check_mark:\n<\/summary>\n\n| File | Coverage |\n| :--- | :--- |\n\n\nThis check for [test coverage](https://github.com/dart-lang/ecosystem/wiki/Test-Coverage) is informational (issues shown here will not fail the PR).\n\n\nThis check can be disabled by tagging the PR with `skip-coverage-check`.\n<\/details>\n\n<details>\n<summary>\n<strong>License Headers<\/strong> :heavy_check_mark:\n<\/summary>\n\n```\n// Copyright (c) 2026, the Dart project authors. Please see the AUTHORS file\n// for details. All rights reserved. Use of this source code is governed by a\n// BSD-style license that can be found in the LICENSE file.\n```\n\n| Files | kip-leaking-check`.\n<\/details>\n\n<details>\n<summary>\n<strong>Changelog Entry<\/strong> :heavy_check_mark:\n<\/summary>\n\n| Package | Changed Files |\n| :--- | :--- |\n\n\nChanges to files need to be [accounted for](https://github.com/dart-lang/ecosystem/wiki/Changelog) in their respective changelogs.\n\n\nThis check can be disabled by tagging the PR with `skip-changelog-check` (for example, for non-user-visible changes when the package version is already at `-wip`).\n<\/details>"}, {"who": "brianquinlan", "bot": false, "at": "2026-10-23 15:55", "ago": "2d ago", "what": "reviewed [APPROVED]", "text": ""}], "note": "", "prd_note": "The PR of a close collaborator in a repo that I am responsible for. Not actionable because I've already approved it.", "set": "A"}, {"id": "dart-lang/http#1981", "url": "https://github.com/dart-lang/http/issues/1981", "title": "Feature request: expose a server trust evaluation hook in CupertinoClient for certificate pinning", "kind": "Issue", "state": "open", "author": "umair9430", "labels": [], "assignees": ["brianquinlan"], "requested": [], "repo_desc": "A composable API for making HTTP requests in Dart.", "created": "54d ago", "updated": "5h ago", "snapshot": "2026-10-25T19:30:50Z", "as_of": null, "thumbs_down_at": null, "roles": ["assignee", "commenter", "watches_repo"], "last": "brianquinlan commented 5h ago", "stacked_on": null, "related": [], "body": "`cupertino_http`'s `CupertinoClient` doesn't currently expose any way to customize TLS server trust evaluation — there's no hook equivalent to `URLSessionDelegate`'s `urlSession(_:didReceive:completionHandler:)` for the `NSURLAuthenticationMethodServerTrust` case.\n\n**Use case**: Certificate pinning against a CA higher up the chain than the leaf. For example, AWS explicitly recommends pinning to an Amazon Trust Services *root* CA (not the leaf, and not even the intermediate CA) for ACM-issued certificates, since Amazon now issues from multiple \"dynamic\" intermediate CAs that can rotate unpredictably — see AWS's own guidance: https://aws.amazon.com/blogs/security/amazon-introduces-dynamic-intermediate-certificate-authorities/. Implementing this requires walking the full certificate chain during the TLS handshake to find the pinned CA, which `dart:io`'s `HttpClient.badCertificateCallback` cannot do — it only exposes the leaf certificate via `X509Certificate`, never the intermediates or root.\n\n`cupertino_http` is otherwise a great fit for this — it already streams request/response bodies properly via `URLSession`'s native APIs, unlike `dart:io`'s `HttpClient`. The only missing piece is a way to intercept the trust decision.\n\n**Proposed API** (minimal surface, doesn't require exposing the full delegate):\n\n```dart\nCupertinoClient.fromSessionConfiguration(\n  config,\n  serverTrustEvaluator: (SecTrust trust, String host) => bool,\n);\n```\n\n`cupertino_http` would still own the actual `URLSessionDelegate` internally (preserving its existing streaming/redirect handling); it would just call this closure during its own `didReceive challenge` implementation and act on the returned decision.\n\nHappy to contribute a PR if the maintainers are open to this direction.", "timeline": [{"who": "umair9430", "bot": false, "at": "2026-09-01 13:31", "ago": "54d ago", "what": "opened this issue", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2026-09-28 17:01", "ago": "27d ago", "what": "commented", "text": "I'm not sure how this would fit together so I can't promise to accept a PR but I'd be interested in seeing what this would look like. Would you mind writing a skeleton PR for discussion? I doesn't need to include tests, comments, etc. for now."}, {"who": "brianquinlan", "bot": false, "at": "2026-10-25 14:38", "ago": "5h ago", "what": "assigned brianquinlan", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2026-10-25 14:39", "ago": "5h ago", "what": "commented", "text": "I've started working on this."}], "note": "", "prd_note": "", "set": "B"}, {"id": "googleapis/google-cloud-dart#252", "url": "https://github.com/googleapis/google-cloud-dart/issues/252", "title": "Enum does not parse integer values", "kind": "Issue", "state": "open", "author": "brianquinlan", "labels": ["type: bug", "priority: p2"], "assignees": [], "requested": [], "repo_desc": "[Experimental] Google Cloud Dart Client Libraries", "created": "6mo ago", "updated": "4d ago", "snapshot": "2026-10-25T19:30:52Z", "as_of": null, "thumbs_down_at": null, "roles": ["author", "commenter", "watches_repo"], "last": "Yusufihsangorgel commented 4d ago", "stacked_on": null, "related": [], "body": "From https://protobuf.dev/programming-guides/json/\n\n> The name of the enum value as specified in proto is used. Parsers accept both enum names and integer values.", "timeline": [{"who": "brianquinlan", "bot": false, "at": "2026-04-29 19:01", "ago": "6mo ago", "what": "opened this issue", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2026-04-29 19:01", "ago": "6mo ago", "what": "labeled 'type: bug'", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2026-04-29 19:01", "ago": "6mo ago", "what": "labeled 'priority: p2'", "text": ""}, {"who": "github-project-automation[bot]", "bot": true, "at": "2026-04-29 19:01", "ago": "6mo ago", "what": "added to project v2", "text": ""}, {"who": "github-project-automation[bot]", "bot": true, "at": "2026-04-29 19:01", "ago": "6mo ago", "what": "project v2 item status changed", "text": ""}, {"who": "Yusufihsangorgel", "bot": false, "at": "2026-10-13 19:56", "ago": "12d ago", "what": "commented", "text": "I'd like to take this. I would change the enum template in googleapis/librarian so generated fromJson also maps a known integer to its constant, then regenerate here and un-skip `oneof_enum_integer`. For an unknown number, should the decoder keep it or throw?"}, {"who": "brianquinlan", "bot": false, "at": "2026-10-13 20:57", "ago": "12d ago", "what": "commented", "text": "Take a look at https://protobuf.dev/programming-guides/enum/\n\nI think that, to be compliant, you need to preserve unknown integers. But, if you do that, you'll need to change the [`ProtoEnum`](https://github.com/googleapis/google-cloud-dart/blob/0a3fe91aabdbdad8b8a2305aa36390e50958ffa4/generated/google_cloud_protobuf/lib/src/protobuf.p.dart#L37) definition and the code generation for `ProtoEnum` subclasses to preserve the field numbers.\n\nThe [ProtoJSON](https://protobuf.dev/programming-guides/json/) description doesn't really say what to do if the string/integer values don't map to existing values.\n\nWhen using actual APIs, do we every receive \n\nI think that this is the Java parsing implementation:\nhttps://github.com/protocolbuffers/protobuf/blob/2f21136f4ea05813a4e2cffd4ab6337a5a09cecb/java/util/src/main/java/com/google/protobuf/util/JsonFormat.java#L2448\n\nMaybe we need to set `;enum-encoding=int` in the request to get any benefit from the unknown enum value behavior?\n\n@Yusufihsangorgel I think that this is likely a big project that you'll have to research a bit before you take it on."}, {"who": "brianquinlan", "bot": false, "at": "2026-10-13 20:59", "ago": "12d ago", "what": "commented", "text": "It looks like some clients do request integer enum values e.g.\nhttps://github.com/googleapis/google-cloud-rust/blob/16628efbcde33ee1d62f7ee68a833c9ea8dae13f/src/generated/cloud/workflows/v1/src/transport.rs#L113"}, {"who": "Yusufihsangorgel", "bot": false, "at": "2026-10-13 23:11", "ago": "12d ago", "what": "commented", "text": "I'll read the Java JsonFormat parser and how the Rust client requests integer enums, then write up a design here first."}, {"who": "Yusufihsangorgel", "bot": false, "at": "2026-10-14 03:16", "ago": "12d ago", "what": "commented", "text": "For proto3 the conformance suite requires an unknown integer to round-trip as a number ([EnumFieldUnknownValue][1]). By default Java's [JsonFormat][2] and Go's [protojson][3] print integers only for unknown values. Without `enum-encoding=int`, Showcase [GetEnum][4] can return one, and the Dart client throws on it today. Dart already keeps unknown names, so asking for integers can come later.\n\nI'd generate the value numbers, map known integers to constants, keep unknown ones and accept 0 for NullValue. Should `ProtoEnum` get a nullable number, or would a [Rust-style unknown variant][5] fit better?\n\n[1]: https://github.com/protocolbuffers/protobuf/blob/2f21136f4ea05813a4e2cffd4ab6337a5a09cecb/conformance/binary_json_conformance_suite.cc#L3278-L3286\n[2]: https://github.com/protocolbuffers/protobuf/blob/2f21136f4ea05813a4e2cffd4ab6337a5a09cecb/java/util/src/main/java/com/google/protobuf/util/JsonFormat.java#L1556-L1557\n[3]: https://github.com/protocolbuffers/protobuf-go/blob/3933e752f9ea536e2cf45bf15b321274293863d3/encoding/protojson/encode.go#L331-L333\n[4]: https://github.com/googleapis/gapic-showcase/blob/c804ae4fb988f92e54ddf5a6c816c61e9e62e98e/server/services/compliance_service.go#L135-L158\n[5]: https://github.com/googleapis/google-cloud-rust/blob/16628efbcde33ee1d62f7ee68a833c9ea8dae13f/src/generated/cloud/workflows/v1/src/model.rs#L666-L678"}, {"who": "brianquinlan", "bot": false, "at": "2026-10-14 18:19", "ago": "11d ago", "what": "commented", "text": "We keep unknown names? Oh, I think that is not to spec, it is a detail of the existing implementation. \n\nProbably `ProtoEnum` should have a nullable number and a nullable string (which will be breaking but we are still prerelease)."}, {"who": "Yusufihsangorgel", "bot": false, "at": "2026-10-15 05:52", "ago": "11d ago", "what": "commented", "text": "Yeah, the [conformance suite](https://github.com/protocolbuffers/protobuf/blob/2f21136f4ea05813a4e2cffd4ab6337a5a09cecb/conformance/binary_json_conformance_suite.cc#L2585-L2593) recommends rejecting unknown names, or dropping them when unknown fields are ignored.\n\nNullable number and string make sense. Librarian's [CONTRIBUTING](https://github.com/googleapis/librarian/blob/984188ef724e707146280a0702a8a8d0e8cfb5f3/CONTRIBUTING.md#becoming-a-contributor) asks contributors to join its team. Does that apply to a one-off template change?"}, {"who": "brianquinlan", "bot": false, "at": "2026-10-15 16:03", "ago": "10d ago", "what": "commented", "text": "I suspec\n\n> Librarian's [CONTRIBUTING](https://github.com/googleapis/librarian/blob/984188ef724e707146280a0702a8a8d0e8cfb5f3/CONTRIBUTING.md#becoming-a-contributor) asks contributors to join its team. Does that apply to a one-off template change?\n\nI suspect not but we can do the paperwork when you have a PR. It might make sense to show a design, preliminary PR, etc. before you try to get all the details right. Just to make sure that we agree on approach before you write tonnes of code."}, {"who": "Yusufihsangorgel", "bot": false, "at": "2026-10-21 18:10", "ago": "4d ago", "what": "commented", "text": "I’d propose nullable number and string members, with declared constants carrying both. Unknown integer values in ordinary open enums use JSON numbers and decimal-string query values. This breaks the existing string-only API. Unknown-name decoding remains outside this representation sketch.\n\n```dart\nfinal int? number;\nfinal String? value;\nconst State._(this.number, this.value);\nstatic const ready = State._(1, 'READY'), unknown = State._(123, null);\nObject? toJson() => value ?? number;\nString toQueryValue() => value ?? number!.toString();\n```"}], "note": "", "prd_note": "", "set": "B"}, {"id": "dart-lang/http#1932", "url": "https://github.com/dart-lang/http/issues/1932", "title": "`cronetHttpNoPlay=true` build broken in Flutter 3.44.0: Namespace 'org.chromium.net' is used in multiple modules and/or libraries", "kind": "Issue", "state": "open", "author": "dreautall", "labels": ["type-bug", "package:cronet_http"], "assignees": ["brianquinlan"], "requested": [], "repo_desc": "A composable API for making HTTP requests in Dart.", "created": "5mo ago", "updated": "4d ago", "snapshot": "2026- m.net:cronet-api:141.7340.3` referenced in https://github.com/dart-lang/http/issues/1932#issuecomment-4587107456 isn't the latest version. Likewise with `org.chromium.net:cronet-shared:141.7340.3`.\n\nI wonder why is holding back the use of the most recent version?"}, {"who": "brianquinlan", "bot": false, "at": "2026-07-01 23:58", "ago": "4mo ago", "what": "commented", "text": "The version of `cronnet-embedded` used by `cronet_http` `1.9.0` depends on `cronet_shared:143.7445.0`:\nhttps://mvnrepository.com/artifact/org.chromium.net/cronet-embedded/143.7445.0/dependencies"}, {"who": "brianquinlan", "bot": false, "at": "2026-07-02 00:16", "ago": "4mo ago", "what": "commented", "text": "...but the lastest (`18.1.1`) version of `play-services-cronet` depends on the older version of `cronet-api`:\nhttps://mvnrepository.com/artifact/com.google.android.gms/play-services-cronet/18.1.1"}, {"who": "downtown1629", "bot": false, "at": "2026-07-18 18:42", "ago": "3mo ago", "what": "commented", "text": "I'm getting the same issue even without `cronetHttpNoPlay=true`. Is waiting for Google to update `play-services-cronet`'s dependency all we can do? Where should we report it?"}, {"who": "brianquinlan", "bot": false, "at": "2026-07-20 17:59", "ago": "3mo ago", "what": "commented", "text": "I reopened https://g-issues.chromium.org/issues/406926302"}, {"who": "Mohammad-amleh", "bot": false, "at": "2026-09-22 15:55", "ago": "33d ago", "what": "commented", "text": "when this issue will be resolved ?"}, {"who": "Pinguino0", "bot": false, "at": "2026-10-15 19:35", "ago": "10d ago", "what": "referenced this in commit 8bce31a", "text": ""}, {"who": "igordanilovski", "bot": false, "at": "2026-10-21 13:35", "ago": "4d ago", "what": "commented", "text": "Any updates on this guys?"}], "note": "", "prd_note": "", "set": "B"}, {"id": "dart-lang/http#2034", "url": "https://github.com/dart-lang/http/pull/2034", "title": "fix(cronet): avoid cronet namespace duplication", "kind": "PR", "state": "open", "author": "brianquinlan", "labels": ["package:cronet_http"], "assignees": [], "requested": ["goderbauer"], "repo_desc": "A composable API for making HTTP requests in Dart.", "created": "2d ago", "updated": "2d ago", "snapshot": "2026-10-25T19:30:56Z", "as_of": null, "thumbs_down_at": null, "roles": ["author", "watches_repo"], "last": "brianquinlan review_requested 2d ago", "stacked_on": null, "related": ["issue dart-lang/http#1932 [linked: closes/closed-by] \"`cronetHttpNoPlay=true` build broken in Flutter 3.44.0: Namespace 'org.chromium.net' is used in multiple modules and/or libraries\": open, by dreautall, updated 4d ago, assignees ['brianquinlan'], labels ['type-bug', 'package:cronet_http']"], "body": "Worked around a [cronet bug](https://issues.chromium.org/issues/406926302) where multiple packages have the same. See the comment in pkgs/cronet_http/android/build.gradle for details.\r\n\r\nAlso upgrades `package:jnigen` to `1.0.1` to avoid a CI failure because the CI would version solve against `package:jnigen` `1.0.1`, which generates slightly different code to `1.0.0`.\r\n\r\nFixes https://github.com/dart-lang/http/issues/1932\r\n\r\n---\r\n\r\n- [X] I’ve reviewed the contributor guide and applied the relevant portions to this PR.\r\n\r\n<details>\r\n  <summary>Contribution guidelines:<\/summary><br>\r\n\r\n- See our [contributor guide](https://github.com/dart-lang/.github/blob/main/CONTRIBUTING.md) for general expectations for PRs.\r\n- Larger or significant changes should be discussed in an issue before creating a PR.\r\n- Contributions to our repos should follow the [Dart style guide](https://dart.dev/guides/language/effective-dart) and use `dart format`.\r\n- Most changes should add an entry to the changelog and may need to [rev the pubspec package version](https://github.com/dart-lang/sdk/blob/main/docs/External-Package-Maintenance.md#making-a-change).\r\n- Changes to packages require [corresponding tests](https://github.com/dart-lang/.github/blob/main/CONTRIBUTING.md#Testing).\r\n\r\nMany Dart repos have a weekly cadence for reviewing PRs - please allow for some latency before initial review feedback.\r\n\r\n**Note**: The Dart team is trialing Gemini Code Assist. Don't take its comments as final Dart team feedback. Use the suggestions if they're helpful; otherwise, wait for a human reviewer.\r\n\r\n<\/details>", "timeline": [{"who": "Brian Quinlan", "bot": false, "at": "2026-10-23 16:22", "ago": "2d ago", "what": "pushed commit 487cc58 'fix(cronet): avoid cronet namespace duplication'", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2026-10-23 16:25", "ago": "2d ago", "what": "opened this PR", "text": ""}, {"who": "github-actions[bot]", "bot": true, "at": "2026-10-23 16:25", "ago": "2d ago", "what": "labeled 'package:cronet_http'", "text": ""}, {"who": "Brian Quinlan", "bot": false, "at": "2026-10-23 16:26", "ago": "2d ago", "what": "pushed commit f80e3cc 'Update gradle.properties'", "text": ""}, {"who": "Brian Quinlan", "bot": false, "at": "2026-10-23 16:36", "ago": "2d ago", "what": "pushed commit 322ec3e 'jni upgrade'", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2026-10-23 16:45", "ago": "2d ago", "what": "review_requested goderbauer", "text": ""}], "note": "", "prd_note": "", "set": "B"}, {"id": "dart-lang/native#3752", "url": "https://github.com/dart-lang/native/issues/3752", "title": "[objective_c] `NSInputStream` doesn't support run loop scheduling", "kind": "Issue", "state": "open", "author": "brianquinlan", "labels": ["lang-objective_c", "package:objective_c", "needs-triage"], "assignees": ["brianquinlan"], "requested": [], "repo_desc": "Dart packages related to native interop and the foreign function interface. Contains code generators for generating bindings for other programming languages and packages related to the hooks system for bundling native code,", "created": "6d ago", "updated": "6d ago", "snapshot": "2026-10-25T19:31:00Z", "as_of": null, "thumbs_down_at": null, "roles": ["author", "assignee"], "last": "brianquinlan assigned 6d ago", "stacked_on": null, "related": ["PR dart-lang/native#3763 [linked: closes/closed-by] '[objective_c] support `scheduleInRunLoop:forMode:`': open, by brianquinlan, updated 2d ago, labels ['package:objective_c']"], "body": "The `NSInputStream` returned by `toNSInputStream` ignores [`scheduleInRunLoop:forMode:`](https://github.com/dart-lang/native/blob/3cbe319e3c1ec0f9253c126ba3e465e55229c3a4/pkgs/objective_c/src/input_stream_adapter.m#L66-L67), never sends stream events to its delegate, and [hasBytesAvailable](https://github.com/dart-lang/native/blob/3cbe319e3c1ec0f9253c126ba3e465e55229c3a4/pkgs/objective_c/src/input_stream_adapter.m#L191-L193) returns YES even when no data is buffered. So a reader that schedules the stream and waits for events never receives any.\n\n`NSURLSession` schedules request body streams, but because `hasBytesAvailable` returns `YES`, it calls [read:maxLength](https://github.com/dart-lang/native/blob/3cbe319e3c1ec0f9253c126ba3e465e55229c3a4/pkgs/objective_c/src/input_stream_adapter.m#L131) on its single, process-wide `com.apple.NSURLConnectionLoader thread`, which [waits](https://github.com/dart-lang/native/blob/3cbe319e3c1ec0f9253c126ba3e465e55229c3a4/pkgs/objective_c/src/input_stream_adapter.m#L163) until the Dart stream provides data. Until then, no other NSURLSession request in the process can make progress. `package:cupertino_http` sends StreamedRequest bodies this way.\n\nTo reproduce, add this to pkgs/objective_c/test/ns_input_stream_test.dart:\n\n```dart\ntest('hasBytesAvailable when scheduled in a run loop', () {\n  final controller = StreamController<List<int>>();\n  final inputStream = controller.stream.toNSInputStream();\n  addTearDown(inputStream.close);\n  inputStream.scheduleInRunLoop(\n    NSRunLoop.getCurrentRunLoop(),\n    forMode: 'kCFRunLoopDefaultMode'.toNSString(),\n  );\n  inputStream.open();\n  expect(inputStream.hasBytesAvailable, isFalse);\n});\n```", "timeline": [{"who": "brianquinlan", "bot": false, "at": "2026-10-19 23:58", "ago": "6d ago", "what": "opened this issue", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2026-10-19 23:58", "ago": "6d ago", "what": "labeled 'lang-objective_c'", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2026-10-19 23:58", "ago": "6d ago", "what": "labeled 'package:objective_c'", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2026-10-19 23:58", "ago": "6d ago", "what": "labeled 'needs-triage'", "text": ""}, {"who": "brianquinlan", "bot": false, "at": "2026-10-19 23:58", "ago": "6d ago", "what": "assigned brianquinlan", "text": ""}], "note": "", "prd_note": "", "set": "B"}, {"id": "dart-lang/tools#2715", "url": "https://github.com/dart-lang/tools/pull/2715", "title": "[string_scanner] Validate error() span bounds and test eager lastSpan", "kind": "PR", "state": "open", "author": "kevmoo", "labels": ["package:string_scanner"], "assignees": [], "requested": ["davidmorgan", "dart-ecosystem-team (team)"], "repo_desc": "This repository is home to tooling related Dart packages.", "created": "2d ago", "updated": "2d ago", "snapshot": "2026-10-25T19:31:02Z", "as_of": null, "thumbs_down_at": null, "roles": ["requested_reviewer_via_team(dart-ecosystem-team)"], "last": "kevmoo review_requested 2d ago", "stacked_on": null, "related": ["PR dart-lang/tools#2633 '[string_scanner] Fix SpanScanner.within() and LineScanner edge cases': merged, by kevmoo, updated 2d ago, labels ['package:string_scanner']"], "body": "Validates resolved `(position, length)` bounds in `error()` so `SpanScanner.within().error(message, length: n)` and out-of-range `Match` arguments throw `RangeError` instead of reading past the subspan into `_sourceFile`, and pins `SpanScanner.eager` `lastSpan` clearing (follow-up to #2633).\n\n- [#2633 review comment (`within().error` bounds)](https://github.com/dart-lang/tools/pull/2633#discussion_r4357319290)\n- [#2633 review comment (`SpanScanner.eager` `lastSpan`)](https://github.com/dart-lang/tools/pull/2633#discussion_r4357319299)", "timeline": [{"who": "Kevin Moore", "bot": false, "at": "2026-10-23 19:02", "ago": "2d ago", "what": "pushed commit a295254 '[string_scanner] Validate resolved error span bounds and test eager lastSpan clearing'", "text": ""}, {"who": "kevmoo", "bot": false, "at": "2026-10-23 19:22", "ago": "2d ago", "what": "opened this PR", "text": ""}, {"who": "kevmoo", "bot": false, "at": "2026-10-23 19:22", "ago": "2d ago", "what": "review_requested dart-ecosystem-team", "text": ""}, {"who": "kevmoo", "bot": false, "at": "2026-10-23 19:22", "ago": "2d ago", "what": "review_requested davidmorgan", "text": ""}, {"who": "github-actions[bot]", "bot": true, "at": "2026-10-23 19:22", "ago": "2d ago", "what": "labeled 'package:string_scanner'", "text": ""}, {"who": "gemini-code-assist[bot]", "bot": true, "at": "2026-10-23 19:22", "ago": "2d ago", "what": "reviewed [COMMENTED]", "text": "## Code Review\n\nThis pull request introduces validation for error arguments in `RelativeSpanScanner`, `SpanScanner`, and `StringScanner` by invoking `validateErrorArgs` in their `error` methods. It also adds unit tests to ensure `RangeError` is thrown when the error length exceeds the span, and that `lastSpan` is cleared when the position changes without a match. There are no review comments, so I have no feedback to provide."}, {"who": "github-actions[bot]", "bot": true, "at": "2026-10-23 19:23", "ago": "2d ago", "what": "commented", "text": "## PR Health\n\n\n<details>\n<summary>\n<strong>Coverage<\/strong> :warning:\n<\/summary>\n\n| File | Coverage |\n| :--- | :--- |\n|pkgs/string_scanner/lib/src/relative_span_scanner.dart| :broken_heart: 91 % :arrow_down: 0 % |\n|pkgs/string_scanner/lib/src/span_scanner.dart| :green_heart: 61 % :arrow_up: 6 % |\n|pkgs/string_scanner/lib/src/string_scanner.dart| :broken_heart: 98 % :arrow_down: 0 % |\n|pkgs/string_scanner/lib/src/utils.dart| :green_heart: 100 % |\n\nThis check rent's trailing `.` against the first character of `.file`.\n- A lone `.` component means the current directory, so `/dir/.` is the same directory as `/dir` and contains `/dir/.file`. A name such as `.bar` is unchanged.\n- Covered with posix cases, and checked the same behavior on the Windows style.\n\nFixes #537\n\n## Test plan\n- [x] Local checks: trailing-dot parent contains `.file` and `file`, equals `/dir`, and `foo/./bar` is still not a parent of `foo/.bar/baz` (posix and Windows)\n- [ ] `dart test test/posix_test.dart --name isWithin` inside `pkgs/path` (pub.dev was unreachable from this environment)\n\n\nMade with [Cursor](https://cursor.com)", "timeline": [{"who": "hamed", "bot": false, "at": "2026-10-10 19:02", "ago": "15d ago", "what": "pushed commit 3f95c96 'Treat a trailing dot parent as the current directory in isWithin.'", "text": ""}, {"who": "hamed75kazemii", "bot": false, "at": "2026-10-10 19:06", "ago": "15d ago", "what": "opened this PR", "text": ""}, {"who": "hamed75kazemii", "bot": false, "at": "2026-10-10 19:06", "ago": "15d ago", "what": "review_requested dart-ecosystem-team", "text": ""}, {"who": "github-actions[bot]", "bot": true, "at": "2026-10-10 19:06", "ago": "15d ago", "what": "labeled 'package:path'", "text": ""}, {"who": "google-cla[bot]", "bot": true, "at": "2026-10-10 19:06", "ago": "15d ago", "what": "commented", "text": "Thanks for your pull request! It looks like this may be your first contribution to a Google open source project. Before we can look at your pull request, you'll need to sign a Contributor License Agreement (CLA).\n\nView this [failed invocation](https://github.com/dart-lang/core/pull/1007/checks?check_run_id=114290261978) of the CLA check for more information.\n\nFor the most up to date status, view the checks section at the bottom of the pull request."}], "note": "", "prd_note": "", "set": "B"}, {"id": "dart-lang/tools#2544", "url": "https://github.com/dart-lang/tools/pull/2544", "title": "[package_config] Forbid UNC paths in rootUri to mitigate UNC path injection", "kind": "PR", "state": "open", "author": "jonasfj", "labels": ["package:package_config"], "assignees": [], "requested": ["dart-ecosystem-team (team)"], "repo_desc": "This repository is home to tooling related Dart packages.", "created": "2mo ago", "updated": "2mo ago", "snapshot": "2026-10-25T19:31:11Z", "as_of": null, "thumbs_down_at": null, "roles": ["requested_reviewer_via_team(dart-ecosystem-team)"], "last": "lrhn reviewed [COMMENTED] 2mo ago", "stacked_on": null, "related": [], "body": "On Windows a `package_config.json`, crafted by a malicious actor, can point to an external UNC network share (e.g. `\"rootUri\": \"//attacker.example.com/share/\"`). \r\n\r\nDownstream tools (`analyzer`, `pub`, etc) that attempt to read from such a path (or just `File.statSync`) may trigger Windows to initiate an SMB request which the attacker can use to [record the user's account hashes](https://attack.mitre.org/techniques/T1187/).\r\n\r\nTo mitigate this issue, we require that `rootUri`s inside `package_config.json` must be a local file path.\r\n\r\nFor users who legitimately have `package_config.json` on a network share, the solution is to mount these network shares as local drive letters (like `Z:\\`).\r\n\r\n\r\nBUG=536309083", "timeline": [{"who": "jonasfj", "bot": false, "at": "2026-08-20 13:37", "ago": "2mo ago", "what": "opened this PR", "text": ""}, {"who": "jonasfj", "bot": false, "at": "2026-08-20 13:37", "ago": "2mo ago", "what": "review_requested dart-ecosystem-team", "text": ""}, {"who": "github-actions[bot]", "bot": true, "at": "2026-08-20 13:37", "ago": "2mo ago", "what": "labeled 'package:package_config'", "text": ""}, {"who": "Jonas Finnemann Jensen", "bot": false, "at": "2026-08-20 13:37", "ago": "2mo ago", "what": "pushed commit 8f881ea 'Forbid non-local file paths in rootUri to mitigate UNC path injection'", "text": ""}, {"who": "github-actions[bot]", "bot": true, "at": "2026-08-20 13:38", "ago": "2mo t": "## PR Health\n\n\n<details>\n<summary>\n<strong>Unused Dependencies<\/strong> :warning:\n<\/summary>\n\n| Package | Status |\n| :--- | :--- |\n| package_config | <details><summary>:exclamation: Show Issues<\/summary><pre>These packages are used outside lib/ but are not dev_dependencies:<br>  * path<\/pre><\/details> |\n\nFor details on how to fix these, see [dependency_validator](https://pub.dev/packages/dependency_validator).\n\n\nThis check can be disabled by tagging the PR with `skip-unused-dependencies-check`.\n<\/details>\n\n<details>\n<summary>\n<strong>Breaking changes<\/strong> :heavy_check_mark:\n<\/summary>\n\n| Package | Change | Current Version | New Version | Needed Version | Looking good? |\n| :--- | :--- | ---: | ---: | ---: | ---: |\n|package_config|None|3.0.0|3.0.1-wip|3.0.1-wip|:heavy_check_mark:|\n\n\nThis check can be disabled by tagging the PR with `skip-breaking-check`.\n<\/details>\n\n<details>\n<summary>\n<strong>API leaks<\/strong> :heavy_check_mark:\n<\/summary>\n\nThe following packages contain symbols visible in the public API, but not exported by the library. Export these symbols or remove them from your publicly visible API.\n\n| Package | Leaked API symbol | Leaking sources |\n| :--- | :--- | :--- |\n\n\n\nThis check can be disabled by tagging the PR with `skip-leaking-check`.\n<\/details>\n\n<details>\n<summary>\n<strong>Changelog Entry<\/strong> :heavy_check_mark:\n<\/summary>\n\n| Package | Changed Files |\n| :--- | :--- |\n\n\nChanges to files need to be [accounted for](https://github.com/dart-lang/ecosystem/wiki/Changelog) in their respective changelogs.\n\n\nThis check can be disabled by tagging the PR with `skip-changelog-check`.\n<\/details>\n\n<details>\n<summary>\n<strong>License Headers<\/strong> :heavy_check_mark:\n<\/summary>\n\n```\n// Copyright (c) 2026, the Dart project authors. Please see the AUTHORS file\n// for details. All rights reserved. Use of this source code is governed by a\n// BSD-style license that can be found in the LICENSE file.\n\n```\n\n| Files |\n| :--- |\n| _no missing headers_  |\n\nAll source files should start with a [license header](https://github.com/dart-lang/ecosystem/wiki/License-Header).\n\n\n\n\n\nThis check can be disabled by tagging the PR with `skip-license-check`.\n<\/details>\n\n<details>\n<summary>\n<strong>Coverage<\/strong> :warning:\n<\/summary>\n\n| File | Coverage |\n| :--- | :--- |\n|pkgs/package_config/lib/src/package_config.dart| :broken_heart: 82 % :arrow_down: 0 % |\n\nThis check for [test coverage](https://github.com/dart-lang/ecosystem/wiki/Test-Coverage) is informational (issues shown here will not fail the PR).\n\n\nThis check can be disabled by tagging the PR with `skip-coverage-check`.\n<\/details>"}, {"who": "gemini-code-assist[bot]", "bot": true, "at": "2026-08-20 13:39", "ago": "2mo ago", "what": "reviewed [COMMENTED]", "text": "## Code Review\n\nThis pull request mitigates UNC path injection (SMB NTLM leak) by forbidding non-local file paths in `rootUri`. Feedback on the changes highlights a regression where checking `root.host.isNotEmpty` instead of `parsedRootUri.host.isNotEmpty` breaks package resolution for legitimate projects hosted on network shares. Additionally, a temporary scratch file (`scratch.dart`) was committed and should be removed, and a test case should be added to verify that relative paths on network shares remain supported.\n\n<details>\n<summary>I am having trouble creating individual review comments. Click here to see my feedback.<\/summary>\n\n### pkgs/package_config/lib/src/package_config_json.dart (157-163)\n\n![security-high](https://www.gstatic.com/codereviewagent/security-high-priority.svg) ![high](https://www.gstatic.com/codereviewagent/high-priority.svg)\n\nChecking `root.host.isNotEmpty` will cause a regression for legitimate users who have their project located on a network share (UNC path). When `baseLocation` has a host (e.g., `file://network-share/project/...`), any relative `rootUri` (like `../foo`) will resolve to a URI that inherits the same host. This causes `root.host.isNotEmpty` to be `true`, resulting in a false positive and breaking package resolution for those users.\n\nTo fix this, check `parsedRootUri.host.isNotEmpty` instead. This ensures that only `rootUri`s that explicitly specify a host are rejected, while relative paths on a network share remain fully supported and secure.\n\n```suggestion\n    if (parsedRootUri.host.isNotEmpty) {\n      onError(PackageConfigFormatException(\n        'Package root URIs must not have a host (authority) component. '\n        'The rootUri must be a local file path. '\n        'Found: \"${parsedRootUri.host}\".', entry));\n      return null;\n    }\n```\n\n<details>\n<summary>References<\/summary>\n\n1. When building foundational components, prioritize robust, future-proof implementations over simpler ones that may introduce subtle bugs or rely on unintended behavior.\n<\/details>\n\n### pkgs/package_config/scratch.dart (1-6)\n\n![medium](https://www.gstatic.com/codereviewagent/medium-priority.svg)\n\nThe `scratch.dart` file appears to be a temporary debug or scratch file used during development. It should not be committed to the repository. Please remove this file from the pull request.\n\n### pkgs/package_config/test/parse_test.dart (403-406)\n\n![medium](https://www.gstatic.com/codereviewagent/medium-priority.svg)\n\nAdd a test case to verify that relative paths are still allowed when the project itself is located on a network share (i.e., when `baseLocation` has a host component). This prevents future regressions.\n\n```suggestion\n          testThrows(\n            'has-host',\n            '{$cfg,\"packages\":[{$name,\"rootUri\":\"file://attacker.com/share/\"}]}',\n          );\n          test('relative path on network share base', () {\n            var config = parsePackageConfigBytes(\n              utf8.encode('{$cfg,\"packages\":[{$name,\"rootUri\":\"../foo/\"}]}'),\n              Uri.parse('file://network-share/tmp/.dart_tool/file.dart'),\n              throwError,\n            );\n            expect(config.packages.first.root, Uri.parse('file://network-share/tmp/foo/'));\n          });\n```\n\n<\/details>"}, {"who": "jonasfj", "bot": false, "at": "2026-08-20 13:44", "ago": "2mo ago", "what": "review_requested lrhn", "text": ""}, {"who": "lrhn", "bot": false, "at": "2026-08-20 20:55", "ago": "2mo ago", "what": "left inline review comment on pkgs/package_config/lib/src/package_config_json.dart", "text": "Need to check for port as well, don't want `file://:8192/path` to connect to something.\n\nAlso `file:///path` and `file://localhost/path` are morally equivalent.\n\nConsider:\n```dart\nif (root.authority case var authority \n     when authority.isNotEmpty && authority != \"localhost\") {\n  .... error ....\n}\n```"}, {"who": "lrhn", "bot": false, "at": "2026-08-20 20:56", "ago": "2mo ago", "what": "left inline review comment on pkgs/package_config/test/parse_test.dart", "text": "Use `example.com` for example domains."}, {"who": "lrhn", "bot": false, "at": "2026-08-20 20:57", "ago": "2mo ago", "what": "left inline review comment on pkgs/package_config/lib/src/package_config_json.dart", "text": "Should probably apply to package root (`lib/` dir) as well. Nothing here prevents that string from being `//example.com/badness/`.\n(There should be a check later, that the package URI root is inside the package root, but let's not rely on that being enough. Security in depth.)"}, {"who": "lrhn", "bot": false, "at": "2026-08-20 21:03", "ago": "2mo ago", "what": "left inline review comment on pkgs/package_config/lib/src/package_config_json.dart", "text": "Should probably only apply if `.isScheme('file')`.\n\nThe current configuration allows non-`file` schemes.\nIf we shouldn't allow that, we should also check for it."}, {"who": "lrhn", "bot": false, "at": "2026-08-20 21:04", "ago": "2mo ago", "what": "left inline review comment on pkgs/package_config/lib/src/package_config_json.dart", "text": "The `SimplePackage.validate` should validate all the constraints again. (Or instead, depends on whether it's a config parsing error or a data logic error.)"}, {"who": "lrhn", "bot": false, "at": "2026-08-20 21:04", "ago": "2mo ago", "what": "reviewed [COMMENTED]", "text": ""}, {"who": "jonasfj", "bot": false, "at": "2026-08-21 06:44", "ago": "2mo ago", "what": "left inline review comment (reply) on pkgs/package_config/lib/src/package_config_json.dart", "text": "I think we should allow `../foo` relative paths, without `file:` prefix."}, {"who": "Jonas Finnemann Jensen", "bot": false, "at": "2026-08-21 07:35", "ago": "2mo ago", "what": "pushed commit d0b6c65 'Forbid UNC paths in package root URIs'", "text": ""}, {"who": "jonasfj", "bot": false, "at": "2026-08-21 07:58", "ago": "2mo ago", "what": "renamed 'Forbid non-local file paths in rootUri to mitigate UNC path injection' -> '[package_config] Forbid UNC paths in rootUri to mitigate UNC path injection'", "text": ""}, {"who": "Jonas Finnemann Jensen", "bot": false, "at": "2026-08-21 08:03", "ago": "2mo ago", "what": "pushed commit 90019e7 'Move UNC validation into SimplePackage.validate for security in depth'", "text": ""}, {"who": "Jonas Finnemann Jensen", "bot": false, "at": "2026-08-21 08:16", "ago": "2mo ago", "what": "pushed commit d468e60 'Add packageUri UNC tests and update CHANGELOG'", "text": ""}, {"who": "Jonas Finnemann Jensen", "bot": false, "at": "2026-08-21 08:25", "ago": "2mo ago", "what": "pushed commit 31233d0 'Fix changelog wording'", "text": ""}, {"who": "jonasfj", "bot": false, "at": "2026-08-21 08:38", "ago": "2mo ago", "what": "review_requested lrhn", "text": ""}, {"who": "lrhn", "bot": false, "at": "2026-08-26 11:21", "ago": "2mo ago", "what": "left inline review comment on pkgs/package_config/lib/src/package_config.dart", "text": "\"must not evaluate to\" -> \"must not be\" (the root URI is what it is - the representation is just a way to serialize it).\n\nFor someone not on Windows, that's a confusing error message. \"That's _not_ a Windows UNC path, this is Unix. Also, what is a Windows UNC path?\"\n(Not that most Windows users would know that either.)\n\nI'd start the text with the requirement, not the violation:\n```dart\n   \"Package root URIs with the 'file:' scheme must be local paths, \"\n   \"with no authority and a path not starting with '//'. \"\n   \"Was: '$root` which has a non-trivial authority part.\",\n```"}, {"who": "lrhn", "bot": false, "at": "2026-08-26 11:39", "ago": "2mo ago", "what": "left inline review comment on pkgs/package_config/lib/src/package_config.dart", "text": "What is the actual restriction here?\n\nIt's not a _windows_ restriction, it applies to all platforms, and it should be expressed in a way that can be understood without converting to a windows path.\n\nA root URI that is a file URI must:\n* Not have a non-empty authority part. \n* Not have a path that starts with `//`.\n\nA `file:` URI always has an authority part, but it should be empty, meaning an empty host, a default/empty port and no user-id, so `.authority.isEmpty`.\n\nThen it must not have a path that starts with `//`, because that will be converted to a Windows path starting with `\\\\`, so `!root.path.startsWith('//')`.\n\nAka: it must start with `file:///` and not be followed by `/`. It's probably a `_SimpleUri`, so doing `toString()` is free, so we can introduce a central check for that:\n```dart\n  bool hasSimpleFilePath(Uri uri) =>\n    !uri.isScheme('file) ||\n        uri.authority.isEmpty && !uri.path.startsWith('//');\n```\nand do;\n```dart\n  if (!fatalError && !hasSimpleFilePath(root)) {\n    // Badness. \n    fatalError = true;\n  }\n```\n\n(Do we need to check for  a path of `/%2f...` or `/%5c...`, the escapes for `/` and `\\`? Doesn't seem so, they generate an \"invalid character in path\" error from `_toWindowsFilePath`.).\n\nThe URI must probably also not have an empty path, `file://` is a valid URI with an empty authority and empty path, but we already checked above that it `isAbsoluteDirectoryUri`, so that should be covered."}, {"who": "lrhn", "bot": false, "at": "2026-08-26 11:41", "ago": "2mo ago", "what": "left inline review comment on pkgs/package_config/lib/src/package_config.dart", "text": "Doing same check a second time. Have a helper function with proper docs that implements a specified behavior.\n(And tested!)"}, {"who": "lrhn", "bot": false, "at": "2026-08-26 11:41", "ago": "2mo ago", "what": "left inline review comment on pkgs/package_config/lib/src/package_config.dart", "text": "Same error too. Probably have a function for that too.\n\nExcept it's probably not needed. The `packageUriRoot` _must_ be inside the `root` (line 854), so it's probably guaranteed to have same scheme, authority and path start. But I guess the root path could be `file:///` and the package root `file:////bananas/`, in which case we do need to check that it doesn't start with `//`. That can _only_ happen if the root URI has `/` as path.\n\nBut we should check that `isUriPrefix` remembers to check the authority."}, {"who": "lrhn", "bot": false, "at": "2026-08-26 11:55", "ago": "2mo ago", "what": "left inline review comment on pkgs/package_config/CHANGELOG.md", "text": "> - Forbids a non-empty authority or a path starting with `//` in\n>   `rootUri` and `packageUri` to mitigate UNC path injection.\n>  (...)"}, {"who": "lrhn", "bot": false, "at": "2026-08-26 11:59", "ago": "2mo ago", "what": "left inline review comment on pkgs/package_config/test/parse_test.dart", "text": "Test the helper function directly as well, with more tricky cases, on top of testing that  the function gets called in the right places.\n\nTricky cases include:\n* `file://localhost/bananas` - it may be the default host, but `toFilePath` doesn't treat it the same as no host.\n* `file://:1234/bananas`\n* `file://me@/bananas`\n* `file:///` with package-root-URL `//bananas/are/great/`\n* `file://bananas`"}, {"who": "lrhn", " ]"], "body": "> [!NOTE]\n> This PR was generated by an AI coding agent (Jetski) on behalf of @mosuem.\n\nStacked on #2563. Extracts the SLSA provenance parsing and the package attestation policy that dart-lang/pub#4875 (`lib/src/sigstore/provenance.dart`, `verifier.dart`) and dart-lang/pub-dev#9546 (`app/lib/package/attestation_verifier.dart`) currently each carry a copy of into `package:sigstore/provenance.dart`, as proposed in https://github.com/dart-lang/pub-dev/pull/9546#issuecomment-6120956306.\n\nThe new library is pure Dart (`dart:convert` only, no `dart:ffi`, no new dependencies), so it can be imported on every platform, including from `pub`'s `sigstore_stub.dart` configuration:\n\n- `GitHubRepository` (`tryParse`, `tryParseSlug`), `GitHubWorkflowIdentity` (`tryParse`), `ProvenanceSubject`\n- `BuildProvenance.parseBundle` — the union of both copies: pub-dev's `repositoryId`, `repositoryOwnerId` and `runUrl` included\n- `TransparencyLogEntry.tryParseBundle`\n- `checkProvenancePolicy` — the union of both signatures: `expectedRepository`, `configuredRepository` (pub-dev's `configuredGitHubRepository`), `declaredPackageName`/`declaredPackageVersion` (pub), `requireRepository`, `requireTaggedSignerRef`\n\nTwo deliberate differences from the copies:\n\n- `packageVersion` / `declaredPackageVersion` are `String`s, so `package:sigstore` does not pick up a `pub_semver` dependency. Callers pass `version.toString()`.\n- `trustedSignerWorkflows` is required and has no default: which workflows are trusted to sign is the consumer's policy, and `pub.dev` should be able to change it without a `package:sigstore` release. (`defaultTrustedSignerWorkflows` stays in `pub` and `pub.dev`.)\n\nThe sha256-mismatch message is now neutral (`but this archive has sha256 ...`) instead of `downloaded` (pub) / `uploaded` (pub-dev).\n\nTests: `provenance_test.dart` and `policy_test.dart` move over from pub#4875, extended for `tryParseSlug`, the repository ids / run url, `TransparencyLogEntry`, `configuredRepository` and `declaredPackage*`. `sigstore_test.dart` gains an end-to-end test that verifies the real `helpful 0.1.5` attestation over the archive digest (`isDigest: true`) through the native bindings and then feeds `verifiedIdentity()` into `GitHubWorkflowIdentity.tryParse` and `checkProvenancePolicy`, which pins the identity format the parser must understand to the one the bindings produce.\n\nFollow-ups once this is released: switch dart-lang/pub#4875 and dart-lang/pub-dev#9546 to import `package:sigstore/provenance.dart` and delete their copies.", "timeline": [{"who": "Moritz", "bot": false, "at": "2026-10-23 07:38", "ago": "2d ago", "what": "pushed commit 67238a8 '[sigstore] Add package:sigstore/provenance.dart with the shared provenance parsing and policy'", "text": ""}, {"who": "mosuem", "bot": false, "at": "2026-10-23 07:38", "ago": "2d ago", "what": "opened this PR", "text": ""}, {"who": "mosuem", "bot": false, "at": "2026-10-23 07:38", "ago": "2d ago", "what": "review_requested dart-ecosystem-team", "text": ""}, {"who": "github-actions[bot]", "bot": true, "at": "2026-10-23 07:38", "ago": "2d ago", "what": "labeled 'type-infra'", "text": ""}, {"who": "gemini-code-assist[bot]", "bot": true, "at": "2026-10-23 07:41", "ago": "2d ago", "what": "reviewed [COMMENTED]", "text": "## Code Review\n\nThis pull request introduces `package:sigstore/provenance.dart`, a pure-Dart library for parsing SLSA build provenance from Sigstore bundles and checking them against package attestation policies. It includes classes for parsing GitHub repositories, workflow identities, build provenance, and transparency log entries, along with comprehensive tests and documentation. The reviewer feedback suggests enhancing robustness by using `base64.normalize` during payload decoding and handling potential integer types for repository and owner IDs."}, {"who": "gemini-code-assist[bot]", "bot": true, "at": "2026-10-23 07:41", "ago": "2d ago", "what": "left inline review comment on pkgs/sigstore/lib/src/provenance.dart", "text": "![medium](https://www.gstatic.com/codereviewagent/medium-priority.svg)\n\nTo make the base64 decoding robust against missing padding (which is a common issue with base64 strings in JSON payloads generated by some non-standard encoders), consider using `base64.normalize` before decoding.\n\n```suggestion\n      decodedStatement = json.decode(\n        utf8.decode(base64.decode(base64.normalize(encodedPayload))),\n      );\n```\n\n<details>\n<summary>References<\/summary>\n\n1. When building foundational components, prioritize robust, future-proof implementations over simpler ones that may introduce subtle bugs or rely on unintended behavior.\n<\/details>"}, {"who": "gemini-code-assist[bot]", "bot": true, "at": "2026-10-23 07:41", "ago": "2d ago", "what": "left inline review comment on pkgs/sigstore/lib/src/provenance.dart", "text": "![medium](https://www.gstatic.com/codereviewagent/medium-priority.svg)\n\nGitHub repository and owner IDs are sometimes represented as integers in various APIs and payloads, even though they are strings in OIDC claims. To prevent silent parsing failures if a tool encodes them as integers, consider stringifying them robustly if they are not null.\n\n```dart\n      final id = github['repository_id'];\n      if (id != null) {\n        final idStr = '$id'.trim();\n        if (idStr.isNotEmpty) repositoryId = idStr;\n      }\n      final ownerId = github['repository_owner_id'];\n      if (ownerId != null) {\n        final ownerIdStr = '$ownerId'.trim();\n        if (ownerIdStr.isNotEmpty) repositoryOwnerId = ownerIdStr;\n      }\n```\n\n<details>\n<summary>References<\/summary>\n\n1. When building foundational components, prioritize robust, future-proof implementations over simpler ones that may introduce subtle bugs or rely on unintended behavior.\n<\/details>"}, {"who": "mosuem", "bot": false, "at": "2026-10-23 07:52", "ago": "2d ago", "what": "added to stack", "text": ""}, {"who": "
