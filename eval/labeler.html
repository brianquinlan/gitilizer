dy connected!');\n      return true;\n    }\n\n    // make connection \n    _channel = defaultTargetPlatform == TargetPlatform.iOS ||\n            defaultTargetPlatform == TargetPlatform.android\n        ? IOWebSocketChannel.connect(url)\n        : WebSocketChannel.connect(url);\n    try {\n      await _channel!.ready;\n    } catch (e) {\n      debugPrint('Error Exception repo $e');\n    }\n\n    // confirming connection again\n    if (_channel?.innerWebSocket?.readyState == 1) {\n      return true;\n    } else {\n      return false;\n    }\n  }\n...\n}\n```"},{"who":"github-actions[bot]","bot":true,"at":"2025-05-02 08:05","ago":"18mo ago","what":"unlabeled 'needs-info'","text":""}],"note":"","prd_note":"","set":null,"source":"production","draft":"respond","why":"","settings_note":"additional repositories: dart-lang/tools (“I'm only interested in `package:boring`”), dart-lang/http (“I am responsible for all packages in this repo, expect `package:http2`. But if I am assigned, mentioned, etc. in an issue or PR related to `package:http2` then rank it as you would any other package in dart-lang/http.”); collaborators: kevmoo, natebosch, sigurdm, mosuem","agents":[{"who":"Gemini","step":"respond","text":"Reply to RazaGR's question about how to check connection status after the removal of innerWebSocket."},{"who":"Basic","step":"respond","text":""},{"who":"Claude","step":"backlog","text":"Reply to RazaGR on whether package:web_socket_channel 3.x offers a way to check the current readyState (e.g. closeCode or tracking stream done), or close the issue as a feature request."},{"who":"OpenAI","step":"respond","text":"Answer whether current connection state is exposed in 3.x and suggest an appropriate connection-tracking approach."}]},{"id":"dart-lang/tools#2899","url":"https://github.com/dart-lang/tools/pull/2899","title":"[boring] Pin NASM and the macOS cross-toolchain, and attest in a separate job","kind":"PR","state":"open","author":"mosuem","labels":["type-infra"],"assignees":[],"requested":["jonasfj","dart-ecosystem-team (team)"],"repo_desc":"This repository is home to tooling related Dart packages.","created":"4h ago","updated":"0h ago","snapshot":"2026-11-18T13:16:00Z","as_of":null,"thumbs_down_at":null,"roles":["watches_repo"],"last":"mosuem review_requested 0h ago","stacked_on":null,"related":["PR dart-lang/tools#2866 '[boring] Bundle the prebuilt libraries in the published package': draft open, by mosuem, updated 4h ago, labels ['type-infra', 'package:boring']"],"body":"> [!NOTE]\n> This PR was generated by an AI coding agent (Jetski) on behalf of @mosuem.\n\nSupply-chain hardening for `package:boring`'s CI. None of it depends on how the prebuilt libraries are distributed. This is the first PR in a stack; #2866 (bundling the libraries in the published package) builds on it.\n\n- **NASM:** replaces `ilammy/setup-nasm`, which downloads NASM from a mutable branch of its repository without checking the download, with a local composite action, `.github/actions/setup-nasm`. It downloads NASM 2.16.01 directly from nasm.us and verifies a pinned SHA-256 (matching Scoop's manifest). It's used in `boring.yaml` and in `boring_binaries.yaml`, which builds the released Windows libraries.\n- **macOS Linux cross-toolchain:** replaces the unpinnable `brew install messense/macos-cross-toolchains/...` tap in the `test` job of `boring.yaml` with a direct download of the `v15.2.0` release tarball (arm64/x86_64) and a SHA-256 check, like the Windows cross-toolchain.\n- **`precompile` permissions:** `precompile` runs compilers and other build tools, so it no longer gets `id-token: write` / `attestations: write`. A new `attest` job, which only downloads the `binaries-*` artifacts, attests their provenance before `release` uploads them. `gh attestation verify <file> --repo dart-lang/tools` keeps working.","timeline":[{"who":"Moritz","bot":false,"at":"2026-11-18 09:24","ago":"4h ago","what":"pushed commit a43f527 '[boring] Pin NASM and the macOS cross-toolchain, and attest in a separate job'","text":""},{"who":"mosuem","bot":false,"at":"2026-11-18 09:25","ago":"4h ago","what":"opened this PR","text":""},{"who":"mosuem","bot":false,"at":"2026-11-18 09:25","ago":"4h ago","what":"review_requested dart-ecosystem-team","text":""},{"who":"github-actions[bot]","bot":true,"at":"2026-11-18 09:25","ago":"4h ago","what":"labeled 'type-infra'","text":""},{"who":"gemini-code-assist[bot]","bot":true,"at":"2026-11-18 09:26","ago":"4h ago","what":"reviewed [COMMENTED]","text":"## Code Review\n\nThis pull request introduces a new GitHub Action to set up NASM on Windows by downloading it, verifying its SHA-256 checksum, and adding it to the path. A review comment suggests passing the file path directly to `sha256sum` instead of using stdin redirection (`<`) to prevent potential CRLF translation issues on Windows."},{"who":"gemini-code-assist[bot]","bot":true,"at":"2026-11-18 09:26","ago":"4h ago","what":"left inline review comment on .github/actions/setup-nasm/action.yml","text":"![medium](https://www.gstatic.com/codereviewagent/medium-priority.svg)\n\nAvoid redirecting binary files to `stdin` using `<` on Windows, as some environments or tool configurations can default to text mode for `stdin`, potentially leading to CRLF translation or premature EOF (e.g., if the binary contains `0x1A`). Passing the file path directly to `sha256sum` is safer and more robust.\n\n```yaml\n        actual=\"$(sha256sum \"$RUNNER_TEMP/nasm.zip\" | cut -d' ' -f1)\"\n```"},{"who":"github-actions[bot]","bot":true,"at":"2026-11-18 09:26","ago":"4h ago","what":"commented","text":"## PR Health\n\n\n<details>\n<summary>\n<strong>Publish<\/strong> :heavy_check_mark:\n<\/summary>\n\n| Package | Version | Status | Publish tag (post-merge) |\n| :--- | ---: | :--- | ---: |\n| package:boring | 0.5.0 | **ready to publish** | [`boring-v0.5.0`](https://github.com/dart-lang/tools/releases/new?tag=boring-v0.5.0&title=package%3Aboring+v0.5.0&body=-+%2A%2ABreaking%2A%2A s_of":null,"thumbs_down_at":null,"roles":["reviewer","watches_repo"],"last":"dcharkes left inline review comment (reply) 0h ago","stacked_on":null,"related":["PR dart-lang/tools#2892 '[boring] Bind BN_ULONG as UintPtr': merged, by mosuem, updated 12h ago, labels ['package:boring']","PR google/webcrypto.dart#424 'ci: add ASan coverage for hook-built native assets': merged, by HamdaanAliQuatil, updated 31d ago","PR google/webcrypto.dart#429 'fix: track native build configuration and include inputs': merged, by harrshita123, updated 40d ago"],"body":"> [!NOTE]\n> This PR was generated by an AI coding agent (Jetski) on behalf of @mosuem.\n\n> [!IMPORTANT]\n> Stacked on #2892, which is its base branch. The workflows only run for pull requests into `main`, so CI runs once #2892 lands and GitHub retargets this PR.\n\nSecond of a stack of three `package:boring` fixes:\n\n1. #2892: bind `BN_ULONG` as `UintPtr`\n2. **This PR**: compile with `OPENSSL_SMALL` and the sanitizer of the Dart runtime\n3. Run the prebuilt Linux libraries on glibc 2.28, and detect other C libraries\n\n---\n\n### `OPENSSL_SMALL`\n\n`package:webcrypto` compiled BoringSSL with `OPENSSL_SMALL`. It mainly shrinks the precomputed P-256 tables, which every application that uses ECDSA or ECDH needs, so tree-shaking can't remove them. I measured webcrypto's full test suite as a tree-shaken AOT build (`dart build cli`) on Linux x64, with BoringSSL built from source each way:\n\n| | without | with `OPENSSL_SMALL` |\n|---|---|---|\n| tree-shaken `libbssl_dart.so` | 1.12 MB | 0.91 MB (?19%) |\n| untree-shaken `libbssl_dart.so` | 2.98 MB | 2.72 MB (?9%) |\n| ECDSA P-256 sign ?2000 | 52 ms | 108 ms |\n| ECDH P-256 derive ?2000 | 105 ms | 148 ms |\n| AES-256-GCM, 200 MiB | 162 ms | 152 ms |\n\nThat's about 50 ?s per P-256 signature, which is fine for both apps and servers. This applies to every target, so `fetch` and `checkout` keep building the same library. All 1520 webcrypto tests pass with either build.\n\n### Sanitizers\n\nThe build hook ignored `input.config.code.sanitizer`. So `dart test -p vm-asan` loaded uninstrumented BoringSSL, and `package:webcrypto`'s ASan CI job (google/webcrypto.dart#424) no longer checks BoringSSL. Now, like webcrypto's old build hook:\n\n- With a sanitizer, the `checkout` build compiles with Clang and `-fsanitize=address|memory|thread`, via `BSSL_DART_SANITIZER` in `src/CMakeLists.txt`.\n- The `fetch` build mode builds from source in that case, because the prebuilt libraries aren't instrumented. This doesn't contradict \"`fetch` fails instead of falling back to CMake\": that's about missing or failed downloads, while here no prebuilt library can work.\n- A new `asan` CI job runs `test/boring_test.dart` with `-p vm-asan`. Locally, it passes, and the built library references 41 `__asan_*` symbols, compared with none without a sanitizer.\n\n### `.inc` build inputs\n\nBoringSSL has 91 `.inc` files, such as `crypto/fipsmodule/*.cc.inc`, which the `checkout` build didn't list as dependencies, so it didn't rebuild when they changed. google/webcrypto.dart#429 fixed the same issue.\n\n### Testing\n\nLocally on Linux x64: `dart test` (34 passed, 5 skipped), the Wycheproof conformance tests, and `dart test -c cli -p vm-asan test/boring_test.dart`.\n\nChanging `src/CMakeLists.txt` makes the pinned prebuilt libraries stale until the `package:boring binaries` workflow pins new ones after this lands. The `analyze` job only warns about this while the version is `-wip`.","timeline":[{"who":"mosuem","bot":false,"at":"2026-11-17 15:13","ago":"1d ago","what":"opened this PR","text":""},{"who":"mosuem","bot":false,"at":"2026-11-17 15:13","ago":"1d ago","what":"review_requested dart-ecosystem-team","text":""},{"who":"github-actions[bot]","bot":true,"at":"2026-11-17 15:13","ago":"1d ago","what":"labeled 'type-infra'","text":""},{"who":"github-actions[bot]","bot":true,"at":"2026-11-17 15:13","ago":"1d ago","what":"labeled 'package:boring'","text":""},{"who":"gemini-code-assist[bot]","bot":true,"at":"2026-11-17 15:15","ago":"1d ago","what":"reviewed [COMMENTED]","text":"## Code Review\n\nThis pull request adds support for compiling BoringSSL with sanitizers (ASan, MSan, or TSan) when the Dart runtime uses them, which automatically triggers building from source. It also enables the 'OPENSSL_SMALL' compilation flag to reduce the tree-shaken library size at the cost of slower P-256 operations. The review feedback suggests simplifying the build mode override logic in 'pkgs/boring/hook/build.dart' to leverage Dart's flow analysis and eliminate the need for a null assertion operator on the sanitizer variable."},{"who":"gemini-code-assist[bot]","bot":true,"at":"2026-11-17 15:15","ago":"1d ago","what":"left inline review comment on pkgs/boring/hook/build.dart","text":"![medium](https://www.gstatic.com/codereviewagent/medium-priority.svg)\n\nThis logic can be simplified by using a mutable `buildMode` variable and performing the check directly. This allows Dart's flow analysis to promote `sanitizer` to a non-nullable type, eliminating the need for the null assertion operator (`!`).\n\n```dart\n    var buildMode = buildOptions.buildMode;\n    if (sanitizer != null && buildMode == BuildModeEnum.fetch) {\n      buildMode = BuildModeEnum.checkout;\n      stdout.writeln(\n        'boring: building from source, because there are no prebuilt '\n        'libraries with the ${sanitizer.name} sanitizer.',\n      );\n    }\n```\n\n<details>\n<summary>References<\/summary>\n\n1. Avoid adding redundant null checks when preconditions or surrounding logic already guarantee that the property or variable is non-null.\n<\/details>"},{"who":"mosuem","bot":false,"at":"2026-11-17 15:24","ago":"1d ago","what":"added to stack","text":""},{"who":"Moritz","bot":false,"at":"2026-11-18 08:38","ago":"12h ago","what":"pushed commit a000c1c '[boring] Compile with OPENSSL_SMALL and the sanitizer of the Dart runtime'","text":""},{"who":"github-actions[bot]","bot":true,"a mment (reply) on pkgs/boring/src/CMakeLists.txt","text":"When compiling from source, you could make it configurable via a user-define.\r\nFor precompiled, every combination of options would lead to an exponential set of predefined dylibs, so we have to chose a default."}],"note":"","prd_note":"","set":null,"source":"production","draft":"review","why":"","settings_note":"additional repositories: dart-lang/tools (“I'm only interested in `package:boring`”), dart-lang/http (“I am responsible for all packages in this repo, expect `package:http2`. But if I am assigned, mentioned, etc. in an issue or PR related to `package:http2` then rank it as you would any other package in dart-lang/http.”); collaborators: kevmoo, natebosch, sigurdm, mosuem","agents":[{"who":"Gemini","step":"respond","text":"Reply to mosuem and dcharkes' comments on the build hook and sanitizer design choices."},{"who":"Basic","step":"review","text":""},{"who":"Claude","step":"review","text":"Re-review #2893: reply on the open threads (sanitizer fallback vs failing the hook, OPENSSL_SMALL default/user-define, split changelog) and note the PR is stacked on #2892, now merged, so it needs a retarget/rebase."},{"who":"OpenAI","step":"review","text":"Re-review the replies about sanitizer toolchain failures and clarify the requested split from OPENSSL_SMALL."}]},{"id":"dart-lang/sdk#60881","url":"https://github.com/dart-lang/sdk/issues/60881","title":"Allow dart:io SecurityContext to override BoringSSL Extended Key Usage (EKU) check for mTLS","kind":"Issue","state":"open","author":"cpswan","labels":["area-vm","library-_http","triaged"],"assignees":["brianquinlan"],"requested":[],"repo_desc":"The Dart SDK, including the VM, JS and Wasm compilers, analysis, core libraries, and more.","created":"17mo ago","updated":"17mo ago","snapshot":"2026-11-06T17:54:57Z","as_of":null,"thumbs_down_at":null,"roles":["assignee","mentioned"],"last":"a-siva assigned 17mo ago","stacked_on":null,"related":[],"body":"When reporting an issue, please include:\n\n- Dart 3.8.1\n- Linux\n\n## Why is this needed?\n\nAt present TLS certificates issued by popular public Certificate Authorities (CAs) such as LetsEncrypt and ZeroSSL [1] come with Extended Key Usage (EKU) attributes for `Server Auth` and `Client Auth`. This means that services can present their certificates to each other for mutual transport layer security (mTLS) and all the relevant checks pass.\n\nThe Google Chrome team have announced a change in their CA policy to [Promote use of Dedicated TLS Server Authentication PKI Hierarchies](https://googlechrome.github.io/chromerootprogram/#32-promote-use-of-dedicated-tls-server-authentication-pki-hierarchies) that forces CAs to only issue certs with the `Server Auth` EKU (id-kp-serverAuth). As a result LetsEncrypt have [announced \"Ending TLS Client Authentication Certificate Support in 2026\"](https://letsencrypt.org/2025/05/14/ending-tls-client-authentication/). Meaning that certificates will no longer have the Client Auth EKU from 13 May 2026. It's reasonable to expect that other CAs will follow a similar process, and in a similar time frame to meet the Chrome policy deadline of 15 June 2026.\n\n## What happens in Dart today?\n\nWhen the client side of an mTLS connection (between two peer services) presents a certificate that only contains the `Server Auth` EKU a HandshakeException is thrown:\n\n```log\nHandshakeException: Handshake error in server (OS Error:\n        CERTIFICATE_VERIFY_FAILED: unsupported certificate purpose(handshake.cc:295))\n```\n\nThis happens irrespective of whether `requireClientCertificate:` is set to `true` or `false`. When `requestClientCertificate: true` and a client cert is presented then BoringSSL checks the EKUs, and if it just finds `Server Auth` it throws an error [2].\n\nThere is no way to override this behaviour as the exception is thrown before the SecureSocket object is returned.\n\n## Requested change\n\nBy setting `requireClientEKUVerify: false` it should be possible for the securityContext object to pass a flag to BoringSSL such that the EKU check is not required.\n\n## Example code\n\nThe [cpswan/dart_mtls](https://github.com/cpswan/dart_mtls/) repo contains an example `tls_socket_server.dart` and `tls_socket_client.dart` implementation along with (self signed) certificates with various EKUs:\n\n* client.crt: `Server Auth` and `Client Auth`\n* client.noext.crt: none\n* client.web.crt: `Server Auth`\n\nThe service address `atsign.test` is expected to resolve to localhost (127.0.0.1).\n\n### Notes\n\n[1] Google's own public CA defaults to issuing certificates with just the `Server Auth` EKU, but (for now) it's trivial to modify the Certificate Signing Request (CSR) to get a certificate that also has the `Client Auth` EKU.\n[2] This check isn't super rigorous, so if a cert with no EKUs is presented that passes the test. So it's not precisely that it's ensuring that `Client Auth` is present but rather that if there are EKUs then `Client Auth` must be one of them.","timeline":[{"who":"cpswan","bot":false,"at":"2025-06-10 11:02","ago":"17mo ago","what":"opened this issue","text":""},{"who":"devoncarew","bot":false,"at":"2025-06-10 16:07","ago":"17mo ago","what":"labeled 'area-vm'","text":""},{"who":"devoncarew","bot":false,"at":"2025-06-10 16:08","ago":"17mo ago","what":"labeled 'library-_http'","text":""},{"who":"devoncarew","bot":false,"at":"2025-06-10 16:08","ago":"17mo ago","what":"commented","text":"cc @brianquinlan (or, whoever is most knowledgable about our use of BoringSSL)"},{"who":"a-siva","bot":false,"at":"2025-06-11 20:40","ago":"17mo ago","what":"labeled 'triaged'","text":""},{"who":"a-siva","bot":false,"at":"2025-06-11 20:40","ago":"17mo ago","what":"assigned brianquinlan","text":""}],"note":"","prd_note":"","set":null,"source":"production","draft":"backlog","why":"","settings_note":"additional repositories: dart-lang/tools (“I'm only interested in `package:boring`”), dart-lang/http (“I am responsible for all packages in this repo, expect `package:http2`. But if I am assigned, mentioned, etc. in an issue or PR related to `package:http2` then rank it as you would any other package in dart-lang/http.”); collaborators: kevmoo, natebosch, sigurdm, mosuem","agents":[{"who":"Gemini","step":"todo","text":"Evaluate the mTLS EKU verification request in dart:io / BoringSSL, then fix or reassign."},{"who":"Basic","step":"todo","text":""},{"who":"Claude","step":"todo","text":"Decide whether to implement an option on SecurityContext to relax the client EKU check, or unassign myself, and comment on the issue either way."},{"who":"OpenAI","step":"todo","text":"Assess the mTLS EKU compatibility impact and determine a secure resolution for the requested SecurityContext override."}]},{"id":"canonical/stdlibc.dart#152","url":"https://github.com/canonical/stdlibc.dart/issues/152","title":"Use a Ubuntu 24.0.4 for ffigen workflows","kind":"Issue","state":"open","author":"brianquinlan","labels":[],"assignees":[],"requested":[],"repo_desc":"Standard C Library - FFI bindings to the GNU C Library on Linux, and the BSD C Library on macOS.","created":"19mo ago","updated":"19mo ago","snapshot":"2026-11-06T18:00:55Z","as_of":null,"thumbs_down_at":null,"roles":["author","mentioned"],"last":"robert-ancell commented 19mo ago","stacked_on":null,"related":["PR canonical/stdlibc.dart#150 'Update dependencies': draft open, by brianquinlan, updated 19mo ago"],"body":"The gnu ffigen workflows use Ubuntu 20.0.4, which will soon be removed by Github because they will be out of LTS.\n\nMoving to Ubuntu 24.0.4 wasn't as straightforward ([WIP PR](https://github.com/canonical/stdlibc.dart/pull/150) ) as I thought because the `__*stat` symbols were removed from `sys/stat.h`. Would it be reasonable to just define those calls directly (using `external`) in `gnu/stat.dart`?","timeline":[{"who":"brianquinlan","bot":false,"at":"2025-04-03 22:21","ago":"19mo ago","what":"opened this issue","text":""},{"who":"rober "mentioned"],"last":"lrhn unlabeled 21mo ago","stacked_on":null,"related":[],"body":"Hi,\r\n\r\nWriting here because I'm not sure the right place and this seems to involve dart:io (though that isn't necessarily the cause of this issue).\r\n\r\n### Issue background \r\n\r\n~5 times in the last month, a recurring network call in my deployed flutter Windows application (on multiple different client computers) has begun to throw the following error when connecting to a particular API:\r\n```\r\nHandshakeException: Handshake error in client (OS Error: \r\n\tBLOCK_TYPE_IS_NOT_01(../../third_party/boringssl/src/crypto/fipsmodule/rsa/padding.c:108)\r\n\tPADDING_CHECK_FAILED(../../third_party/boringssl/src/crypto/fipsmodule/rsa/rsa_impl.c:676)\r\n\tpublic key routines(../../third_party/boringssl/src/crypto/x509/a_verify.c:108)\r\n\tCERTIFICATE_VERIFY_FAILED: certificate signature failure(../../third_party/boringssl/src/ssl/handshake.cc:393))\r\n```\r\nThis is the code in the dart sdk that invokes the boringssl validation\r\n```\r\nsecure_socket_patch.dart in _SecureFilterImpl._handshake at line 99\r\n```\r\nThe issue occurs for the duration of the lifespan of the application. Force quitting the application and restarting the machine both successfully resolve the issue; otherwise the recurring process continues to fail with this error. The same exception occurs in multiple places in my application where I call this endpoint. Here's one such example (running every 60 seconds) that is raising this exception (which happens whether I a `/health` endpoint from this healthcheck code or from the more important application code.:\r\n\r\n```\r\n  final client = HttpClient();\r\n  try {\r\n    final req = await client.getUrl(host);\r\n    final res = await req.close();\r\n    if (res.statusCode != 200) {\r\n      throw Exception('Unexpected status code: ${res.statusCode}. Reason: ${res.reasonPhrase}.');\r\n    }\r\n  } on Exception catch (e, stackTrace) {\r\n    // send to logging endpoint\r\n  } finally {\r\n    client.close(force: true);\r\n  }\r\n```\r\n\r\n### Why this might be a dart or flutter issue\r\nI initially assumed there was a network failure or a certificate issue and have worked to disprove these theories. Here's what I've learned:\r\n* This issue only happens for some clients, some of the time, while other clients have no problem\r\n* This issue only happens to this one api - healthchecks to 8.8.8.8 succeed (thanks google)\r\n* The issue happens whether I instantiate a new HttpClient or use a Dio singleton\r\n* This issue only happens when connecting over HTTPS to this endpoint - http healthchecks to my endpoint succeed\r\n* While the instance of the app is impaired, https Requests from the rest of the OS to this endpoint succeed - curl and browser requests both succeed\r\n* Packet sniffing indicates that the client is sending FIN packets before the TLS connection is complete and application data is exchanged: I have generated a pcap file while the app is impaired and have found that at various stages of the TLS handshake the client has sent a FIN packet before the TLS handshake is done - sometimes between Server Hello and Server Key Exchange, sometimes after Server Key Exchange. \r\n\r\n### Reproduction steps\r\nUnfortunately I haven't been able to reproduce this issue quite yet. If you have any suggestions I'd be very happy to try them.\r\n\r\n### Specs\r\nWindows 10 (both my dev machine and the affected clients)\r\nDart version: Dart version: 3.0.6 (stable)\r\nFlutter 3.10.6 (stable)\r\n\r\nI'm at a bit of a loss and would appreciate any ideas to try to understand the source of this error. Thanks!","timeline":[{"who":"aweinber","bot":false,"at":"2024-02-07 19:34","ago":"2.7y ago","what":"opened this issue","text":""},{"who":"lrhn","bot":false,"at":"2024-02-08 16:37","ago":"2.7y ago","what":"labeled 'area-library'","text":""},{"who":"lrhn","bot":false,"at":"2024-02-08 16:37","ago":"2.7y ago","what":"labeled 'library-io'","text": Connection);\r\n  }\r\n\r\n//// Create the Connection\r\nFuture<void> ConnectWS() async{\r\n\r\n    print(\"Connect WS\");\r\n\r\n    //// Do not if already connected\r\n    if  (\r\n            _webSocket != null &&\r\n            (\r\n                _webSocket.readyState == WebSocket.open ||\r\n                _webSocket.readyState == WebSocket.connecting\r\n            )\r\n        ){\r\n        print(\"WS already connected or connecting\");\r\n        return;\r\n    }\r\n\r\n    Future<WebSocket> futureWebSocket = WebSocket.connect( 'ws://$_host:$_port' );\r\n\r\n    futureWebSocket.then( ( WebSocket webSocket ){\r\n        _webSocket = webSocket;\r\n\r\n        webSocket.listen(\r\n          OnWSData,\r\n\r\n          onError: ( error ){\r\n\r\n            print( \"There was an error.\" );\r\n            print( error );\r\n\r\n          },\r\n\r\n          onDone: (){\r\n            print( \"WS Closed\" );\r\n\r\n            _webSocket = null;\r\n          },\r\n\r\n          cancelOnError: true,\r\n        );\r\n    });\r\n  }\r\n```\r\n\r\nI use this the detect if the connection is made. If there is a disconnection, I set the _websocket to \"null\" then periodically try to reconnect back.\r\n\r\nI hope it helps someone."},{"who":"michael-joseph-payne","bot":false,"at":"2024-08-15 20:51","ago":"2.2y ago","what":"commented","text":"@brianquinlan I'm struggling with this too (both WebSocket and CupertinoWebSocket)"},{"who":"mosuem","bot":false,"at":"2025-01-22 16:05","ago":"21mo ago","what":"labeled 'package:web_socket_channel'","text":""}],"note":"","prd_note":"","set":null,"source":"production","draft":"backlog","why":"","settings_note":"additional repositories: dart-lang/tools (“I'm only interested in `package:boring`”), dart-lang/http (“I am responsible for all packages in this repo, expect `package:http2`. But if I am assigned, mentioned, etc. in an issue or PR related to `package:http2` then rank it as you would any other package in dart-lang/http.”); col d":"dart-lang/sdk#60768","url":"https://github.com/dart-lang/sdk/issues/60768","title":"HttpServer: we have default headers that are set, even when against RFC","kind":"Issue","state":"open","author":"kevmoo","labels":["area-vm","library-io","triaged"],"assignees":["brianquinlan"],"requested":[],"repo_desc":"The Dart SDK, including the VM, JS and Wasm compilers, analysis, core libraries, and more.","created":"18mo ago","updated":"16mo ago","snapshot":"2026-11-06T17:54:55Z","as_of":null,"thumbs_down_at":null,"roles":["assignee","commenter","mentioned"],"last":"kevmoo commented 16mo ago","stacked_on":null,"related":[],"body":"https://github.com/dart-lang/sdk/blob/f9278779f770cf87b0cbbd7bd4d1fe127d6fe69f/sdk/lib/_http/http_impl.dart#L3385\n\nThe default response headers set a content-type even in cases when they shouldn't.\n\nSee RFC 9110\n\nSuggestion: drop the default content header if the body is empty?","timeline":[{"who":"kevmoo","bot":false,"at":"2025-05-21 00:33","ago":"18mo ago","what":"opened this issue","text":""},{"who":"kevmoo","bot":false,"at":"2025-05-21 00:33","ago":"18mo ago","what":"labeled 'library-io'","text":""},{"who":"lrhn","bot":false,"at":"2025-05-21 12:25","ago":"18mo ago","what":"labeled 'area-vm'","text":""},{"who":"a-siva","bot":false,"at":"2025-05-21 20:37","ago":"18mo ago","what":"commented","text":"//cc @brianquinlan"},{"who":"a-siva","bot":false,"at":"2025-05-21 20:38","ago":"18mo ago","what":"assigned brianquinlan","text":""},{"who":"a-siva","bot":false,"at":"2025-05-21 20:38","ago":"18mo ago","what":"labeled 'triaged'","text":""},{"who":"brianquinlan","bot":false,"at":"2025-06-24 23:36","ago":"16mo ago","what":"commented","text":"What part of RFC-9110 are you referring to. [8.3](https://www.rfc-editor.org/rfc/rfc9110.html#field.content-type) says:\n\n> A sender that generates a message containing content SHOULD generate a Content-Type header field in that message unless the intended media type of the enclosed representation is unknown to the sender.\n\nAFAIK, there is no advice when no body is sent.\n\nFor the linked flutter issue, should Flutter be setting the content-type explicitly?"},{"who":"kevmoo","bot":false,"at":"2025-06-24 23:39","ago":"16mo ago","what":"commented","text":"I'd read that we should do less. There is no SHOULD do content header if there is no content."}],"note":"","prd_note":"","set":null,"source":"production","draft":"backlog","why":"","settings_note":"additional repositories: dart-lang/tools (“I'm only interested in `package:boring`”), dart-lang/http (“I am responsible for all packages in this repo, expect `package:http2`. But if I am assigned, mentioned, etc. in an issue or PR related to `package:http2` then rank it as you would any other package in dart-lang/http.”); collaborators: kevmoo, natebosch, sigurdm, mosuem","agents":[{"who":"Gemini","step":"backlog","text":"Decide whether to change HttpServer default Content-Type behavior or unassign myself."},{"who":"Basic","step":"respond","text":""},{"who":"Claude","step":"backlog","text":"Decide whether to drop the default Content-Type for empty bodies in dart:io HttpServer, or unassign/close if not worth changing."},{"who":"OpenAI","step":"respond","text":"Reply to kevmoo with a decision on empty-response Content-Type defaults and whether to pursue a change."}]},{"id":"dart-lang/sdk#51528","url":"https://github.com/dart-lang/sdk/issues/51528","title":"HttpClientRequest sends headers with lower case key and out of order.","kind":"Issue","state":"open","author":"sososdk","labels":["area-core-library","library-_http"],"assignees":[],"requested":[],"repo_desc":"The Dart SDK, including the VM, JS and Wasm compilers, analysis, core libraries, and more.","created":"3.7y ago","updated":"22mo ago","snapshot":"2026-11-06T18:01:58Z","as_of":null,"thumbs_down_at":null,"roles":["mentioned"],"last":"fyxtc commented 22mo ago","stacked_on":null,"related":[],"body":"The server requires the http headers to be ordered and case-sensitive, but Dart cannot do this.\r\n\r\nFor example, in the following code, the key of the request headers received by the server is all lowercase, and the order is also disrupted(possibly `{'b ':'b', 'd': 'd', 'c': 'c', 'a': 'a',}`).\r\n\r\n```dart\r\n    final client = HttpClient();\r\n    final request = await client.getUrl(Uri.parse(url));\r\n    final headers = {\r\n      'A': 'a',\r\n      'B': 'b',\r\n      'C': 'c',\r\n      'D': 'd',\r\n    };\r\n    headers.forEach((key, value) {\r\n      request.headers.set(key, value);\r\n    });\r\n```","timeline":[{"who":"sososdk","bot":false,"at":"2023-02-24 21:12","ago":"3.7y ago","what":"opened this issue","text":""},{"who":"mraleph","bot":false,"at":"2023-02-26 09:22","ago":"3.7y ago","what":"commented","text":"> The server requires the http headers to be ordered and case-sensitive, but Dart cannot do this.\r\n\r\nThat's the bug in the server. Refer to HTTP/1.1 specification. RFC 2616 section 4.2 Message Headers says:\r\n\r\n> Field names are case-insensitive.\r\n> [...]\r\n> The order in which header fields with differing field names are received is not significant.\r\n\r\nI don't know if supporting non-compliant servers which don't follow RFC 2616 is a goal or not for our builtin client. \r\n\r\nI defer to @brianquinlan to make the call."},{"who":"mraleph","bot":false,"at":"2023-02-26 09:22","ago":"3.7y ago","what":"labeled 'area-library'","text":""},{"who":"mraleph","bot":false,"at":"2023-02-26 09:23","ago":"3.7y ago","what":"labeled 'library-_http'","text":""},{"who":"sososdk","bot":false,"at":"2023-02-26 15:13","ago":"3.7y ago","what":"commented","text":"> That's the bug in the server. Refer to HTTP/1.1 specification. RFC 2616 section 4.2 Message Headers says:\r\n\r\nI think Dart as a development language should not limit this. This is a matter of framework."},{"who":"lrhn","bot":false,"at":"2023-02-26 16:54","ago":"3.7y ago","what":"commented","text":"If we can allow people to control the header precisely, even if it requires going through a more cumbersome API than the default, I think it is a reasonable feature.\r\n\r\nYou may want to build specific headers to test your server code, and not only test it with the headers that `dart:io` sends by default.\r\n\r\nIt'd also be reasonable to defer to a secondary library for something like that, like `package:http` or a new `package:custom_http` (or whatever, naming is hard). It doesn't have to be part of the default implementation unless those other packages need it. \r\n\r\nThe big question then becomes who should implement it, and what priority it deserves."},{"who":"tinyc0der","bot":false,"at":"2024-06-17 06:51","ago":"2.4y ago","what":"commented","text":"I think the behind reason is that it is using HashMap instead of LinkedHashMap\r\nhttps://github.com/dart-lang/sdk/blob/51ecf21356df5043f42270915aa22b76857941cd/sdk/lib/_http/http_headers.dart#L29.\r\n@mraleph can you fix that to prevent them?"},{"who":"fyxtc","bot":false,"at":"2024-12-23 10:34","ago":"22mo ago","what":"commented","text":"@tinyc0der Hi, how did you solve it? I saw the merge was closed"}],"note":"","prd_note":"","set":null,"source":"production","draft":"respond","why":"","settings_note":"additional repositories: dart-lang/tools (“I'm only interested in `package:boring`”), dart-lang/http (“I am responsible for all packages in this repo, expect `package:http2`. But if I am assigned, mentioned, etc. in an issue or PR related to `package:http2` then rank it as you would any other package in dart-lang/http.”); collaborators: kevmoo, natebosch, sigurdm, mosuem","agents":[{"who":"Gemini","step":"respond","text":"Reply to mraleph's question about whether dart:io HttpClient should support preserving header casing and ordering for non-compliant servers."},{"who":"Basic","step":"not_yours","text":""},{"who":"Claude","step":"backlog","text":"Decide whether dart:io HttpClient should support header casing/order control, then reply or close; the dart-lang/sdk repo isn't one I ow C disabled, the same request succeeds on the same network ? so the underlying network connectivity and standard DNS resolution are both functional. This points to QUIC-specific DNS behavior (possibly HTTPS RR / SVCB record lookups, or Cronet's built-in DNS resolver being activated only when QUIC is enabled) that fails when the cellular network's DNS configuration is not properly inherited by the background isolate.\n\n#### Potential investigation areas\n\n1. **QUIC-specific DNS resolution path.** The Android\n[`DnsOptions`](https://developer.android.com/develop/connectivity/cronet/reference/org/chromium/net/DnsOptions) docs explicitly state it is \"only relevant if `enableQuic` is enabled\" ? confirming that QUIC activates a different DNS code path. This likely involves Cronet's built-in resolver (for HTTPS RR / SVCB record lookups needed by QUIC) rather than the system resolver. The built-in resolver may not inherit the cellular network's DNS server configuration in a WorkManager isolate, while the system resolver (used when QUIC is disabled) does.\n\n2. **Exposing `DnsOptions` in the Dart API.** The Android `DnsOptions` API exposes `useBuiltInDnsResolver`, `enableStaleDns`, and `persistHostCache` ? none of which are currently surfaced in the Dart `CronetEngine.build()` API. Exposing `useBuiltInDnsResolver: false` would allow falling back to the system resolver even with QUIC enabled, which based on our testing would resolve the issue.\n\n3. **Stale DNS / persistent host cache.** `DnsOptions` supports `persistHostCache` and `enableStaleDns`. If the Dart API exposed these with a shared `storagePath`, WorkManager isolates could resolve from a DNS cache populated by the foreground engine ? avoiding the need for a live DNS query from the built-in resolver entirely.\n\n4. **Network binding in background isolates.** Even if the built-in resolver is required for QUIC, it may simply need to be bound to the active cellular network. Android's [`ConnectivityManager.bindProcessToNetwork()` (https://developer.android.com/reference/android/net/ConnectivityManager#bindProcessToNetwork(android.net.Network)) called before building the `CronetEngine` could ensure the resolver uses the correct network. This could be handled internally by the plugin when it detects it's running outside the main isolate.\n\n#### Environment\n- `cronet_http`: **1.8.0** (previously reproduced on 1.7.0)\n- Flutter: 3.29.x\n- Android 10+ (multiple devices)\n- Backend: Cloudflare (HTTP/3 enabled)\n- WorkManager via `package:workmanager` ^0.9.0\n\n```\n01-08 16:20:13.420  1616 13797 D ConnectivityService: requestNetwork for uid/pid:10399/13492 activeRequest: null callbackRequest: 8667 [NetworkRequest [ REQUEST id=8668, [ Capabilities: INTERNET&NOT_RESTRICTED&TRUSTED&NOT_VCN_MANAGED&NOT_BANDWIDTH_CONSTRAINED Uid: 10399 RequestorUid: 10399 RequestorPkg: com.myapp.myapp UnderlyingNetworks: Null] ]] callback flags: 0 order: 2147483647 isUidTracked: false declaredMethods: AVAIL|LOST|NC\n01-08 16:20:13.439  1616  2107 D ConnectivityService: NetReassign [8668 : null ? 131] [c 0] [a 5] [i 12]\n01-08 16:20:13.454 13492 13520 D WM-Processor: Processor: processing WorkGenerationalId(workSpecId=fc71ebf8-cdab-4aa7-a4f2-cecfcdcf5d4f, generation=0)\n01-08 16:20:13.471 13492 13492 D WM-WorkerWrapper: Starting work for dev.fluttercommunity.workmanager.BackgroundWorker\n01-08 16:20:13.549 13492 19651 I flutter : [IMPORTANT:flutter/shell/platform/android/android_context_vk_impeller.cc(62)] Using the Impeller rendering backend (Vulkan).\n01-08 16:20:16.025 13492 13492 I flutter : [WorkManager] Task started: com.myapp.periodicSync\n01-08 16:20:16.043 13492 13492 I flutter : [WorkManager] Starting periodic sync...\n01-08 16:20:16.428 13492 13492 I flutter : ???????????????????????????????????????????????????????????????\n01-08 16:20:16.429 13492 13492 I flutter : ? ? HTTP Client Configuration\n01-08 16:20:16.429 13492 13492 I flutter : ??????????????????????????????????????????????????????? :"mosuem","state":"open","reviews":"none","requested_reviewers":[]},{"pr":"#2108","title":"fix(http2): harden Http2Client request/response validation and unread body backpressure","author":"mosuem","state":"open","reviews":"none","requested_reviewers":[]},{"pr":"#2107","title":"fix(http2): harden HPACK decoding, CONTINUATION framing, and HTTP/2 header validation","author":"mosuem","state":"open","reviews":"none","requested_reviewers":[]},{"pr":"#2106","title":"fix(http2): propagate connection backpressure and bound dribble/WINDOW_UPDATE cost","author":"mosuem","state":"open","reviews":"none","requested_reviewers":[]}],"related":["PR dart-lang/http#1999 'feat(http2): configurable receive windows and frame size': merged, by banglcb, updated 41d ago, labels ['package:http2']","PR dart-lang/http#2029 'fix(http2): Http2Client applies response-body backpressure to the HTTP/2 stream and uses 4 MiB / 16 MiB receive windows': merged, by mosuem, updated 26d ago, labels ['package:http2']","PR dart-lang/http#2031 'chore(http2): prepare to release 3.2.0': merged, by mosuem, updated 2d ago, labels ['package:http2']","PR dart-lang/http#2045 \"fix(http2): Http2Client disables Nagle's algorithm and grows each stream's receive window from 256 KiB\": merged, by mosuem, updated 2d ago, labels ['package:http2']","PR dart-lang/http#2099 'chore(http2): prepare to release 3.2.2': open, by mosuem, updated 0h ago, labels ['package:http2']","PR dart-lang/http#2111 'chore(http2): prepare to release 3.2.1': open, by mosuem, updated 0h ago, labels ['package:http2']","PR dart-lang/http#2113 'fix(http2): only arm the inbound header block timer while a field block is incomplete': open, by mosuem, updated 0h ago, labels ['package:http2']"],"body":"> [!NOTE]\n> This PR was generated by an AI coding agent (Jetski) on behalf of @mosuem.\n\n_Reopened from #2045 after reordering performance changes behind the `3.2.1` security release (see prior review comments on #2045: [comment 1](https://github.com/dart-lang/http/pull/2045#discussion_r4427012774), [comment 2](https://github.com/dart-lang/http/pull/2045#discussion_r4427024219))._\n\n### Summary\n\nFixes two `Http2Client` performance regressions against 3.1.0 introduced in 3.2.0. They were found with [`package:http_client_benchmarks`](https://github.com/brianquinlan/http_client_benchmarks) and bisected over every `pkgs/http2` commit since `http2-v3.1.0`:\n\n| Scenario | 3.1.0 | `master` / #2031 | Introduced by | This PR |\n| --- | --- | --- | --- | --- |\n| `download-cancel`: cancel a response after 256 KiB, then make one more request (median, lower is better) | 0.97 ms | 26.3 ms | `be2b51f` #2029 (fixed 4 MiB stream window) | 4.4?4.5 ms |\n| `upload-1mib-sequential`: 20 sequential 1 MiB uploads (higher is better) | 27.7 MB/s | 20.7 MB/s | `23f8574` #1999 (1 MiB DATA frames, together with Nagle) | 109?115 MB/s |\n\nAll numbers are from a Linux Cloudtop (x64, 48 vCPU), loopback, Dart 3.14.0-dev (JIT), 7 trials + 2 warmup.\n\n1. **A cancelled response held up the connection.** With #2029's fixed 4 MiB stream window, the server has sent up to 4 MiB of a response before the client's `RST_STREAM` reaches it (the benchmark measured at least 1.8 MiB unread). TCP can't skip bytes, so all of that must be received, decrypted and discarded before the response to the next request on the same connection. That costs about 25 ms here, where Dart's TLS manages about 100 MB/s. On an emulated 100 ms / 200 Mbit/s link it added about 55 ms to the next request. On a slow mobile link it would be far worse, because there the drain is bounded by the link's bandwidth.\n2. **`Http2Client` never disabled Nagle's algorithm** (see the section below). Since #1999, `Http2Client` honours the peer's `SETTINGS_MAX_FRAME_SIZE`, so an upload to a Go server (1 MiB max frame size) goes out as a single 1 MiB DATA frame. The short tail of that write is then held back by Nagle until the earlier segments are acknowledged. Meanwhile the server delays its acknowledgement (by 40 ms on Linux), because it can't do anything with the frame until the tail arrives. So nearly every upload paid that stall.\n\n### Changes\n\n- **`lib/src/http2_client.dart`**\n  - Sets `SocketOption.tcpNoDelay` on every connection, as `dart:io`'s `HttpClient` and `HttpServer` do.\n  - Each stream's receive window now starts at 256 KiB (`SETTINGS_INITIAL_WINDOW_SIZE`) instead of 4 MiB and grows up to 4 MiB as the body is read. The connection window stays at 16 MiB.\n- **`lib/src/flowcontrol/window_handler.dart`**\n  - `IncomingWindowHandler.stream` takes an optional `maxWindowSize`.\n  - When the handler sends a WINDOW_UPDATE (once half the window has been processed), it also adds the current window size to the increment, up to `maxWindowSize`, so the window doubles.\n  - Data only counts as processed while the stream's listener isn't paused, so the window only grows while the body is actually being read. Backpressure (#2029) still holds: a paused body holds at most the current window.\n- **`lib/src/connection.dart`, `lib/src/streams/stream_handler.dart`**\n  - Pass an internal `maxStreamWindowSize` from `ClientConnection` (not exported) to new streams.\n  - There is no public API change. `ClientTransportConnection.viaSocket` and `ServerTransportConnection` behave as before.\n- **`CHANGELOG.md`**\n  - Adds entries under `3.2.2-wip`.\n  - Adds an entry for `TCP_NODELAY`.\n\nNot changed: outgoing DATA frames still use the peer's `SETTINGS_MAX_FRAME_SIZE`. I also tried capping them at 16 KiB: with `TCP_NODELAY` it made `upload-large-buffered` 16% slower (122 vs 145 MB/s), so the 1 MiB frames from #1999 are fine once Nagle is off.\n\n### What `TCP_NODELAY` does, and why `Http2Client` should set it\n\n`TCP_NODELAY` is a socket option that turns off **Nagle's algorithm** ([RFC 896](https://www.rfc-editor.org/rfc/rfc896), [RFC 1122 ?4.2.3.4](https://www.rfc-editor.org/rfc/rfc1122#section-4.2.3.4)). Nagle is on by default for sockets that `dart:io` creates. While earlier data on a connection is unacknowledged, it makes the kernel hold back any write that doesn't fill a full TCP segment. The held data is sent once everything outstanding is acknowledged, or once enough has piled up to fill a segment. It was designed to stop interactive programs (telnet) from flooding networks with one-byte packets, and on its own it costs at most one round trip.\n\nThe problem is how it combines with **delayed acknowledgements** ([RFC 1122 ?4.2.3.2](https://www.rfc-editor.org/rfc/rfc1122#section-4.2.3.2)). A receiver may hold back its ACK, hoping to piggyback it on response data or to acknowledge two segments at once. Linux holds it for at least 40 ms, and other systems for up to 200 ms. Suppose the sender's last, short segment is waiting for an ACK, and the receiver's ACK is waiting for more data, or for its application to respond, which it can't do without that last segment. Then neither side moves until the delayed-ACK timer fires. This is the classic write-write-read stall.\n\nHTTP/2 hits this all the time, and much more than HTTP/1.1 does:\n\n- Almost every write ends in a short segment: a HEADERS frame, a WINDOW_UPDATE, a SETTINGS or PING ACK, an RST_STREAM, or the tail of a DATA frame.\n- Multiplexing puts every request on one connection. So when a new request is written, earlier data on that connection is usually still unacknowledged. With HTTP/1.1 and one request per connection, it usually isn't.\n\n**Should we set it? Yes:**\n\n- **Everyone else does.** `dart:io`'s own `HttpClient` and `HttpServer` call `socket.setOption(SocketOption.tcpNoDelay, true)` on every connection (`sdk/lib/_http/http_impl.dart`). Go's `net` package enables it for all TCP connections by default. curl has enabled it by default since 7.50.2. Without it, moving an app from `IOClient` to `Http2Client` adds latency just because of a missing socket option.\n- **It fixes the upload regression and much more.** Measured against #2031 on Linux (one run, compared with `benchmark compare` against two #2031 runs, IOClient control flat):\n  - `head-of-line`: 24.4 ms ? 2.6 ms\n  - `upload-1mib-sequential`: 20.7 ? 112 MB/s\n  - `get-concurrent-16`: 2.9k ? 11.1k req/s\n  - `multipart-upload`: 71.9 ? 33.9 ms\n  - `download-1mib-sequential`: 62 ? 97 MB/s\n  - `many-headers`: 0.97 ? 0.73 ms\n\n  The macOS run of the benchmark doesn't show these stalls (`head-of-line` is 1.7 ms there). Android uses the Linux TCP stack, so it is probably affected; I haven't measured Android.\n- **The cost:** with Nagle off, each write goes out at once, so an application that makes many tiny writes sends more, smaller packets. Here that shows up as about 20% fewer requests per second in `get-concurrent-128` (128 tiny requests in flight on one loopback connection; for example 15.3k ? 11.8k req/s). Writes that Nagle used to batch across event-loop turns now go out separately. `FrameWriter` writes every frame to the socket on its own, so batching frames per event-loop turn would be the natural follow-up to win this back. It never adds latency.\n\n### Why a growing stream window, rather than a smaller fixed one\n\nOn loopback, the stream window barely matters for throughput once `TCP_NODELAY` is set. It does matter for the cancel cost, and on long links it decides throughput. Each variant below was run once, with `TCP_NODELAY`:\n\n| Stream receive window | `download-cancel` (loopback) | Buffered while paused | 4 MiB download, 100 ms RTT / 200 Mbit/s | 16 MiB download, same link | Cancel + next request, same link |\n| --- | --- | --- | --- | --- | --- |\n| 64 KiB fixed, no `TCP_NODELAY` (3.1.0's windows)? | 0.97 ms | 36 MiB (no backpressure) | 6,907 ms | 28,911 ms | 103 ms |\n| 4 MiB fixed (#2029) | 24.4 ms | 4 MiB | **270 ms** | **827 ms** | 157 ms |\n| 1 MiB fixed | 8.8 ms | 1 MiB | 513 ms | 1,983 ms | 103 ms |\n| 256 KiB fixed | **1.8 ms** | < 1 MiB | 1,710 ms | 6,812 ms | 103 ms |\n| 64 KiB ? 4 MiB | 5.1 ms | < 1 MiB | 794 ms | 1,404 ms | 114 ms |\n| **256 KiB ? 4 MiB (this PR)** | 4.8 ms | < 1 MiB | 597 ms | 1,152 ms | 113 ms |\n| 1 MiB ? 4 MiB | 8.9 ms | 1 MiB | 411 ms | 967 ms | 103 ms |\n\nNotes on the table:\n\n- The long link was emulated with a userspace proxy adding 50 ms each way and 200 Mbit/s, measured with `Http2Client` on a warm connection, median of 3 downloads and of 5 cancels.\n- \"Buffered while paused\" is what the server had sent while the body was paused. The benchmark can't measure below 1 MiB.\n- ? The loopback columns of this row are 3.1.0 itself. Its link columns use this branch with 3.1.0's 64 KiB stream window and Nagle left on.\n\nHow to read it:\n\n- A cancelled stream can only have let the server send its current window. With a growing window, that is about twice what the app had read at that point: 640 KiB for a response cancelled after 256 KiB, against 4 MiB before.\n- A stream that is read keeps doubling its window about once per round trip and reaches 4 MiB after about 2 MiB, so long downloads still get the large window. Fixed small windows give that up: 256 KiB caps throughput at 256 KiB per round trip.\n- The cost against a fixed 4 MiB window is the ramp-up: about 3?4 extra round trips per stream on long links. Starting at 1 MiB would ramp faster but doubles the cancel cost. 256 KiB still fits most API responses and thumbnails within the initial window, and it suits mobile links, where a big window mostly sits in the link's buffers. Changing the start is a one-constant change if reviewers prefer otherwise.\n\n### Benchmarks: full suite, #2031 vs this PR\n\nSame machine, run in ABBA order (#2031, this PR, this PR, #2031). Each round was compared with `dart run bin/benchmark.dart compare`, which uses a Mann-Whitney U test on the 7 trials and reports changes with p < 0.05 and at least 5%. Only `Http2Client` changes; IOClient serves as a control for drift, and it moved by ?5?15% in a few scenarios in either direction, which is normal noise on this VM.\n\n| Scenario (`Http2Client` h2) | #2031 (round 1 / 2) | This PR (round 1 / 2) | Change (round 1 / 2) |\n| --- | --- | --- | --- |\n| `download-cancel` | 21.4 / 22.9 ms | 4.40 / 4.54 ms | **?79% / ?80%** |\n| `upload-1mib-sequential` | 21.0 / 20.9 MB/s | 115 / 109 MB/s | **+448% / +423%** |\n| `head-of-line` | 22.7 / 22.8 ms | 2.30 / 2.49 ms | **?90% / ?89%** |\n| `get-concurrent-16` | 3.1k / 2.9k req/s | 10.6k / 11.6k req/s | **+243% / +304%** |\n| `get-delayed-concurrent-100` | 2.5k / 3.0k req/s | 4.6k / 4.5k req/s | **+81% / +54%** |\n| `multipart-upload` | 72.0 / 71.8 ms | 32.3 / 31.5 ms | **?55% / ?56%** |\n| `download-1mib-sequential` | 61.8 / 63.0 MB/s | 93.9 / 99.0 MB/s | **+52% / +57%** |\n| `download-small-writes` | 82.1 / 74.2 MB/s | 106 / 104 MB/s | **+30% / +40%** |\n| `upload-streamed-small-chunks` | 103 / 108 MB/s | 131 / 132 MB/s | **+27% / +22%** |\n| `many-headers` | 956 / 926 ?s | 713 / 711 ?s | **?25% / ?23%** |\n| `download-slow-consumer` (buffered while paused) | 4.0 / 4.0 MiB | < 1 MiB / < 1 MiB | |\n| `get-concurrent-128` | 16.3k / 14.4k req/s | 12.6k / 12.1k req/s | **?23% / ?16%** (the `TCP_NODELAY` cost, see above) |\n| `upload-large-streamed` | 152 / 156 MB/s | 143 / 146 MB/s | **?6% / ?6%** |\n\nNo significant change in both rounds for: `get-sequential`, `get-multi-origin-64`, `download-large`, `download-concurrent`, `server-sent-events`, `upload-large-buffered`, `upload-concurrent`, `cold-client`, `json-burst` and `gzip-download` (+25% in both rounds, but not significant).\n\n### Test Verification (Fails Before ? Passes After)\n\n- `a-response-cancelled-early-had-a-small-window` (new, `test/http2_client_test.dart`): a frame-level server sends as fast as the client's credit allows while the app cancels the body after 256 KiB. The server must have sent ? 1 MiB before the `RST_STREAM` arrives (640 KiB here; 4 MiB before).\n- `a-st\n…[1628 more characters]","timeline":[{"who":"mosuem","bot":false,"at":"2026-11-16 11:27","ago":"2d ago","what":"opened this PR","text":""}, no new activity."},{"who":"OpenAI","step":"backlog","text":"When grooming backlog, check whether commit e9f6230 addressed the streaming-method whitelist and close or update the issue."}]},{"id":"dart-lang/http#1530","url":"https://github.com/dart-lang/http/issues/1530","title":"Get connection state after connect","kind":"Issue","state":"open","author":"sturmf","labels":["package:web_socket_channel"],"assignees":[],"requested":[],"repo_desc":"A composable API for making HTTP requests in Dart.","created":"6.0y ago","updated":"21mo ago","snapshot":"2026-11-06T18:10:27Z","as_of":null,"thumbs_down_at":null,"roles":["commenter","watches_repo"],"last":"mosuem labeled 21mo ago","stacked_on":null,"related":[],"body":"A similar question was asked before but without a resolution. I want to get the connection state after I called HtmlWebSocketChannel.connect. \r\nThe reason is hat I want to display a successful connection in the statusbar and add the Url to a history list. Right now I can only get a callback if the connection failed. But that would only happen asynchronously after I connect.\r\n\r\n    channel = HtmlWebSocketChannel.connect('ws://' + url);\r\n    channel.stream.listen(\r\n      _receiveMessage,\r\n      onError: (e) {\r\n        print('Could not connect to: $url');\r\n      },\r\n      onDone: () {\r\n        print('Connection closed');\r\n      },\r\n    );\r\n    update_statusbar(url);  // FIXME: here I do not know if the connection was successful or not!","timeline":[{"who":"sturmf","bot":false,"at":"2020-11-04 09:59","ago":"6.0y ago","what":"opened this issue","text":""},{"who":"wapchief","bot":false,"at":"2020-11-24 09:16","ago":"6.0y ago","what":"commented","text":"And the server keeps setting up heartbeats\r\n```\r\nString type = jsonDecode(message)['msg_type'];\r\n      var data = jsonDecode(message)['date'];\r\n      switch (type) {\r\n        case 'heartbeat':\r\n          var msgData = {\"Topic\": \"heartbeat\"};\r\n          _webSocket.sink.add(jsonEncode(msgData));\r\n          lastHeartbeat = 1;\r\n          break;\r\n```\r\ncheck timeout \r\n```\r\n  static localHeart() {\r\n    if (_timer != null && _timer.isActive) {\r\n      return;\r\n    }\r\n    const timeout = const Duration(seconds: 15);\r\n    _timer = Timer.periodic(timeout, (timer) {\r\n      if (loginState == 1) {\r\n        if (lastHeartbeat == 0) {\r\n          socketConnect();\r\n        } else {\r\n          lastHeartbeat = 0;\r\n        }\r\n      }\r\n    });\r\n  }\r\n```"},{"who":"brianquinlan","bot":false,"at":"2023-06-20 20:12","ago":"3.4y ago","what":"commented","text":"Does the `WebSocketChannel.ready` field help here?"},{"who":"mosuem","bot":false,"at":"2025-01-22 16:02","ago":"21mo ago","what":"labeled 'package:web_socket_channel'","text":""}],"note":"","prd_note":"","set":null,"source":"production","draft":"waiting","why":"","settings_note":"additional repositories: dart-lang/tools (“I'm only interested in `package:boring`”), dart-lang/http (“I am responsible for all packages in this repo, expect `package:http2`. But if I am assigned, mentioned, etc. in an issue or PR related to `package:http2` then rank it as you would any other package in dart-lang/http.”); collaborators: kevmoo, natebosch, sigurdm, mosuem","agents":[{"who":"Gemini","step":"backlog","text":"Triage or close this issue if WebSocketChannel.ready resolved the reporter's need."},{"who":"Basic","step":"backlog","text":""},{"who":"Claude","step":"backlog","text":"When grooming, check whether WebSocketChannel.ready answers this request and close the issue if it does, or ask the reporter to confirm."},{"who":"OpenAI","step":"waiting","text":"Wait for the reporter to confirm whether WebSocketChannel.ready solves their use case."}]},{"id":"dart-lang/language#2133","url":"https://github.com/dart-lang/language/issues/2133","title":"Platform (iOS, Android, etc.) should be a useable condition for conditional imports","kind":"Issue","state":"open","author":"brianquinlan","labels":["request"],"assignees":[],"requested":[],"repo_desc":"Design of the Dart language","created":"4.7y ago","updated":"8mo ago","snapshot":"2026-11-06T18:05:48Z","as_of":null,"thumbs_down_at":null,"roles":["author","commenter"],"last":"kevin-sakemaer commented 8mo ago","stacked_on":null,"related":["issue dart-lang/sdk#32960 'Resolve config specific imports for Dart 2': closed (completed), by leafpetersen, updated 8.4y ago, assignees ['leafpetersen'], labels ['area-language']","issue dart-lang/sdk#49379 'Add sentinel libraries dart:cupertino and dart:desktop to allow for conditional imports in Flutter': open, by ohir, updated 4.3y ago, labels ['area-sdk', 'type-enhancement']"],"body":"I have multiple platform-specific implementations of an HTTP client and I would like to select the appropriate one for the platform e.g. to use one based on NSURLSession on iOS, cronet on Android, etc.\r\n\r\nIn C++, I would use preprocessor macros to solve this issue e.g.\r\n\r\n```C++\r\nHttpClient *client;\r\n#ifdef IOS\r\n#include <whatever.h>\r\nclient = new NSURLAdapter();\r\n#elif ...\r\n```\r\n\r\nIn Python, I would do the configuration at runtime e.g.\r\n\r\n```python\r\nimport platform\r\n\r\nclient: HttpClient\r\nif platform.system() == \"Windows\":\r\n  import whatever\r\n  client = whatever.WindowsClient()\r\nelif  ...\r\n```\r\n\r\nIn Dart, I don't know how to solve this problem except in the narrow case of differentiating between web and non-web (using conditional imports).","timeline":[{"who":"brianquinlan","bot":false,"at":"2022-03-01 02:16","ago":"4.7y ago","what":"opened this issue","text":""},{"who":"brianquinlan","bot":false,"at":"2022-03-01 02:16","ago":"4.7y ago","what":"labeled 'request'","text":""},{"who":"Levi-Lesches","bot":false,"at":"2022-03-01 02:32","ago":"4.7y ago","what":"commented","text":"See the [Platform](https://api.dart.dev/stable/2.16.1/dart-io/Platform-class.html) class from `dart:io`. You could do:\r\n\r\n```dart\r\nimport \"dart:io\";\r\n\r\nclass Client { }\r\nclass WindowsClient extends Client { }\r\nclass MacClient extends Client { } \r\nclass AndroidClient extends Client { }\r\nclass IPhoneClient extends Client { }\r\n\r\nClient getClient() => \r\n  Platform.isWindows ? WindowsClient() : \r\n  Platform.isMacOS ? MacClient() : \r\n  Platform.isAndroid ? AndroidClient() : \r\n  Platform.isIOS ? IPhoneClient() : \r\n  throw \"Unrecognized platform\";\r\n```"},{"who":"leafpetersen","bot":false,"at":"2022-03-01 04:47","ago":"4.7y ago","what":"commented","text":"The language leaves it deliberately implementation defined what constants are defined for use in conditional imports, IIRC.  The limiting factor is largely around the ability of the build systems to handle multiple configurations efficiently.  This [issue](https://github.com/dart-lang/sdk/issues/32960) documents the discussion and eventual resolution.  cc @jakemac53 @natebosch who might have more comments here."},{"who":"lrhn","bot":false,"at":"2022-03-01 10:03","ago":"4.7y ago","what":"commented","text":"We could introduce more available environment constants, and when some build-systems or environments can't support them, we could introduce lints to disable their use. Then people with concrete needs and no special build-system requirements can make their code more precisely platform specific.\r\n\r\nIt does risk that some libraries will be incompatible with some build-systems, which can fragment the ecosystem.\r\nNot doing so risks reducing everybody to the lowest common denominator.\r\n\r\n(I always wanted to know at compile time whether I have web numbers or 64-bit integers!)"},{"who":"jakemac53","bot":false,"at":"2022-03-01 15:52","ago":"4.7y ago","what":"commented","text":"Fwiw, the build systems can in theory handle arbitrary constants as long as they either:\r\n\r\n- are defined globally (via a `--define` flag or similar global config for the entire build)\r\n- are tied to a specific platform (web, vm, etc)\r\n- are tied to sound or unsound modes\r\n\r\nConcretely this matters because build_runner and bazel may be compiling multiple apps in a single build, and they share kernel output files (per platform & null safety mode). So they have to agree on all constants (for a given platform & mode).\r\n\r\nBoth of these systems however allow passing arbitrary arguments to backend compilers, and people may try to pass `-D` arguments that way, so it could be confusing, but we could put in some special  handling to alert them that it won't work."},{"who":"jakemac53","bot":false,"at":"2022-03-01 15:55","ago":"4.7y ago","what":"commented","text":"It is also worth mentioning though that the _cost_ of supporting this might be prohibitively high. We would need to resolve constants in order to discover which imports to select. Using the analyzer to do this is actually challenging because the analyzer has to be ran in the same mode that is being compiled for, which I don't think it supports well today. And it would be costly to evaluate the constants as well."},{"who":"Levi-Lesches","bot":false,"at":"2022-03-01 20:02","ago":"4.7y ago","what":"commented","text":"Can someone clarify whether the `Platform` class is an adequate solution? When you can import `dart:io`, you can use it to know what platform you're on. And when you can't, you know you're on web."},{"who":"jakemac53","bot":false,"at":"2022-03-01 20:44","ago":"4.7y ago","what":"commented","text":"> Can someone clarify whether the `Platform` class is an adequate solution? When you can import `dart:io`, you can use it to know what platform you're on. And when you can't, you know you're on web.\r\n\r\nThe problem is if you want to actually change the import based on the `Platform` constants. Today you could change the runtime behavior, but not the actual imports, because `Platform` isn't even available outside of `dart:io`."},{"who":"jakemac53","bot":false,"at":"2022-03-01 20:49","ago":"4.7y ago","what":"commented","text":"Fwiw as far as platform constants specifically go, it would require the build systems to compile separately for each platform, which they don't  have to do for all platforms today (only \"targets\" which doesn't map 1:1 with platforms).\r\n\r\nThat would be feasible in theory but it would also make kernel files not be portable across platforms which is not desirable imo."},{"who":"jakemac53","bot":false,"at":"2022-03-01 20:52","ago":"4.7y ago","what":"commented","text":"Actually, these Platform variables are not even constant for this same reason (its only known at runtime, depending on the current OS). So I don't see these Platform variables being something you can use in conditional imports regardless."},{"who":"brianquinlan","bot":false,"at":"2022-03-09 18:35","ago":"4.7y ago","what":"commented","text":"Having conditional use cases based on `Platform` would be sufficient for my use case.\r\n\r\nThe solution suggested in https://github.com/dart-lang/language/issues/2133#issuecomment-1054923740 works (and what I'm currently using) but, since `Platform.is*` are all non-const, the code for every platform will end up in standalone binaries.\r\n\r\nIn my mind, the cleanest solution is more robust conditional imports and conditional dependencies in `pubspec.yaml`.\r\n\r\nFWIW, conditional dependencies in Python look like this:\r\n```\r\ninstall_requires:\r\n    pywin32 >= 1.0;platform_system=='Windows'\r\n```"},{"who":"filiph","bot":false,"at":"2024-08-27 19:15","ago":"2.2y ago","what":"commented","text":"To summarize, I think this issue suggests something like this:\r\n\r\n```dart\r\nexport 'src/hw_none.dart' // Stub implementation\r\n    if (dart.os.windows) 'src/hw_windows.dart' // Windows implementation\r\n    if (dart.os.macos) 'src/hw_macos.dart'; // macOS implementation\r\n```\r\n\r\nAm I right?\r\n\r\nI, for one, would find this helpful. A related issue suggests something very similar: https://github.com/dart-lang/sdk/issues/49379.\r\n\r\nMy question to @jakemac53 is whether this is something that is covered by [static metaprogramming](https://github.com/orgs/dart-lang/projects/90?pane=issue&itemId=64695977)?"},{"who":"brianquinlan","bot":false,"at":"2024-08-27 19:52","ago":"2.2y ago","what":"commented","text":"> To summarize, I think this issue suggests something like this:\r\n> \r\n> ```dart\r\n> export 'src/hw_none.dart' // Stub implementation\r\n>     if (dart.os.windows) 'src/hw_windows.dart' // Windows implementation\r\n>     if (dart.os.macos) 'src/hw_macos.dart'; // macOS implementation\r\n> ```\r\n> \r\n> Am I right?\r\n\r\nThat approach would work!\r\n\r\nIn general, I don't like the conditional import approach because it forces you to split your logic into separate source files, even when the logic is trivial."},{"who":"lrhn","bot":false,"at":"2024-08-27 22:54","ago":"2.2y ago","what":"commented","text":"With part files with imports, you should get conditional part directives, and with augmentations you should be able to override only that you need to override in those parts.\nTogether that should avoid needing extra libraries or duplicating logic, you can change only the small private part of a library that is conditionally supported."},{"who":"filiph","bot":false,"at":"2024-09-02 11:48","ago":"2.2y ago","what":"commented","text":"> With part files with imports, you should get conditional part directives, and with augmentations you should be able to override only that you need to override in those parts. Together that should avoid needing extra libraries or duplicating logic, you can change only the small private part of a library that is conditionally supported.\r\n\r\nI'm not sure I follow. Are part files with imports and augmentations parts of a spec? If there's documentation for these features, just give me a link and I can study these on my own. Maybe I already know these features, just not under those names?"},{"who":"lrhn","bot":false,"at":"2024-09-02 12:22","ago":"2.2y ago","what":"commented","text":"Part files with imports, aka \"enhanced par
