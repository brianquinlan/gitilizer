to project v2","text":""},{"who":"github-project-automation[bot]","bot":true,"at":"2026-11-05 19:08","ago":"23h ago","what":"project v2 item status changed","text":""}],"note":"","prd_note":"","set":null,"source":"production","draft":"todo","why":"","settings_note":"additional repositories: dart-lang/tools (“I'm only interested in `package:boring`”), dart-lang/http (“I am responsible for all packages in this repo, expect `package:http2`. But if I am assigned, mentioned, etc. in an issue or PR related to `package:http2` then rank it as you would any other package in dart-lang/http.”); collaborators: kevmoo, natebosch, sigurdm, mosuem","agents":[{"who":"Gemini","step":"todo","text":"Implement support for x-google-user-project or leave it in the backlog."},{"who":"Basic","step":"backlog","text":""},{"who":"Claude","step":"todo","text":"Decide whether to implement x-google-user-project support in requestMetadata for the auth package, or defer it until the feature is needed."},{"who":"OpenAI","step":"backlog","text":"Revisit quota-project metadata support during backlog grooming and decide whether to implement it."}]}]}</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const ME = DATA.user.toLowerCase();
  const STEPS = DATA.steps; // [{key, label, tone, meaning}] in the order of PRD RANK-23
  const STEP = Object.fromEntries(STEPS.map(s => [s.key, s]));
  const byId = Object.fromEntries(DATA.items.map(x => [x.id, x]));
  const ids = DATA.items.map(x => x.id);
  const DOC = "labels/all";
  let labels = {}, notes = {};
  let filter = "all";
  let sel = ids[0];
  let hideBots = true;
  let db = null, writing = false, pending = false, timer = null, first = true;

  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const when = iso => new Date(iso).toLocaleString(undefined, { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit", timeZoneName: "short" });
  const role = r => r.replace("requested_reviewer_via_team", "review requested via team").replace(/_/g, " ");
  const tag = (k, draft) => `<span class="tag ${STEP[k].tone}${draft ? " draft" : ""}" title="${draft ? "Draft: " : ""}${esc(STEP[k].label)}">${esc(STEP[k].label)}</span>`;
  // Gemini's answer for an item, from the runs the page was built with.
  const gemini = id => ((byId[id].agents || []).find(a => a.who === "Gemini") || {}).step || null;
  const differs = id => !!labels[id] && !!gemini(id) && gemini(id) !== labels[id];
  // The items "Differs from Gemini" shows, fixed when it is chosen, so changing a label doesn't make the item vanish.
  let checking = new Set();
  const shown = () => ids.filter(id => filter === "all" || (filter === "todo" ? !labels[id] : filter === "gemini" ? checking.has(id) : byId[id].source === filter));

  // ---- the seven buttons
  const stepsEl = $("#steps");
  const groups = [["On you", STEPS.filter(s => s.tone !== "off")], ["Not on you", STEPS.filter(s => s.tone === "off")]];
  stepsEl.innerHTML = groups.map(([name, ss]) => `<div class="group" role="group" aria-label="${name}"><span class="glabel">${name}</span>${ss.map(s =>
    `<button type="button" class="step ${s.tone}" data-k="${s.key}" aria-pressed="false" title="${esc(s.meaning)}">${esc(s.label)} <kbd>${STEPS.indexOf(s) + 1}</kbd></button>`).join("")}</div>`).join("");
  stepsEl.addEventListener("click", e => { const b = e.target.closest("button.step"); if (b) choose(b.dataset.k); });

  // ---- list
  const listEl = $("#list");
  const rows = {};
  for (const x of DATA.items) {
    const li = document.createElement("li");
    li.setAttribute("role", "option");
    li.innerHTML = `<span style="min-width:0"><span class="row-title">${esc(x.title)}</span><span class="row-id"><span class="k ${x.kind === "PR" ? "pr" : "issue"}">${x.kind}</span><span class="rid">${esc(x.id)}</span><span class="src">${x.source === "eval" ? "eval" : ""}</span></span></span><span class="lab"></span>`;
    li.addEventListener("click", () => select(x.id, true));
    rows[x.id] = li;
  }

  function renderList() {
    const vis = shown();
    listEl.replaceChildren(...vis.map(id => rows[id]));
    if (!vis.length) listEl.innerHTML = `<li class="empty">Nothing here.</li>`;
    for (const id of ids) {
      const li = rows[id], k = labels[id], d = byId[id].draft;
      li.setAttribute("aria-selected", String(id === sel));
      li.classList.toggle("done", !!k);
      li.querySelector(".lab").innerHTML = k ? tag(k) : d ? tag(d, true) : "";
    }
    const n = ids.filter(id => labels[id]).length;
    $("#count").textContent = `${n} of ${ids.length} labelled`;
    $("#geminiFilter").textContent = `Differs from Gemini (${ids.filter(differs).length})`;
    $("#geminiFilter").hidden = !ids.some(gemini);
    $("#yamlText").value = yaml();
  }

  function renderBar() {
    const k = labels[sel], d = byId[sel].draft;
    for (const b of stepsEl.querySelectorAll("button.step")) {
      b.setAttribute("aria-pressed", String(b.dataset.k === k));
      b.classList.toggle("draft", !k && b.dataset.k === d);
    }
    const vis = shown(), i = vis.indexOf(sel);
    $("#pos").innerHTML = i >= 0 ? `${i + 1} <small>of ${vis.length}</small>` : "";
    $("#draftNote").innerHTML = !k && d ? `Draft from your ranking note: ${tag(d, true)} · <kbd>Enter</kbd> to accept` : "";
  }

  // ---- item view
  function renderView() {
    const x = byId[sel];
    const chips = [`<span class="chip ${x.kind === "PR" ? "pr" : "issue"}">${x.kind}</span>`, `<span class="chip">${esc(x.state)}</span>`,
      ...x.labels.map(l => `<span class="chip">${esc(l)}</span>`)].join("");
    const facts = [
      ["Author", x.author], ["Opened", x.created], ["Last update", x.updated],
      x.assignees.length && ["Assigned", x.assignees.join(", ")],
      x.requested.length && ["Review requested", x.requested.join(", ")],
      x.roles.length && ["Your role", x.roles.map(role).join(", ")],
      ["Last human activity", x.last || "none (bots only)"],
      x.stacked_on && ["Stacked on", Array.isArray(x.stacked_on) ? x.stacked_on.map(s => `${s.pr} “${s.title}” (${s.state}; reviews: ${Array.isArray(s.reviews) ? s.reviews.join(", ") : s.reviews})`).join(" · ") : x.stacked_on],
      x.related.length && ["Related", x.related.join(" · ")],
    ].filter(Boolean).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("");
    const banners = [
      x.as_of ? `<div class="banner asof"><b>Shown as it was on ${esc(when(x.as_of))}.</b> Label it as if that were now.</div>` : `<div class="banner note"><b>Snapshot:</b> ${esc(when(x.snapshot))}. GitHub may have changed since; label what you see here.</div>`,
      x.thumbs_down_at ? `<div class="banner down"><b>Pretend you thumbs-downed this on ${esc(when(x.thumbs_down_at))}.</b></div>` : "",
      x.why ? `<div class="banner note"><b>Your ranking note:</b> ${esc(x.why)}</div>` : "",
      x.settings_note ? `<div class="banner note"><b>About you, as the agent sees it:</b> ${esc(x.settings_note)}</div>` : "",
    ].join("");
    const events = x.timeline.filter(e => !(hideBots && e.bot));
    const tl = events.map(e => `<li class="${e.who.toLowerCase() === ME ? "me" : ""} ${e.bot ? "bot" : ""}"><div class="meta"><b>${esc(e.who)}</b> ${esc(e.what)} · ${esc(e.at)} (${esc(e.ago)})</div>${e.text ? `<div class="txt">${esc(e.text)}</div>` : ""}</li>`).join("");
    const botCount = x.timeline.filter(e => e.bot).length;
    const agents = (x.agents || []).map(a => `<li><span class="who">${esc(a.who)}</span>${a.step ? tag(a.step) : "<span></span>"}<span>${esc(a.text || "")}</span></li>`).join("");
    $("#view").innerHTML = `
      <div class="chips">${chips}</div>
      <h2><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></h2>
      <div class="idline">${esc(x.id)}${x.repo_desc ? " · " + esc(x.repo_desc) : ""}</div>
      ${banners}
      <details class="help"><summary>What each next step means</summary><dl>${STEPS.map((s, i) => `<dt>${i + 1}. ${tag(s.key)}</dt><dd>${esc(s.meaning)}</dd>`).join("")}</dl>
        <p style="margin:0;padding:0 12px 12px;font-size:12.5px;color:var(--muted)">If more than one applies: ${DATA.precedence.map(k => esc(STEP[k].label)).join(", ")}, in that order.</p></details>
      ${agents ? `<details class="agents" id="agentsBox"${labels[sel] ? " open" : ""}><summary>What the agents said (opens after you choose, so it doesn't sway you)</summary><ul>${agents}</ul></details>` : ""}
      <dl class="facts">${facts}</dl>
      <h3>Description</h3>
      <div class="body">${x.body ? esc(x.body) : "<i>No description.</i>"}</div>
      <div class="tlbar"><h3>Conversation (${events.length})</h3>${botCount ? `<label><input type="checkbox" id="botToggle" ${hideBots ? "checked" : ""}> Hide ${botCount} bot events</label>` : ""}</div>
      <ol class="tl">${tl || "<li><i>Nothing yet.</i></li>"}</ol>
      <div class="why"><label for="noteBox">Note (optional): why this next step, or what made it hard</label><textarea id="noteBox"></textarea></div>`;
    $("#noteBox").value = notes[sel] || "";
    $("#noteBox").addEventListener("input", e => { notes[sel] = e.target.value; save(); });
    const bt = $("#botToggle"); if (bt) bt.addEventListener("change", e => { hideBots = e.target.checked; renderView(); });
  }

  function select(id, fromClick) {
    sel = id;
    renderList(); renderBar(); renderView();
    $("#viewpane").scrollTop = 0;
    if (!fromClick && rows[id].isConnected) rows[id].scrollIntoView({ block: "nearest" });
  }
  function step(delta) {
    const vis = shown(), i = vis.indexOf(sel);
    const j = i < 0 ? 0 : i + delta;
    if (j >= 0 && j < vis.length) select(vis[j]);
  }
  function nextToLabel() {
    const i = ids.indexOf(sel);
    const next = [...ids.slice(i + 1), ...ids.slice(0, i)].find(id => !labels[id] && shown().includes(id));
    if (next) select(next);
  }
  function choose(k) {
    if (k) labels[sel] = k; else delete labels[sel];
    const box = $("#agentsBox"); if (box && k) box.open = true;
    renderList(); renderBar(); save();
  }

  $(".filters").addEventListener("click", e => {
    const b = e.target.closest("button[data-f]"); if (!b) return;
    filter = b.dataset.f;
    if (filter === "gemini") checking = new Set(ids.filter(differs));
    for (const x of document.querySelectorAll(".filters button")) x.setAttribute("aria-pressed", String(x === b));
    const vis = shown();
    if (vis.length && !vis.includes(sel)) select(vis[0]); else renderList(), renderBar();
  });
  document.addEventListener("keydown", e => {
    if (e.target.closest("textarea, input, select") || e.metaKey || e.ctrlKey || e.altKey) return;
    const n = Number(e.key);
    if (e.key >= "1" && e.key <= String(STEPS.length)) { e.preventDefault(); choose(STEPS[n - 1].key); }
    else if (e.key === "0" || e.key === "Backspace") { e.preventDefault(); choose(null); }
    else if (e.key === "Enter" && !e.target.closest("button, a, summary") && byId[sel].draft && !labels[sel]) { e.preventDefault(); choose(byId[sel].draft); }
    else if (e.key === "j" || e.key === "J") step(1);
    else if (e.key === "k" || e.key === "K") step(-1);
    else if (e.key === "n" || e.key === "N") nextToLabel();
  });

  function yaml() {
    const lines = ["# Next steps (PRD RANK-23) from the labelling page", "next_steps:"];
    for (const id of ids) if (labels[id]) {
      lines.push(`  - url: ${byId[id].url}`, `    next_step: ${labels[id]}`);
      if ((notes[id] || "").trim()) lines.push(`    note: ${JSON.stringify(notes[id].trim())}`);
    }
    return lines.join("\n") + "\n";
  }
  $("#copyBtn").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(yaml()); $("#copyBtn").textContent = "Copied"; setTimeout(() => $("#copyBtn").textContent = "Copy as YAML", 1500); }
    catch { $("#yamlBox").hidden = false; $("#yamlText").value = yaml(); $("#yamlText").focus(); $("#yamlText").select(); }
  });

  // ---- saving (db capability): one document, written after a short pause, one write at a time
  function setStatus(s, t) { $("#status").dataset.s = s; $("#statusText").textContent = t; }
  function save() {
    if (!db) { $("#yamlText").value = yaml(); return; }
    setStatus("saving", "Saving…");
    clearTimeout(timer); timer = setTimeout(flush, 600);
  }
  async function flush() {
    timer = null;
    if (writing) { pending = true; return; }
    writing = true;
    try {
      await db.doc(DOC).set({ labels: { ...labels }, notes: { ...notes }, updated_at: new Date().toISOString() });
      setStatus("saved", "Saved");
    } catch (e) {
      if (e && e.code === "unavailable") { pending = true; setStatus("saving", "Retrying…"); await new Promise(r => setTimeout(r, 1200 + Math.random() * 800)); }
      else setStatus("error", `Couldn't save (${e && e.code || "error"}). Use Copy as YAML.`);
    } finally {
      writing = false;
      if (pending) { pending = false; flush(); }
    }
  }
  function apply(d) {
    labels = Object.fromEntries(Object.entries(d.labels || {}).filter(([id, k]) => byId[id] && STEP[k]));
    notes = Object.fromEntries(Object.entries(d.notes || {}).filter(([id]) => byId[id]));
  }
  // Open on what's left to label; once everything is labelled, on the items where the label and Gemini's answer differ.
  function startFilter() {
    if (ids.some(id => !labels[id])) filter = "todo";
    else if (ids.some(differs)) { filter = "gemini"; checking = new Set(ids.filter(differs)); }
    else return;
    for (const x of document.querySelectorAll(".filters button")) x.setAttribute("aria-pressed", String(x.dataset.f === filter));
    sel = shown()[0];
  }

  select(sel);

  (async () => {
    let timeout = setTimeout(() => setStatus("offline", "Saving unavailable here: use Copy as YAML"), 10000);
    try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch { db = null; }
    if (!db) { clearTimeout(timeout); setStatus("offline", "Saving unavailable here: use Copy as YAML"); $("#yamlBox").hidden = false; return; }
    db.doc(DOC).onSnapshot(snap => {
      clearTimeout(timeout);
      if (first) {
        first = false;
        if (snap.exists) { apply(snap.data()); startFilter(); select(sel); setStatus("saved", "Saved"); }
        else setStatus("saved", "Nothing saved yet");
      } else if (snap.exists && !snap.metadata.hasPendingWrites && !writing && !timer) {
        apply(snap.data()); renderList(); renderBar();
      }
    }, e => { clearTimeout(timeout); setStatus("error", `Saving stopped (${e.code}). Reload the page.`); });
  })();
})();
</script>
