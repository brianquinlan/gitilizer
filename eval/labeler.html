cation writes, potentially causing callers to hang indefinitely. Additionally, a potential duplicate error emission issue was identified in the stream controller's error-handling logic.\n\n<details>\n<summary>I am having trouble creating individual review comments. Click here to see my feedback.<\/summary>\n\n### pkgs/google_cloud_pubsub/lib/src/subscription.dart (192-197)\n\n![high](https://www.gstatic.com/codereviewagent/high-priority.svg)\n\nCalling `activeStream.add(...)` can throw a `StateError` if the stream has been cancelled asynchronously (e.g., due to a network drop). Since there is no `try-catch` block around this call, the exception will propagate and prevent `resolveBatch()` from being called. This will cause any completers associated with the batch to never complete, leading to callers awaiting `acknowledge()` hanging indefinitely. Wrapping the call in a `try-catch` block allows it to safely fall back to the unary RPC path.\n\n```dart\n    final activeStream = _getActiveStream();\n    if (activeStream != null) {\n      try {\n        activeStream.add(grpc.StreamingPullRequest()..ackIds.addAll(ackIds));\n        resolveBatch();\n        return;\n      } catch (e) {\n        // Fall back to unary RPC if stream write fails.\n      }\n    }\n```\n\n### pkgs/google_cloud_pubsub/lib/src/subscription.dart (258-269)\n\n![high](https://www.gstatic.com/codereviewagent/high-priority.svg)\n\nCalling `activeStream.add(...)` can throw a `StateError` if the stream has been cancelled asynchronously. Without a `try-catch` block, this exception will propagate and prevent `resolveGroup()` from being called, causing callers awaiting `modifyAckDeadline()` to hang indefinitely. Wrapping the call in a `try-catch` block allows it to safely fall back to the unary RPC path.\n\n```dart\n        final activeStream = _getActiveStream();\n        if (activeStream != null) {\n          try {\n            activeStream.add(\n              grpc.StreamingPullRequest()\n                ..modifyDeadlineAckIds.addAll(ackIds)\n                ..modifyDeadlineSeconds.addAll(\n                  List.filled(ackIds.length, deadline),\n                ),\n            );\n            resolveGroup();\n            return;\n          } catch (e) {\n            // Fall back to unary RPC if stream write fails.\n          }\n        }\n```\n\n### pkgs/google_cloud_pubsub/lib/src/client.dart (540-551)\n\n![medium](https://www.gstatic.com/codereviewagent/medium-priority.svg)\n\nWhen `cancelOnError` is true, `controller.addStream` forwards any stream error to the controller and then completes its returned future with that error (throwing it). Because this call is inside the main `try-catch` block, the caught exception will trigger `controller.addError` a second time. If the user listens to the stream without `cancelOnError: true` (the default in Dart), they will receive every stream error twice. Wrapping `addStream` in its own `try-catch` block to catch and ignore the thrown error prevents this duplicate emission.\n\n```suggestion\n          try {\n            await controller.addStream(\n              responseStream.expand(\n                (response) => response.receivedMessages.map(\n                  (receivedMessage) => _mapReceivedMessage(\n                    receivedMessage,\n                    ackHandler: ackHandler,\n                    modifyDeadlineHandler: modifyDeadlineHandler,\n                  ),\n                ),\n              ),\n              cancelOnError: true,\n            );\n          } catch (_) {\n            // The error has already been forwarded to the controller by addStream.\n          }\n```\n\n<\/details>"}],"note":"The PR of a close collaborator in a repo that I am responsible for.","prd_note":"","set":"A","source":"eval","draft":"review","why":"The PR of a close collaborator in a repo that I am responsible for.","settings_note":"","agents":[{"who":"Gemini","step":"review","text":"Review Sigurd's PR adding client attribution headers and release polish for Pub/Sub."},{"who":"Basic","step":"review","text":""},{"who":"Claude","step":"review","text":"Review sigurdm's pubsub release-polish PR (client attribution header, CHANGELOG, pubspec, .pubignore); it has had no human review for 5 days."},{"who":"OpenAI","step":"review","text":"Review #376’s attribution header, version checks, and release-packaging changes."}]},{"id":"googleapis/google-cloud-dart#382","url":"https://github.com/googleapis/google-cloud-dart/pull/382","title":"fix(google_cloud_rpc): use the google.rpc.Code of JSON errors in Status.code","kind":"PR","state":"open","author":"quaaantumdev","labels":[],"assignees":[],"requested":[],"repo_desc":"[Experimental] Google Cloud Dart Client Libraries","created":"3d ago","updated":"3d ago","snapshot":"2026-10-25T17:52:26Z","as_of":null,"thumbs_down_at":null,"roles":["watches_repo"],"last":"quaaantumdev opened this PR 3d ago","stacked_on":null,"related":["issue googleapis/google-cloud-dart#381 [linked: closes/closed-by] '[google_cloud_rpc] fromHttpResponse puts the HTTP status into Status.code and drops the google.rpc.Code, so ABORTED is never retried over REST': open, by quaaantumdev, updated 3d ago"],"body":"Fixes #381.\n\nFor an error received as JSON, `ServiceException.fromHttpResponse` put the HTTP status code into `status.code` and dropped the `google.rpc.Code` that the error names in `status`. gRPC errors carry the `google.rpc.Code` there (see `_mapGrpcError` in `google_cloud_pubsub`), and `ExponentialRetry.isRetryable` relies on it. Over REST, an `ABORTED` error (409) was therefore never retried, and callers couldn't tell `ABORTED` from `ALREADY_EXISTS`, or `FAILED_PRECONDITION` from `INVALID_ARGUMENT`.\n\n## Changes\n\n- `fromHttpResponse` reads the error's `status` into `Status.code`, for example `\"ABORTED\"` becomes 10. When `status` is missing or isn't a `google.rpc.Code`, the HTTP status code stays, as before. `ServiceException.statusCode` still has the HTTP status code.\n- The doc comment of `ServiceException.status` says what `code` holds.\n\nThis changes `status.code` for JSON errors that name their code (400 becomes 3, and so on). The only other place in this repository that reads `status.code` for a REST error is `google_cloud_storage`'s `create_bucket_test.dart`. Cloud Storage's JSON API errors don't carry a `status`, so that test still gets 409.\n\n## Tests\n\n- The existing `valid error 400`, `409` and `other` tests now expect the `google.rpc.Code` (3, 6 and 13).\n- New tests: `ABORTED` gives 10 and is retryable, and `ALREADY_EXISTS` is not. An error without a `status`, or with an unknown one, keeps the HTTP status code.\n- Without the fix, the four tests that expect a `google.rpc.Code` fail.\n- `dart test` in `generated/google_cloud_rpc`: 86 passed. `dart analyze --fatal-infos` and `dart format` are clean.","timeline":[{"who":"Kjartan Ferstl","bot":false,"at":"2026-10-22 14:37","ago":"3d ago","what":"pushed commit dc2f85b 'fix(google_cloud_rpc): use the google.rpc.Code of JSON errors in Status.code'","text":""},{"who":"quaaantumdev","bot":false,"at":"2026-10-22 14:38","ago":"3d ago","what":"opened this PR","text":""},{"who":"gemini-code-assist[bot]","bot":true,"at":"2026-10-22 14:49","ago":"3d ago","what":"reviewed [COMMENTED]","text":"## Code Review\n\nThis pull request updates the test suite for service exceptions by refining status code assertions to match specific Google Cloud RPC error codes and adding new test cases to verify retryable behavior for specific error scenarios. I have no further feedback to provide as there were no review comments submitted."}],"note":"Recent PR from an unknown 3rd party in a repo that I am responsible for.","prd_note":"","set":"A","source":"eval","draft":"review","why":"Recent PR from an unknown 3rd party in a repo that I am responsible for.","settings_note":"","agents":[{"who":"Gemini","step":"review","text":"Review this PR fixing google.rpc.Code handling in google_cloud_rpc"},{"who":"Basic","step":"review","text":""},{"who":"Claude","step":"review","text":"Review PR #382 (first-time contributor) in google-cloud-dart; check the Status.code behavior change for JSON errors and its impact on retry logic and Storage."},{"who":"OpenAI","step":"review","text":"Review #382 for correct RPC error-code mapping, retry behavior, and backward compatibility."}]},{"id":"googleapis/google-cloud-dart#252","url":"https://github.com/googleapis/google-cloud-dart/issues/252","title":"Enum does not parse integer values","kind":"Issue","state":"open","author":"brianquinlan","labels":["type: bug","priority: p2"],"assignees":[],"requested":[],"repo_desc":"[Experimental] Google Cloud Dart Client Libraries","created":"6mo ago","updated":"4d ago","snapshot":"2026-10-25T19:30:52Z","as_of":null,"thumbs_down_at":null,"roles":["author","commenter","watches_repo"],"last":"Yusufihsangorgel commented 4d ago","stacked_on":null,"related":[],"body":"From https://protobuf.dev/programming-guides/json/\n\n> The name of the enum value as specified in proto is used. Parsers accept both enum names and integer values.","timeline":[{"who":"brianquinlan","bot":false,"at":"2026-04-29 19:01","ago":"6mo ago","what":"opened this issue","text":""},{"who":"brianquinlan","bot":false,"at":"2026-04-29 19:01","ago":"6mo ago","what":"labeled 'type: bug'","text":""},{"who":"brianquinlan","bot":false,"at":"2026-04-29 19:01","ago":"6mo ago","what":"labeled 'priority: p2'","text":""},{"who":"github-project-automation[bot]","bot":true,"at":"2026-04-29 19:01","ago":"6mo ago","what":"added to project v2","text":""},{"who":"github-project-automation[bot]","bot":true,"at":"2026-04-29 19:01","ago":"6mo ago","what":"project v2 item status changed","text":""},{"who":"Yusufihsangorgel","bot":false,"at":"2026-10-13 19:56","ago":"12d ago","what":"commented","text":"I'd like to take this. I would change the enum template in googleapis/librarian so generated fromJson also maps a known integer to its constant, then regenerate here and un-skip `oneof_enum_integer`. For an unknown number, should the decoder keep it or throw?"},{"who":"brianquinlan","bot":false,"at":"2026-10-13 20:57","ago":"12d ago","what":"commented","text":"Take a look at https://protobuf.dev/programming-guides/enum/\n\nI think that, to be compliant, you need to preserve unknown integers. But, if you do that, you'll need to change the [`ProtoEnum`](https://github.com/googleapis/google-cloud-dart/blob/0a3fe91aabdbdad8b8a2305aa36390e50958ffa4/generated/google_cloud_protobuf/lib/src/protobuf.p.dart#L37) definition and the code generation for `ProtoEnum` subclasses to preserve the field numbers.\n\nThe [ProtoJSON](https://protobuf.dev/programming-guides/json/) description doesn't really say what to do if the string/integer values don't map to existing values.\n\nWhen using actual APIs, do we every receive \n\nI think that this is the Java parsing implementation:\nhttps://github.com/protocolbuffers/protobuf/blob/2f21136f4ea05813a4e2cffd4ab6337a5a09cecb/java/util/src/main/java/com/google/protobuf/util/JsonFormat.java#L2448\n\nMaybe we need to set `;enum-encoding=int` in the request to get any benefit from the unknown enum value behavior?\n\n@Yusufihsangorgel I think that this is likely a big project that you'll have to research a bit before you take it on."},{"who":"brianquinlan","bot":false,"at":"2026-10-13 20:59","ago":"12d ago","what":"commented","text":"It looks like some clients do request integer enum values e.g.\nhttps://github.com/googleapis/google-cloud-rust/blob/16628efbcde33ee1d62f7ee68a833c9ea8dae13f/src/generated/cloud/workflows/v1/src/transport.rs#L113"},{"who":"Yusufihsangorgel","bot":false,"at":"2026-10-13 23:11","ago":"12d ago","what":"commented","text":"I'll read the Java JsonFormat parser and how the Rust client requests integer enums, then write up a design here first."},{"who":"Yusufihsangorgel","bot":false,"at":"2026-10-14 03:16","ago":"12d ago","what":"commented","text":"For proto3 the conformance suite requires an unknown integer to round-trip as a number ([EnumFieldUnknownValue][1]). By default Java's [JsonFormat][2] and Go's [protojson][3] print integers only for unknown values. Without `enum-encoding=int`, Showcase [GetEnum][4] can return one, and the Dart client throws on it today. Dart already keeps unknown names, so asking for integers can come later.\n\nI'd generate the value numbers, map known integers to constants, keep unknown ones and accept 0 for NullValue. Should `ProtoEnum` get a nullable number, or would a [Rust-style unknown variant][5] fit better?\n\n[1]: https://github.com/protocolbuffers/protobuf/blob/2f21136f4ea05813a4e2cffd4ab6337a5a09cecb/conformance/binary_json_conformance_suite.cc#L3278-L3286\n[2]: https://github.com/protocolbuffers/protobuf/blob/2f21136f4ea05813a4e2cffd4ab6337a5a09cecb/java/util/src/main/java/com/google/protobuf/util/JsonFormat.java#L1556-L1557\n[3]: https://github.com/protocolbuffers/protobuf-go/blob/3933e752f9ea536e2cf45bf15b321274293863d3/encoding/protojson/encode.go#L331-L333\n[4]: https://github.com/googleapis/gapic-showcase/blob/c804ae4fb988f92e54ddf5a6c816c61e9e62e98e/server/services/compliance_service.go#L135-L158\n[5]: https://github.com/googleapis/google-cloud-rust/blob/16628efbcde33ee1d62f7ee68a833c9ea8dae13f/src/generated/cloud/workflows/v1/src/model.rs#L666-L678"},{"who":"brianquinlan","bot":false,"at":"2026-10-14 18:19","ago":"11d ago","what":"commented","text":"We keep unknown names? Oh, I think that is not to spec, it is a detail of the existing implementation. \n\nProbably `ProtoEnum` should have a nullable number and a nullable string (which will be breaking but we are still prerelease)."},{"who":"Yusufihsangorgel","bot":false,"at":"2026-10-15 05:52","ago":"11d ago","what":"commented","text":"Yeah, the [conformance suite](https://github.com/protocolbuffers/protobuf/blob/2f21136f4ea05813a4e2cffd4ab6337a5a09cecb/conformance/binary_json_conformance_suite.cc#L2585-L2593) recommends rejecting unknown names, or dropping them when unknown fields are ignored.\n\nNullable number and string make sense. Librarian's [CONTRIBUTING](https://github.com/googleapis/librarian/blob/984188ef724e707146280a0702a8a8d0e8cfb5f3/CONTRIBUTING.md#becoming-a-contributor) asks contributors to join its team. Does that apply to a one-off template change?"},{"who":"brianquinlan","bot":false,"at":"2026-10-15 16:03","ago":"10d ago","what":"commented","text":"I suspec\n\n> Librarian's [CONTRIBUTING](https://github.com/googleapis/librarian/blob/984188ef724e707146280a0702a8a8d0e8cfb5f3/CONTRIBUTING.md#becoming-a-contributor) asks contributors to join its team. Does that apply to a one-off template change?\n\nI suspect not but we can do the paperwork when you have a PR. It might make sense to show a design, preliminary PR, etc. before you try to get all the details right. Just to make sure that we agree on approach before you write tonnes of code."},{"who":"Yusufihsangorgel","bot":false,"at":"2026-10-21 18:10","ago":"4d ago","what":"commented","text":"I’d propose nullable number and string members, with declared constants carrying both. Unknown integer values in ordinary open enums use JSON numbers and decimal-string query values. This breaks the existing string-only API. Unknown-name decoding remains outside this representation sketch.\n\n```dart\nfinal int? number;\nfinal String? value;\nconst State._(this.number, this.value);\nstatic const ready = State._(1, 'READY'), unknown = State._(123, null);\nObject? toJson() => value ?? number;\nString toQueryValue() => value ?? number!.toString();\n```"}],"note":"Conversation waiting for a reply to make progress.","prd_note":"","set":"B","source":"eval","draft":"respond","why":"Conversation waiting for a reply to make progress.","settings_note":"","agents":[{"who":"Gemini","step":"respond","text":"Reply to Yusufihsangorgel's proposed design sketch for ProtoEnum with feedback so they can proceed."},{"who":"Basic","step":"respond","text":""},{"who":"Claude","step":"respond","text":"Reply to Yusufihsangorgel's 4d-old design proposal (nullable number/string ProtoEnum): confirm the approach or flag concerns, and tell them to go ahead with a preliminary PR."},{"who":"OpenAI","step":"respond","text":"Review Yusufihsangorgel’s enum representation proposal and confirm the approach or request changes before implementation."}]},{"id":"dart-lang/http#2027","url":"https://github.com/dart-lang/http/issues/2027","title":"Tighten `Client.close` semantics","kind":"Issue","state":"open","author":"brianquinlan","labels":[],"assignees":[],"requested":[],"repo_desc":"A composable API for making HTTP requests in Dart.","created":"9d ago","updated":"9d ago","snapshot":"2026-10-25T19:31:42Z","as_of":null,"thumbs_down_at":null,"roles":["author","watches_repo"],"last":"brianquinlan opened this issue 9d ago","stacked_on":null,"related":[],"body":"The current documentation for `Client.close` says:\n\n```dart\n/// Closes the client and cleans up any resources associated with it.\n///\n/// Once [close] is called, no other [Client] methods should be called. If\n/// [close] is called while there are active requests, the behavior is\n/// undefined.\n///\n/// > [!WARNING]\n/// > The behavior is undefined if [close] is not called before the isolate\n/// > that created this [Client], including the main isolate, exits.\nvoid close();\n```\n\nThe problem with the undefined behavior when `close` is called with active requests is that it makes this pattern impossible:\n\n```dart\ntry:\n  client.get(...).timeout(const Duration(seconds: 0));\nfinally:\n  client.close();  // orphaned request may still be running\n```\n\n1. The reason that I made the `close` behavior undefined when there are active requests is because some libraries (e.g. `cronet`) do not support closing when there are active requests. I think that I can fix that by tracking the outstanding requests and only closing the client when they have all finished.\n\nwhich brings up...\n\n2. The reason that I made calling `close` before isolate exit a requirement is because `ffigen`ed Objective-C asynchronous callbacks would cause the VM to exit if they were called on an isolate that had already exited. \n \nSo the fix was to:\n  - Make `close` synchronous (which means that you there can't be active requests for some clients because you can't wait for them to complete)\n  - Make calling `close` before isolate exit a requirement\n\nBut I think that the issue with callbacks on exited isolates causing a VM exit has been fixed in the latest `ffigen`/`jnigen` versions (though I think that memory might leak because native references aren't cleaned up).\n\nUh, maybe we should just bite the bullet and make `close` return a `Future` that must be `await`ed. That would be a breaking change but there are a lot of pending breaking changes for `package:http` so maybe it is time for a 2.0 release. Making `close` async would make it possible for `Client` implementations to wait until requests are actual killed/finished before returning.","timeline":[{"who":"brianquinlan","bot":false,"at":"2026-10-16 15:49","ago":"9d ago","what":"opened this issue","text":""}],"note":"Recent bug filed by file in an area in which I work.","prd_note":"","set":"B","source":"eval","draft":"todo","why":"Recent bug filed by file in an area in which I work.","settings_note":"","agents":[{"who":"Gemini","step":"todo","text":"Design or propose the new API semantics for Client.close or begin an implementation plan for 2.0."},{"who":"Basic","step":"todo","text":""},{"who":"Claude","step":"backlog","text":"Decide whether to tighten Client.close semantics (track outstanding requests vs. make close async in a 2.0 release) and write up the plan or a PR."},{"who":"OpenAI","step":"todo","text":"Investigate current callback behavior and propose whether Client.close should defer cleanup or become asynchronous."}]},{"id":"dart-lang/http#1981","url":"https://github.com/dart-lang/http/issues/1981","title":"Feature request: expose a server trust evaluation hook in CupertinoClient for certificate pinning","kind":"Issue","state":"open","author":"umair9430","labels":[],"assignees":["brianquinlan"],"requested":[],"repo_desc":"A composable API for making HTTP requests in Dart.","created":"54d ago","updated":"5h ago","snapshot":"2026-10-25T19:30:50Z","as_of":null,"thumbs_down_at":null,"roles":["assignee","commenter","watches_repo"],"last":"brianquinlan commented 5h ago","stacked_on":null,"related":[],"body":"`cupertino_http`'s `CupertinoClient` doesn't currently expose any way to customize TLS server trust evaluation — there's no hook equivalent to `URLSessionDelegate`'s `urlSession(_:didReceive:completionHandler:)` for the `NSURLAuthenticationMethodServerTrust` case.\n\n**Use case**: Certificate pinning against a CA higher up the chain than the leaf. For example, AWS explicitly recommends pinning to an Amazon Trust Services *root* CA (not the leaf, and not even the intermediate CA) for ACM-issued certificates, since Amazon now issues from multiple \"dynamic\" intermediate CAs that can rotate unpredictably — see AWS's own guidance: https://aws.amazon.com/blogs/security/amazon-introduces-dynamic-intermediate-certificate-authorities/. Implementing this requires walking the full certificate chain during the TLS handshake to find the pinned CA, which `dart:io`'s `HttpClient.badCertificateCallback` cannot do — it only exposes the leaf certificate via `X509Certificate`, never the intermediates or root.\n\n`cupertino_http` is otherwise a great fit for this — it already streams request/response bodies properly via `URLSession`'s native APIs, unlike `dart:io`'s `HttpClient`. The only missing piece is a way to intercept the trust decision.\n\n**Proposed API** (minimal surface, doesn't require exposing the full delegate):\n\n```dart\nCupertinoClient.fromSessionConfiguration(\n  config,\n  serverTrustEvaluator: (SecTrust trust, String host) => bool,\n);\n```\n\n`cupertino_http` would still own the actual `URLSessionDelegate` internally (preserving its existing streaming/redirect handling); it would just call this closure during its own `didReceive challenge` implementation and act on the returned decision.\n\nHappy to contribute a PR if the maintainers are open to this direction.","timeline":[{"who":"umair9430","bot":false,"at":"2026-09-01 13:31","ago":"54d ago","what":"opened this issue","text":""},{"who":"brianquinlan","bot":false,"at":"2026-09-28 17:01","ago":"27d ago","what":"commented","text":"I'm not sure how this would fit together so I can't promise to accept a PR but I'd be interested in seeing what this would look like. Would you mind writing a skeleton PR for discussion? I doesn't need to include tests, comments, etc. for now."},{"who":"brianquinlan","bot":false,"at":"2026-10-25 14:38","ago":"5h ago","what":"assigned brianquinlan","text":""},{"who":"brianquinlan","bot":false,"at":"2026-10-25 14:39","ago":"5h ago","what":"commented","text":"I've started working on this."}],"note":"Not actionable but recent comment indicates that work is in progress.","prd_note":"","set":"B","source":"eval","draft":"todo","why":"Not actionable but recent comment indicates that work is in progress.","settings_note":"","agents":[{"who":"Gemini","step":"todo","text":"Implement the server trust evaluation hook in cupertino_http and submit a PR."},{"who":"Basic","step":"todo","text":""},{"who":"Claude","step":"todo","text":"Finish the prototype for a server trust evaluator hook in CupertinoClient that you said you started, and share it as a skeleton PR for discussion."},{"who":"OpenAI","step":"todo","text":"Continue implementing the CupertinoClient server trust evaluation hook with secure default behavior."}]},{"id":"googleapis/google-cloud-dart#360","url":"https://github.com/googleapis/google-cloud-dart/issues/360","title":"[google_cloud_rpc] Fix _makeStreamingRequest non-SSE EOF buffering and mid-stream error handling","kind":"Issue","state":"open","author":"kevmoo","labels":[],"assignees":[],"requested":[],"repo_desc":"[Experimental] Google Cloud Dart Client Libraries","created":"37d ago","updated":"17d ago","snapshot":"2026-10-25T17:59:15Z","as_of":null,"thumbs_down_at":null,"roles":["commenter","watches_repo"],"last":"kevmoo commented 17d ago","stacked_on":null,"related":["issue googleapis/librarian#2490 'sidekick(dart generator): Only generate streaming method implementations for white-listed methods': open, by brianquinlan, updated 3mo ago, labels ['sidekick']","PR googleapis/librarian#5533 'feat(dart): support a SSE allowlist': merged, by brianquinlan, updated 10d ago, assignees ['natebosch']","PR googleapis/google-cloud-dart#339 'feat(pubsub): add resilient parallel streaming pull': merged, by sigurdm, updated 5d ago"],"body":"### Context & Problem\n\nWhile PR #339 adds resilient gRPC bidirectional streaming pull specifically for handwritten `pkgs/google_cloud_pubsub`, all generated server-streaming REST RPCs (such as Vertex AI `streamGenerateContent`, Gemini `streamGenerateContent`, and Firestore `Listen`) rely on `ServiceClient._makeStreamingRequest()` in `generated/google_cloud_rpc/lib/service_client.dart` (lines 177–241).\n\nCurrently, `_makeStreamingRequest()` has two runtime issues:\n\n1. **Non-SSE `application/json` Responses Buffer Until EOF (`service_client.dart:210-217`)**:\n   - When `enableSse: false` (or when a Google API returns a chunked JSON array `[obj1, obj2, ...]` with `Content-Type: application/json` instead of `text/event-stream`), lines 213–216 execute:\n     ```dart\n     final responseBody = await response.stream.bytesToString();\n     final json = (jsonDecode(responseBody) as List)\n         .cast<Map<String, dynamic>>();\n     yield* Stream.fromIterable(json);\n     ```\n   - Awaiting `response.stream.bytesToString()` blocks until the entire HTTP stream reaches EOF before decoding or yielding the first item, defeating incremental streaming for non-SSE streaming endpoints (see also `googleapis/librarian#2490` and `googleapis/librarian#5533`).\n\n2. **Mid-Stream SSE Error Frames Are Silently Decoded as Empty Messages (`service_client.dart:230-240`)**:\n   - When `Content-Type: text/event-stream` is active, an HTTP `200 OK` response header is sent before streaming begins. If an error occurs mid-stream (e.g., quota exhaustion, deadline exceeded, or upstream disconnect), Google APIs emit an SSE `data: {\"error\": {\"code\": ..., \"message\": ..., \"status\": ...}}` JSON frame.\n   - Currently, lines 236–238 decode the `data: ` payload and `yield json` directly to the generated method's `.map(ResponseType.fromJson)`. Because `ResponseType` does not have an `error` field, `ResponseType.fromJson` silently ignores the `\"error\"` key and yields a default/empty `ResponseType` message instead of throwing a `ServiceException`.\n\n### Proposed Solution\n\n1. **Detect and Throw `ServiceException` on Mid-Stream Error Payloads**:\n   - In `_makeStreamingRequest()`, inspect each decoded `Map<String, dynamic>` item (both in the SSE `data:` loop and JSON array stream) for a top-level `'error'` object matching `google.rpc.Status` / Google REST error format (matching the check in `ServiceException.fromHttpResponse` in `lib/src/exceptions.dart:105-110`), and throw the corresponding `ServiceException`.\n2. **Incremental Framing for `application/json` Streaming Responses**:\n   - Replace the full-stream `await response.stream.bytesToString()` buffer in the `case 'application/json':` branch with an incremental JSON array element splitter/decoder so elements in `[obj1, obj2, ...]` are yielded as chunks arrive over `response.stream`.\n\n### Acceptance Criteria\n\n- [ ] Mid-stream SSE `data: {\"error\": ...}` frames (and chunked JSON array error elements) throw a `ServiceException` on the returned `Stream` rather than yielding an empty/default response message.\n- [ ] `application/json` streaming responses (`enableSse: false`) yield array elements incrementally as HTTP chunks arrive instead of buffering until EOF.","timeline":[{"who":"kevmoo","bot":false,"at":"2026-09-19 05:56","ago":"37d ago","what":"opened this issue","text":""},{"who":"github-project-automation[bot]","bot":true,"at":"2026-09-19 05:56","ago":"37d ago","what":"added to project v2","text":""},{"who":"github-project-automation[bot]","bot":true,"at":"2026-09-19 05:56","ago":"37d ago","what":"project v2 item status changed","text":""},{"who":"brianquinlan","bot":false,"at":"2026-10-08 21:37","ago":"17d ago","what":"commented","text":"For (1), do you know if servers actually incrementally send JSON? Are you worried about the memory footprint of waiting until the entire result is received?"},{"who":"kevmoo","bot":false,"at":"2026-10-08 22:24","ago":"17d ago","what":"commented","text":"I don't know if servers send incremental JSON. I'm not *worried*. Just...I don't know. Being able to stream results means we can process on the fly and avoid the memory bits.\n\nI won't say this is urgent, just a hole we have!"}],"note":"An issue in a repo that I'm responsible for. The filer is a collaborator. The filer indicated the issue isn't urgent.","prd_note":"","set":"A","source":"eval","draft":"todo","why":"An issue in a repo that I'm responsible for. The filer is a collaborator. The filer indicated the issue isn't urgent.","settings_note":"","agents":[{"who":"Gemini","step":"todo","text":"Decide whether to implement mid-stream error handling and investigate incremental JSON streaming in google_cloud_rpc."},{"who":"Basic","step":"waiting","text":""},{"who":"Claude","step":"todo","text":"Decide how to handle the mid-stream SSE error frames (issue 2, silently yielding empty messages) and whether to defer incremental JSON framing, then reply to kevmoo or file a fix."},{"who":"OpenAI","step":"todo","text":"Triage the streaming gaps: prioritize explicit mid-stream error handling and determine whether incremental JSON decoding is warranted."}]},{"id":"dart-lang/sdk#59846","url":"https://github.com/dart-lang/sdk/issues/59846","title":"[io]: HTTP header parser accepts many invalid characters within header names","kind":"Issue","state":"open","author":"kenballus","labels":["area-vm","library-io","type-bug","triaged"],"assignees":["brianquinlan"],"requested":[],"repo_desc":"The Dart SDK, including the VM, JS and Wasm compilers, analysis, core libraries, and more.","created":"22mo ago","updated":"22mo ago","snapshot":"2026-10-25T19:31:43Z","as_of":null,"thumbs_down_at":null,"roles":["assignee"],"last":"a-siva labeled 22mo ago","stacked_on":null,"related":["issue dart-lang/sdk#1 'Process tests sometimes cause timeout on Linux': closed (completed), by sgjesse, updated 11.4y ago, assignees ['sgjesse']"],"body":"In RFC 9110, the allowable characters within a header name are\r\n> tchar = \"!\" / \"#\" / \"$\" / \"%\" / \"&\" / \"'\" / \"*\" / \"+\" / \"-\" / \".\" /\r\n \"^\" / \"_\" / \"`\" / \"|\" / \"~\" / DIGIT / ALPHA\r\n\r\ndart:io does not enforce this rule. The following characters are incorrectly accepted:\r\n```\r\n\\x00 \\x01 \\x02 \\x03 \\x04 \\x05 \\x06 \\x07 \\x08 \\x0b \\x0c \\x0e \\x0f \\x10 \\x11 \\x12 \\x13 \\x14 \\x15 \\x16 \\x17 \\x18 \\x19 \\x1a \\x1b \\x1c \\x1d \\x1e \\x1f \\x22 \\x28 \\x29 \\x2c \\x2f \\x3a \\x3b \\x3c \\x3d \\x3e \\x3f \\x40 \\x5b \\x5c \\x5d \\x7b \\x7d \\x7f \\x80 \\x81 \\x82 \\x83 \\x84 \\x85 \\x86 \\x87 \\x88 \\x89 \\x8a \\x8b \\x8c \\x8d \\x8e \\x8f \\x90 \\x91 \\x92 \\x93 \\x94 \\x95 \\x96 \\x97 \\x98 \\x99 \\x9a \\x9b \\x9c \\x9d \\x9e \\x9f \\xa0 \\xa1 \\xa2 \\xa3 \\xa4 \\xa5 \\xa6 \\xa7 \\xa8 \\xa9 \\xaa \\xab \\xac \\xad \\xae \\xaf \\xb0 \\xb1 \\xb2 \\xb3 \\xb4 \\xb5 \\xb6 \\xb7 \\xb8 \\xb9 \\xba \\xbb \\xbc \\xbd \\xbe \\xbf \\xc0 \\xdb \\xdc \\xdd \\xde \\xdf \\xe0 \\xe1 \\xe2 \\xe3 \\xe4 \\xe5 \\xe6 \\xe7 \\xe8 \\xe9 \\xea \\xeb \\xec \\xed \\xee \\xef \\xf0 \\xf1 \\xf2 \\xf3 \\xf4 \\xf5 \\xf6 \\xf7 \\xf8 \\xf9 \\xfa \\xfb \\xfc \\xfd \\xfe \\xff\r\n```\r\n\r\nOf particular note is that NUL and some whitespace characters (`\\x0b`) are in this list. This can cause issues with upstream proxies.\r\n\r\n```\r\n$ dart info\r\n...\r\n- Dart 3.6.0-edge.3cc6105316be32e2d48b1b9b253247ad4fc89698 (main) (Fri Aug 30 22:53:32 2024 +0000) on \"linux_x64\"\r\n- on linux / Linux 6.10.2-arch1-2 #1 SMP PREEMPT_DYNAMIC Sat, 03 Aug 2024 17:56:17 +0000\r\n- locale is en_US\r\n```","timeline":[{"who":"kenballus","bot":false,"at":"2025-01-06 19:02","ago":"22mo ago","what":"opened this issue","text":""},{"who":"dart-github-bot","bot":true,"at":"2025-01-06 19:05","ago":"22mo ago","what":"commented","text":"**Summary:** Dart's `dart:io` HTTP header parser accepts invalid characters in header names, violating RFC 9110.  This may cause interoperability issues."},{"who":"dart-github-bot","bot":true,"at":"2025-01-06 19:05","ago":"22mo ago","what":"labeled 'area-core-library'","text":""},{"who":"dart-github-bot","bot":true,"at":"2025-01-06 19:05","ago":"22mo ago","what":"labeled 'triage-automation'","text":""},{"who":"dart-github-bot","bot":true,"at":"2025-01-06 19:05","ago":"22mo ago","what":"labeled 'type-bug'","text":""},{"who":"lrhn","bot":false,"at":"2025-01-07 23:11","ago":"22mo ago","what":"unlabeled 'area-core-library'","text":""},{"who":"lrhn","bot":false,"at":"2025-01-07 23:11","ago":"22mo ago","what":"unlabeled 'triage-automation'","text":""},{"who":"lrhn","bot":false,"at":"2025-01-07 23:11","ago":"22mo ago","what":"labeled 'area-vm'","text":""},{"who":"lrhn","bot":false,"at":"2025-01-07 23:11","ago":"22mo ago","what":"labeled 'library-io'","text":""},{"who":"a-siva","bot":false,"at":"2025-01-08 22:03","ago":"22mo ago","what":"assigned brianquinlan","text":""},{"who":"a-siva","bot":false,"at":"2025-01-08 22:03","ago":"22mo ago","what":"labeled 'triaged'","text":""}],"note":"Assigned to me my a collaborator but inactive. I should probably address this or unassign it.","prd_note":"","set":"B","source":"eval","draft":"backlog","why":"Assigned to me my a collaborator but inactive. I should probably address this or unassign it.","settings_note":"","agents":[{"who":"Gemini","step":"todo","text":"Fix the HTTP header name character validation in dart:io or reassign the issue."},{"who":"Basic","step":"backlog","text":""},{"who":"Claude","step":"todo","text":"Decide whether to fix dart:io's header-name validation to match the RFC 9110 tchar rule (reject NUL, whitespace and other invalid bytes), or unassign myself."},{"who":"OpenAI","step":"todo","text":"Verify current header-name validation and address any remaining acceptance of invalid characters, including proxy parsing security risks."}]},{"id":"googleapis/google-cloud-dart#361","url":"https://github.com/googleapis/google-cloud-dart/issues/361","title":"[google_cloud_compute_v1] Switch to specification_format: discovery and wire CommonDiscovery LRO pollers","kind":"Issue","state":"open","author":"kevmoo","labels":[],"assignees":[],"requested":[],"repo_desc":"[Experimental] Google Cloud Dart Client Libraries","created":"36d ago","updated":"16d ago","snapshot":"2026-10-25T17:52:30Z","as_of":null,"thumbs_down_at":null,"roles":["commenter","mentioned","watches_repo"],"last":"brianquinlan commented 16d ago","stacked_on":null,"related":["PR googleapis/google-cloud-dart#323 'feat(google_cloud_compute_v1): initial commit': merged, by brianquinlan, updated 2mo ago, assignees ['natebosch']","PR googleapis/google-cloud-dart#345 'feat(dns): initial support': draft open, by brianquinlan, updated 45d ago","issue googleapis/google-cloud-dart#28 'provide facilities to make it easier for users to poll for the results of LROs': open, by devoncarew, updated 37d ago, labels ['type: feature request']"],"body":"### Context & Problem\n\n`google_cloud_compute_v1` (landed in #323) is currently configured in `librarian.yaml` (lines 281–293) without `specification_format: discovery`. As a result, `librarian` derives `google/cloud/compute/v1` and generates `google_cloud_compute_v1` from `google/cloud/compute/v1/compute.proto` (`SpecificationFormat: protobuf`).\n\nHowever, Compute Engine does not use `google.longrunning.Operations`. In `compute.proto`, long-running operations return `google.cloud.compute.v1.Operation` and are annotated with `google.cloud.operation_service` extensions (`ZoneOperations`, `RegionOperations`, `GlobalOperations`, `GlobalOrganizationOperations`), which `internal/sidekick/parser/protobuf.go` does not parse into `api.Method.OperationInfo` or `DiscoveryLro`.\n\nBy contrast, in `googleapis/librarian`:\n- `internal/serviceconfig/sdk.yaml:436-438` maps `google/cloud/compute/v1` to `discovery: discoveries/compute.v1.json`.\n- `internal/sidekick/parser/discovery/lro.go` (`lroAnnotations`) populates `api.Method.DiscoveryLro` (`PollingPathParameters`) and injects service-scoped `getOperation` poller methods (`IsLroPoller: true`) when `modelConfig.Discovery` (`*api.Discovery`) is configured via `CommonDiscovery` (`internal/config/discovery.go`, as used by `internal/librarian/rust/codec.go:96-108` and `internal/librarian/swift/generate.go:149-161`).\n- PR #345 (`google_cloud_dns_v1`) already introduces `sources.discovery` and `specification_format: discovery` in `librarian.yaml` for Dart.\n\n### Proposed Solution\n\n1. **Support `SpecDiscovery` and `CommonDiscovery` in `googleapis/librarian` (`internal/librarian/dart/codec.go` & `internal/config/`)**:\n   - Update `toModelConfig` in `internal/librarian/dart/codec.go` (lines 31–66) to accept `config.SpecDiscovery` and resolve `SpecificationSource = svcConfig.Discovery` (`\"discoveries/compute.v1.json\"`, matching `internal/librarian/rust/codec.go:46-53`).\n   - Add `Discovery *CommonDiscovery` (`yaml:\"discovery,omitempty\"`) to `config.DartPackage` and map `library.Dart.Discovery` (`OperationID` and `Pollers`) to `modelConfig.Discovery` in `internal/librarian/dart/codec.go` (matching `internal/librarian/rust/codec.go:96-108`).\n2. **Update `google_cloud_compute_v1` in `librarian.yaml`**:\n   - Switch `google_cloud_compute_v1` to `specification_format: discovery` with `roots: [discovery, googleapis]` and configure `dart.discovery` poller mappings:\n     ```yaml\n     dart:\n       discovery:\n         operation_id: .google.cloud.compute.v1.Operation\n         pollers:\n           - prefix: compute/v1/projects/{project}/zones/{zone}\n             method_id: .google.cloud.compute.v1.zoneOperations.get\n           - prefix: compute/v1/projects/{project}/regions/{region}\n             method_id: .google.cloud.compute.v1.regionOperations.get\n           - prefix: compute/v1/projects/{project}/global\n             method_id: .google.cloud.compute.v1.globalOperations.get\n           - prefix: compute/v1/locations/global\n             method_id: .google.cloud.compute.v1.globalOrganizationOperations.get\n     ```\n3. **Wire `DiscoveryLro` Poller Generation in `sidekick/dart` (for #28)**:\n   - Use the injected `IsLroPoller` (`getOperation`) mixin and `api.Method.DiscoveryLro.PollingPathParameters` (`project`, `zone`, `region`, `operation`) in `internal/sidekick/dart/annotate.go` so Compute Engine mutations (`Instances.insert`, `Disks.insert`, etc.) expose typed LRO polling helpers alongside standard `google.longrunning.Operation` methods (#28).\n\n### Acceptance Criteria\n\n- [ ] `internal/librarian/dart/codec.go` in `googleapis/librarian` supports `specification_format: discovery` (`SpecificationSource = svcConfig.Discovery`) and `dart.discovery` (`CommonDiscovery` pollers).\n- [ ] `google_cloud_compute_v1` in `librarian.yaml` uses `specification_format: discovery` (`discoveries/compute.v1.json`) with `zoneOperations`, `regionOperations`, `globalOperations`, and `globalOrganizationOperations` pollers configured.\n- [ ] Compute Engine LRO methods expose `DiscoveryLro` polling helpers for #28.","timeline":[{"who":"kevmoo","bot":false,"at":"2026-09-19 05:57","ago":"36d ago","what":"opened this issue","text":""},{"who":"github-project-automation[bot]","bot":true,"at":"2026-09-19 05:57","ago":"36d ago","what":"added to project v2","text":""},{"who":"github-project-automation[bot]","bot":true,"at":"2026-09-19 05:57","ago":"36d ago","what":"project v2 item status changed","text":""},{"who":"brianquinlan","bot":false,"at":"2026-10-08 21:34","ago":"17d ago","what":"commented","text":"Is the problem that the generated `Operation` classes aren't idiomatic?\n\nBecause they are useable, e.g., https://github.com/googleapis/google-cloud-dart/blob/11a532d4a10a20bf23b5961a6a8558dacbe5edff/generated/google_cloud_compute_v1/test/address_test.dart#L63"},{"who":"kevmoo","bot":false,"at":"2026-10-08 21:59","ago":"17d ago","what":"commented","text":"@brianquinlan Yes, exactly! Manual polling via `operationsService.get` works and is perfectly usable, but it isn't idiomatic compared to the `op.wait()` polling helpers generated for services returning standard `google.longrunning.Operation`.\n\nBecause `internal/sidekick/parser/protobuf.go` doesn't currently parse the `google.cloud.operation_service` annotations (`ZoneOperations`, `RegionOperations`, etc.) used in `compute.proto`, `sidekick` treats Compute operations as standard RPC responses. This forces clients to write manual `while(true)` polling loops with explicit `Future.delayed` and `status == Operation_Status.done` checks, as seen in `address_test.dart`.\n\nIf we switch Compute Engine to `specification_format: discovery` in `librarian.yaml` and configure the `CommonDiscovery` LRO pollers, `internal/sidekick/parser/discovery/lro.go` will correctly map these to `api.Method.DiscoveryLro`. This gives us the necessary AST data to wire up idiomatic polling helpers for Compute Engine in `sidekick/dart` (resolving #28), bringing it to parity with how Rust and Swift handle Compute LROs."},{"who":"brianquinlan","bot":false,"at":"2026-10-09 17:56","ago":"16d ago","what":"commented","text":"I remember generating the discovery version of `compute_v1` and it had a **much** bigger API surface than the proto version because of the synthetic classes. I wish that I had kept the numbers but I remember it being something like 60% larger and, IMO, harder to navigate.\n\nDo you think that we'd be better switching to discovery or adding some convenience extensions to the service operations? \n\nIn my mind, the most compelling reason to go with the discovery version of compute is that other generated code is using that version. But the actual API is less pleasant."}],"note":"Issue created by a close collaborator in a repo that I am responsible for. In the last comment I asked a question that hasn't been answered yet.","prd_note":"","set":"A","source":"eval","draft":"waiting","why":"Issue created by a close collaborator in a repo that I am responsible for. In the last comment I asked a question that hasn't been answered yet.","settings_note":"","agents":[{"who":"Gemini","step":"waiting","text":"Wait for kevmoo to respond to my question regarding switching to discovery vs. adding convenience extensions."},{"who":"Basic","step":"waiting","text":""},{"who":"Claude","step":"waiting","text":"Wait for kevmoo to answer my question on whether to switch Compute to discovery or add convenience extensions to the proto-based service operations; follow up if he stays quiet."},{"who":"OpenAI","step":"waiting","text":"Wait for kevmoo’s view on switching to Discovery versus adding convenience extensions to the existing operations API."}]},{"id":"dart-lang/sdk#31275","url":"https://github.com/dart-lang/sdk/issues/31275","title":"dart:io HttpClient.post throws uncatch-able exception","kind":"Issue","state":"open","author":"Pacane","labels":["area-vm","library-io","P2","type-bug"],"assignees":[],"requested":[],"repo_desc":"The Dart SDK, including the VM, JS and Wasm compilers, analysis, core libraries, and more.","created":"9.0y ago","updated":"20mo ago","snapshot":"2026-10-25T17:52:33Z","as_of":null,"thumbs_down_at":null,"roles":["mentioned"],"last":"lrhn labeled 20mo ago","stacked_on":null,"related":[],"body":"I have this issue where I use `dart:io`'s `HttpClient` to post data `client.post` and that the post throws the following exception:\r\n\r\n```dart\r\n      if (_nextResponseCompleter == null) {\r\n        throw new HttpException(\r\n            \"Unexpected response (unsolicited response without request).\",\r\n            uri: _currentUri);\r\n      }\r\n```\r\n(from http_impl.dart)\r\n\r\nwhen I try to put the `client.post` in a try-catch block, the exception doesn't bubble up in my catch. Instead, it goes up until it's uncaught and make my program crash.\r\n\r\nwith the help of @floitschG I could successfully catch the error by issuing my `client.post` in a `runZoned`, but this shouldn't be necessary.\r\n\r\nThis bug affected our system in production and made our server crash.","timeline":[{"who":"Pacane","bot":false,"at":"2017-11-03 17:18","ago":"9.0y ago","what":"opened this issue","text":""},{"who":"floitschG","bot":false,"at":"2017-11-03 17:18","ago":"9.0y ago","what":"labeled 'area-library'","text":""},{"who":"floitschG","bot":false,"at":"2017-11-03 17:18","ago":"9.0y ago","what":"labeled 'library-io'","text":""},{"who":"floitschG","bot":false,"at":"2017-11-03 17:39","ago":"9.0y ago","what":"commented","text":"@zanderso : I looked a little bit into this.\r\nThe problem is that this exception is thrown from within the `listen` to a `_httpParser`. This means that the user can't ever catch this error:\r\n\r\n``` dart\r\n    _subscription = _httpParser.listen((incoming) {\r\n      // Only handle one incoming response at the time. Keep the\r\n      // stream paused until the response have been processed.\r\n      _subscription.pause();\r\n      // We assume the response is not here, until we have send the request.\r\n      if (_nextResponseCompleter == null) {\r\n        throw new HttpException(\r\n            \"Unexpected response (unsolicited response without request).\",\r\n            uri: _currentUri);\r\n      }\r\n```\r\n\r\nThe big question is: how should this error be reported?. Just throwing isn't good enough, since it would never reach the user. The surrounding code doesn't give me enough information.\r\n\r\nWhen can `_nextResponseCompleter == null` be true?\r\nIf it is `null` did we already report an error (or success), and should we then just ignore the error? (still better than crashing the VM).\r\n\r\n@Pacane could you provide some feedback on how this was happening?\r\nWhat client/server interaction seems to trigger this?"},{"who":"Pacane","bot":false,"at":"2017-11-03 18:19","ago":"9.0y ago","what":"commented","text":"So this happens when I do a post request to a remote server, and the server gives a 408 response (Request Timeout).\r\n\r\nWhen the server returns the 408, `_nextResponseCompleter == null` is true, and the exception is thrown.\r\n\r\nThe production had this pattern\r\n\r\n```dart\r\nconnect() async {\r\n     var client = getSomeClient();\r\n     try {\r\n          HttpClientRequest request = await client.postUrl(connUri);\r\n          // more code\r\n     catch(e) {\r\n          retryConnectWithSomeDelay();\r\n     }\r\n}\r\n```\r\n\r\nFor some reason, when I do this\r\n\r\n```dart\r\nconnect() async {\r\n     var client = getSomeClient();\r\n     try {\r\n          HttpClientRequest request = await client.postUrl(connUri);\r\n          // more code\r\n     catch(e) {\r\n          retryConnectWithSomeDelay();\r\n     }\r\n}\r\n```\r\nthe error happens. But if I close the client before retrying:\r\n\r\n```dart\r\nconnect() async {\r\n     var client = getSomeClient();\r\n     try {\r\n          HttpClientRequest request = await client.postUrl(connUri);\r\n          // more code\r\n     catch(e) {\r\n          __client.close();__\r\n          retryConnectWithSomeDelay();\r\n     }\r\n}\r\n```\r\n\r\nI have no error.\r\n\r\nNote that I can freely remove the `retryConnectWithSomeDelay()` and get essentially the same behaviour. In other words, the minimal code needed to reproduce this (omitting some details like certificates and [I think] other irrelevant stuff) is:\r\n\r\n```dart\r\nconnect() async {\r\n     var client = getSomeClient();\r\n     HttpClientRequest request = await client.postUrl(connUri);\r\n}\r\n```\r\n\r\nwith a server returning a 408. When I debugged the _HttpClientConnection, when the exception was gonna be thrown, the `incoming` value from the `_httpParser.listen()` was:\r\n\r\n![image](https://user-images.githubusercontent.com/2762440/32389745-0b8f891c-c0a2-11e7-9a29-4641f23ac349.png)\r\n\r\nNote that this server returning the 408 is a 3rd party server that I don't have access to unfortunately."},{"who":"Schwusch","bot":false,"at":"2020-04-19 09:31","ago":"6.5y ago","what":"commented","text":"I get this when using the [Dart AWS Lambda Runtime](https://github.com/awslabs/aws-lambda-dart-runtime) in the [lambci/lambda:provided](https://github.com/lambci/docker-lambda) Docker image in the [AWS SAM CLI tool](https://github.com/awslabs/aws-sam-cli):\r\n```\r\nUnhandled exception:\r\nHttpException: Unexpected response (unsolicited response without request).\r\n```\r\nThe server interacting with the Dart HTTP client is a [Go server](https://github.com/lambci/docker-lambda/blob/master/provided/run/init.go). \r\nSpecifically the [postInvocationError](https://github.com/awslabs/aws-lambda-dart-runtime/blob/master/lib/client/client.dart#L149..L158) request that is handled by the [handleErrorRequest](https://github.com/lambci/docker-lambda/blob/20bcae1af655c22796ccf7dd11772a4b5defff66/provided/run/init.go#L538) function gives the \"Unexpected response\" exception."},{"who":"zanderso","bot":false,"at":"2020-04-20 16:20","ago":"6.5y ago","what":"commented","text":"@ZichangG @sortie"},{"who":"zichangg","bot":false,"at":"2020-04-21 00:53","ago":"6.5y ago","what":"commented","text":"```dart\r\n      if (incoming.statusCode == 100) {\r\n        // some codes\r\n      } else {\r\n        _nextResponseCompleter.complete(incoming);\r\n        _nextResponseCompleter = null;\r\n      }\r\n```\r\n\r\n```dart\r\n          if (!closing &&\r\n              !_dispose &&\r\n              incoming.headers.persistentConnection &&\r\n              request.persistentConnection) {\r\n            // Return connection, now we are done.\r\n            _httpClient._returnConnection(this);\r\n            _subscription.resume();\r\n          } else {\r\n            destroy();\r\n          }\r\n```\r\n\r\nI'm not confident whether this is a bug. In our implementation, if `statusCode != 100`, we complete with `incoming` and set `_nextResponseCompleter` to `null`. Because of persistent connection, it resumes the subscription so the next `incoming` arrived and `_nextResponseCompleter` is `null`. \r\nIs this behavior correct?"},{"who":"Schwusch","bot":false,"at":"2020-04-21 18:15","ago":"6.5y ago","what":"commented","text":"I'm wondering whether it's a bug in the failing request or the request that came before.\r\nIs there a possibility that the previous request is causing the unexpected response?\r\nHow is this handled in other languages?"},{"who":"zichangg","bot":false,"at":"2020-04-21 22:25","ago":"6.5y ago","what":"commented","text":"According to [RFC](https://tools.ietf.org/html/rfc7231#section-6.5.7),\r\n\r\n>  A server SHOULD send the \"close\" connection option\r\n   (Section 6.1 of [RFC7230]) in the response, since 408 implies that\r\n   the server has decided to close the connection rather than continue\r\n   waiting.\r\n\r\nThis looks like the case where server didn't explicitly close.\r\n\r\n@Schwusch or @Pacane Could you please try my patch(https://dart-review.googlesource.com/c/sdk/+/144346) to see whether it worked?"},{"who":"Schwusch","bot":false,"at":"2020-04-22 07:11","ago":"6.5y ago","what":"commented","text":"@zichangg I'll make an attempt to download the patchset and build the SDK today, or is there a build artifact or alike from the CI/CD?"},{"who":"Schwusch","bot":false,"at":"2020-04-22 10:01","ago":"6.5y ago","what":"commented","text":"@zichangg It worked when I tested it! You're awesome :1st_place_medal:"},{"who":"zichangg","bot":false,"at":"2020-04-23 21:44","ago":"6.5y ago","what":"commented","text":"@Schwusch Thanks! I'll try to get it landed asap."},{"who":"zichangg","bot":false,"at":"2020-04-23 21:44","ago":"6.5y ago","what":"assigned zichangg","text":""},{"who":"sortie","bot":false,"at":"2020-05-05 13:34","ago":"6.5y ago","what":"labeled 'P2'","text":""},{"who":"sortie","bot":false,"at":"2020-05-05 13:34","ago":"6.5y ago","what":"labeled 'type-bug'","text":""},{"who":"rmacnak-google","bot":false,"at":"2020-10-30 23:15","ago":"6.0y ago","what":"unassigned zichangg","text":""},{"who":"gencto","bot":false,"at":"2024-01-09 17:11","ago":"2.8y ago","what":"commented","text":"@zichangg Hi, will this fix be implemented into the current SDK?"},{"who":"parlough","bot":false,"at":"2024-01-09 17:23","ago":"2.8y ago","what":"commented","text":"zichangg is no longer on the Dart team.\r\n\r\nSomeone else could take over their original (now abandoned) CL, or use it as inspiration: https://dart-review.googlesource.com/c/sdk/+/144346\r\n\r\n\\cc @brianquinlan Who is the new owner of this library."},{"who":"kevmoo","bot":false,"at":"2024-04-11 00:01","ago":"2.5y ago","what":"commented","text":"I would LOVE this to be taken up. I'm hitting this myself! CC @brianquinlan"},{"who":"lrhn","bot":false,"at":"2025-02-13 14:17","ago":"20mo ago","what":"unlabeled 'area-core-library'","text":""},{"who":"lrhn","bot":false,"at":"2025-02-13 14:17","ago":"20mo ago","what":"labeled 'area-vm'","text":""}],"note":"Seemingly important issue where I was explicitly CCed as the last comment. But the last comment is very old and I am not assigned.","prd_note":"","set":"A","source":"eval","draft":"not_yours","why":"Seemingly important issue where I was explicitly CCed as the last comment. But the last comment is very old and I am not assigned.","settings_note":"","agents":[{"who":"Gemini","step":"backlog","text":"Investigate resurrecting CL 1443 est body streams, but because `hasBytesAvailable` returns `YES`, it calls [read:maxLength](https://github.com/dart-lang/native/blob/3cbe319e3c1ec0f9253c126ba3e465e55229c3a4/pkgs/objective_c/src/input_stream_adapter.m#L131) on its single, process-wide `com.apple.NSURLConnectionLoader thread`, which [waits](https://github.com/dart-lang/native/blob/3cbe319e3c1ec0f9253c126ba3e465e55229c3a4/pkgs/objective_c/src/input_stream_adapter.m#L163) until the Dart stream provides data. Until then, no other NSURLSession request in the process can make progress. `package:cupertino_http` sends StreamedRequest bodies this way.\n\nTo reproduce, add this to pkgs/objective_c/test/ns_input_stream_test.dart:\n\n```dart\ntest('hasBytesAvailable when scheduled in a run loop', () {\n  final controller = StreamController<List<int>>();\n  final inputStream = controller.stream.toNSInputStream();\n  addTearDown(inputStream.close);\n  inputStream.scheduleInRunLoop(\n    NSRunLoop.getCurrentRunLoop(),\n    forMode: 'kCFRunLoopDefaultMode'.toNSString(),\n  );\n  inputStream.open();\n  expect(inputStream.hasBytesAvailable, isFalse);\n});\n```","timeline":[{"who":"brianquinlan","bot":false,"at":"2026-10-19 23:58","ago":"6d ago","what":"opened this issue","text":""},{"who":"brianquinlan","bot":false,"at":"2026-10-19 23:58","ago":"6d ago","what":"labeled 'lang-objective_c'","text":""},{"who":"brianquinlan","bot":false,"at":"2026-10-19 23:58","ago":"6d ago","what":"labeled 'package:objective_c'","text":""},{"who":"brianquinlan","bot":false,"at":"2026-10-19 23:58","ago":"6d ago","what":"labeled 'needs-triage'","text":""},{"who":"brianquinlan","bot":false,"at":"2026-10-19 23:58","ago":"6d ago","what":"assigned brianquinlan","text":""}],"note":"","prd_note":"","set":"B","source":"eval","draft":"elsewhere","why":"","settings_note":"","agents":[{"who":"Gemini","step":"elsewhere","text":"Follow up on PR dart-lang/native#3763 which fixes this issue."},{"who":"Basic","step":"elsewhere","text":""},{"who":"Claude" "step":"not_yours","text":"None; this is an automated PR in dart-lang/tools requested to a team rather than me personally."},{"who":"Basic","step":"not_yours","text":""},{"who":"Claude","step":"not_yours","text":"Nothing to do; this is a team review request in dart-lang/tools, which I'm not responsible for, so leave it to the rest of dart-ecosystem-team."},{"who":"OpenAI","step":"not_yours","text":"Leave this update for the dart-ecosystem-team reviewers; no personal action is required."}]},{"id":"googleapis/google-cloud-dart#381","url":"https://github.com/googleapis/google-cloud-dart/issues/381","title":"[google_cloud_rpc] fromHttpResponse puts the HTTP status into Status.code and drops the google.rpc.Code, so ABORTED is never retried over REST","kind":"Issue","state":"open","author":"quaaantumdev","labels":[],"assignees":[],"requested":[],"repo_desc":"[Experimental] Google Cloud Dart Client Libraries","created":"3d ago","updated":"3d ago","snapshot":"2026-10-25T17:52:34Z","as_of":null,"thumbs_down_at":null,"roles":["watches_repo"],"last":"quaaantumdev opened this issue 3d ago","stacked_on":null,"related":["PR googleapis/google-cloud-dart#382 [linked: closes/closed-by] 'fix(google_cloud_rpc): use the google.rpc.Code of JSON errors in Status.code': open, by quaaantumdev, updated 3d ago"],"body":"## Summary\n\nFor an error received as JSON, `ServiceException.fromHttpResponse` puts the HTTP status code into `ServiceException.status.code`. The `google.rpc.Code` the service reported, which the JSON error carries by name in `status`, is dropped.\n\n`Status.code` is documented as \"an enum value of `google.rpc.Code`\", and the rest of the package already treats it that way:\n\n- The gRPC error mapping in `google_cloud_pubsub` (`_mapGrpcError`) puts the gRPC code there. Its comment says this matches how `fromHttpResponse` fills it for REST errors, but it doesn't.\n- `ExponentialRetry.isRetryable` reads `status.code`, for example `ConflictException(:final status) => status?.code == 10`. Over REST that value is 409, so an `ABORTED` error is never retried.\n\n## Why it matters\n\nSeveral `google.rpc.Code`s share an HTTP status, and only the name tells them apart:\n\n| HTTP | `status` | for example (Firestore `commit`) |\n|---|---|---|\n| 400 | `FAILED_PRECONDITION` | \"the stored version (…) does not match the required base version (…)\" |\n| 400 | `INVALID_ARGUMENT` | \"Invalid transaction.\" |\n| 409 | `ABORTED` | \"Aborted due to cross-transaction contention. …\" |\n| 409 | `ALREADY_EXISTS` | \"Document already exists: …\" |\n\nThese are real responses from `google_cloud_firestore_v1` 0.5.5 `commit` calls. As things stand, a client can't tell a transaction it should retry (`ABORTED`) from a write that can never succeed (`ALREADY_EXISTS`), or a stale precondition from a malformed request, except by parsing the message.\n\n## Reproduction\n\n```dart\nimport 'package:google_cloud_rpc/exceptions.dart';\nimport 'package:google_cloud_rpc/retry.dart';\nimport 'package:http/http.dart' as http;\n\nvoid main() {\n  const body = '{\"error\": {\"code\": 409, \"message\": \"Aborted due to cross-transaction contention.\", \"status\": \"ABORTED\"}}';\n  final e = ServiceException.fromHttpResponse(http.Response(body, 409), body);\n  print(e.status!.code); // 409, expected 10\n  print(const ExponentialRetry().isRetryable(e)); // false, expected true\n}\n```\n\n## Proposed fix\n\nIn `fromHttpResponse`, set `Status.code` to the `google.rpc.Code` named by the error's `status`, and keep the HTTP status code when `status` is missing or unknown. `ServiceException.statusCode` still has the HTTP status code.\n\nThis changes `status.code` for JSON errors that name their code (400 becomes 3, and so on), so code that compared it with an HTTP status would need `statusCode` instead. Errors without a `status`, such as Cloud Storage's JSON API errors, are unaffected. PR: #382.\n\nVersions: google_cloud_rpc 0.6.0 (`main` has the same code), google_cloud_firestore_v1 'feat(google_cloud_rpc): extract shared RetryRunner and ExponentialRetry': merged, by sigurdm, updated 27d ago","PR googleapis/google-cloud-dart#353 'feat(google_cloud_pubsub): add Pub/Sub retry configuration and gRPC error mapping': merged, by sigurdm, updated 17d ago","issue googleapis/google-cloud-dart#346 'Share retry logic between google_cloud_pubsub and google_cloud_storage (before pubsub 1.0)': closed (completed), by sigurdm, updated 27d ago","issue googleapis/google-cloud-dart#80 '`AutoPopulated` fields not supported': open, by brianquinlan, updated 10d ago"],"body":"### Context & Problem\n\nPR #352 extracts `RetryRunner`, `ExponentialRetry`, `NoDelayRetry`, and `defaultIsRetryable` into `package:google_cloud_rpc/retry.dart` (`keep:` list) so `google_cloud_storage` and `google_cloud_pubsub` (#353) can share a common retry implementation (#346).\n\nHowever, three transport and codegen gaps remain before `RetryRunner` can reliably protect all 20+ generated REST client packages in `generated/*`:\n\n1. **`ServiceClient._makeRequest()` Does Not Invoke `RetryRunner` or Accept `RequestOptions`**:\n   - `ServiceClient._makeRequest()` in `generated/google_cloud_rpc/lib/service_client.dart` still executes raw `http.Client.send` calls without invoking `RetryRunner`, and provides no mechanism for callers to configure client-level retry policies, per-call timeouts, or custom headers (`RequestOptions`).\n   - By contrast, sibling `sidekick`-generated SDKs (`google-cloud-rust` and `google-cloud-swift`) wrap every generated client transport in a `RetryLoop` consulting a client-level `RetryPolicy` and per-call `RequestOptions`.\n\n2. **Bug: `ServiceException.fromHttpResponse` Throws `FormatException` on HTML `502`/`503`/`504` Responses (Bypassing `RetryRunner`)**:\n   - In `generated/google_cloud_rpc/lib/src/exceptions.dart:60`, `ServiceException.fromHttpResponse(http.Response response, String body)` calls `JsonDecode(body)` whenever `body.isNotEmpty` without catching `FormatException`.\n   - When a Google Front End (GFE) or load balancer returns a transient `502 Bad Gateway`, `503 Service Unavailable`, or `504 Gateway Timeout` with an HTML error page (`<html>...`), `JsonDecode(body)` throws an uncaught `FormatException` **before `ServiceException` is constructed**.\n   - Because `defaultIsRetryable` in `retry.dart` (#352) checks `if (error is ServiceException)` (`500`, `502`, `503`, `504`, `408`, `429`), an uncaught `FormatException` completely bypasses `RetryRunner` on gateway errors.\n\n<del>\n3. **AIP-4222 `x-goog-request-params` Routing Headers & AIP-155 Auto-Populated `request_id` UUIDv4 (`sidekick/dart`)**:\n   - `sidekick/api` (`routing_info.go`) already parses `google.api.routing` annotations into `api.Method.Routing` and `auto_populated_fields` (`request_id` UUIDv4) into `api.Method.AutoPopulated`, and `sidekick/rust` emits both, whereas `sidekick/dart` currently drops them.\n   - Emitting `x-goog-request-params` is required by [AIP-4222](https://google.aip.dev/client-libraries/4222) for regional/tenant routing, and auto-populating empty `request_id` fields with a UUIDv4 ([AIP-155](https://google.aip.dev/155) / [AIP-4235](https://google.aip.dev/client-libraries/4235)) makes mutating `POST` RPCs idempotent so `RetryRunner` can safely retry them on transient failures.\n<\/del>\n\n### Proposed Solution\n\n1. **Harden `ServiceException.fromHttpResponse` and Extend `ServiceClient` in `package:google_cloud_rpc`**:\n   - Wrap `JsonDecode(body)` in `ServiceException.fromHttpResponse` (`exceptions.dart:60`) in a `try / on FormatException` block that falls back to constructing the status-code-mapped `ServiceException` with `response.reasonPhrase ?? body` when the error payload is non-JSON/HTML.\n   - Add an optional `RetryRunner retry` parameter to `ServiceClient({...})` (defaulting to `const NoDelayRetry()` or per-service defaults passed by generated clients).\n   - Add a `RequestOptions` class in `package:google_cloud_rpc` supporting per-call `Duration? timeout`, `RetryRunner? retry`, and `Map<String, String>? headers`.\n   - Update `ServiceClient._makeRequest()` to execute requests through `(options?.retry ?? this.retry).run(...)` with optional timeout enforcement.\n2. **Update `sidekick/dart` Generator Templates (`googleapis/librarian`)**:\n   - Pass service-specific retry defaults (from service config / `librarian.yaml`) when constructing `ServiceClient`.\n   - Add an optional `RequestOptions? options` parameter to generated RPC methods in `method.mustache`.\n   - Emit `x-goog-request-params` headers from `api.Method.Routing` ([AIP-4222](https://google.aip.dev/client-libraries/4222)) and auto-populate unset `request_id` fields (`api.Method.AutoPopulated`) with a UUIDv4 before entering `RetryRunner`.\n\n### Acceptance Criteria\n\n- [ ] `ServiceException.fromHttpResponse` gracefully handles non-JSON/HTML `502`/`503`/`504` error bodies without throwing `FormatException`, allowing `RetryRunner` to retry gateway errors.\n- [ ] `ServiceClient` in `package:google_cloud_rpc` supports `RetryRunner` and per-request `RequestOptions`.\n- [ ] Generated REST clients in `generated/*` support configurable retry policies, per-call `RequestOptions`, `x-goog-request-params` routing headers, and auto-populated `request_id` UUIDs.","timeline":[{"who":"kevmoo","bot":false,"at":"2026-09-18 22:35","ago":"37d ago","what":"opened this issue","text":""},{"who":"github-project-automation[bot]","bot":true,"at":"2026-09-18 22:35","ago":"37d ago","what":"added to project v2","text":""},{"who":"github-project-automation[bot]","bot":true,"at":"2026-09-18 22:35","ago":"37d ago","what":"project v2 item status changed","text":""},{"who":"brianquinlan","bot":false,"at":"2026-10-09 00:14","ago":"17d ago","what":"assigned brianquinlan","text":""},{"who":"brianquinlan","bot":false,"at":"2026-10-09 00:21","ago":"17d ago","what":"commented","text":"Retry examples:\n\nGo:\n```golang\npackage main\n\nimport (\n\t\"context\"\n\t\"time\"\n\n\tsecretmanager \"cloud.google.com/go/secretmanager/apiv1\"\n\t\"cloud.google.com/go/secretmanager/apiv1/secretmanagerpb\"\n\t\"github.com/googleapis/gax-go/v2\"\n\t\"google.golang.org/grpc/codes\"\n)\n\nfunc example(ctx context.Context) error {\n\tclient, err := secretmanager.NewClient(ctx)\n\tif err != nil {\n\t\treturn err\n\t}\n\tdefer client.Close()\n\n\t// 1. Client-level (per-method) override on CallOptions:\n\tclient.CallOptions.GetSecret = []gax.CallOption{\n\t\tgax.WithRetry(func() gax.Retryer {\n\t\t\treturn gax.OnCodes([]codes.Code{\n\t\t\t\tcodes.Unavailable,\n\t\t\t\tcodes.DeadlineExceeded,\n\t\t\t}, gax.Backoff{\n\t\t\t\tInitial:    100 * time.Millisecond,\n\t\t\t\tMax:        10 * time.Second,\n\t\t\t\tMultiplier: 1.3,\n\t\t\t})\n\t\t}),\n\t}\n\n\t// 2. Per-call override via variadic gax.CallOption:\n\treq := &secretmanagerpb.GetSecretRequest{Name: \"projects/my-project/secrets/my-secret\"}\n\tsecret, err := client.GetSecret(\n\t\tctx,\n\t\treq,\n\t\tgax.WithTimeout(30*time.Second),\n\t\tgax.WithRetry(func() gax.Retryer {\n\t\t\t// Return a fresh Retryer per call (Retryer is stateful)\n\t\t\treturn gax.OnHTTPCodes(gax.Backoff{\n\t\t\t\tInitial:    500 * time.Millisecond,\n\t\t\t\tMax:        30 * time.Second,\n\t\t\t\tMultiplier: 2.0,\n\t\t\t}, 429, 502, 503, 504)\n\t\t}),\n\t)\n\t_ = secret\n\treturn err\n}\n```\n\nJava:\n```java\nimport com.google.api.gax.httpjson.HttpJsonCallContext;\nimport com.google.api.gax.retrying.RetrySettings;\nimport com.google.api.gax.rpc.StatusCode;\nimport com.google.cloud.secretmanager.v1.GetSecretRequest;\nimport com.google.cloud.secretmanager.v1.Secret;\nimport com.google.cloud.secretmanager.v1.SecretManagerServiceClient;\nimport com.google.cloud.secretmanager.v1.SecretManagerServiceSettings;\nimport java.time.Duration;\nimport java.util.Set;\n\npublic class RetryExample {\n  public static void main(String[] args) throws Exception {\n    // 1. Client-level (per-method) configuration via Settings Builder:\n    SecretManagerServiceSettings.Builder settingsBuilder =\n        SecretManagerServiceSettings.newHttpJsonBuilder();\n\n    settingsBuilder\n        .getSecretSettings()\n        .setRetryableCodes(\n            StatusCode.Code.UNAVAILABLE,\n            StatusCode.Code.DEADLINE_EXCEEDED)\n        .setRetrySettings(\n            RetrySettings.newBuilder()\n                .setInitialRetryDelayDuration(Duration.ofMillis(100))\n                .setRetryDelayMultiplier(1.3)\n                .setMaxRetryDelayDuration(Duration.ofSeconds(60))\n                .setInitialRpcTimeoutDuration(Duration.ofSeconds(20))\n                .setMaxRpcTimeoutDuration(Duration.ofSeconds(20))\n                .setTotalTimeoutDuration(Duration.ofMinutes(5))\n                .setMaxAttempts(5)\n                .build());\n\n    try (SecretManagerServiceClient client =\n        SecretManagerServiceClient.create(settingsBuilder.build())) {\n\n      GetSecretRequest request =\n          GetSecretRequest.newBuilder()\n              .setName(\"projects/my-project/secrets/my-secret\")\n              .build();\n\n      // 2. Per-call override using the generated Callable + ApiCallContext:\n      HttpJsonCallContext callContext =\n          HttpJsonCallContext.createDefault()\n              .withRetrySettings(\n                  RetrySettings.newBuilder()\n                      .setMaxAttempts(3)\n                      .setInitialRetryDelayDuration(Duration.ofSeconds(1))\n                      .build())\n              .withRetryableCodes(Set.of(StatusCode.Code.UNAVAILABLE))\n              .withTimeoutDuration(Duration.ofSeconds(15));\n\n      Secret secret = client.getSecretCallable().call(request, callContext);\n    }\n  }\n}\n```\n\nPython:\n```python\nfrom google.api_core import exceptions\nfrom google.api_core import retry\nfrom google.cloud import secretmanager_v1\n\n# Initialize the client (using REST transport if desired)\nclient = secretmanager_v1.SecretManagerServiceClient(transport=\"rest\")\n\n# Define a custom retry policy\ncustom_retry = retry.Retry(\n    predicate=retry.if_exception_type(\n        exceptions.ServiceUnavailable,\n        exceptions.DeadlineExceeded,\n        exceptions.InternalServerError,\n    ),\n    initial=1.0,       # 1s initial delay\n    maximum=60.0,      # 60s max delay\n    multiplier=2.0,    # exponential multiplier\n    timeout=120.0,     # total retry deadline (2 minutes)\n)\n\nrequest = secretmanager_v1.GetSecretRequest(\n    name=\"projects/my-project/secrets/my-secret\"\n)\n\n# Pass retry, timeout, and metadata per-call\nresponse = client.get_secret(\n    request=request,\n    retry=custom_retry,\n    timeout=30.0,\n    metadata=[(\"x-custom-header\", \"value\")],\n)\n```"},{"who":"brianquinlan","bot":false,"at":"2026-10-15 15:52","ago":"10d ago","what":"commented","text":"I think that the client side changes required for AIP-4222 & AIP-155 are covered by https://github.com/googleapis/google-cloud-dart/issues/80 so I'm going to remove that part of this bug."}],"note":"There is a PR open to address this issue so there is nothing else actionable to do.","prd_note":"","set":"B","source":"eval","draft":"elsewhere","why":"There is a PR open to address this issue so there is nothing else actionable to do.","settings_note":"","agents":[{"who":"Gemini","step":"todo","text":"Implement RetryRunner and RequestOptions wiring in ServiceClient for google_cloud_rpc."},{"who":"Basic","step":"todo","text":""},{"who":"Claude","step":"todo","text":"Implement the ServiceClient RetryRunner/RequestOptions wiring and harden ServiceException.fromHttpResponse against non-JSON error bodies."},{"who":"OpenAI","step":"todo","text":"Implement the remaining ServiceClient retry and RequestOptions support, including robust handling of non-JSON error responses."}]},{"id":"dart-lang/http#2031","url":"https://github.com/dart-lang/http/pull/2031","title":"chore(http2): prepare to release 3.2.0","kind":"PR","state":"open","author":"mosuem","labels":["pa
