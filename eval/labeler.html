ckage_config/lib/src/package_config.dart| :broken_heart: 82 % :arrow_down: 0 % |\n\nThis check for [test coverage](https://github.com/dart-lang/ecosystem/wiki/Test-Coverage) is informational (issues shown here will not fail the PR).\n\n\nThis check can be disabled by tagging the PR with `skip-coverage-check`.\n<\/details>"},{"who":"gemini-code-assist[bot]","bot":true,"at":"2026-08-20 13:39","ago":"2mo ago","what":"reviewed [COMMENTED]","text":"## Code Review\n\nThis pull request mitigates UNC path injection (SMB NTLM leak) by forbidding non-local file paths in `rootUri`. Feedback on the changes highlights a regression where checking `root.host.isNotEmpty` instead of `parsedRootUri.host.isNotEmpty` breaks package resolution for legitimate projects hosted on network shares. Additionally, a temporary scratch file (`scratch.dart`) was committed and should be removed, and a test case should be added to verify that relative paths on network shares remain supported.\n\n<details>\n<summary>I am having trouble creating individual review comments. Click here to see my feedback.<\/summary>\n\n### pkgs/package_config/lib/src/package_config_json.dart (157-163)\n\n![security-high](https://www.gstatic.com/codereviewagent/security-high-priority.svg) ![high](https://www.gstatic.com/codereviewagent/high-priority.svg)\n\nChecking `root.host.isNotEmpty` will cause a regression for legitimate users who have their project located on a network share (UNC path). When `baseLocation` has a host (e.g., `file://network-share/project/...`), any relative `rootUri` (like `../foo`) will resolve to a URI that inherits the same host. This causes `root.host.isNotEmpty` to be `true`, resulting in a false positive and breaking package resolution for those users.\n\nTo fix this, check `parsedRootUri.host.isNotEmpty` instead. This ensures that only `rootUri`s that explicitly specify a host are rejected, while relative paths on a network share remain fully supported and secure.\n\n```suggestion\n    if (parsedRootUri.host.isNotEmpty) {\n      onError(PackageConfigFormatException(\n        'Package root URIs must not have a host (authority) component. '\n        'The rootUri must be a local file path. '\n        'Found: \"${parsedRootUri.host}\".', entry));\n      return null;\n    }\n```\n\n<details>\n<summary>References<\/summary>\n\n1. When building foundational components, prioritize robust, future-proof implementations over simpler ones that may introduce subtle bugs or rely on unintended behavior.\n<\/details>\n\n### pkgs/package_config/scratch.dart (1-6)\n\n![medium](https://www.gstatic.com/codereviewagent/medium-priority.svg)\n\nThe `scratch.dart` file appears to be a temporary debug or scratch file used during development. It should not be committed to the repository. Please remove this file from the pull request.\n\n### pkgs/package_config/test/parse_test.dart (403-406)\n\n![medium](https://www.gstatic.com/codereviewagent/medium-priority.svg)\n\nAdd a test case to verify that relative paths are still allowed when the project itself is located on a network share (i.e., when `baseLocation` has a host component). This prevents future regressions.\n\n```suggestion\n          testThrows(\n            'has-host',\n            '{$cfg,\"packages\":[{$name,\"rootUri\":\"file://attacker.com/share/\"}]}',\n          );\n          test('relative path on network share base', () {\n            var config = parsePackageConfigBytes(\n              utf8.encode('{$cfg,\"packages\":[{$name,\"rootUri\":\"../foo/\"}]}'),\n              Uri.parse('file://network-share/tmp/.dart_tool/file.dart'),\n              throwError,\n            );\n            expect(config.packages.first.root, Uri.parse('file://network-share/tmp/foo/'));\n          });\n```\n\n<\/details>"},{"who":"jonasfj","bot":false,"at":"2026-08-20 13:44","ago":"2mo ago","what":"review_requested lrhn","text":""},{"who":"lrhn","bot":false,"at":"2026-08-20 20:55","ago":"2mo ago","what":"left inline review comment on pkgs/package_config/lib/src/package_config_json.dart","text":"Need to check for port as well, don't want `file://:8192/path` to connect to something.\n\nAlso `file:///path` and `file://localhost/path` are morally equivalent.\n\nConsider:\n```dart\nif (root.authority case var authority \n     when authority.isNotEmpty && authority != \"localhost\") {\n  .... error ....\n}\n```"},{"who":"lrhn","bot":false,"at":"2026-08-20 20:56","ago":"2mo ago","what":"left inline review comment on pkgs/package_config/test/parse_test.dart","text":"Use `example.com` for example domains."},{"who":"lrhn","bot":false,"at":"2026-08-20 20:57","ago":"2mo ago","what":"left inline review comment on pkgs/package_config/lib/src/package_config_json.dart","text":"Should probably apply to package root (`lib/` dir) as well. Nothing here prevents that string from being `//example.com/badness/`.\n(There should be a check later, that the package URI root is inside the package root, but let's not rely on that being enough. Security in depth.)"},{"who":"lrhn","bot":false,"at":"2026-08-20 21:03","ago":"2mo ago","what":"left inline review comment on pkgs/package_config/lib/src/package_config_json.dart","text":"Should probably only apply if `.isScheme('file')`.\n\nThe current configuration allows non-`file` schemes.\nIf we shouldn't allow that, we should also check for it."},{"who":"lrhn","bot":false,"at":"2026-08-20 21:04","ago":"2mo ago","what":"left inline review comment on pkgs/package_config/lib/src/package_config_json.dart","text":"The `SimplePackage.validate` should validate all the constraints again. (Or instead, depends on whether it's a config parsing error or a data logic error.)"},{"who":"lrhn","bot":false,"at":"2026-08-20 21:04","ago":"2mo ago","what":"reviewed [COMMENTED]","text":""},{"who":"jonasfj","bot":false,"at":"2026-08-21 06:44","ago":"2mo ago","what":"left inline review comment (reply) on pkgs/package_config/lib/src/package_config_json.dart","text":"I think we should allow `../foo` relative paths, without `file:` prefix."},{"who":"Jonas Finnemann Jensen","bot":false,"at":"2026-08-21 07:35","ago":"2mo ago","what":"pushed commit d0b6c65 'Forbid UNC paths in package root URIs'","text":""},{"who":"jonasfj","bot":false,"at":"2026-08-21 07:58","ago":"2mo ago","what":"renamed 'Forbid non-local file paths in rootUri to mitigate UNC path injection' -> '[package_config] Forbid UNC paths in rootUri to mitigate UNC path injection'","text":""},{"who":"Jonas Finnemann Jensen","bot":false,"at":"2026-08-21 08:03","ago":"2mo ago","what":"pushed commit 90019e7 'Move UNC validation into SimplePackage.validate for security in depth'","text":""},{"who":"Jonas Finnemann Jensen","bot":false,"at":"2026-08-21 08:16","ago":"2mo ago","what":"pushed commit d468e60 'Add packageUri UNC tests and update CHANGELOG'","text":""},{"who":"Jonas Finnemann Jensen","bot":false,"at":"2026-08-21 08:25","ago":"2mo ago","what":"pushed commit 31233d0 'Fix changelog wording'","text":""},{"who":"jonasfj","bot":false,"at":"2026-08-21 08:38","ago":"2mo ago","what":"review_requested lrhn","text":""},{"who":"lrhn","bot":false,"at":"2026-08-26 11:21","ago":"2mo ago","what":"left inline review comment on pkgs/package_config/lib/src/package_config.dart","text":"\"must not evaluate to\" -> \"must not be\" (the root URI is what it is - the representation is just a way to serialize it).\n\nFor someone not on Windows, that's a confusing error message. \"That's _not_ a Windows UNC path, this is Unix. Also, what is a Windows UNC path?\"\n(Not that most Windows users would know that either.)\n\nI'd start the text with the requirement, not the violation:\n```dart\n   \"Package root URIs with the 'file:' scheme must be local paths, \"\n   \"with no authority and a path not starting with '//'. \"\n   \"Was: '$root` which has a non-trivial authority part.\",\n```"},{"who":"lrhn","bot":false,"at":"2026-08-26 11:39","ago":"2mo ago","what":"left inline review comment on pkgs/package_config/lib/src/package_config.dart","text":"What is the actual restriction here?\n\nIt's not a _windows_ restriction, it applies to all platforms, and it should be expressed in a way that can be understood without converting to a windows path.\n\nA root URI that is a file URI must:\n* Not have a non-empty authority part. \n* Not have a path that starts with `//`.\n\nA `file:` URI always has an authority part, but it should be empty, meaning an empty host, a default/empty port and no user-id, so `.authority.isEmpty`.\n\nThen it must not have a path that starts with `//`, because that will be converted to a Windows path starting with `\\\\`, so `!root.path.startsWith('//')`.\n\nAka: it must start with `file:///` and not be followed by `/`. It's probably a `_SimpleUri`, so doing `toString()` is free, so we can introduce a central check for that:\n```dart\n  bool hasSimpleFilePath(Uri uri) =>\n    !uri.isScheme('file) ||\n        uri.authority.isEmpty && !uri.path.startsWith('//');\n```\nand do;\n```dart\n  if (!fatalError && !hasSimpleFilePath(root)) {\n    // Badness. \n    fatalError = true;\n  }\n```\n\n(Do we need to check for  a path of `/%2f...` or `/%5c...`, the escapes for `/` and `\\`? Doesn't seem so, they generate an \"invalid character in path\" error from `_toWindowsFilePath`.).\n\nThe URI must probably also not have an empty path, `file://` is a valid URI with an empty authority and empty path, but we already checked above that it `isAbsoluteDirectoryUri`, so that should be covered."},{"who":"lrhn","bot":false,"at":"2026-08-26 11:41","ago":"2mo ago","what":"left inline review comment on pkgs/package_config/lib/src/package_config.dart","text":"Doing same check a second time. Have a helper function with proper docs that implements a specified behavior.\n(And tested!)"},{"who":"lrhn","bot":false,"at":"2026-08-26 11:41","ago":"2mo ago","what":"left inline review comment on pkgs/package_config/lib/src/package_config.dart","text":"Same error too. Probably have a function for that too.\n\nExcept it's probably not needed. The `packageUriRoot` _must_ be inside the `root` (line 854), so it's probably guaranteed to have same scheme, authority and path start. But I guess the root path could be `file:///` and the package root `file:////bananas/`, in which case we do need to check that it doesn't start with `//`. That can _only_ happen if the root URI has `/` as path.\n\nBut we should check that `isUriPrefix` remembers to check the authority."},{"who":"lrhn","bot":false,"at":"2026-08-26 11:55","ago":"2mo ago","what":"left inline review comment on pkgs/package_config/CHANGELOG.md","text":"> - Forbids a non-empty authority or a path starting with `//` in\n>   `rootUri` and `packageUri` to mitigate UNC path injection.\n>  (...)"},{"who":"lrhn","bot":false,"at":"2026-08-26 11:59","ago":"2mo ago","what":"left inline review comment on pkgs/package_config/test/parse_test.dart","text":"Test the helper function directly as well, with more tricky cases, on top of testing that  the function gets called in the right places.\n\nTricky cases include:\n* `file://localhost/bananas` - it may be the default host, but `toFilePath` doesn't treat it the same as no host.\n* `file://:1234/bananas`\n* `file://me@/bananas`\n* `file:///` with package-root-URL `//bananas/are/great/`\n* `file://bananas`"},{"who":"lrhn","bot":false,"at":"2026-08-26 11:59","ago":"2mo ago","what":"reviewed [COMMENTED]","text":""}],"note":"","prd_note":"","set":"B","source":"eval","draft":"not_yours","why":"","settings_note":"","agents":[{"who":"Gemini","step":"not_yours","text":"None; lrhn is reviewing this security PR in dart-lang/tools and jonasfj needs to respond."},{"who":"Basic","step":"not_yours","text":""},{"who":"Claude","step":"not_yours","text":"Nothing for me to do: this is a team review request in dart-lang/tools, which I don't own, and lrhn is already reviewing; jonasfj needs to address lrhn's feedback."},{"who":"OpenAI","step":"not_yours","text":"Leave the follow-up to jonasfj and the requested reviewer, lrhn."}]},{"id":"dart-lang/tools#2710","url":"https://github.com/dart-lang/tools/pull/2710","title":"[sigstore] Add package:sigstore/provenance.dart with the shared provenance parsing and policy","kind":"PR","state":"open","author":"mosuem","labels":["type-infra"],"assignees":[],"requested":["dart-ecosystem-team (team)"],"repo_desc":"This repository is home to tooling related Dart packages.","created":"2d ago","updated":"2d ago","snapshot":"2026-10-25T19:31:18Z","as_of":null,"thumbs_down_at":null,"roles":["requested_reviewer_via_team(dart-ecosystem-team)"],"last":"mosuem referenced this in commit 2d ago","stacked_on":[{"pr":"#2563","title":"[sigstore] Add package:sigstore for Sigstore bundle verification","author":"mosuem","state":"draft open","reviews":["gemini-code-assist[bot]:COMMENTED"],"requested_reviewers":[]}],"related":["PR dart-lang/pub-dev#9546 'Verify uploaded package attestations using package:sigstore': draft open, by mosuem, updated 2d ago","PR dart-lang/pub#4875 'Verify package attestations and enforce provenance policies in pub get/upgrade': draft open, by mosuem, updated 2d ago","PR dart-lang/tools#2563 '[sigstore] Add package:sigstore for Sigstore bundle verification': draft open, by mosuem, updated 2d ago, labels ['type-infra']"],"body":"> [!NOTE]\n> This PR was generated by an AI coding agent (Jetski) on behalf of @mosuem.\n\nStacked on #2563. Extracts the SLSA provenance parsing and the package attestation policy that dart-lang/pub#4875 (`lib/src/sigstore/provenance.dart`, `verifier.dart`) and dart-lang/pub-dev#9546 (`app/lib/package/attestation_verifier.dart`) currently each carry a copy of into `package:sigstore/provenance.dart`, as proposed in https://github.com/dart-lang/pub-dev/pull/9546#issuecomment-6120956306.\n\nThe new library is pure Dart (`dart:convert` only, no `dart:ffi`, no new dependencies), so it can be imported on every platform, including from `pub`'s `sigstore_stub.dart` configuration:\n\n- `GitHubRepository` (`tryParse`, `tryParseSlug`), `GitHubWorkflowIdentity` (`tryParse`), `ProvenanceSubject`\n- `BuildProvenance.parseBundle` — the union of both copies: pub-dev's `repositoryId`, `repositoryOwnerId` and `runUrl` included\n- `TransparencyLogEntry.tryParseBundle`\n- `checkProvenancePolicy` — the union of both signatures: `expectedRepository`, `configuredRepository` (pub-dev's `configuredGitHubRepository`), `declaredPackageName`/`declaredPackageVersion` (pub), `requireRepository`, `requireTaggedSignerRef`\n\nTwo deliberate differences from the copies:\n\n- `packageVersion` / `declaredPackageVersion` are `String`s, so `package:sigstore` does not pick up a `pub_semver` dependency. Callers pass `version.toString()`.\n- `trustedSignerWorkflows` is required and has no default: which workflows are trusted to sign is the consumer's policy, and `pub.dev` should be able to change it without a `package:sigstore` release. (`defaultTrustedSignerWorkflows` stays in `pub` and `pub.dev`.)\n\nThe sha256-mismatch message is now neutral (`but this archive has sha256 ...`) instead of `downloaded` (pub) / `uploaded` (pub-dev).\n\nTests: `provenance_test.dart` and `policy_test.dart` move over from pub#4875, extended for `tryParseSlug`, the repository ids / run url, `TransparencyLogEntry`, `configuredRepository` and `declaredPackage*`. `sigstore_test.dart` gains an end-to-end test that verifies the real `helpful 0.1.5` attestation over the archive digest (`isDigest: true`) through the native bindings and then feeds `verifiedIdentity()` into `GitHubWorkflowIdentity.tryParse` and `checkProvenancePolicy`, which pins the identity format the parser must understand to the one the bindings produce.\n\nFollow-ups once this is released: switch dart-lang/pub#4875 and dart-lang/pub-dev#9546 to import `package:sigstore/provenance.dart` and delete their copies.","timeline":[{"who":"Moritz","bot":false,"at":"2026-10-23 07:38","ago":"2d ago","what":"pushed commit 67238a8 '[sigstore] Add package:sigstore/provenance.dart with the shared provenance parsing and policy'","text":""},{"who":"mosuem","bot":false,"at":"2026-10-23 07:38","ago":"2d ago","what":"opened this PR","text":""},{"who":"mosuem","bot":false,"at":"2026-10-23 07:38","ago":"2d ago","what":"review_requested dart-ecosystem-team","text":""},{"who":"github-actions[bot]","bot":true,"at":"2026-10-23 07:38","ago":"2d ago","what":"labeled 'type-infra'","text":""},{"who":"gemini-code-assist[bot]","bot":true,"at":"2026-10-23 07:41","ago":"2d ago","what":"reviewed [COMMENTED]","text":"## Code Review\n\nThis pull request introduces `package:sigstore/provenance.dart`, a pure-Dart library for parsing SLSA build provenance from Sigstore bundles and checking them against package attestation policies. It includes classes for parsing GitHub repositories, workflow identities, build provenance, and transparency log entries, along with comprehensive tests and documentation. The reviewer feedback suggests enhancing robustness by using `base64.normalize` during payload decoding and handling potential integer types for repository and owner IDs."},{"who":"gemini-code-assist[bot]","bot":true,"at":"2026-10-23 07:41","ago":"2d ago","what":"left inline review comment on pkgs/sigstore/lib/src/provenance.dart","text":"![medium](https://www.gstatic.com/codereviewagent/medium-priority.svg)\n\nTo make the base64 decoding robust against missing padding (which is a common issue with base64 strings in JSON payloads generated by some non-standard encoders), consider using `base64.normalize` before decoding.\n\n```suggestion\n      decodedStatement = json.decode(\n        utf8.decode(base64.decode(base64.normalize(encodedPayload))),\n      );\n```\n\n<details>\n<summary>References<\/summary>\n\n1. When building foundational components, prioritize robust, future-proof implementations over simpler ones that may introduce subtle bugs or rely on unintended behavior.\n<\/details>"},{"who":"gemini-code-assist[bot]","bot":true,"at":"2026-10-23 07:41","ago":"2d ago","what":"left inline review comment on pkgs/sigstore/lib/src/provenance.dart","text":"![medium](https://www.gstatic.com/codereviewagent/medium-priority.svg)\n\nGitHub repository and owner IDs are sometimes represented as integers in various APIs and payloads, even though they are strings in OIDC claims. To prevent silent parsing failures if a tool encodes them as integers, consider stringifying them robustly if they are not null.\n\n```dart\n      final id = github['repository_id'];\n      if (id != null) {\n        final idStr = '$id'.trim();\n        if (idStr.isNotEmpty) repositoryId = idStr;\n      }\n      final ownerId = github['repository_owner_id'];\n      if (ownerId != null) {\n        final ownerIdStr = '$ownerId'.trim();\n        if (ownerIdStr.isNotEmpty) repositoryOwnerId = ownerIdStr;\n      }\n```\n\n<details>\n<summary>References<\/summary>\n\n1. When building foundational components, prioritize robust, future-proof implementations over simpler ones that may introduce subtle bugs or rely on unintended behavior.\n<\/details>"},{"who":"mosuem","bot":false,"at":"2026-10-23 07:52","ago":"2d ago","what":"added to stack","text":""},{"who":"Moritz","bot":false,"at":"2026-10-23 07:55","ago":"2d ago","what":"pushed commit 233e5ab '[sigstore] Accept every ProtoJSON base64 form and numeric repository ids in BuildProvenance.parseBundle'","text":""},{"who":"mosuem","bot":false,"at":"2026-10-23 07:55","ago":"2d ago","what":"left inline review comment (reply) on pkgs/sigstore/lib/src/provenance.dart","text":"Done, thanks. This one matters more than it looks: `sigstore-rust` decodes the DSSE payload with `decode_protojson_base64` (`sigstore-types/src/encoding.rs`), which accepts both alphabets with `DecodePaddingMode::Indifferent`, so an unpadded payload would have *verified* and then failed to parse here. Now using `base64.normalize`, with a comment and a test that re-encodes the real bundle's payload URL-safe and unpadded."},{"who":"mosuem","bot":false,"at rianquinlan review_requested 2d ago","stacked_on":null,"related":["issue dart-lang/native#3750 [linked: closes/closed-by] '[objective_c] `NSInputStream` can deadlock': open, by brianquinlan, updated 6d ago, labels ['package:objective_c', 'needs-triage']","issue dart-lang/native#3752 [linked: closes/closed-by] \"[objective_c] `NSInputStream` doesn't support run loop scheduling\": open, by brianquinlan, updated 6d ago, assignees ['brianquinlan'], labels ['lang-objective_c', 'package:objective_c', 'needs-triage']"],"body":"## Description\r\n\r\nThe `NSInputStream` returned by `toNSInputStream` currently ignores [`scheduleInRunLoop:forMode:`](https://github.com/dart-lang/native/blob/3cbe319e3c1ec0f9253c126ba3e465e55229c3a4/pkgs/objective_c/src/input_stream_adapter.m#L66-L67).\r\n\r\nThis causes `NSURLSession` to make [read:maxLength](https://github.com/dart-lang/native/blob/3cbe319e3c1ec0f9253c126ba3e465e55229c3a4/pkgs/objective_c/src/input_stream_adapter.m#L131) calls on its single, process-wide `com.apple.NSURLConnectionLoader thread`, which [waits](https://github.com/dart-lang/native/blob/3cbe319e3c1ec0f9253c126ba3e465e55229c3a4/pkgs/objective_c/src/input_stream_adapter.m#L163) until the Dart stream provides data. This really hurts `package:cupertino_http`'s performance when performing concurrent uploads.\r\n\r\n## Related Issues\r\n\r\nFixes #3750\r\nFixes #3752 \r\n\r\n## PR Checklist\r\n\r\n- [X] I’ve reviewed the [contributor guide](https://github.com/dart-lang/native/blob/main/CONTRIBUTING.md) and applied the relevant portions to this PR.\r\n- [X] I've run `dart tool/ci.dart --all` locally and resolved all issues identified. This ensures the PR is formatted, has no lint errors, and ran all code generators. This applies to the packages part of the toplevel `pubspec.yaml` workspace.\r\n- [X] All existing and new tests are passing. I added new tests to check the change I am making.\r\n- [X] The PR is actually solving the issue. PRs that don't solve the issue will b  Cloud Dart Client Libraries","created":"11d ago","updated":"4d ago","snapshot":"2026-10-25T19:31:27Z","as_of":null,"thumbs_down_at":null,"roles":["author","commenter","watches_repo"],"last":"brianquinlan commented 4d ago","stacked_on":null,"related":["issue googleapis/google-cloud-dart#359 '[google_cloud_rpc] Wire RetryRunner and per-call RequestOptions into ServiceClient for generated REST clients': open, by kevmoo, updated 10d ago, assignees ['brianquinlan']","PR brianquinlan/google-cloud-dart#2 'chore(pubsub): merge main and update Subscription retry calls': merged, by sigurdm, updated 5d ago","PR googleapis/google-cloud-dart#292 'feat(google_cloud_pubsub): add Subscription ack and modifyAckDeadline batching': merged, by sigurdm, updated 5d ago","PR googleapis/google-cloud-dart#339 'feat(pubsub): add resilient parallel streaming pull': merged, by sigurdm, updated 5d ago","PR googleapis/google-cloud-dart#2 'Configure Renovate': closed, by renovate-bot, updated 13mo ago"],"body":"Part of https://github.com/googleapis/google-cloud-dart/issues/359\r\n\r\nHistory: My original implementation of RPC retry logic was located in `package:google_cloud_storage` and meant for use in that package. @sigurdm needed equivalent functionality for `package:google_cloud_pubsub` so he moved it to a common location (`package:google_cloud_rpc`).\r\n\r\nThe intent of this PR is to make this RPC retry logic useable by all clients, hand-written and generated.\r\n\r\nThe broad strokes (does saying something like \"broad strokes\" make this seem more or less AI-written?):\r\n1. Remove the Google Cloud Storage-specific retry logic from `package:google_cloud_rpc` and replace it with the ability to retry errors based on either a predicate function or specific error codes.\r\n2. Changed the retry defaults to match Python (there is variation across implementations so I picked one)\r\n3. Changed the jittering logic to match the other languages' clients (the were all the same) \r\n4. Changed `ServiceClient` to accept a `retry` argument for every RPC method\r\n\r\nThe rest of the PR is clean-up in `package:google_cloud_storage` and `package:google_cloud_pubsub` to use the change functionality.\r\n\r\nThere are a few semi-related changes in `package:google_cloud_storage` (I noticed these because it does affect the retry strategy):\r\n- Changed `deleteObjectAcl`/`patchObjectAcl` to never be idempotent.\r\n- Changed `deleteBucket` to always be idempotent.\r\n- Changed `uploadObjectFromSink` to only consider the generation match when starting the transfer, not when retrying failed data chunk uploads.\r\n\r\nOne small semi-related change to `package:google_cloud_pubsub`:\r\n- Changed `defaultRetry` to match the service definition. @sigurdm could you check that I used the correct reference?\r\n\r\n**Question**: Should every package `export 'package:google_cloud_rpc/retry.dart';` so that developers don't have to explicitly depend on `package:google_cloud_rpc` if they want to modify their client's retry logic?\r\n\r\nI talked to @natebosch and we will not be doing that.","timeline":[{"who":"Brian Quinlan","bot":false,"at":"2026-10-13 20:15","ago":"12d ago","what":"pushed commit 6328f71 'first go'","text":""},{"who":"Brian Quinlan","bot":false,"at":"2026-10-13 21:16","ago":"12d ago","what":"pushed commit 4dc8510 'Fix'","text":""},{"who":"Brian Quinlan","bot":false,"at":"2026-10-13 22:38","ago":"12d ago","what":"pushed commit a7807d9 'Retry'","text":""},{"who":"Brian Quinlan","bot":false,"at":"2026-10-13 22:46","ago":"12d ago","what":"pushed commit 0591457 'Update AGENTS.md'","text":""},{"who":"Brian Quinlan","bot":false,"at":"2026-10-13 23:19","ago":"12d ago","what":"pushed commit 5e4974c 'fixes'","text":""},{"who":"Brian Quinlan","bot":false,"at":"2026-10-13 23:28","ago":"12d ago","what":"pushed commit c83bb62 'Docs.'","text":""},{"who":"Brian Quinlan","bot":false,"at":"2026-10-13 23:37","ago":"12d ago","what":"pushed commit 8629ad5 'Remove equality.'","text":""},{"who":"Brian Quinlan","bot":false,"at":"2026-10-13 23:49","ago":"12d ago","what":"pushed commit 0c91543 'retry private'","text":""},{"who":"Brian Quinlan","bot":false,"at":"2026-10-14 00:08","ago":"12d ago","what":"pushed commit b416590 'docfixes'","text":""},{"who":"Brian Quinlan","bot":false,"at":"2026-10-14 00:56","ago":"12d ago","what":"pushed commit 4205674 'Doc fix'","text":""},{"who":"brianquinlan","bot":false,"at":"2026-10-14 16:37","ago":"11d ago","what":"opened this PR","text":""},{"who":"gemini-code-assist[bot]","bot":true,"at":"2026-10-14 16:42","ago":"11d ago","what":"reviewed [COMMENTED]","text":"## Code Review\n\nThis pull request refactors the retry mechanism across the Google Cloud Dart packages, introducing breaking changes to `ExponentialRetry` by removing built-in retryable errors in favor of explicit predicates or status codes, implementing full jitter, and dynamically determining idempotency within client methods rather than the retry runner. Additionally, it updates documentation, examples, and tests to align with these changes. A critical bug was identified in the newly added `isTransientError` helper in `pkgs/google_cloud_storage/lib/src/retry.dart`, where parsed REST-based `ServiceException` errors containing HTTP status codes in `status.code` would fail to be recognized as transient and thus would not be retried."},{"who":"gemini-code-assist[bot]","bot":true,"at":"2026-10-14 16:42","ago":"11d ago","what":"left inline review comment on pkgs/google_cloud_storage/lib/src/retry.dart","text":"![high](https://www.gstatic.com/codereviewagent/high-priority.svg)\n\nIn REST-based APIs like Google Cloud Storage, the JSON error response is parsed into a `ServiceException` where `status.code` contains the HTTP status code (e.g., `503`), rather than a gRPC status code. Because `status?.code` is `503` (which is not in the gRPC status codes list `2 || 4 || 8 || 10 || 13 || 14` and is not `null`), the switch falls through to `_ => false`. This prevents transient REST errors with parsed JSON bodies from being retried. Adding the transient HTTP status codes to the first switch case resolves this issue.\n\n```suggestion\n    ServiceException(:final status, :final statusCode) =>\n      switch (status?.code) {\n        // gRPC status codes: UNKNOWN(2), DEADLINE_EXCEEDED(4),\n        // RESOURCE_EXHAUSTED(8), ABORTED(10), INTERNAL(13), UNAVAILABLE(14).\n        // HTTP status codes: 408, 429, 500, 502, 503, 504.\n        2 || 4 || 8 || 10 || 13 || 14 ||\n        408 || 429 || 500 || 502 || 503 || 504 => true,\n        null =>\n          statusCode == 408 ||\n              statusCode == 429 ||\n              statusCode == 500 ||\n              statusCode == 502 ||\n              statusCode == 503 ||\n              statusCode == 504,\n        _ => false,\n      },\n```"},{"who":"Brian Quinlan","bot":false,"at":"2026-10-14 16:49","ago":"11d ago","what":"pushed commit 76bf2fd 'Retry docs'","text":""},{"who":"Brian Quinlan","bot":false,"at":"2026-10-14 17:07","ago":"11d ago","what":"pushed commit f6b92db 'test cleanup'","text":""},{"who":"Brian Quinlan","bot":false,"at":"2026-10-14 17:09","ago":"11d ago","what":"pushed commit ff338a3 'simplify'","text":""},{"who":"Brian Quinlan","bot":false,"at":"2026-10-14 17:26","ago":"11d ago","what":"pushed commit 66488eb 'Remove language stuff'","text":""},{"who":"Brian Quinlan","bot":false,"at":"2026-10-14 17:31","ago":"11d ago","what":"pushed commit 85b2651 'Matching'","text":""},{"who":"Brian Quinlan","bot":false,"at":"2026-10-14 17:32","ago":"11d ago","what":"pushed commit b755444 'Update AGENTS.md'","text":""},{"who":"brianquinlan","bot":false,"at":"2026-10-14 17:42","ago":"11d ago","what":"renamed 'Retry harmony' -> 'feat(rpc): make retry logic useable across clients'","text":""},{"who":"brianquinlan","bot":false,"at":"2026-10-14 18:05","ago":"11d ago","what":"commented","text":"/gcbrun"},{"who":"Brian Quinlan","bot":false,"at":"2026-10-14 18:21","ago":"11d ago","what":"pushed commit cf08f15 'Fix'","text":""},{"who":"Brian Quinlan","bot":false,"at":"2026-10-14 18:29","ago":"11d ago","what":"pushed commit db747a3 'Update retry.dart'","text":""},{"who":"brianquinlan","bot":false,"at":"2026-10-14 18:31","ago":"11d ago","what":"left inline review comment (reply) on pkgs/google_cloud_storage/lib/src/retry.dart","text":"google_cloud_storage doesn't use gRPC so I removed all of these cases."},{"who":"Brian Quinlan","bot":false,"at":"2026-10-14 19:32","ago":"11d ago","what":"pushed commit 8ded78b 'Update client_test.dart'","text":""},{"who":"Brian Quinlan","bot":false,"at":"2026-10-14 19:35","ago":"11d ago","what":"pushed commit 69b4cf6 'fix'","text":""},{"who":"Brian Quinlan","bot":false,"at":"2026-10-14 19:55","ago":"11d ago","what":"pushed commit c94e910 'Update retry_test.dart'","text":""},{"who":"Brian Quinlan","bot":false,"at":"2026-10-14 20:19","ago":"11d ago","what":"pushed commit 3ccbba4 'Fixes some tests'","text":""},{"who":"brianquinlan","bot":false,"at":"2026-10-14 20:20","ago":"11d ago","what":"commented","text":"/gcbrun"},{"who":"Brian Quinlan","bot":false,"at":"2026-10-14 20:36","ago":"11d ago","what":"pushed commit a2d98a4 'Update retry.dart'","text":""},{"who":"brianquinlan","bot":false,"at":"2026-10-14 20:41","ago":"11d ago","what":"commented","text":"/gcbrun"},{"who":"brianquinlan","bot":false,"at":"2026-10-14 20:50","ago":"11d ago","what":"commented","text":"/gemini review"},{"who":"gemini-code-assist[bot]","bot":true,"at":"2026-10-14 20:53","ago":"11d ago","what":"reviewed [COMMENTED]","text":"## Code Review\n\nThis pull request introduces significant updates to the retry mechanism across the google_cloud_rpc, google_cloud_pubsub, and google_cloud_storage packages, including breaking changes that remove the isIdempotent parameter from RetryRunner.run and allow explicit retry runners to always be used. It also adds the isTransientError helper and noRetry option for Cloud Storage. Feedback on these changes suggests documenting that the custom http.Client is closed when Storage is closed, and correcting the Pub/Sub delayMultiplier from 4 to 2 (along with its corresponding test) to align with the standard service configuration."},{"who":"gemini-code-assist[bot]","bot":true,"at":"2026-10-14 20:53","ago":"11d ago","what":"left inline review comment on pkgs/google_cloud_storage/lib/src/client.dart","text":"![medium](https://www.gstatic.com/codereviewagent/medium-priority.svg)\n\nSince the `Storage` class closes the user-provided `http.Client` in its `close()` method, this behavior must be explicitly documented in the constructor to warn users against passing shared or persistent clients, in accordance with the repository's general rules.\n\n```suggestion\n  /// Methods retry failed requests using [defaultRetry] if the operation is\n  /// [idempotent][], and don't retry them otherwise. Pass a `retry` argument\n  /// to a method to change how that call is retried. The documentation for\n  /// each method says when the operation is idempotent.\n  ///\n  /// Note that if a custom [client] is provided, it will be closed when\n  /// [close] is called on this [Storage] instance. Avoid passing a shared or\n  /// persistent client that is used elsewhere.\n```\n\n<details>\n<summary>References<\/summary>\n\n1. If a class or function accepts a user-provided http.Client (or a factory creating one) and closes it, this behavior must be explicitly documented to warn users against passing shared or persistent clients.\n<\/details>"},{"who":"gemini-code-assist[bot]","bot":true,"at":"2026-10-14 20:53","ago":"11d ago","what":"left inline review comment on pkgs/google_cloud_pubsub/lib/src/retry.dart","text":"![medium](https://www.gstatic.com/codereviewagent/medium-priority.svg)\n\nThe `google.pubsub.v1` gRPC service configuration specifies a `backoffMultiplier` of `2` (or `1.3` in some versions), not `4`. A multiplier of `4` causes the retry delay to grow extremely fast, which deviates from the standard Pub/Sub retry policy. Please update this to `2` to match the service definition.\n\n```suggestion\n  delayMultiplier: 2,\n```"},{"who":"gemini-code-assist[bot]","bot":true,"at":"2026-10-14 20:53","ago":"11d ago","what":"left inline review comment on pkgs/google_cloud_pubsub/test/retry_test.dart","text":"![medium](https://www.gstatic.com/codereviewagent/medium-priority.svg)\n\nUpdate the test assertion to expect a `delayMultiplier` of `2` to align with the corrected default retry configuration.\n\n```dart\n      expect(defaultRetry.delayMultiplier, equals(2));\n```"},{"who":"brianquinlan","bot":false,"at":"2026-10-14 21:04","ago":"11d ago","what":"commented","text":"/gcbrun(a2d98a479f1227e5e51f65592d64dba7e320fafb)"},{"who":"Brian Quinlan","bot":false,"at":"2026-10-14 22:32","ago":"11d ago","what":"pushed commit 07791cd \"Merge branch 'main' into retry_harmony\"","text":""},{"who":"brianquinlan","bot":false,"at":"2026-10-14 22:33","ago":"11d ago","what":"left inline review comment (reply) on pkgs/google_cloud_pubsub/lib/src/retry.dart","text":"The value is `4` here:\r\nhttps://github.com/googleapis/googleapis/blob/8c6e40489b4ab4f1886154a32ece2f0b5db52b27/google/pubsub/v1/pubsub_grpc_service_config.json#L41-L64"},{"who":"brianquinlan","bot":false,"at":"2026-10-14 22:34","ago":"11d ago","what":"left inline review comment (reply) on pkgs/google_cloud_storage/lib/src/client.dart","text":"This seems unrelated to this PR."},{"who":"brianquinlan","bot":false,"at":"2026-10-14 22:34","ago":"11d ago","what":"review_requested natebosch","text":""},{"who":"brianquinlan","bot":false,"at":"2026-10-14 22:34","ago":"11d ago","what":"review_requested sigurdm","text":""},{"who":"brianquinlan","bot":false,"at":"2026-10-14 22:34","ago":"11d ago","what":"assigned natebosch","text":""},{"who":"brianquinlan","bot":false,"at":"2026-10-14 22:35","ago":"11d ago","what":"commented","text":"@sigurdm for the pubsub bits"},{"who":"Brian Quinlan","bot":false,"at":"2026-10-15 07:22","ago":"11d ago","what":"pushed c Request for the code that follows and I guess that was the easiest way I could think of.\r\n\r\nBut if that is not a good idea or best practice I'm all in for improvements."},{"who":"kevmoo","bot":false,"at":"2023-05-30 00:39","ago":"3.4y ago","what":"commented","text":"@brianquinlan @devoncarew @natebosch"},{"who":"kevmoo","bot":false,"at":"2023-05-30 00:40","ago":"3.4y ago","what":"commented","text":"Please fix merge conflicts!"},{"who":"github-actions[bot]","bot":true,"at":"2023-05-30 09:12","ago":"3.4y ago","what":"labeled 'package:http'","text":""},{"who":"tlueder","bot":false,"at":"2023-05-30 09:15","ago":"3.4y ago","what":"commented","text":"@kevmoo done"},{"who":"natebosch","bot":false,"at":"2023-05-30 22:41","ago":"3.4y ago","what":"labeled 'next-breaking-release'","text":""},{"who":"natebosch","bot":false,"at":"2023-05-30 22:54","ago":"3.4y ago","what":"commented","text":"This looks like a breaking change, and we have been avoiding breaking API changes. This is only breaking for a subset of users, but I don't know what proportion.\r\n\r\nWe are currently getting through a major version bump without too much difficulty, but that was a version bump without breaking API changes. cc @brianquinlan for thoughts on the practicality of a breaking API change and another version bump."},{"who":"tlueder","bot":false,"at":"2023-05-31 06:21","ago":"3.4y ago","what":"commented","text":"This is a API change for sure but I would argue against a breaking one. This adds a new optional feature. And should not break anything for anyone not using it.\r\n\r\nCan you elaborate what you mean by \"This is only breaking for a subset of users\"?\r\nMaybe I can change the code to make sure it won't affect them."},{"who":"natebosch","bot":false,"at":"2023-05-31 14:30","ago":"3.4y ago","what":"commented","text":"This is breaking for classes with overrides of the changed methods."},{"who":"tlueder","bot":false,"at":"2023-05-31 14:46","ago":"3.4y ago","what":"commented","text":"Of course, I haven't even thought about that.\r\nThanks for the information."},{"who":"brianquinlan","bot":false,"at":"2023-05-31 17:07","ago":"3.4y ago","what":"commented","text":"> We are currently getting through a major version bump without too much difficulty, but that was a version bump without breaking API changes. cc @brianquinlan for thoughts on the practicality of a breaking API change and another version bump.\r\n\r\n1. As you said, this is definitely a breaking change (in particular it will definitely break at least `package:cronet_http` and `package:cupertino_http`).\r\n2. I wonder if there is a way to implement this without breaking the API? For example, we could define a new class like:\r\n\r\n```dart\r\ninterface class ProgressTracker {\r\n  void onSendProgress(int loaded, int total);\r\n}\r\n\r\nclass ProgressTrackingRequest extends StreamedRequest implements ProgressTracker {\r\n   ...\r\n}\r\n```\r\n\r\nAnd `send` implementations could check if the `Request` implements that class and, if so, could update the progress e.g.\r\n\r\n```dart\r\nif (request is ProgressTracker) {\r\n  request.onSendProcess(...);\r\n}\r\n```\r\n\r\nThat's a bit ugly.\r\n\r\n3. I'm not sure why tracking upload progress is more important than tracking download progress. If we are going to make a breaking change then we should do both so we don't have to update the major version just to add the obvious complementary feature.\r\n4. I'd be fine with another version bump but maybe we should wait a few months and accumulate all the breaking changes into one release? Is there an easy way to do this? Like have a 2.0 branch or something?"},{"who":"tlueder","bot":false,"at":"2023-05-31 21:26","ago":"3.4y ago","what":"commented","text":"1. Understood, and thanks for your input I was not aware of that.\r\n2. I'd rather wait for a version bump instead of a \"quick fix\". But in the end, I don't really care so much about the how this is implemented, because I don't know enough about dart best practice and what side effects this can have. I just need the progress data and if this is done a different way? I'm happy to update my apps if that means I can get rid of the dependency override and rebasing my fork.\r\n3. It is not that tracking the download is not important, but in contrast to the upload it can be done easily on the consuming side as all the needed data is already available. Just not as callback function. And when I wrote this, 2 years ago, I was not able to do this and my attempts felt just wrong. So I left it at that, but any hints in the right direction are welcome."},{"who":"Thomas Lüder","bot":false,"at":"2024-08-27 11:32","ago":"2.2y ago","what":"pushed commit b16c0fa 'Setup callback for send data progress'","text":""},{"who":"Thomas Lüder","bot":false,"at":"2024-08-27 11:32","ago":"2.2y ago","what":"pushed commit c16bf02 'Added send progress to BrowserClient'","text":""},{"who":"Thomas Lüder","bot":false,"at":"2024-08-27 11:32","ago":"2.2y ago","what":"pushed commit b2d832b 'Added send progress to IOClient'","text":""},{"who":"Thomas Lüder","bot":false,"at":"2024-08-27 11:32","ago":"2.2y ago","what":"pushed commit 7574756 'Update changelog'","text":""},{"who":"Thomas Lüder","bot":false,"at":"2024-08-27 11:32","ago":"2.2y ago","what":"pushed commit e2f0ea6 'Update changelog'","text":""},{"who":"Thomas Lüder","bot":false,"at":"2024-08-27 11:32","ago":"2.2y ago","what":"pushed commit 2a03ddd 'Fixed test override'","text":""},{"who":"Thomas Lüder","bot":false,"at":"2024-08-27 11:33","ago":"2.2y ago","what":"pushed commit 2272c00 'Update changelog'","text":""},{"who":"Thomas Lüder","bot":false,"at":"2024-08-27 11:33","ago":"2.2y ago","what":"pushed commit 30b47e6 'Fixed overrides after rebase'","text":""},{"who":"kevmoo","bot":false,"at":"2024-08-27 20:26","ago":"2.2y ago","what":"review_requested brianquinlan","text":""},{"who":"github-actions[bot]","bot":true,"at":"2024-08-27 20:27","ago":"2.2y ago","what":"commented","text":"## PR Health \n\n\ 'm getting the same issue even without `cronetHttpNoPlay=true`. Is waiting for Google to update `play-services-cronet`'s dependency all we can do? Where should we report it?"},{"who":"brianquinlan","bot":false,"at":"2026-07-20 17:59","ago":"3mo ago","what":"commented","text":"I reopened https://g-issues.chromium.org/issues/406926302"},{"who":"Mohammad-amleh","bot":false,"at":"2026-09-22 15:55","ago":"33d ago","what":"commented","text":"when this issue will be resolved ?"},{"who":"Pinguino0","bot":false,"at":"2026-10-15 19:35","ago":"10d ago","what":"referenced this in commit 8bce31a","text":""},{"who":"igordanilovski","bot":false,"at":"2026-10-21 13:35","ago":"4d ago","what":"commented","text":"Any updates on this guys?"}],"note":"There is a PR open to address this issue so there is nothing else actionable to do.","prd_note":"","set":"B","source":"eval","draft":"elsewhere","why":"There is a PR open to address this issue so there is nothing else actionable to do.","settings_note":"","agents":[{"who":"Gemini","step":"elsewhere","text":"Follow up on PR dart-lang/http#2034 which fixes this issue."},{"who":"Basic","step":"elsewhere","text":""},{"who":"Claude","step":"elsewhere","text":"Act on PR dart-lang/http#2034 (fix(cronet): avoid cronet namespace duplication), which closes this issue; no separate action needed here."},{"who":"OpenAI","step":"elsewhere","text":"Move the fix forward in PR dart-lang/http#2034 rather than treating this issue as separate work."}]},{"id":"flutter/devtools#8223","url":"https://github.com/flutter/devtools/issues/8223","title":"Feature request: Please add webSocket support in network inspector","kind":"Issue","state":"open","author":"KeterVM","labels":["devtools-network-screen","type-enhancement","P2"],"assignees":[],"requested":[],"repo_desc":"Developer tools for Flutter & Dart","created":"2.2y ago","updated":"4d ago","snapshot":"2026-10-25T19:32:18Z","as_of":null,"thumbs_down_at":null,"roles":["mentioned"],"last":"srawlins unlabeled 4d ago","stacked_on":null,"related":[],"body":"Hi Flutter DevTools team,\r\n\r\nWhile using DevTools to debug my Flutter applications, I've found that it currently lacks the ability to inspect WebSocket connections. This has made it difficult for me to debug Flutter apps that rely on WebSocket.\r\n\r\nWould you consider adding this feature in a future release? With a WebSocket connection inspection feature, we would be able to better understand the status of WebSocket connections in our apps and the data being transmitted, which would be very helpful for debugging these types of Flutter applications.\r\n\r\nI hope you can implement this feature soon, thank you!","timeline":[{"who":"KeterVM","bot":false,"at":"2024-08-21 17:14","ago":"2.2y ago","what":"opened this issue","text":""},{"who":"kenzieschmoll","bot":false,"at":"2024-08-21 20:33","ago":"2.2y ago","what":"labeled 'screen: network'","text":""},{"who":"kenzieschmoll","bot":false,"at":"2024-08-21 20:38","ago":"2.2y ago","what":"commented","text":"@bkonyi could you comment on what it would take to access data from web socket network traffic?"},{"who":"kenzieschmoll","bot":false,"at":"2024-08-21 20:38","ago":"2.2y ago","what":"labeled 'P2'","text":""},{"who":"bkonyi","bot":false,"at":"2024-08-21 21:08","ago":"2.2y ago","what":"commented","text":"> @bkonyi could you comment on what it would take to access data from web socket network traffic?\r\n\r\nThis would be quite a bit of work as we'd have to add network profiling support in `dart:io` at the very least. If we wanted to add generic support we'd have to update our HTTP profiling solution to also handle websocket traffic. cc @brianquinlan @derekxu16"},{"who":"srawlins","bot":false,"at":"2025-03-21 00:10","ago":"19mo ago","what":"labeled 'cost: high'","text":""},{"who":"kenzieschmoll","bot":false,"at":"2025-07-07 18:46","ago":"16mo ago","what":"labeled 'new feature'","text":""},{"who":"srawlins","bot":false,"at":"2025-11-05 23:47","ago":"12mo ago","what":"parent issue added","text":""},{"who":"github-project-automation[bot]","bot":true,"at":"2026-01-23 22:54","ago":"9mo ago","what":"added to project v2","text":""},{"who":"Victowolf","bot":false,"at":"2026-02-26 10:15","ago":"8mo ago","what":"commented","text":"Hi @bkonyi,\n\nMy name is [**Yash (VictoWolf)**](https://github.com/Victowolf) ,\nI am currently exploring this project  under GSOC 2026.\n\nRight now, HTTP profiling is request-based, whereas WebSocket is connection-based and long-lived.\n\nIf we move toward a generic profiling model that supports both request-based (HTTP) and connection-based (WebSocket) protocols, what safe design measures should I keep in mind to avoid breaking the current system?\n\nThanks"},{"who":"srawlins","bot":false,"at":"2026-10-21 17:08","ago":"4d ago","what":"unlabeled 'cost: high'","text":""}],"note":"","prd_note":"","set":"B","source":"eval","draft":"not_yours","why":"","settings_note":"","agents":[{"who":"Gemini","step":"not_yours","text":"None; this issue belongs to the Flutter DevTools team and was only an informational CC."},{"who":"Basic","step":"not_yours","text":""},{"who":"Claude","step":"not_yours","text":"Nothing to do; I was only CC'd on a DevTools feature request in a repository I'm not responsible for."},{"who":"OpenAI","step":"not_yours","text":"No action needed; the DevTools team and bkonyi are driving this feature discussion."}]},{"id":"dart-lang/http#1837","url":"https://github.com/dart-lang/http/issues/1837","title":"Support WinHTTP-based HTTP client for Windows (similar to cupertino_http and cronet_http)","kind":"Issue","state":"open","author":"UnluckyY1","labels":["type-enhancement","contributions-welcome","P3","package:http"],"assignees":[],"requested":[],"repo_desc":"A composable API for making HTTP requests in Dart.","created":"12mo ago","updated":"12mo ago","snapshot":"2026-10-25T17:52:37Z","as_of":null,"thumbs_down_at":null,"roles":["commenter","watches_repo"],"last":"brianquinlan labeled 12mo ago","stacked_on":null,"related":["issue flutter/flutter#26359 'App ignores proxy settings': open, by christian-muertz, updated 9mo ago, labels ['c: new feature', 'framework', 'engine', 'dependency: dart', 'P2', 'team-engine', 'triaged-engine']"],"body":"Hi Dart team 👋\n\nI’d like to ask if there are any plans to provide a WinHTTP-based implementation for the http package on Windows, similar to how:\n\t•\tcronet_http is used on Android\n\t•\tcupertino_http is used on iOS/macOS\n\nCurrently, there’s no native Windows equivalent. As a result, apps using Dart/Flutter on Windows rely solely on the default Dart HTTP stack, which may not take advantage of Windows’ native networking capabilities (e.g. WinHTTP, proxy integration, certificate management, etc.).\n\nThis would also help resolve long-standing issues such as:\nflutter/flutter#26359","timeline":[{"who":"UnluckyY1","bot":false,"at":"2025-10-20 23:15","ago":"12mo ago","what":"opened this issue","text":""},{"who":"UnluckyY1","bot":false,"at":"2025-10-20 23:15","ago":"12mo ago","what":"labeled 'type-enhancement'","text":""},{"who":"UnluckyY1","bot":false,"at":"2025-10-20 23:15","ago":"12mo ago","what":"labeled 'package:http'","text":""},{"who":"HosseinYousefi","bot":false,"at":"2025-10-21 08:47","ago":"12mo ago","what":"labeled 'contributions-welcome'","text":""},{"who":"brianquinlan","bot":false,"at":"2025-10-28 00:05","ago":"12mo ago","what":"commented","text":"Hi @UnluckyY1 ,\n\nThis is not something that the Dart team is likely to take on. It should be possible to a member of the community to tackle this by adding the needed APIs to `package:win32` and then implementing the HTTP API using them."},{"who":"brianquinlan","bot":false,"at":"2025-10-28 00:05","ago":"12mo ago","what":"labeled 'P3'","text":""}],"note":"Old low priority issue where I explicitly asked for 3rd party contributions.","prd_note":"","set":"A","source":"eval","draft":"backlog","why":"Old low priority issue where I explicitly asked for 3rd party contributions.","settings_note":"","agents":[{"who":"Gemini","step":"backlog","text":"Leave in backlog for community contributions or triage during grooming."},{"who":"Basic","step":"not_yours","text":""},{"who":"Claude","step":"backlog","text":"Nothing pending; leave as a contributions-welcome P3 and revisit only if a community member picks it up."},{"who":"OpenAI","step":"backlog","text":"Leave this for community contributions and revisit only during backlog grooming or if a contributor volunteers."}]},{"id":"dart-lang/http#2033","url":"https://github.com/dart-lang/http/pull/2033","title":"chore(http): run Firefox tests with -headless instead of xvfb-run","kind":"PR","state":"open","author":"mosuem","labels":["package:http","type-infra"],"assignees":[],"requested":[],"repo_desc":"A composable API for making HTTP requests in Dart.","created":"3d ago","updated":"2d ago","snapshot":"2026-10-25T17:52:54Z","as_of":null,"thumbs_down_at":null,"roles":["reviewer","watches_repo"],"last":"brianquinlan reviewed [APPROVED] 2d ago","stacked_on":null,"related":[],"body":"> [!NOTE]\n> This PR was generated by an AI coding agent (Jetski) on behalf of @mosuem.\n\n### Summary\n\n`package:test` spawns a separate `firefox` process per test suite and does not pass `-headless` to Firefox by default (`ExecutableSettings.headless` is only applied to Chromium browsers). Previously, `pkgs/http/mono_pkg.yaml` wrapped the Firefox test invocation in `xvfb-run -s \"-screen 0 1024x768x24\"` (without `-noreset`), which caused `Xvfb` to reset display `:99` whenever the last Firefox client connection closed between test suites—flaking in CI when the next suite's Firefox process launched during that X server reset window:\n\n```text\nFailed to load \"test/html/streamed_request_test.dart\":\nFailed to run Firefox: Firefox failed with exit code 1.\nStandard output:\nError: cannot open display: :99.\n```\n\n### Changes\n- Add `pkgs/http/dart_test.yaml` passing `-headless` to the `firefox` platform so Firefox uses its native  downloading files with GRPC streams and speed depending on how far the server is, can be 8 times slower comparing to http download. I was trying to isolate the issue and it seems http2 package seems to be the main problem. \r\nI have Dart VM version: 2.8.4\r\nand tested with\r\nhttp2: ^1.0.0\r\nhttp: ^0.12.2\r\n\r\nI used the code from \"minimal example\" to download file with http2. Is there a way to improve speed?","timeline":[{"who":"KMantas","bot":false,"at":"2020-07-28 17:06","ago":"6.2y ago","what":"opened this issue","text":""},{"who":"FrantisekGazo","bot":false,"at":"2020-11-10 11:57","ago":"6.0y ago","what":"commented","text":"Any update on this?"},{"who":"thamarakshan-pilla","bot":false,"at":"2022-04-05 13:48","ago":"4.6y ago","what":"commented","text":"Any update on this yet??"},{"who":"Neronse","bot":false,"at":"2022-08-04 09:43","ago":"4.2y ago","what":"commented","text":"Seems like problem is not in http2 package. \r\nI noticed that sending photo is slow too.\r\nSending bytes to outgoing stream is fast enough, but when we start listen incoming stream, first header frame received only after 10s+. Looks like problem may be in raw socket.\r\nI have found this issue for dart socket https://github.com/dart-lang/sdk/issues/48210, may be where the same problem.\r\n\r\nI also want to note that the problem is serious for http 2 in dart. All native solutions are faster.\r\n\r\nUPD:\r\nMy problem wasnt in http2 package, or socket. \r\nI am using Dio and write http2 adapter. And all open source adapters implemented like this https://github.com/flutterchina/dio/blob/master/plugins/http2_adapter/lib/src/http2_adapter.dart#L75\r\nThey are sending data messages with 1 byte inside.\r\nWhen i refactored this code, speed of sending becomes `normal.\r\n\r\n\r\n```\r\n final bytes = BytesBuilder(copy: false);\r\n      final completer = Completer<Uint8List>.sync();\r\n      requestStream.listen(\r\n        bytes.add,\r\n        onError: completer.completeError,\r\n        onDone: () => completer.complete(bytes.takeBytes()),\r\n        cancelOnError: true,\r\n      );\r\n      final collectedBytes = await completer.future;\r\n      stream.sendData(collectedBytes);\r\n```"},{"who":"mosuem","bot":false,"at":"2024-06-12 14:47","ago":"2.4y ago","what":"labeled 'type-enhancement'","text":""},{"who":"mosuem","bot":false,"at":"2024-10-18 09:08","ago":"2.0y ago","what":"labeled 'package:http2'","text":""},{"who":"lubritto","bot":false,"at":"2026-02-10 08:15","ago":"8mo ago","what":"commented","text":"Hey, is it confirmed that the root cause is not in the http2 library? if so, should this issue be closed?"}],"note":"Issue in a repo that I'm interested in. The issue is stale. I indicated that I am not responsible for package:http2.","prd_note":"","set":"A","source":"eval","draft":"not_yours","why":"Issue in a repo that I'm interested in. The issue is stale. I indicated that I am not responsible for package:http2.","settings_note":"","agents":[{"who":"Gemini","step":"not_yours","text":"None, as I am not responsible for package:http2."},{"who":"Basic","step":"not_yours","text":""},{"who":"Claude","step":"not_yours","text":"Nothing to do: the issue is in the package:http2 area, which I am not responsible for."},{"who":"OpenAI","step":"not_yours","text":"Leave investigation and closure to the http2 maintainers."}]},{"id":"dart-lang/tools#2715","url":"https://github.com/dart-lang/tools/pull/2715","title":"[string_scanner] Validate error() span bounds and test eager lastSpan","kind":"PR","state":"open","author":"kevmoo","labels":["package:string_scanner"],"assignees":[],"requested":["davidmorgan","dart-ecosystem-team (team)"],"repo_desc":"This repository is home to tooling related Dart packages.","created":"2d ago","updated":"2d ago","snapshot":"2026-10-25T19:31:02Z","as_of":null,"thumbs_down_at":null,"roles":["requested_reviewer_via_team(dart-ecosystem-team)"],"last":"kevmoo review_requested 2d ago","stacked_on":null,"related":["PR dart-lang/tools#2 not_yours","text":"Leave the review to davidmorgan, the personally requested reviewer."}]},{"id":"dart-lang/http#2026","url":"https://github.com/dart-lang/http/pull/2026","title":"[http2] Keep remotely closed streams until their queues are done","kind":"PR","state":"open","author":"shoaib-akhtar","labels":["package:http2"],"assignees":[],"requested":[],"repo_desc":"A composable API for making HTTP requests in Dart.","created":"11d ago","updated":"1d ago","snapshot":"2026-10-25T17:52:47Z","as_of":null,"thumbs_down_at":null,"roles":["watches_repo"],"last":"shoaib-akhtar commented 1d ago","stacked_on":null,"related":["issue dart-lang/http#2021 [linked: closes/closed-by] 'http2: Connection._terminate asserts _stream2messageQueue.isEmpty on a stream _handleEndOfStreamRemote orphaned': open, by hbarney, updated 16d ago","PR dart-lang/http#2013 'fix(http2): do not head-of-line block HEADERS, RST_STREAM and GOAWAY behind window-exhausted DATA': merged, by mosuem, updated 3d ago, labels ['package:http2']"],"body":"Fixes #2021.\n\n`StreamHandler._handleEndOfStreamRemote` removed a stream from `_openStreams` as soon as the peer's END_STREAM moved it from `HalfClosedLocal` to `Closed`, even if the application had not read the stream's incoming messages yet. The stream's entry in the connection-level `ConnectionMessageQueueIn` was left behind, so a later `Connection._terminate` skipped the stream (`StreamHandler.onTerminated` only walks `_openStreams`) and then failed:\n\n```\nFailed assertion: '_stream2messageQueue.isEmpty': is not true.\n  ConnectionMessageQueueIn.onTerminated\n  Connection._terminate\n```\n\nWhen END_STREAMs arrive in the other order (ours after the peer's), `_endStream` moves the stream to `Closed` without removing it. It stays in `_openStreams` until both of its queues are done and `_cleanupClosedStream` runs, so termination closes it normally. This change makes the peer-END_STREAM path behave the same way, which is what the TODO at that line was asking for.\n\n### Tests\n\n`terminate-with-undrained-closed-stream--{server,client}-ends-first` in `transport_test.dart` runs the scenario from the issue over the in-memory transport, in both END_STREAM orders, with the server never reading the stream's messages:\n\n| Order | Before | After |\n|---|---|---|\n| server END_STREAM first | ❌ assertion above | ✅ |\n| client END_STREAM first | ✅ | ✅ |\n\nThe first commit adds only the test, so it can be checked out to see the failure. `dart test` in `pkgs/http2` passes (256 tests), and `dart analyze --fatal-infos` reports no issues.","timeline":[{"who":"Shoaib Akhtar","bot":false,"at":"2026-10-14 10:38","ago":"11d ago","what":"pushed commit 8fa9159 '[http2] Add failing test for terminating with an undrained closed stream'","text":""},{"who":"Shoaib Akhtar","bot":false,"at":"2026-10-14 10:38","ago":"11d ago","what":"pushed commit 4c04318 '[http2] Keep remotely closed streams until their queues are done'","text":""},{"who":"shoaib-akhtar","bot":false,"at":"2026-10-14 10:38","ago":"11d ago","what":"opened this PR","text":""},{"who":"github-actions[bot]","bot":true,"at":"2026-10-14 10:39","ago":"11d ago","what":"labeled 'package:http2'","text":""},{"who":"google-cla[bot]","bot":true,"at":"2026-10-14 10:39","ago":"11d ago","what":"commented","text":"Thanks for your pull request! It looks like this may be your first contribution to a Google open source project. Before we can look at your pull request, you'll need to sign a Contributor License Agreement (CLA).\n\nView this [failed invocation](https://github.com/dart-lang/http/pull/2026/checks?check_run_id=115808763698) of the CLA check for more information.\n\nFor the most up to date status, view the checks section at the bottom of the pull request."},{"who":"Shoaib Akhtar","bot":false,"at":"2026-10-24 10:37","ago":"1d ago","what":"pushed commit e90bd89 'Re-run CLA check'","text":""},{"who":"Shoaib Akhtar","bot":false,"at":"2026-10-24 10:39","ago":"1d ago","what":"pushed commit 60061aa \"Merge remote-tracking branch 'origin/master' into http2-terminate-undrained-closed-stream\"","text":""},{"who":"shoaib-akhtar","bot":false,"at":"2026-10-24 10:40","ago":"1d ago","what":"commented","text":"Hey @mosuem, saw you've been doing a lot in stream_handler lately, so I merged master in. #2013 touched the same spot. Your version keeps the stream around while outgoing DATA is still waiting on window, and this one also keeps it until the incoming side has been read, so I kept the broader check and merged the two comments. All http2 tests pass on my end. CLA is signed now too. Would you mind taking a look when you have a moment?"}],"note":"PR in a repo that I am interested in. Assigned to another collaborator. Indicated that I am not responsible for package:http2.","prd_note":"","set":"A","source":"eval","draft":"not_yours","why":"PR in a repo that I am interested in. Assigned to another collaborator. Indicated that I am not responsible for package:http2.","settings_note":"","agents":[{"who":"Gemini","step":"not_yours","text":"None; this is in http2, which is outside my scope, and the author specifically asked mosuem to review."},{"who":"Basic","step":"not_yours","text":""},{"who":"Claude","step":"not_yours","text":"Nothing for me; http2 is outside my scope and the contributor asked mosuem to review."},{"who":"OpenAI","step":"not_yours","text":"Leave review to mosuem and the http2 maintainers."}]},{"id":"dart-lang/native#3653","url":"https://github.com/dart-lang/native/issues/3653","title":"[ffigen] Use `objc_retainAutoreleasedReturnValue`","kind":"Issue","state":"open","author":"liamappelbe","labels":["package:ffigen"],"assignees":["liamappelbe"],"requested":[],"repo_desc":"Dart packages related to native interop and the foreign function interface. Contains code generators for generating bindings for other programming languages and packages related to the hooks system for bundling native code,","created":"39d ago","updated":"34d ago","snapshot":"2026-10-25T17:52:52Z","as_of":null,"thumbs_down_at":null,"roles":["commenter","mentioned"],"last":"liamappelbe commented 34d ago","stacked_on":null,"related":["issue dart-lang/sdk#61129 '[vm] Use autorelease pools in message loop on iOS/macOS': closed (completed), by liamappelbe, updated 34d ago, assignees ['liamappelbe'], labels ['area-vm', 'P2', 'triaged']","issue dart-lang/native#3652 'Objective-C autorelease pools are never drained': closed (completed), by brianquinlan, updated 27d ago, assignees ['liamappelbe'], labels ['package:ffigen', 'lang-objective_c']","PR dart-lang/native#3664 [linked: closes/closed-by] '[objective_c] Use `objc_retainAutoreleasedReturnValue`': merged, by liamappelbe, updated 35d ago, labels ['package:ffigen', 'package:objective_c']"],"body":"From the [documentation](https://clang.llvm.org/docs/AutomaticReferenceCounting.html#arc-runtime-objc-retainautoreleasedreturnvalue), I *think* we can just replace all our calls to `objc_retain` with this function. If the reference was not recently autoreleased, this is the same as an `objc_retain` call. But if it was autoreleased, then this essentially promotes the autoreleased reference to a strong reference.\n\nThis would reduce the number of autoreleased references we hold, helping to mitigate https://github.com/dart-lang/sdk/issues/61129 / https://github.com/dart-lang/native/issues/3652 (though it's still not a complete solution, because the ObjC APIs the user is calling could autorelease their own internal references).\n\nThanks for the tip @brianquinlan","timeline":[{"who":"liamappelbe","bot":false,"at":"2026-09-16 22:21","ago":"39d ago","what":"opened this issue","text":""},{"who":"liamappelbe","bot":false,"at":"2026-09-16 22:21","ago":"39d ago","what":"assigned liamappelbe","text":""},{"who":"liamappelbe","bot":false,"at":"2026-09-16 22:21","ago":"39d ago","what":"labeled 'package:ffigen'","text":""},{"who":"brianquinlan","bot":false,"at":"2026-09-16 22:56","ago":"39d ago","what":"commented","text":"I actually did an experiment with this and I don't think that it always works (https://github.com/dart-lang/native/issues/3652).\n\nThe problem is that some APIs calls (e.g. `NSURLSession.dataTaskWithRequest`) seem to add things to the autorelease pool other than their return values. After you call `NSURLSession.dataTaskWithRequest`, you'll see that the 7 objects in the autorelease pool (instead of the expected one). Those objects include `__NSCFLocalDataTask` and `__CFN_TaskMetrics` (whatever those are)."},{"who":"liamappelbe","bot":false,"at":"2026-09-16 23:01","ago":"39d ago","what":"commented","text":"Right, we'd still need the VM message loop autorelease pool for references the APIs creates internally. But I think this still worth doing, as long as `objc_retainAutoreleasedReturnValue` is actually a drop-in replacement for `objc_retain`."},{"who":"mkustermann","bot":false,"at":"2026-09-18 08:26","ago":"37d ago","what":"commented","text":"> From the [documentation](https://clang.llvm.org/docs/AutomaticReferenceCounting.html#arc-runtime-objc-retainautoreleasedreturnvalue), I think we can just replace all our calls to objc_retain with this function.\n> ...\n> But I think this still worth doing, as long as objc_retainAutoreleasedReturnValue is actually a drop-in replacement for objc_retain.\n\nIt's not so simple as just calling `objc_retainAutoreleasedReturnValue`: There is a special protocol between caller and callee.\n\nThe called ObjC function that returns the object will get the return address from the stack and look at the following machine instructions to see if it fits a certain pattern (see [here](https://github.com/opensource-apple/objc4/blob/cd5e62a5597ea7a31dccef089317abb3a661c154/runtime/objc-object.h#L1060)). This is also described e.g. [here](https://theapplewiki.com/wiki/Automatic_Reference_Counting#arm64)\n\nSo we cannot just use a FFI calls to `objc_msgSend` and then another FFI call to `objc_retainAutoreleasedReturnValue` with the returned value -- it will not take it out of autorelease pool."},{"who":"brianquinlan","bot":false,"at":"2026-09-18 16:38","ago":"37d ago","what":"commented","text":"> The called ObjC function that returns the object will get the return address from the stack and look at the following machine instructions to see if it fits a certain pattern (see [here](https://github.com/opensource-apple/objc4/blob/cd5e62a5597ea7a31dccef089317abb3a661c154/runtime/objc-object.h#L1060)). This is also described e.g. [here](https://theapplewiki.com/wiki/Automatic_Reference_Counting#arm64)\n\nFWIW, when I was experimenting with this, I created one Objective-C trampoline per bound method so clang would be responsible for generating the correct code. But I thought that this wasn't worth it because:\n1. it's a lot of extra native code generation\n2. it doesn't actually fix the problem (because some methods add to the autorelease pool as an implementation detail)\n\nThe trampoline looks like:\n\n```objc\n__attribute__((ns_returns_retained))\nNSURLSessionDataTask* URLSession_dataTaskWithRequest(NSURLSession* session,\n                                                    NSURLRequest* request) {\n  return [session dataTaskWithRequest:request];\n}\n```\n\nThe generated code ends with:\n\n```\nblr  x8                    ; calls objc_msgSend\nmov  x29, x29              ; <-- the magic marker instruction for arm64\nbl   0x78                  ; calls objc_retainAutoreleasedReturnValue\n```\n\nYou can then change the generated binding like:\n\n```diff\n      final $ret = <call trampoline>\n-    return NSURLSessionDataTask.fromPointer($ret, retain: true, release: true);\n+    // Don't retain because the trampoline has already incremented the reference count.\n+    return NSURLSessionDataTask.fromPointer($ret, retain: false, release: true);\n```"},{"who":"liamappelbe","bot":false,"at":"2026-09-21 00:27","ago":"35d ago","what":"closed","text":""},{"who":"mraleph","bot":false,"at":"2026-09-21 08:11","ago":"34d ago","what":"reopened","text":""},{"who":"mraleph","bot":false,"at":"2026-09-21 08:23","ago":"34d ago","what":"commented","text":"The landed PR does not actually do anything because there is a protocol between `objc_autoreleaseReturnValue` and `objc_retainAutoreleasedReturnValue` which you need to follow for hand-off to succeed. \n\nSee [the code](https://github.com/apple-oss-distributions/objc4/blob/fb265098298302243cd7eeaa1f63f0ba7786dd9a/runtime/NSObject.mm#L2335-L2342), more specifically [`prepareOptimizedReturn`](https://github.com/apple-oss-distributions/objc4/blob/fb265098298302243cd7eeaa1f63f0ba7786dd9a/runtime/objc-object.h#L1612-L1673) and [`acceptOptimizedReturn`](https://github.com/apple-oss-distributions/objc4/blob/fb265098298302243cd7eeaa1f63f0ba7786dd9a/runtime/objc-object.h#L1676-L1724).\n\nTLDR is that on ARM64  `objc_autoreleaseReturnValue` will put a tuple of `(obj, return-address)` into the TLS and `objc_retainAutoreleasedReturnValue` will check whether `return-address` corresponds to its call-site. There are also some corner-cases (e.g. classes which intercept `retain` / `release` messages are handled specially) where these methods will look at instructions at the call-site to detect a special marking instructions (e.g. `mov fp, fp` on ARM64). \n\nI don't think we can fully satisfy the protocol without some low-level surgery in the FFI implementation in the VM.  \n\nPS. Additional data point. If you take the PR and revert all the changes except changes in the tests - those tests will still pass. Which seems to indicate that the PR does not do anything."},{"who":"liamappelbe","bot":false,"at":"2026-09-22 01:51","ago":"34d ago","what":"commented","text":"Ok, that's a much bigger change then. We'd need to add a new flag similar to `isLeaf` to `@Native` etc, and then change the trampoline based on that flag. We would only really need to enable that flag for `objc_msgSend` and co (and only if they return an object pointer with a +0 reference).\n\nAs for *how* we change the trampoline:\n- The straightforward option would be to call `objc_retainAutoreleasedReturnValue` inside the trampoline, which is fine as long as the caller knows that this means the reference is now +1 instead of +0, and must be caught in a Dart wrapper object. As long as we're careful about version skew between VM/FFIgen/package:objective_c, this should be ok. A bit risky tho.\n- A fancier approach would be to try to make the `objc_retainAutoreleasedReturnValue` work by making the trampoline transparent, so that from Dart code it looks like we are directly calling `objc_msgSend`. This seems like it would be extremely difficult.\n\nOverall I'm not sure it's worth it. Better to just wrap every `objc_msgSend` call in an autorelease pool. Seems like a lot of effort to go to to save a few ns."}],"note":"Issue that I created comments in. Assigned to someone else and not actionable by me.","prd_note":"","set":"A","source":"eval","draft":"not_yours","why":"Issue that I created comments in. Assigned to someone else and not actionable by me.","settings_note":"","agents":[{"who":"Gemini","step":"not_yours","text":"None; liamappelbe is driving this ffigen issue in dart-lang/native."},{"who":"Basic","step":"elsewhere","text":""},{"who":"Claude","step":"backlog","text":"Nothing is asked of me; liamappelbe is assigned and leaning toward wrapping objc_msgSend in an autorelease pool instead. Skim occasionally and close or comment if the approach is dropped."},{"who":"OpenAI","step":"not_yours","text":"Leave further investigation and disposition to liamappelbe, the assignee."}]},{"id":"dart-lang/http#1972","url":"https://github.com/dart-lang/http/issues/1972","title":"HEAD call results in ClientException: Content-Length is larger than actual response length.","kind":"Issue","state":"open","author":"Keetz","labels":["type-bug","package:http","needs-info"],"assignees":["brianquinlan"],"requested":[],"repo_desc":"A composable API for making HTTP requests in Dart.","created":"18d ago","updated":"8d ago","snapshot":"2026-08-30T00:00:00Z","as_of":"2026-08-30T00:00:00Z","thumbs_down_at":null,"roles":["assignee","commenter","watches_repo"],"last":"brianquinlan labeled 8d ago","stacked_on":null,"related":["PR dart-lang/http#1974 [linked: closes/closed-by] 'Fix #1972: bypass body-reading for HEAD requests in io_client': open, by amanmaurya92, updated 0h ago, labels ['package:http', 'needs-info']"],"body":"It looks like the HTTP implementation is receiving the Content-Length and then performing its usual body-length consistency check without correctly accounting for the fact that the request was HEAD.\n\nThe HEAD call itself is fine and gives an 200 OK, but trying to do anything around a try/catch setup gets messed up by this unexpected ClientException.","timeline":[{"who":"Keetz","bot":false,"at":"2026-08-11 13:44","ago":"18d ago","what":"opened this issue","text":""},{"who":"Keetz","bot":false,"at":"2026-08-11 13:44","ago":"18d ago","what":"labeled 'type-bug'","text":""},{"who":"Keetz","bot":false,"at":"2026-08-11 13:44","ago":"18d ago","what":"labeled 'package:http'","text":""},{"who":"brianquinlan","bot":false,"at":"2026-08-21 18:07","ago":"8d ago","what":"assigned brianquinlan","text":""},{"who":"brianquinlan","bot":false,"at":"2026-08-22 00:20","ago":"8d ago","what":"commented","text":"1. What client are you using? Is it `IOClient`?\n2. I don't understand the scenario: is the server returning a content-length header but without content? Because I can't reproduce that issue if that is the case:\n    ```dart\n      test('HEAD', () async {\n        httpServerChannel.sink.add('content-length: 100\\r\\n');\n        final response = await client.head(Uri.http(host, ''));\n        expect(response.statusCode, 200);\n        expect(response.headers['content-length'], '100');\n        expect(response.body, '');\n      });\n    ```"},{"who":"brianquinlan","bot":false,"at":"2026-08-22 00:20","ago":"8d ago","what":"labeled 'needs-info'","text":""}],"note":"","prd_note":"","set":"B","source":"eval","draft":"elsewhere","why":"","settings_note":"","agents":[{"who":"Gemini","step":"elsewhere","text":"Act on PR #1974 instead of this issue."},{"who":"Basic","step":"elsewhere","text":""},{"who":"Claude","step":"elsewhere","text":"Work on PR dart-lang/http#1974, which claims to fix this issue, instead of this issue; the reporter has not yet answered my needs-info questions."},{"who":"OpenAI","step":"elsewhere","text":"Track the proposed fix in PR #1974; wait for the reporter to provide the requested reproduction details."}]},{"id":"dart-lang/http#1841","url":"https://github.com/dart-lang/http/issues/1841","title":"Respect Retry-After header on 503 responses for RetryClient","kind":"Issue","state":"open","author":"RobertBrunhage","labels":["type-enhancement","next-breaking-release","package:http"],"assignees":[],"requested":[],"repo_desc":"A composable API for making HTTP requests in Dart.","created":"12mo ago","updated":"25d ago","snapshot":"2026-10-25T19:31:47Z","as_of":null,"thumbs_down_at":"2026-10-05T00:00:00Z","roles":["commenter","mentioned","watches_repo"],"last":"agam1092005 referenced this in commit 23d ago","stacked_on":null,"related":["PR dart-lang/http#2002 [linked: closes/closed-by] 'Add retryDelay callback to RetryClient to support Retry-After header': open, by agam1092005, updated 12d ago, labels ['package:http']"],"body":"it is generally recommended that on 503, if the server responds with the `Retry-After` header we should respect that and if it's not present we should default back exponential backoff.\n\nIs this something that coud be considered to be added directly into the `RetryClient`, so we have that as default behaviour?\n\nI am asking this because we already retrying [503 by default](https://github.com/dart-lang/http/blob/2cb6c12966e18abc11a0217a8b613742849a29ea/pkgs/http/lib/retry.dart#L182C1-L182C4).","timeline":[{"who":"RobertBrunhage","bot":false,"at":"2025-10-30 14:43","ago":"12mo ago","what":"opened this issue","text":""},{"who":"RobertBrunhage","bot":false,"at":"2025-10-30 14:43","ago":"12mo ago","what":"labeled 'type-enhancement'","text":""},{"who":"RobertBrunhage","bot":false,"at":"2025-10-30 14:43","ago":"12mo ago","what":"labeled 'package:http'","text":""},{"who":"brianquinlan","bot":false,"at":"2025-12-02 01:06","ago":"11mo ago","what":"commented","text":"The most obvious way of doing this is to make `BaseResponse` available in the `delay` function. But that would be a breaking change.\n\nCan you think of another way of doing this?"},{"who":"brianquinlan","bot":false,"at":"2025-12-02 01:06","ago":"11mo ago","what":"labeled 'next-breaking-release'","text":""},{"who":"agam1092005","bot":false,"at":"2026-09-30 17:51","ago":"25d ago","what":"commented","text":"Another way to do this without breaking the existing API is to keep delay(int retryCount) as the default backoff policy and add a separate opt-in callback for response-aware delays. For example:\n\n`Duration? Function(BaseResponse response, int retryCount)? retryDelay`\n\nThe default implementation would continue using the current exponential backoff, while callers that need server-controlled retry timing can provide a function that reads Retry-After and returns the appropriate delay. This preserves compatibility for existing users while allowing Retry-After support without changing the meaning of delay.\nThat keeps the change focused and avoids forcing all retry users to depend on BaseResponse in the existing callback.\n\n@brianquinlan @RobertBrunhage \n I’d like to work on this issue."},{"who":"agam1092005","bot":false,"at":"2026-10-02 18:36","ago":"23d ago","what":"referenced this in commit 4d1b31e","text":""},{"who":"agam1092005","bot":false,"at":"2026-10-02 18:41","ago":"23d ago","what":"referenced this in commit d69fb8d","text":""}],"note":"","prd_note":"","set":"B","source":"eval","draft":"elsewhere","why":"","settings_note":"","agents":[{"who":"Gemini","step":"elsewhere","text":"Review open PR dart-lang/http#2002 which implements this enhancement."},{"who":"Basic","step":"elsewhere","text":""},{"who":"Claude","step":"not_yours","text":"Nothing to do on this issue; any action belongs on PR dart-lang/http#2002, which is open and covers it, and I already marked this item not important."},{"who":"OpenAI","step":"elsewhere","text":"Track the proposed implementation in PR #2002 rather than acting on this issue."}]},{"id":"dart-lang/sdk#38148","url":"https://github.com/dart-lang/sdk/issues/38148","title":"Directory.deleteSync(recursive: true) failing if directory is not empty","kind":"Issue","state":"open","author":"tvolkert","labels":["area-vm","library-io","P2","triaged"],"assignees":["brianquinlan"],"requested":[],"repo_desc":"The Dart SDK, including the VM, JS and Wasm compilers, analysis, core libraries, and more.","created":"7.2y ago","updated":"24d ago","snapshot":"2026-10-25T19:31:45Z","as_of":null,"thumbs_down_at":"2026-08-01T00:00:00Z","roles":["assignee"],"last":"filiph commented 24d ago","stacked_on":null,"related":["issue dart-lang/sdk#16264 'Directory.deleteSync(recursive: true) throwing exception in Windows because directory is not empty.': closed (completed), by DartBot, updated 10.7y ago, labels ['closed-as-intended', 'library-io']","issue dart-lang/sdk#1757 'Directory.delete[Sync]() fails if the directory is non-empty': closed (completed), by munificent, updated 11.4y ago, assignees ['madsager'], labels ['area-core-library', 'library-io']","issue flutter/flutter#64410 '[tool_crash] FileSystemException: Deletion failed, OS Error: Directory not empty, errno = 66': closed (not_planned), by wjcwukong, updated 15mo ago, labels ['c: crash', 'tool', 'P2', 'team-tool', 'triaged-tool']"],"body":"Observed on the following Dart version:\r\n\r\n```sh\r\n$ dart --version\r\nDart VM version: 2.5.0-dev.3.0.flutter-35382f9b14 (Wed Aug 28 18:50:51 2019 +0000) on \"macos_x64\"\r\n```\r\n\r\n```\r\n  FileSystemException: Deletion failed, path = '/private/v
