<!DOCTYPE html>

<style>
/* Shared with the ranking page (eval/ranker_template.html): the list on the left, the selected issue on the right. */
:root {
  --bg: #f4f6f8; --surface: #ffffff; --ink: #16202c; --muted: #5a6575; --line: #d9dfe7; --hover: #eef2f6;
  --accent: #0e6b67; --accent-ink: #ffffff; --accent-soft: #dcefed;
  --pr: #5b3aa6; --pr-soft: #ece6f8; --issue: #23692f; --issue-soft: #e3f1e5;
  --warn: #8a5300; --warn-soft: #fbedd6; --down: #a3332b; --down-soft: #f9e3e1;
  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141a; --surface: #171e26; --ink: #e5eaf0; --muted: #98a3b2; --line: #2a3441; --hover: #1d2630;
  --accent: #46b8b0; --accent-ink: #062523; --accent-soft: #15302f;
  --pr: #b9a0f0; --pr-soft: #2a2140; --issue: #86d193; --issue-soft: #183020;
  --warn: #f0b75c; --warn-soft: #33270f; --down: #f09a92; --down-soft: #3a1d1b; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f141a; --surface: #171e26; --ink: #e5eaf0; --muted: #98a3b2; --line: #2a3441; --hover: #1d2630;
  --accent: #46b8b0; --accent-ink: #062523; --accent-soft: #15302f;
  --pr: #b9a0f0; --pr-soft: #2a2140; --issue: #86d193; --issue-soft: #183020;
  --warn: #f0b75c; --warn-soft: #33270f; --down: #f09a92; --down-soft: #3a1d1b; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14.5px/1.5 var(--font-body); display: flex; flex-direction: column; }
a { color: var(--accent); }
button { font: 600 13px/1 var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 9px 12px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--muted); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); }
h1 { font: 800 18px/1.1 var(--font-display); margin: 0; }
.status { font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; margin-right: auto; min-width: 0; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.status[data-s="saved"] .dot { background: var(--issue); }
.status[data-s="saving"] .dot { background: var(--warn); }
.status[data-s="error"] .dot, .status[data-s="offline"] .dot { background: var(--down); }
.count { font-size: 12.5px; color: var(--muted); }

.panes { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); }
.listpane { border-right: 1px solid var(--line); overflow-y: auto; background: var(--surface); }
ol.rank { list-style: none; margin: 0; padding: 6px 0; }
ol.rank li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px; align-items: baseline; padding: 7px 12px 7px 10px; cursor: pointer; border-left: 3px solid transparent; }
ol.rank li:hover { background: var(--hover); }
ol.rank li[aria-selected="true"] { background: var(--accent-soft); border-left-color: var(--accent); }
.n { font: 800 15px/1 var(--font-display); font-variant-numeric: tabular-nums; text-align: right; color: var(--muted); }
li[aria-selected="true"] .n { color: var(--accent); }
.row-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
.row-id { font: 11.5px/1.3 var(--font-mono); color: var(--muted); display: flex; gap: 6px; align-items: center; }
.k { flex: none; font: 700 10px/1 var(--font-body); padding: 2px 4px; border-radius: 3px; }
.k.pr { background: var(--pr-soft); color: var(--pr); } .k.issue { background: var(--issue-soft); color: var(--issue); }
.rid { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.newdot { flex: none; white-space: nowrap; font: 600 10px/1 var(--font-body); color: var(--warn); background: var(--warn-soft); padding: 2px 4px; border-radius: 3px; }

.viewpane { overflow-y: auto; min-width: 0; }
.mover { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-block: 10px; padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); background: var(--bg); border-bottom: 1px solid var(--line); }
.pos { font: 800 22px/1 var(--font-display); font-variant-numeric: tabular-nums; margin-right: 6px; }
.pos small { font: 500 13px var(--font-body); color: var(--muted); }
.mover .big { padding: 10px 16px; font-size: 14px; }
.mover .sep { flex: 1; }
.hint { font-size: 12px; color: var(--muted); }
kbd { font: 11px var(--font-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 1px 4px; background: var(--surface); }

article { padding: 18px 20px 40px; padding-right: max(20px, env(safe-area-inset-right, 0px)); max-width: 860px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 600 11px/1 var(--font-body); padding: 4px 7px; border-radius: 5px; background: var(--surface); color: var(--muted); border: 1px solid var(--line); }
.chip.pr { background: var(--pr-soft); color: var(--pr); border-color: transparent; }
.chip.issue { background: var(--issue-soft); color: var(--issue); border-color: transparent; }
h2 { font: 600 20px/1.3 var(--font-body); margin: 10px 0 4px; text-wrap: balance; }
h2 a { color: var(--ink); text-decoration: none; } h2 a:hover { text-decoration: underline; }
.idline { font: 12.5px/1.4 var(--font-mono); color: var(--muted); overflow-wrap: anywhere; }
.banner { margin: 12px 0 0; padding: 9px 12px; border-radius: 8px; font-size: 13.5px; }
.banner.asof { background: var(--warn-soft); color: var(--warn); }
.banner.down { background: var(--down-soft); color: var(--down); }
.banner.note { background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
.banner.note b { color: var(--muted); font-weight: 600; }
dl.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 14px; margin: 14px 0; font-size: 13.5px; }
dl.facts dt { color: var(--muted); } dl.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
h3 { font: 600 11px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px; }
.body { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; font-size: 14px; }
.tlbar { display: flex; align-items: center; gap: 10px; margin: 22px 0 8px; }
.tlbar h3 { margin: 0; }
.tlbar label { font-size: 12.5px; color: var(--muted); display: inline-flex; gap: 5px; align-items: center; }
ol.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
ol.tl li { border-left: 2px solid var(--line); padding: 2px 0 2px 12px; }
ol.tl li.me { border-left-color: var(--accent); }
ol.tl li.bot { opacity: .7; }
ol.tl .meta { font-size: 12.5px; color: var(--muted); }
ol.tl .meta b { color: var(--ink); font-weight: 600; }
ol.tl .txt { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 3px; font-size: 13.5px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; max-height: 340px; overflow-y: auto; }
.why label { display: block; font-size: 12.5px; color: var(--muted); margin: 22px 0 4px; }
textarea { width: 100%; min-height: 56px; resize: vertical; font: 14px/1.45 var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; }
.yaml { margin: 16px; }
.yaml textarea { min-height: 200px; font: 12px/1.4 var(--font-mono); }

@media (max-width: 760px) {
  body { height: auto; display: block; }
  .panes { display: flex; flex-direction: column-reverse; }
  .listpane { border-right: 0; border-top: 1px solid var(--line); max-height: none; overflow: visible; }
  .viewpane { overflow: visible; }
  .mover { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .mover .hint { display: none; }
  article { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
/* The labelling page: the items on the left, the selected item on the right, the seven next steps on top of it. */
.stepbar { position: sticky; top: 0; z-index: 2; padding: 10px 20px 12px; padding-right: max(20px, env(safe-area-inset-right, 0px)); background: var(--bg); border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.stepbar .groups { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; }
.stepbar .group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.stepbar .glabel { font: 600 11px/1 var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
.stepbar .row2 { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12.5px; color: var(--muted); }
.stepbar .row2 .grow { flex: 1; }
.pos { font: 800 18px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.pos small { font: 500 12.5px var(--font-body); color: var(--muted); }

/* Next-step chips, in the app's colors (PRD LIST-42): filled blue on me, outlined blue for Backlog, grey for the rest. */
:root { --on: #315bde; --on-soft: #eef2ff; --on-line: #c9d4f5; --off: #5f6876; --off-soft: #f3f5f8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --on: #8fa8ff; --on-soft: #1d2647; --on-line: #34437a; --off: #a7b0bd; --off-soft: #1f2731; } }
button.step { display: inline-flex; align-items: center; gap: 7px; padding: 8px 11px; border-radius: 999px; font: 600 13px/1 var(--font-body); }
button.step kbd { font-size: 10.5px; padding: 0 4px; opacity: .8; }
button.step[aria-pressed="true"] kbd { background: transparent; color: inherit; border-color: rgba(255, 255, 255, .6); }
button.step.now { background: var(--on-soft); color: var(--on); border-color: transparent; }
button.step.later { background: var(--surface); color: var(--on); border-color: var(--on-line); }
button.step.off { background: var(--off-soft); color: var(--off); border-color: var(--line); }
button.step[aria-pressed="true"] { color: #fff; border-color: transparent; box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px currentColor; }
button.step.now[aria-pressed="true"], button.step.later[aria-pressed="true"] { background: var(--on); box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--on); }
button.step.off[aria-pressed="true"] { background: var(--off); box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--off); }
button.step.draft:not([aria-pressed="true"]) { border: 1.5px dashed currentColor; }
.tag { flex: none; display: inline-flex; align-items: center; height: 18px; padding: 0 7px; border-radius: 999px; font: 600 11px/1 var(--font-body); white-space: nowrap; border: 1px solid transparent; }
.tag.now { background: var(--on-soft); color: var(--on); }
.tag.later { background: var(--surface); color: var(--on); border-color: var(--on-line); }
.tag.off { background: var(--off-soft); color: var(--off); border-color: var(--line); }
.tag.draft { background: transparent; border: 1px dashed currentColor; opacity: .75; }

.filters { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 1; }
.filters button { padding: 6px 9px; font-size: 12px; }
.filters button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
ol.rank li { grid-template-columns: minmax(0, 1fr) auto; align-items: center; padding-left: 12px; }
ol.rank li.done .row-title { color: var(--muted); }
.src { font: 600 10px/1 var(--font-body); color: var(--muted); }
details.help, details.agents { margin: 14px 0 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
details.help summary, details.agents summary { cursor: pointer; padding: 9px 12px; font-size: 13px; font-weight: 600; }
details.help dl { margin: 0; padding: 0 12px 10px; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 12px; font-size: 13px; }
details.help dd { margin: 0; color: var(--muted); }
details.agents ul { margin: 0; padding: 0 12px 12px 12px; list-style: none; display: grid; gap: 8px; font-size: 13.5px; }
details.agents li { display: grid; grid-template-columns: 70px auto minmax(0, 1fr); gap: 8px; align-items: baseline; }
details.agents .who { color: var(--muted); font-size: 12.5px; }
.empty { padding: 40px 20px; color: var(--muted); }
</style>

<header class="top">
  <h1>Next steps</h1>
  <span class="count" id="count"></span>
  <div class="status" id="status" data-s="loading" role="status" aria-live="polite"><span class="dot"></span><span id="statusText">Connecting…</span></div>
  <button id="copyBtn" type="button">Copy as YAML</button>
</header>

<div class="panes">
  <nav class="listpane" aria-label="Items">
    <div class="filters" role="group" aria-label="Show">
      <button type="button" data-f="all" aria-pressed="true">All</button>
      <button type="button" data-f="todo" aria-pressed="false">To label</button>

      <div class="groups" id="steps"></div>

        <span class="pos" id="pos"></span>
        <span id="draftNote"></span>
        <span class="grow"></span>
        <span class="hint"><kbd>1</kbd>–<kbd>7</kbd> choose · <kbd>Enter</kbd> accept the draft · <kbd>0</kbd> clear · <kbd>J</kbd><kbd>K</kbd> next/previous · <kbd>N</kbd> next to label</span>
      </div>
    </div>
    <article id="view"></article>
    <div class="yaml" id="yamlBox" hidden>
      <p>Saving isn't available in this view. Copy this and paste it to Claude:</p>
      <textarea id="yamlText" readonly></textarea>
    </div>
  </main>
</div>

<script id="data" type="application/json">{"user":"brianquinlan","steps":[{"key":"review","label":"Review","tone":"now","meaning":"A PR is waiting for my review or re-review. I am a requested reviewer, or the default reviewer for the repository, or the author has updated the PR since my last review."},{"key":"respond","label":"Respond","tone":"now","meaning":"Someone is waiting on me. A question or request addressed to me is unanswered, or my own PR has review feedback I haven't addressed."},{"key":"todo","label":"To do","tone":"now","meaning":"It is mine to move forward and nobody is waiting on a reply from me. This covers work I am assigned, said I would do, or recently filed in an area I own. It includes checking whether something is fixed, deciding what to do, finishing or closing my draft, and pinging a reviewer who has been silent for about a week."},{"key":"backlog","label":"Backlog","tone":"later","meaning":"It is mine, but nothing is pressing. It is an old or stale item in an area I own, with no recent activity and nobody waiting, that I could triage or close when grooming."},{"key":"waiting","label":"Waiting","tone":"off","meaning":"I am involved and it is someone else's move. I asked a question, requested changes or requested a review, and haven't had an answer yet."},{"key":"elsewhere","label":"Elsewhere","tone":"off","meaning":"The thing to act on is a different item. This is an issue with an open PR that fixes it, or a PR stacked on lower PRs that need review first. Name that item in the next action."},{"key":"not_yours","label":"Not yours","tone":"off","meaning":"There is nothing for me to do, now or later. It is outside my stated scope, owned or driven by someone else, a team review request in a repository I'm not responsible for, a mention with nothing asked of me, or a PR I already approved."}],"precedence":["not_yours","elsewhere","review","respond","waiting","todo","backlog"],"items":[{"id":"dart-lang/sdk#48056","url":"https://github.com/dart-lang/sdk/issues/48056","title":"Disabled CA certificates on android are trusted by Dart","kind":"Issue","state":"open","author":"brianquinlan","labels":["area-vm","P3","library-io","os-android","triaged"],"assignees":["brianquinlan"],"requested":[],"repo_desc":"The Dart SDK, including the VM, JS and Wasm compilers, analysis, core libraries, and more.","created":"4.8y ago","updated":"3d ago","snapshot":"2026-10-25T17:52:11Z","as_of":null,"thumbs_down_at":null,"roles":["author","assignee","commenter","mentioned"],"last":"julemand101 commented 3d ago","stacked_on":null,"related":["issue flutter/flutter#26359 'App ignores proxy settings': open, by christian-muertz, updated 9mo ago, labels ['c: new feature', 'framework', 'engine', 'dependency: dart', 'P2', 'team-engine', 'triaged-engine']","issue dart-lang/sdk#50434 'HttpClient should honor the system configured proxy': open, by brianquinlan, updated 2.5y ago, assignees ['brianquinlan'], labels ['area-vm', 'P3', 'library-io', 'triaged']","issue dart-lang/sdk#50435 'HttpClient should honor user-installed certificates on Android': open, by brianquinlan, updated 16mo ago, assignees ['brianquinlan'], labels ['area-vm', 'P3', 'library-io', 'os-android', 'triaged']","issue dart-lang/sdk#64644 '[dart:io] Distrust eight compromised intermediate CA keys': closed (completed), by DubaiChewyCookie, updated 2d ago, assignees ['mraleph'], labels ['area-vm', 'triaged']"],"body":"On Android OS, the list of Root Certificates loaded by the DartSDK SecurityContext is loaded from the directory /system/etc/security/cacerts.\r\n\r\nThe Root Certificate files placed in this path will match the System Certificates in the Trusted credentials on the Android OS. \r\n\r\nHowever, even if Certificate is set to Disable on the Android OS, the Root Certificate file will not be removed from /system/etc/security/cacerts. So even if a user sets any Root Certificate to be untrusted, the DartSDK will ignore that setting and trust it.\r\n\r\nSteps to reproduce:\r\n\r\n1. On AndroidOS, disable the System Root Certificate DigiCert High Assurance EV Root CA in Trusted credentials.\r\n2. Using the `http` package of DartSDK, connect to the server where DigiCert High Assurance EV Root CA will be the RootCA. An example of the code is shown below.\r\n```\r\ndart\r\n// RootCA for www.intellilink.co.jp FQDN is DigiCert High Assurance EV Root CA\r\nhttp.get(Uri.parse('https://www.intellilink.co.jp'));\r\n```\r\n3. For the reasons explained above, DartSDK trusts the Root Certificate with the disabled setting and establishes communication with it. Note that NET::ERR_CERT_AUTHORITY_INVALID is generated when you connect to https://www.intellilink.co.jp with Google Chrome, which confirms that the above disabled setting is working.","timeline":[{"who":"brianquinlan","bot":false,"at":"2022-01-04 20:55","ago":"4.8y ago","what":"opened this issue","text":""},{"who":"brianquinlan","bot":false,"at":"2022-01-04 20:55","ago":"4.8y ago","what":"labeled 'library-io'","text":""},{"who":"brianquinlan","bot":false,"at":"2022-01-04 20:55","ago":"4.8y ago","what":"labeled 'os-android'","text":""},{"who":"a-siva","bot":false,"at":"2022-01-04 21:31","ago":"4.8y ago","what":"labeled 'area-library'","text":""},{"who":"acoutts","bot":false,"at":"2022-03-23 13:10","ago":"4.6y ago","what":"commented","text":"Could this also mean if a user has explicitly added a new certificate to their system, dart wouldn't trust it?\r\nOne issue I'm seeing in the wild is users on corporate public wifi networks are getting certificate errors in my flutter app but they are clearly able to use the internet otherwise to contact our support team, which means their device must trust the root CA being used but the flutter app is not."},{"who":"komaxx","bot":false,"at":"2022-10-30 10:22","ago":"4.0y ago","what":"commented","text":"@acoutts\r\nYes, many corporate Wifi network setups will not work with Dart/Flutter (at least with Android devices).\r\nIn one app, we've built a workaround where a required certificate would be installed into the app per MDM additionally to installing it in the OS itself.\r\nThat is brittle workaround, though. \r\n\r\nWe've also tried to pipe all traffic not through `dart.http` but wrote native plugin code for that instead. This will fail for everything that you don't control directly, though, like image loading or video streaming.\r\n\r\nIn the end, we scrapped the Flutter project for all business apps, and started re-implementing natively.\r\n\r\nI wish Flutter/Dart would put a clear warning on their pages, like: _Corporate networks are not supported_."},{"who":"brianquinlan","bot":false,"at":"2022-10-31 19:56","ago":"4.0y ago","what":"assigned brianquinlan","text":""},{"who":"brianquinlan","bot":false,"at":"2022-10-31 19:57","ago":"4.0y ago","what":"labeled 'P2'","text":""},{"who":"brianquinlan","bot":false,"at":"2022-10-31 19:57","ago":"4.0y ago","what":"unlabeled 'P2'","text":""},{"who":"brianquinlan","bot":false,"at":"2022-10-31 19:57","ago":"4.0y ago","what":"labeled 'P1'","text":""},{"who":"brianquinlan","bot":false,"at":"2022-11-02 00:09","ago":"4.0y ago","what":"commented","text":"Hey @komaxx,\r\n\r\nI'd like to understand your use case (and I'm not familiar with how typical corporate networks do security).\r\n\r\nSo the corporate network that you are trying to access requires a client certificate. When you were explicitly setting the certificate in your app, were you using [`SecurityContext.useCertificateChainBytes`](https://api.dart.dev/stable/2.18.4/dart-io/SecurityContext/useCertificateChainBytes.html)?\r\n\r\nWould [`getCertificateChain`](https://developer.android.com/reference/android/security/KeyChain#getCertificateChain(android.content.Context,%20java.lang.String) have provided the certificate that you needed?\r\n\r\nWhat did your native plugin do? Provide the needed certificate, do the entire HTTP transport or something else?\r\n\r\nThanks for your help!"},{"who":"aam","bot":false,"at":"2022-11-02 15:57","ago":"4.0y ago","what":"commented","text":"> Could this also mean if a user has explicitly added a new certificate to their system, dart wouldn't trust it?\r\n\r\nIt depends on how and kind of a certificate was added to the system.\r\nGenerally speaking, by default dart app will pick up _trusted_root_certs_ from the system, so if a user adds new new trusted root cert to the system, dart app will use it. Dart developer can also allows force use of trusted roots certs that are built-in into the dart vm(via [`SecurityContext(withTrustedRoots:true)`](https://api.flutter.dev/flutter/dart-io/SecurityContext/SecurityContext.html)). Dart developer can also explicitly specify certificates that should be used(via [`SecurityContext.setTrustedCertificates`](https://api.flutter.dev/flutter/dart-io/SecurityContext/setTrustedCertificates.html)\r\n\r\n> One issue I'm seeing in the wild is users on corporate public wifi networks are getting certificate errors in my flutter app but they are clearly able to use the internet otherwise to contact our support team, which means their device must trust the root CA being used but the flutter app is not.\r\n\r\nI recommend opening new issue for the issue you see, since this one is specifically about handling of disabled certs on Android, and providing more details along the lines @brianquinlan suggested."},{"who":"brianquinlan","bot":false,"at":"2022-11-02 16:29","ago":"4.0y ago","what":"commented","text":"Hey @aam,\r\n\r\nMaybe I'm misunderstanding but Dart is loading certs from [`/system/etc/security/cacerts`](https://github.com/dart-lang/sdk/blob/main/runtime/bin/security_context_android.cc#L50).\r\n\r\nI think that user-add certificates go in `/data/misc/keystore/user_0/` (or in a database in new Android versions), which we don't consider.\r\n\r\nGood point about the new issue - if this is looking like a client certificate issue then I'll file a new issue just about that."},{"who":"aam","bot":false,"at":"2022-11-02 16:47","ago":"4.0y ago","what":"commented","text":"> I think that user-add certificates go in `/data/misc/keystore/user_0/` (or in a database in new Android versions), \r\n\r\nAh, I see. If that's the case, then you are right, we are not going to pick those certificates up automatically at the moment"},{"who":"komaxx","bot":false,"at":"2022-11-07 09:07","ago":"4.0y ago","what":"commented","text":"Hi @brianquinlan \r\n\r\nHappy to help! \r\nHere's what I've encountered as a common corporate network setup: (Android) devices are controlled via some sort of MDM (Knox, MobileIron, ..). Via these MDMs, self-signed certificates are installed on the phones. In the settings app on the phone, these will then show up as user-added certificates.\r\nAlso Wifi connections are often set-up to use a man-in-the-middle proxy (for \"security\") which uses again a self-signed certificate for TLS.\r\n\r\nFor the **browser**, everything works then out-of-the-box: Browser apps by default trust user-added certificates.\r\n\r\nFor **native Android** apps, there is only a small change necessary: One just has to add a security config XML file that enables user-installed certificates as trust-anchors (see: https://developer.android.com/training/articles/security-config). Proxy settings are honored automatically.\r\n\r\nFor **Flutter apps**, we're now in hot water: \r\n- First, Flutter will not respect the phones proxy settings (see: https://github.com/flutter/flutter/issues/26359) \r\n- Then, when a workaround for that was made, the user-installed certificates will not be accepted. For this, we could not find a simple solution, as there seems to be no easy way to read user-certificates from the system. \r\n\r\nWith one customer we could build a scheme where the PEM of the used self-signed certificate would be transported to the app via MDM. Then, we simply registered an `HttpOverride` and created a `HttpClient` that would check in its `badCertificateCallback` against this pem. It works - but it puts our app at a disadvantage against competitor's apps that don't need fiddling around with certificates in MDM interfaces.\r\n\r\nThe second workaround was to simply dump all http requesting into a plugin and run the requests natively. That gets old quickly (multipart requets, custom headers, error handling, ..) as we had to re-implement parts of the `http` interface, but it works - for http requests that we do ourself; implicit requests (e.g. `Image.network`) fail. One can write workarounds for all those things as well. However, we decided at that point to go for a different platform for apps targeted at corporate customers.\r\n\r\n> Would [getCertificateChain](https://developer.android.com/reference/android/security/KeyChain#getCertificateChain(android.content.Context,%20java.lang.String) have provided the certificate that you needed?\r\n\r\nI don't know :/ This did not turn up in my research at the time, and right now I don't know how I would use it, sorry!\r\n\r\nI hope that makes things a bit clearer?"},{"who":"brianquinlan","bot":false,"at":"2022-11-10 18:32","ago":"4.0y ago","what":"commented","text":"Based on the discussion, I've filed two new bugs:\r\n- [HttpClient should honor the system configured proxy](https://github.com/dart-lang/sdk/issues/50434)\r\n- [HttpClient should honor user-installed certificates on Android](https://github.com/dart-lang/sdk/issues/50435)"},{"who":"brianquinlan","bot":false,"at":"2022-11-10 18:32","ago":"4.0y ago","what":"unlabeled 'P1'","text":""},{"who":"brianquinlan","bot":false,"at":"2022-12-17 02:23","ago":"3.9y ago","what":"labeled 'library-io-triaged'","text":""},{"who":"brianquinlan","bot":false,"at":"2022-12-17 02:23","ago":"3.9y ago","what":"labeled 'P3'","text":""},{"who":"a-siva","bot":false,"at":"2022-12-20 19:33","ago":"3.8y ago","what":"labeled 'triaged'","text":""},{"who":"a-siva","bot":false,"at":"2022-12-20 19:33","ago":"3.8y ago","what":"unlabeled 'library-io-triaged'","text":""},{"who":"tomekit","bot":false,"at":"2023-06-02 09:56","ago":"3.4y ago","what":"commented","text":"We're facing similar issue where Dart/Flutter doesn't respect configured user managed trusted CA. \r\n\r\nIn more detail, we're getting:\r\n```HandshakeException: Handshake error in client (OS Error: \\n\\tCERTIFICATE_VERIFY_FAILED: unable to get local issuer certificate(handshake.cc:393```\r\n\r\nOn Android we've installed CA and tested on Android 11, Android 13 and Android 14 without success:\r\n\r\n![Screenshot from 2023-06-02 11-50-25](https://github.com/dart-lang/sdk/assets/7759113/75e9894d-4d36-4def-8b49-ee16ac17e559)\r\n\r\n![Screenshot from 2023-06-02 11-50-49](https://github.com/dart-lang/sdk/assets/7759113/d7c624d9-4cd9-406a-9152-066e5c2ef522)\r\n\r\nAre there any plans to address the issue, so Flutter correctly recognizes the user managed CA installed on the system?\r\n\r\nThis is a deal breaker for many corporate apps / use cases, where CA is managed by the IT department and installed on the user's end device.\r\n\r\nRelated: https://stackoverflow.com/questions/78384421/flutter-user-trusted-credentials-arent-trusted-on-android"},{"who":"lrhn","bot":false,"at":"2024-04-21 23:10","ago":"2.5y ago","what":"labeled 'area-vm'","text":""},{"who":"lrhn","bot":false,"at":"2024-04-21 23:10","ago":"2.5y ago","what":"unlabeled 'area-core-library'","text":""},{"who":"acn-masatadakurihara","bot":false,"at":"2026-10-22 08:13","ago":"3d ago","what":"commented","text":"### Security impact: eMudhra intermediate CA compromise (October 2026)\n\nHi Dart team,\n\nI'd like to raise a security-related concern in connection with this issue, following the recent **eMudhra intermediate CA private key compromise**, disclosed on October 20, 2026.\n\nIncident details:\nhttps://emudhra.we-have-a-problem.com/\n\nEight intermediate CA private keys were compromised, potentially allowing attackers to impersonate HTTPS services.\n\nMajor browsers and operating systems have deployed mitigations through certificate revocation or blocklists. However, some non-browser TLS clients may remain vulnerable because they do not enforce these mechanisms.\n\n### Potential impact on Dart/Flutter for Android\n\nAs described in this issue, Dart's `SecurityContext` on Android loads trusted CA certificates from `/system/etc/security/cacerts`, rather than fully relying on Android's platform trust evaluation.\n\nThis raises a related concern:\n\n**Does Dart's `HttpClient` honor Android's certificate revocation and blocklist mechanisms, including the mitigations deployed for the compromised eMudhra intermediates?**\n\nEven if Android has blocked these certificates, Dart applications using `dart:io` might still accept certificate chains involving the compromised intermediates if the relevant revocation or blocklist checks are not enforced.\n\n### Questions\n\n1. Does `dart:io` / `HttpClient` on Android honor certificate revocation and blocklists distributed through Android platform security updates or Google Play services?\n\n2. Are the compromised eMudhra intermediate CA certificates currently rejected by Dart's TLS implementation on Android?\n\n3. Does the behavior differ between Android, iOS, and macOS, particularly where platform-native trust evaluation is used?\n\n4. If Dart is affected, is a Dart SDK security update planned, or is there a recommended mitigation for Flutter applications?\n\n### Reproduction / verification\n\nThe incident disclosure provides public TLS test endpoints:\n\n- https://dv-g3b-emudhra.we-have-a-problem.com/\n- https://dv-g3b-aaa-emudhra.we-have-a-problem.com/\n\nThese can be tested using Dart's standard `HttpClient`, without disabling certificate verification.\n\nSuccessful TLS negotiation with a compromised certificate chain would indicate a potential security issue requiring further investigation.\n\nI have not yet independently confirmed whether current Dart/Flutter versions accept these chains on Android.\n\nGiven the potential impact on Flutter applications handling authentication tokens, API credentials, and sensitive user data, an official assessment of Dart's TLS behavior would be greatly appreciated.\n\nThank you!"},{"who":"julemand101","bot":false,"at":"2026-10-22 08:18","ago":"3d ago","what":"commented","text":"@acn-masatadakurihara see also: https://github.com/dart-lang/sdk/issues/64644"}],"note":"Issue created by me, recent security concerns that have probably been addressed by #64644 but need to verify that they have been addressed and possibly close the issue.","prd_note":"","set":"A","source":"eval","draft":"todo","why":"Issue created by me, recent security concerns that have probably been addressed by #64644 but need to verify that they have been addressed and possibly close the issue.","settings_note":"","agents":[{"who":"Gemini","step":"todo","text":"Check the security implications raised regarding revoked/compromised intermediate CAs and verify whether #64644 addresses it."},{"who":"Basic","step":"todo","text":""},{"who":"Claude","step":"todo","text":"Review the new eMudhra CA-compromise questions on this issue, check whether dart:io on Android honors the platform blocklist and what #64644 changed, reply, and close or update this issue."},{"who":"OpenAI","step":"todo","text":"Verify whether #64644 addresses the reported Android trust exposure, and document any remaining disabled-CA or revocation gaps in this issue."}]},{"id":"googleapis/librarian#7808","url":"https://github.com/googleapis/librarian/pull/7808","title":"fix(internal/librarian/dart): set initial `librarian.yaml` version on `bump`","kind":"PR","state":"open","author":"brianquinlan","labels":[],"assignees":[],"requested":["cloud-sdk-librarian-team (team)"],"repo_desc":"CLI for managing SDK client library configuration, generation and releases","created":"3d ago","updated":"19h ago","snapshot":"2026-10-25T17:52:14Z","as_of":null,"thumbs_down_at":null,"roles":["author"],"last":"kevmoo left inline review comment 19h ago","stacked_on":null,"related":["issue googleapis/google-cloud-dart#358 [linked: closes/closed-by] 'Publishing leaves new packages untagged': open, by brianquinlan, updated 4d ago, labels ['type: process', 'priority: p2']"],"body":"Change the way that `librarian bump` works for dart:\r\n1. expect that unpublished packages do *not* have a version in `librarian.yaml` (`librarian generate` will set the `pubspec.yaml` version to `default.dart.version`  or `0.1.0)\r\n2. if `librarian bump` is run on an unpublished package then the `librarian.yaml` and `pubspec.yaml` versions are set to to `default.dart.version`  or `0.1.0\r\n\r\nThis is necessary because `librarian tag` finds the packages released by a commit by comparing the versions in `librarian.yaml` before and after `librarian bump`. New Dart packages were onboarded with a version already in librarian.yaml, so bump never changed it and `librarian tag` skipped their first release.\r\n\r\nFixes https://github.com/googleapis/google-cloud-dart/issues/358","timeline":[{"who":"Brian Quinlan","bot":false,"at":"2026-10-22 23:00","ago":"3d ago","what":"pushed commit ac88b5b 'fix'","text":""},{"who":"Brian Quinlan","bot":false,"at":"2026-10-22 23:18","ago":"3d ago","what":"pushed commit 27728dd 'Update bump_test.go'","text":""},{"who":"brianquinlan","bot":false,"at":"2026-10-22 23:38","ago":"3d ago","what":"opened this PR","text":""},{"who":"brianquinlan","bot":false,"at":"2026-10-22 23:38","ago":"3d ago","what":"review_requested cloud-sdk-librarian-team","text":""},{"who":"gemini-code-assist[bot]","bot":true,"at":"2026-10-22 23:40","ago":"3d ago","what":"reviewed [COMMENTED]","text":"## Code Review\n\nThis pull request updates the Dart package bumping logic to handle unpublished packages, ensuring they do not have a version in `librarian.yaml` and are instead released using a default version (either from `default.dart.version` or defaulting to `0.1.0`). It also refactors `updatePubspecVersion` to use `slices.IndexFunc`. The review feedback suggests optimizing `updatePubspecVersion` by using the `bytes` package directly on the byte slice to avoid unnecessary memory allocations from string conversions."},{"who":"gemini-code-assist[bot]","bot":true,"at":"2026-10-22 23:40","ago":"3d ago","what":"left inline review comment on internal/librarian/dart/pubspec.go","text":"![medium](https://www.gstatic.com/codereviewagent/medium-priority.svg)\n\nAccording to the repository's general rules, when working with file contents in Go, we should avoid converting `[]byte` to `string` for search and replace operations to prevent unnecessary memory allocations. We can use the `bytes` package directly on the byte slice instead.\n\n```suggestion\nlines := bytes.Split(content, []byte(\"\\n\"))\ni := slices.IndexFunc(lines, func(line []byte) bool { return bytes.HasPrefix(line, []byte(\"version:\")) })\nif i < 0 {\n\treturn fmt.Errorf(\"no version found in %s\", path)\n}\nlines[i] = []byte(\"version: \" + newVersion)\nreturn os.WriteFile(path, bytes.Join(lines, []byte(\"\\n\")), 0644)\n```\n\n<details>\n<summary>References<\/summary>\n\n1. When working with file contents in Go, avoid converting []byte to string for search and replace operations to prevent unnecessary memory allocations. Use the bytes package (e.g., bytes.Contains, bytes.ReplaceAll) to perform operations directly on the byte slice.\n<\/details>"},{"who":"Brian Quinlan","bot":false,"at":"2026-10-23 00:04","ago":"3d ago","what":"pushed commit 0534d29 'Update pubspec.go'","text":""},{"who":"kevmoo","bot":false,"at":"2026-10-24 22:50","ago":"19h ago","what":"reviewed [COMMENTED]","text":""},{"who":"kevmoo","bot":false,"at":"2026-10-24 22:50","ago":"19h ago","what":"left inline review comment on internal/librarian/dart/bump.go","text":"The next `librarian generate` deletes this newly created `CHANGELOG.md` via [`checkAndClean`](https://github.com/googleapis/librarian/blob/00ae0ab2bf5e506433ccfcbb7030b1748e87abc8/internal/librarian/generate.go#L154-L155) because newly onboarded libraries cannot l
