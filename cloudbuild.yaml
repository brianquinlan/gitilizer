steps:
  # ---------------------------------------------------------------------------
  # Step 1: Build the Flutter Web client
  # ---------------------------------------------------------------------------
  - name: 'ghcr.io/cirruslabs/flutter:stable'
    id: 'build-flutter-web'
    dir: 'frontend'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        flutter config --enable-web
        flutter pub get
        flutter build web --release

  # ---------------------------------------------------------------------------
  # Step 2: Deploy to Firebase (Hosting, Functions, Firestore Rules & Indexes)
  # ---------------------------------------------------------------------------
  - name: 'node:20-bookworm'
    id: 'deploy-firebase'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Install Python 3.11 and venv for Firebase Cloud Functions discovery
        apt-get update && apt-get install -y python3 python3-venv

        # Install Firebase CLI globally
        npm install -g firebase-tools

        # Setup Python virtualenv so Firebase CLI can analyze 2nd-gen Python functions
        cd github-task-updater/functions
        python3 -m venv venv
        ./venv/bin/pip install --upgrade pip
        ./venv/bin/pip install -r requirements.txt
        cd ../..

        # Deploy all components using Application Default Credentials (ADC)
        firebase deploy --project=$PROJECT_ID --non-interactive --force

timeout: '1200s'

options:
  logging: CLOUD_LOGGING_ONLY
