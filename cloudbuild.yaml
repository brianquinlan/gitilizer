# Every commit on main (DEPLOYMENT.md, "How a change reaches development"): build the one image, tag it with
# the commit's SHA, store it in Artifact Registry, and deploy it to development. A release later deploys this
# same image to production, so nothing is rebuilt.
#
# Runs as the deploy-dev service account (infra/pipeline.sh), which can deploy gitilizer-dev and nothing else.
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: [build, --build-arg, "GITILIZER_RELEASE=$COMMIT_SHA", -t, "${_REGION}-docker.pkg.dev/$PROJECT_ID/gitilizer/gitilizer:$COMMIT_SHA", .]
  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/gitilizer/gitilizer:$COMMIT_SHA"]
  # Only the image changes, so the service keeps its settings, including the allowlist.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - gitilizer-dev
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/gitilizer/gitilizer:$COMMIT_SHA
images: ["${_REGION}-docker.pkg.dev/$PROJECT_ID/gitilizer/gitilizer:$COMMIT_SHA"]
substitutions:
  _REGION: us-east4 # infra/pipeline.sh sets it to the region in infra/config.sh
options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE
timeout: 1200s
