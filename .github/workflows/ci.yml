# Checks every pull request and every push to main (DEPLOYMENT.md). Merging to main needs this to pass
# (the branch ruleset), and Cloud Build deploys main to development only after that.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      # A real Postgres for the tests of several processes sharing one database (app/server/test/postgres.test.ts).
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w app/web
      # The image builds, so a merge can't break the deployment to development.
      - run: docker build -t gitilizer:ci .
