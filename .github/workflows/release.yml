# Releasing to production (DEPLOYMENT.md, "Releasing to production"). Pushing a tag release-YYYY-MM-DD on a
# commit that development has already run deploys that commit's image to production, after the owner approves
# the run in the `production` environment. Nothing is rebuilt: what was tried is what ships.
name: Release
on:
  push:
    tags: ["release-*"]
permissions:
  contents: read
  id-token: write # Workload Identity Federation: a short-lived token instead of a stored key
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    env:
      REGION: us-east4
      IMAGE: us-east4-docker.pkg.dev/gitilizer/gitilizer/gitilizer:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tagged commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which isn't on main. Release only commits that development has run."
            exit 1
          fi
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Development built this commit
        run: |
          if ! gcloud artifacts docker images describe "$IMAGE" >/dev/null; then
            echo "::error::No image for $GITHUB_SHA in Artifact Registry. Did this commit reach development? See its Cloud Build status on GitHub."
            exit 1
          fi
      - name: Deploy
        run: |
          # When the scheduler and worker run as their own service, they go first (DEPLOYMENT.md, "Splitting production").
          if gcloud run services describe gitilizer-worker --region "$REGION" >/dev/null 2>&1; then
            gcloud run deploy gitilizer-worker --region "$REGION" --image "$IMAGE"
          fi
          gcloud run deploy gitilizer-api --region "$REGION" --image "$IMAGE"
          gcloud run services update-traffic gitilizer-api --region "$REGION" --to-latest
      - name: Check it
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://gitilizer.com/api/health; then echo; exit 0; fi
            sleep 10
          done
          echo "::error::https://gitilizer.com/api/health isn't answering. Roll back: DEPLOYMENT.md, \"Rolling back\"."
          exit 1
      - name: Summary
        run: |
          {
            echo "### Released $GITHUB_REF_NAME"
            echo "Commit \`$GITHUB_SHA\` is live on https://gitilizer.com."
            echo
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME"
          } >> "$GITHUB_STEP_SUMMARY"
